<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACAZES — PUBG Marketplace</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 15px;
        }

        .acazes-text {
            font-family: 'Cinzel', serif;
            font-size: clamp(24px, 7.5vw, 38px);
            font-weight: 900;
            letter-spacing: 10px;
            padding-left: 10px;
            white-space: nowrap;
            text-transform: uppercase;
            background: linear-gradient(120deg, #000000 30%, #555555 50%, #000000 70%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.25));
            animation: glossyMove 2.5s linear infinite, gentleFloat 2.2s ease-in-out infinite alternate;
        }

        @keyframes glossyMove {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        @keyframes gentleFloat {
            0% {
                transform: translateY(-4px) scale(0.98);
            }
            100% {
                transform: translateY(4px) scale(1.03);
            }
        }
    </style>
</head>
<body>

    <div class="acazes-text">A C A Z E S</div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
