<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TESLA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 40%, #172554 0%, #090d16 55%, #020408 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .ambient-glow {
            position: absolute;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, rgba(56, 189, 248, 0.05) 50%, transparent 75%);
            border-radius: 50%;
            pointer-events: none;
            animation: ambientPulse 4s infinite alternate ease-in-out;
        }

        @keyframes ambientPulse {
            0% { transform: scale(0.85); opacity: 0.6; }
            100% { transform: scale(1.25); opacity: 1; }
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .page.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.96);
        }

        .page.active {
            opacity: 1;
            transform: scale(1);
        }

        /* 1-Oyna: Landing */
        .landing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 55px;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            z-index: 10;
        }

        .brand-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
        }

        .tesla-svg-logo {
            width: 260px;
            height: auto;
            overflow: visible;
        }

        @keyframes letterDrop {
            0% { opacity: 0; transform: translateY(-30px) scale(0.6); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes floatWave {
            0%, 100% { transform: translateY(0px) rotate(0deg); filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.7)); }
            25% { transform: translateY(-6px) rotate(-2deg); filter: drop-shadow(0 0 18px rgba(255, 255, 255, 1)); }
            75% { transform: translateY(5px) rotate(2deg); filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.8)); }
        }

        .t-char { opacity: 0; transform-origin: center; }
        .c-1 { animation: letterDrop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.1s forwards, floatWave 2.6s ease-in-out 0.6s infinite; }
        .c-2 { animation: letterDrop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.2s forwards, floatWave 2.6s ease-in-out 0.8s infinite; }
        .c-3 { animation: letterDrop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.3s forwards, floatWave 2.6s ease-in-out 1.0s infinite; }
        .c-4 { animation: letterDrop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.4s forwards, floatWave 2.6s ease-in-out 1.2s infinite; }
        .c-5 { animation: letterDrop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.5s forwards, floatWave 2.6s ease-in-out 1.4s infinite; }

        .premium-badge-wrap {
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            animation: badgeEntrance 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.75s forwards,
                       badgeSuperMotion 2.8s ease-in-out 1.45s infinite;
        }

        @keyframes badgeEntrance {
            0% { opacity: 0; transform: scale(0) rotate(-90deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        @keyframes badgeSuperMotion {
            0%, 100% { transform: scale(1) rotate(0deg) translateY(0); filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.85)); }
            20% { transform: scale(1.18) rotate(12deg) translateY(-4px); filter: drop-shadow(0 0 22px rgba(255, 255, 255, 1)); }
            50% { transform: scale(0.95) rotate(-8deg) translateY(2px); }
            80% { transform: scale(1.02) rotate(5deg) translateY(0); }
        }

        .badge-ring {
            transform-origin: 24px 24px;
            animation: spinRing 6s linear infinite;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .enter-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            border-radius: 20px;
            padding: 16px 52px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
            opacity: 0;
            animation: btnFadeUp 0.6s ease 1.1s forwards;
            transition: transform 0.15s ease, background 0.2s ease;
        }

        @keyframes btnFadeUp {
            0% { opacity: 0; transform: translateY(25px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .enter-btn:active {
            transform: scale(0.94);
            background: rgba(255, 255, 255, 0.18);
        }

        /* 2-Oyna: Market */
        .market-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        .stars-box {
            background: rgba(10, 15, 30, 0.92);
            backdrop-filter: blur(20px);
            border: 1.5px solid rgba(56, 189, 248, 0.3);
            border-radius: 26px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
        }

        .stars-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 19px;
            font-weight: 900;
            color: #ffffff;
        }

        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
        }

        .input-group label {
            font-size: 11.5px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.8);
        }

        .stars-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid rgba(56, 189, 248, 0.3);
            border-radius: 14px;
            padding: 12px 14px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 800;
            outline: none;
            text-align: center;
        }

        .preset-prices {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            width: 100%;
        }

        .preset-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 10px;
            padding: 8px;
            color: #ffffff;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s;
        }

        .preset-btn:hover {
            background: rgba(56, 189, 248, 0.2);
        }

        .price-display {
            font-size: 15px;
            font-weight: 900;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 10px 14px;
            border-radius: 12px;
            width: 100%;
            text-align: center;
        }

        .buy-action-btn {
            background: #ffffff;
            color: #090d16;
            border: none;
            border-radius: 14px;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            width: 100%;
            text-align: center;
            box-shadow: 0 6px 18px rgba(255, 255, 255, 0.2);
            transition: transform 0.15s ease;
        }

        .buy-action-btn:active {
            transform: scale(0.96);
        }

        /* Modal oynalar (Dilerlar ro'yxati) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 4, 8, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: rgba(15, 23, 42, 0.95);
            border: 1.5px solid rgba(56, 189, 248, 0.4);
            border-radius: 26px;
            width: 90%;
            max-width: 350px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            transform: scale(0.85);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.open .modal-content {
            transform: scale(1);
        }

        .modal-title {
            font-size: 16px;
            font-weight: 900;
            color: #ffffff;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .dealers-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .dealer-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .dealer-card:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(56, 189, 248, 0.5);
        }

        .dealer-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dealer-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: #1e293b;
        }

        .dealer-text {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .dealer-name-row {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dealer-name {
            font-size: 14.5px;
            font-weight: 900;
            color: #ffffff;
        }

        .dealer-username {
            font-size: 11.5px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.65);
        }

        .dealer-action-badge {
            font-size: 11px;
            font-weight: 800;
            background: #ffffff;
            color: #090d16;
            padding: 6px 12px;
            border-radius: 10px;
        }

        .close-modal-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 11px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            margin-top: 4px;
            transition: background 0.2s;
        }

        .close-modal-btn:active {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Qimirlab turuvchi katta galochka animatsiyalari */
        .big-wiggle-badge {
            width: 22px;
            height: 22px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            animation: bigWiggle 2s infinite ease-in-out;
        }

        @keyframes bigWiggle {
            0%, 100% { transform: scale(1) rotate(0deg); }
            20% { transform: scale(1.25) rotate(-14deg); }
            40% { transform: scale(0.92) rotate(8deg); }
            60% { transform: scale(1.20) rotate(14deg); }
            80% { transform: scale(0.96) rotate(-6deg); }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <!-- 1-OYNA: Landing -->
    <div id="landingPage" class="page active">
        <div class="landing-container">
            <div class="brand-row">
                <svg class="tesla-svg-logo" viewBox="0 0 280 70" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="teslaWhiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="65%" stop-color="#f1f5f9"/>
                            <stop offset="100%" stop-color="#cbd5e1"/>
                        </linearGradient>
                    </defs>
                    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" fill="url(#teslaWhiteGrad)" text-anchor="middle">
                        <text class="t-char c-1" x="28" y="52">T</text>
                        <text class="t-char c-2" x="84" y="52">E</text>
                        <text class="t-char c-3" x="140" y="52">S</text>
                        <text class="t-char c-4" x="196" y="52">L</text>
                        <text class="t-char c-5" x="252" y="52">A</text>
                    </g>
                </svg>

                <div class="premium-badge-wrap">
                    <svg viewBox="0 0 48 48" width="44" height="44" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="whiteBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ffffff"/>
                                <stop offset="100%" stop-color="#e2e8f0"/>
                            </linearGradient>
                        </defs>
                        <circle class="badge-ring" cx="24" cy="24" r="22" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" stroke-dasharray="4 4"/>
                        <path d="M24 4L28.6 7.8L34.5 7.1L36.5 12.7L41.5 16L39.8 21.8L41.5 27.6L36.5 30.9L34.5 36.5L28.6 35.8L24 39.6L19.4 35.8L13.5 36.5L11.5 30.9L6.5 27.6L8.2 21.8L6.5 16L11.5 12.7L13.5 7.1L19.4 7.8L24 4Z" fill="url(#whiteBadgeGrad)" stroke="#ffffff" stroke-width="1"/>
                        <polyline points="17 22.5 21.8 27.3 31.5 17.5" fill="none" stroke="#090d16" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>

            <button class="enter-btn" onclick="goToMarket()">
                KIRISH
            </button>
        </div>
    </div>

    <!-- 2-OYNA: Market -->
    <div id="marketPage" class="page hidden">
        <div class="market-container">
            <div class="stars-box">
                <div class="stars-header">
                    <span>⚡ Telegram Stars</span>
                </div>

                <div class="input-group">
                    <label for="starsCount">Stars miqdorini kiriting (Min: 50, Maks: 5000):</label>
                    <input type="number" id="starsCount" class="stars-input" value="50" min="50" max="5000" oninput="calculatePrice()">
                </div>

                <div class="preset-prices">
                    <button class="preset-btn" onclick="setPreset(50)">50 ta (11k)</button>
                    <button class="preset-btn" onclick="setPreset(75)">75 ta (16k)</button>
                    <button class="preset-btn" onclick="setPreset(100)">100 ta (22k)</button>
                    <button class="preset-btn" onclick="setPreset(200)">200 ta (43k)</button>
                </div>

                <div class="price-display" id="priceDisplay">
                    Narxi: 11 000 soʻm
                </div>

                <button class="buy-action-btn" onclick="openDealersModal()">
                    Sotib olish
                </button>
            </div>
        </div>
    </div>

    <!-- DILERLAR MODAL OYNASI -->
    <div id="dealersModal" class="modal-overlay" onclick="closeDealersModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-title">⭐ 2 ta rasmiy diler</div>
            
            <div class="dealers-list">
                <!-- 1-Diler: @org_karimov (Qora galochka) -->
                <a href="https://t.me/org_karimov" target="_blank" class="dealer-card" onclick="hapticClick()">
                    <div class="dealer-info">
                        <img src="https://t.me/i/userpic/320/org_karimov.jpg" alt="@org_karimov" class="dealer-avatar" onerror="this.src='https://via.placeholder.com/48/1e293b/ffffff?text=K'">
                        <div class="dealer-text">
                            <div class="dealer-name-row">
                                <span class="dealer-name">Karimov</span>
                                <div class="big-wiggle-badge">
                                    <svg viewBox="0 0 24 24" width="22" height="22" xmlns="http://www.w3.org/2000/svg">
                                        <defs>
                                            <linearGradient id="blackBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                                <stop offset="0%" stop-color="#2a2a2a"/>
                                                <stop offset="100%" stop-color="#000000"/>
                                            </linearGradient>
                                        </defs>
                                        <path d="M12 2L14.8 4.2L18.4 3.8L19.6 7.2L22.6 9.2L21.6 12.7L22.6 16.2L19.6 18.2L18.4 21.6L14.8 21.2L12 23.4L9.2 21.2L5.6 21.6L4.4 18.2L1.4 16.2L2.4 12.7L1.4 9.2L4.4 7.2L5.6 3.8L9.2 4.2L12 2Z" fill="url(#blackBadgeGrad)" stroke="#555" stroke-width="0.8"/>
                                        <polyline points="8.5 12.5 11 15 16 9.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </div>
                            </div>
                            <span class="dealer-username">@org_karimov</span>
                        </div>
                    </div>
                    <span class="dealer-action-badge">Yozish</span>
                </a>

                <!-- 2-Diler: @Abrorovsaler (Sariq galochka) -->
                <a href="https://t.me/Abrorovsaler" target="_blank" class="dealer-card" onclick="hapticClick()">
                    <div class="dealer-info">
                        <img src="https://t.me/i/userpic/320/Abrorovsaler.jpg" alt="@Abrorovsaler" class="dealer-avatar" onerror="this.src='https://via.placeholder.com/48/1e293b/ffffff?text=A'">
                        <div class="dealer-text">
                            <div class="dealer-name-row">
                                <span class="dealer-name">Abrorov</span>
                                <div class="big-wiggle-badge">
                                    <svg viewBox="0 0 24 24" width="22" height="22" xmlns="http://www.w3.org/2000/svg">
                                        <defs>
                                            <linearGradient id="yellowBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                                <stop offset="0%" stop-color="#fbbf24"/>
                                                <stop offset="100%" stop-color="#d97706"/>
                                            </linearGradient>
                                        </defs>
                                        <path d="M12 2L14.8 4.2L18.4 3.8L19.6 7.2L22.6 9.2L21.6 12.7L22.6 16.2L19.6 18.2L18.4 21.6L14.8 21.2L12 23.4L9.2 21.2L5.6 21.6L4.4 18.2L1.4 16.2L2.4 12.7L1.4 9.2L4.4 7.2L5.6 3.8L9.2 4.2L12 2Z" fill="url(#yellowBadgeGrad)" stroke="#fef08a" stroke-width="0.8"/>
                                        <polyline points="8.5 12.5 11 15 16 9.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </div>
                            </div>
                            <span class="dealer-username">@Abrorovsaler</span>
                        </div>
                    </div>
                    <span class="dealer-action-badge">Yozish</span>
                </a>
            </div>

            <button class="close-modal-btn" onclick="closeDealersModal()">Yopish</button>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        function goToMarket() {
            hapticClick();
            document.getElementById('landingPage').classList.remove('active');
            document.getElementById('landingPage').classList.add('hidden');
            document.getElementById('marketPage').classList.remove('hidden');
            document.getElementById('marketPage').classList.add('active');
        }

        function openDealersModal() {
            hapticClick();
            document.getElementById('dealersModal').classList.add('open');
        }

        function closeDealersModal() {
            hapticClick();
            document.getElementById('dealersModal').classList.remove('open');
        }

        function hapticClick() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }
        }

        function calculatePrice() {
            let input = document.getElementById('starsCount');
            let val = parseInt(input.value);

            if (isNaN(val) || val < 50) {
                val = 50;
            } else if (val > 5000) {
                val = 5000;
                input.value = 5000;
            }

            let totalPrice = val * 220;
            let formattedPrice = totalPrice.toLocaleString('uz-UZ');
            document.getElementById('priceDisplay').innerText = `Narxi: ${formattedPrice} soʻm`;
        }

        function setPreset(count) {
            document.getElementById('starsCount').value = count;
            calculatePrice();
        }

        calculatePrice();
    </script>
</body>
</html>
