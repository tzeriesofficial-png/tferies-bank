<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reduz Drop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: all 0.3s ease;
        }

        body {
            height: 100vh;
            background: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
        }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 340px;
        }

        /* Reduz Drop Logotipi */
        .logo-text {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .logo-reduz {
            color: #ff0033;
        }

        .logo-drop {
            color: #000000;
        }

        /* Foiz ko'rsatkichi */
        .percentage-text {
            font-size: 20px;
            font-weight: 900;
            color: #000000;
            letter-spacing: 1px;
        }

        /* Qizil yuklanish chizig'i */
        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.2);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff0033, #ff3366);
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        /* Kanallar oynasi (Bloksiz) */
        .channels-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 380px;
            gap: 16px;
            text-align: center;
        }

        .channels-title {
            font-size: 18px;
            font-weight: 900;
            color: #000000;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Qimirlaydigan qora premium SVG o'yin stikeri */
        .game-svg-icon {
            width: 28px;
            height: 28px;
            display: inline-flex;
            vertical-align: middle;
            animation: gameIconMotion 1.8s infinite ease-in-out;
        }

        @keyframes gameIconMotion {
            0%, 100% { transform: scale(1) rotate(0deg) translateY(0); }
            25% { transform: scale(1.2) rotate(-12deg) translateY(-3px); }
            75% { transform: scale(1.15) rotate(12deg) translateY(2px); }
        }

        .channel-item {
            background: rgba(0, 0, 0, 0.05);
            border: 1.5px solid rgba(0, 0, 0, 0.12);
            border-radius: 20px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            text-decoration: none;
            cursor: default;
        }

        .channel-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .channel-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ff0033;
            background-color: #f0f0f0;
        }

        .channel-name {
            font-size: 16px;
            font-weight: 900;
            color: #000000;
            text-align: left;
        }

        .channel-action {
            background: #ff0033;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 900;
            box-shadow: 0 4px 12px rgba(255,0,51,0.3);
        }
    </style>
</head>
<body>

    <!-- 1-OYNA: REDUZ DROP LOADING -->
    <div id="loaderPage" class="page active">
        <div class="loader-container">
            <div class="logo-text">
                <span class="logo-reduz">Reduz</span><span class="logo-drop">Drop</span>
            </div>

            <div style="width: 100%; display: flex; flex-direction: column; gap: 12px; align-items: center;">
                <div class="progress-bar-container">
                    <div id="progressBarFill" class="progress-bar-fill"></div>
                </div>
                <div id="percentageVal" class="percentage-text">1%</div>
            </div>
        </div>
    </div>

    <!-- 2-OYNA: O'YINLAR (BLOKSIZ) -->
    <div id="channelsPage" class="page">
        <div class="channels-container">
            <div class="channels-title">
                <span>Siz qaysi oʻyinga drop qilishingizni tanlang.</span>
                <span class="game-svg-icon">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="#000000" xmlns="http://www.w3.org/2000/svg">
                        <path d="M21 6H3C1.9 6 1 6.9 1 8V16C1 17.1 1.9 18 3 18H21C22.1 18 23 17.1 23 16V8C23 6.9 22.1 6 21 6ZM10 13H8V15H6V13H4V11H6V9H8V11H10V13ZM15.5 15C14.67 15 14 14.33 14 13.5C14 12.67 14.67 12 15.5 12C16.33 12 17 12.67 17 13.5C17 14.33 16.33 15 15.5 15ZM19 11.5C18.17 11.5 17.5 10.83 17.5 10C17.5 9.17 18.17 8.5 19 8.5C19.83 8.5 20.5 9.17 20.5 10C20.5 10.83 19.83 11.5 19 11.5Z"/>
                    </svg>
                </span>
            </div>
            <div style="font-size: 13px; font-weight: 800; color: #555555; margin-bottom: 6px;">Oʻzingizga mos oʻyinni tanlang</div>

            <div style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
                <!-- 1-O'yin: PUBG Mobile -->
                <div class="channel-item" onclick="event.preventDefault()">
                    <div class="channel-left">
                        <img src="https://t.me/i/userpic/320/official_pubgmobile_mena.jpg" 
                             onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=PUBG+Mobile&background=ff0033&color=ffffff&bold=true&size=128';" 
                             alt="PUBG Mobile" class="channel-avatar">
                        <span class="channel-name">PUBG Mobile</span>
                    </div>
                    <span class="channel-action">Tanlash</span>
                </div>

                <!-- 2-O'yin: Free Fire -->
                <div class="channel-item" onclick="event.preventDefault()">
                    <div class="channel-left">
                        <img src="https://t.me/i/userpic/320/gruxx_ff.jpg" 
                             onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=Free+Fire&background=ff0033&color=ffffff&bold=true&size=128';" 
                             alt="Free Fire" class="channel-avatar">
                        <span class="channel-name">Free Fire</span>
                    </div>
                    <span class="channel-action">Tanlash</span>
                </div>

                <!-- 3-O'yin: Standoff 2 -->
                <div class="channel-item" onclick="event.preventDefault()">
                    <div class="channel-left">
                        <img src="https://t.me/i/userpic/320/play_standoff2.jpg" 
                             onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=Standoff+2&background=ff0033&color=ffffff&bold=true&size=128';" 
                             alt="Standoff 2" class="channel-avatar">
                        <span class="channel-name">Standoff 2</span>
                    </div>
                    <span class="channel-action">Tanlash</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { tg.ready(); tg.expand(); }

        let currentProgress = 1;
        const fillElement = document.getElementById('progressBarFill');
        const percentageElement = document.getElementById('percentageVal');

        const loadingInterval = setInterval(() => {
            if (currentProgress < 100) {
                currentProgress++;
                fillElement.style.width = currentProgress + '%';
                percentageElement.textContent = currentProgress + '%';
            } else {
                clearInterval(loadingInterval);
                setTimeout(() => {
                    document.getElementById('loaderPage').classList.remove('active');
                    document.getElementById('channelsPage').classList.add('active');
                }, 400);
            }
        }, 30);
    </script>
</body>
</html>
