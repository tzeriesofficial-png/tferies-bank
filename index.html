<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaulaTap</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 1-OYNA: KATTA QORA PREMIUM SVG ALMAZ */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 35px;
            width: 100%;
            max-width: 340px;
        }

        .diamond-wrapper {
            width: 165px;
            height: 165px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: diamondFloat 2.2s infinite ease-in-out;
            filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.25));
        }

        .diamond-glint {
            animation: glintPulse 2.2s infinite ease-in-out;
        }

        @keyframes diamondFloat {
            0%, 100% { transform: scale(1) translateY(0) rotate(0deg); }
            35% { transform: scale(1.12) translateY(-10px) rotate(-4deg); }
            70% { transform: scale(1.08) translateY(-6px) rotate(4deg); }
        }

        @keyframes glintPulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 0.85; }
        }

        .progress-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.15);
        }

        .progress-bar-fill {
            height: 100%;
            width: 1%;
            background: #000000;
            border-radius: 12px;
            transition: width 0.08s linear;
        }

        .percentage-text {
            font-size: 20px;
            font-weight: 900;
            color: #000000;
            letter-spacing: 1.5px;
        }

        /* 2-OYNA: ASOSIY EKRAN */
        #mainPage {
            justify-content: space-between;
            padding: 20px 16px 105px 16px;
        }

        .content-area {
            width: 100%;
            max-width: 420px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .tab-pane {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .tab-pane.active-pane {
            display: flex;
        }

        .section-title {
            font-size: 24px;
            font-weight: 900;
            color: #000000;
            letter-spacing: 0.5px;
        }

        .section-sub {
            font-size: 13px;
            font-weight: 700;
            color: #555555;
        }

        /* PASTKI MENYU PANELI (OQ FON, QORA YOZUV VA QORA PREMIUM SVG) */
        .bottom-nav {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 24px);
            max-width: 420px;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 22px;
            padding: 10px 8px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 4px;
            border-radius: 15px;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.2s ease;
        }

        .nav-item:active {
            transform: scale(0.93);
        }

        .nav-item.active {
            background: rgba(0, 0, 0, 0.08);
        }

        .nav-label {
            font-size: 11px;
            font-weight: 900;
            color: #000000;
            letter-spacing: 0.2px;
        }

        .svg-box {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Premium SVG Animatsiyalar */
        .anim-tap { animation: pulseTap 1.8s infinite ease-in-out; }
        .anim-boost { animation: flyRocket 2s infinite ease-in-out; }
        .anim-support { animation: tiltHeadset 2.2s infinite ease-in-out; }
        .anim-wallet { animation: bounceWallet 2.1s infinite ease-in-out; }

        @keyframes pulseTap {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.16) rotate(-5deg); }
        }

        @keyframes flyRocket {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(6deg); }
        }

        @keyframes tiltHeadset {
            0%, 100% { transform: rotate(0deg) scale(1); }
            30% { transform: rotate(-10deg) scale(1.1); }
            70% { transform: rotate(10deg) scale(1.1); }
        }

        @keyframes bounceWallet {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.14) translateY(-3px); }
        }
    </style>
</head>
<body>

    <!-- 1-OYNA: QORA PREMIUM ALMAZ LOADING -->
    <div id="loaderPage" class="page active">
        <div class="loader-container">
            <div class="diamond-wrapper">
                <svg viewBox="0 0 120 120" width="160" height="160" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="dTop" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#3a3a3a"/>
                            <stop offset="100%" stop-color="#0a0a0a"/>
                        </linearGradient>
                        <linearGradient id="dLeft" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#222222"/>
                            <stop offset="100%" stop-color="#000000"/>
                        </linearGradient>
                        <linearGradient id="dCenter" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#4d4d4d"/>
                            <stop offset="50%" stop-color="#141414"/>
                            <stop offset="100%" stop-color="#000000"/>
                        </linearGradient>
                        <linearGradient id="dRight" x1="100%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#1a1a1a"/>
                            <stop offset="100%" stop-color="#000000"/>
                        </linearGradient>
                    </defs>

                    <polygon points="34,18 86,18 110,44 10,44" fill="url(#dTop)"/>
                    <polygon points="34,18 60,44 10,44" fill="#2b2b2b"/>
                    <polygon points="86,18 110,44 60,44" fill="#181818"/>
                    <polygon points="34,18 86,18 60,44" fill="#454545"/>

                    <polygon points="10,44 38,44 60,106" fill="url(#dLeft)"/>
                    <polygon points="38,44 82,44 60,106" fill="url(#dCenter)"/>
                    <polygon points="82,44 110,44 60,106" fill="url(#dRight)"/>

                    <polyline points="10,44 110,44" stroke="#666666" stroke-width="1.2"/>
                    <polyline points="34,18 38,44 60,106 82,44 86,18" stroke="#555555" stroke-width="1"/>
                    <polygon class="diamond-glint" points="34,18 60,44 38,44" fill="#ffffff" opacity="0.25"/>
                </svg>
            </div>

            <div class="progress-wrapper">
                <div class="progress-bar-container">
                    <div id="progressBarFill" class="progress-bar-fill"></div>
                </div>
                <div id="percentageVal" class="percentage-text">1%</div>
            </div>
        </div>
    </div>

    <!-- 2-OYNA: ASOSIY MENYULAR -->
    <div id="mainPage" class="page">
        <div class="content-area">
            <div id="pane-paulatap" class="tab-pane active-pane">
                <div class="section-title">PaulaTap</div>
                <div class="section-sub">Asosiy oʻyin boʻlimi tayyor</div>
            </div>

            <div id="pane-boost" class="tab-pane">
                <div class="section-title">Boost</div>
                <div class="section-sub">Kuchaytirgichlar boʻlimi</div>
            </div>

            <div id="pane-support" class="tab-pane">
                <div class="section-title">Support</div>
                <div class="section-sub">Qoʻllab-quvvatlash xizmati</div>
            </div>

            <div id="pane-wallet" class="tab-pane">
                <div class="section-title">Wallet</div>
                <div class="section-sub">Hamyon va balans boʻlimi</div>
            </div>
        </div>

        <!-- Pastki menyu (Qora yozuv + Qora Premium SVG) -->
        <div class="bottom-nav">
            <!-- 1. PaulaTap -->
            <div class="nav-item active" onclick="switchTab('paulatap', this)">
                <div class="svg-box anim-tap">
                    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <polygon points="7,3 17,3 22,9 2,9" fill="#2b2b2b"/>
                        <polygon points="2,9 22,9 12,21" fill="#000000"/>
                        <polygon points="7,3 17,3 12,9" fill="#555555"/>
                        <line x1="2" y1="9" x2="22" y2="9" stroke="#ffffff" stroke-width="0.8"/>
                    </svg>
                </div>
                <span class="nav-label">PaulaTap</span>
            </div>

            <!-- 2. Boost -->
            <div class="nav-item" onclick="switchTab('boost', this)">
                <div class="svg-box anim-boost">
                    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M13.5 2C13.5 2 18.5 3.5 20.5 9.5C21.5 12.5 19.5 16 17.5 18L14 14.5L9.5 10L6 6.5C8 4.5 11.5 2.5 13.5 2Z" fill="#000000"/>
                        <path d="M6 14C4 16 3.5 19.5 3.5 20.5C4.5 20.5 8 20 10 18L6 14Z" fill="#333333"/>
                        <circle cx="15" cy="9" r="2" fill="#ffffff"/>
                        <path d="M5 9L2 11L5 13" fill="#000000"/>
                        <path d="M15 19L13 22L11 19" fill="#000000"/>
                    </svg>
                </div>
                <span class="nav-label">Boost</span>
            </div>

            <!-- 3. Support -->
            <div class="nav-item" onclick="switchTab('support', this)">
                <div class="svg-box anim-support">
                    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 13V12C4 7.58 7.58 4 12 4C16.42 4 20 7.58 20 12V13" stroke="#000000" stroke-width="2.4" stroke-linecap="round"/>
                        <rect x="2.5" y="11.5" width="4" height="6.5" rx="2" fill="#000000"/>
                        <rect x="17.5" y="11.5" width="4" height="6.5" rx="2" fill="#000000"/>
                        <path d="M19.5 18C19.5 19.8 17.8 21 15.5 21H12" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
                        <circle cx="12" cy="21" r="1.5" fill="#000000"/>
                    </svg>
                </div>
                <span class="nav-label">Support</span>
            </div>

            <!-- 4. Wallet -->
            <div class="nav-item" onclick="switchTab('wallet', this)">
                <div class="svg-box anim-wallet">
                    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2.5" y="5" width="19" height="14" rx="3.5" fill="#000000"/>
                        <path d="M4 5.5C4 4.1 5.1 3 6.5 3H17.5C18.3 3 19 3.7 19 4.5V5H4V5.5Z" fill="#333333"/>
                        <path d="M15.5 9.5H21.5V14.5H15.5C14.1 14.5 13 13.4 13 12C13 10.6 14.1 9.5 15.5 9.5Z" fill="#ffffff"/>
                        <circle cx="16" cy="12" r="1.4" fill="#000000"/>
                    </svg>
                </div>
                <span class="nav-label">Wallet</span>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        let currentProgress = 1;
        const fillElement = document.getElementById('progressBarFill');
        const percentageElement = document.getElementById('percentageVal');

        const loadingInterval = setInterval(() => {
            if (currentProgress < 100) {
                currentProgress++;
                fillElement.style.width = currentProgress + '%';
                percentageElement.textContent = currentProgress + '%';
            } else {
                clearInterval(loadingInterval);
                setTimeout(() => {
                    document.getElementById('loaderPage').classList.remove('active');
                    document.getElementById('mainPage').classList.add('active');
                }, 350);
            }
        }, 30);

        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active-pane'));
            document.getElementById('pane-' + tabId).classList.add('active-pane');

            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
