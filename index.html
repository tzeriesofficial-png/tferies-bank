<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-BOX</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Arial Black', Impact, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .center-screen {
            width: 100%;
            height: 100vh;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .xbox-title {
            font-size: clamp(38px, 10.5vw, 60px);
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 6px;
            line-height: 1;
            text-align: center;
            text-transform: uppercase;
            text-shadow: none;
            filter: none;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="center-screen">
        <div class="xbox-title">X-BOX</div>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }
    </script>
</body>
</html>
