<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACAZES</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* Ko'm-ko'k orqa fon, hech qanday chiziqlarsiz */
            background: radial-gradient(circle at center, #002244 0%, #000d1a 60%, #00050a 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 50px;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        /* Premium SVG Logo Animatsiyasi */
        .logo-svg {
            width: 100%;
            max-width: 360px;
            height: auto;
            overflow: visible;
        }

        /* Harflarning ketma-ket chiqib kelish va yonish animatsiyalari */
        @keyframes letterAppear {
            0% {
                opacity: 0;
                transform: translateY(25px) scale(0.7);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes globalGlow {
            0%, 100% {
                filter: drop-shadow(0 0 12px rgba(0, 162, 255, 0.6)) drop-shadow(0 0 25px rgba(0, 102, 255, 0.4));
            }
            50% {
                filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.9)) drop-shadow(0 0 45px rgba(0, 132, 255, 0.6));
            }
        }

        .animated-logo {
            animation: globalGlow 3s infinite alternate ease-in-out;
        }

        /* Har bir harf uchun alohida navbat (Delay) */
        .char-1 { opacity: 0; animation: letterAppear 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s forwards; }
        .char-2 { opacity: 0; animation: letterAppear 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.4s forwards; }
        .char-3 { opacity: 0; animation: letterAppear 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.6s forwards; }
        .char-4 { opacity: 0; animation: letterAppear 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.8s forwards; }
        .char-5 { opacity: 0; animation: letterAppear 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.0s forwards; }
        .char-6 { opacity: 0; animation: letterAppear 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.2s forwards; }

        /* Premium SVG Kirish Tugmasi */
        .enter-svg-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            outline: none;
            opacity: 0;
            animation: letterAppear 0.6s ease 1.5s forwards;
            transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
            filter: drop-shadow(0 10px 25px rgba(0, 119, 255, 0.35));
        }

        .enter-svg-btn:active {
            transform: scale(0.93);
        }

        .btn-shine {
            animation: shineMove 3s infinite linear;
        }

        @keyframes shineMove {
            0% { transform: translateX(-220px); }
            50%, 100% { transform: translateX(260px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 100% Premium Ko'm-ko'k SVG Logo (A C A Z E S ketma-ket chiqadi) -->
        <svg class="logo-svg animated-logo" viewBox="0 0 360 90" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Ko'k rangli yorqin gradient -->
                <linearGradient id="blueNeon" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#00d4ff"/>
                    <stop offset="50%" stop-color="#0066ff"/>
                    <stop offset="100%" stop-color="#00ffcc"/>
                </linearGradient>

                <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="rgba(0, 212, 255, 0.6)"/>
                    <stop offset="100%" stop-color="rgba(0, 102, 255, 0.2)"/>
                </linearGradient>
            </defs>

            <!-- Dekorativ burchaklar -->
            <path d="M 20 12 L 8 12 L 8 24" fill="none" stroke="url(#frameGrad)" stroke-width="2" stroke-linecap="round"/>
            <path d="M 340 12 L 352 12 L 352 24" fill="none" stroke="url(#frameGrad)" stroke-width="2" stroke-linecap="round"/>
            <path d="M 20 78 L 8 78 L 8 66" fill="none" stroke="url(#frameGrad)" stroke-width="2" stroke-linecap="round"/>
            <path d="M 340 78 L 352 78 L 352 66" fill="none" stroke="url(#frameGrad)" stroke-width="2" stroke-linecap="round"/>

            <!-- Har bir harf alohida guruhda ketma-ket chiqadi -->
            <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#blueNeon)" text-anchor="middle">
                <text class="char-1" x="42" y="62">A</text>
                <text class="char-2" x="96" y="62">C</text>
                <text class="char-3" x="150" y="62">A</text>
                <text class="char-4" x="204" y="62">Z</text>
                <text class="char-5" x="258" y="62">E</text>
                <text class="char-6" x="312" y="62">S</text>
            </g>
        </svg>

        <!-- Premium SVG KIRISH Tugmasi -->
        <button class="enter-svg-btn" onclick="enterMarket()" aria-label="Kirish">
            <svg width="240" height="62" viewBox="0 0 240 62" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="btnBg" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#0055ff"/>
                        <stop offset="50%" stop-color="#00a2ff"/>
                        <stop offset="100%" stop-color="#00ffcc"/>
                    </linearGradient>

                    <linearGradient id="btnBorder" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="rgba(255, 255, 255, 0.8)"/>
                        <stop offset="100%" stop-color="rgba(255, 255, 255, 0.15)"/>
                    </linearGradient>

                    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
                        <stop offset="50%" stop-color="rgba(255,255,255,0.5)"/>
                        <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
                    </linearGradient>

                    <clipPath id="btnClip">
                        <rect x="2" y="2" width="236" height="58" rx="18"/>
                    </clipPath>
                </defs>

                <rect x="2" y="2" width="236" height="58" rx="18" fill="url(#btnBg)"/>
                <rect x="2" y="2" width="236" height="58" rx="18" fill="none" stroke="url(#btnBorder)" stroke-width="1.5"/>
                
                <g clip-path="url(#btnClip)">
                    <polygon class="btn-shine" points="0,0 45,0 20,62 -25,62" fill="url(#shineGrad)"/>
                </g>

                <text x="106" y="32" text-anchor="middle" dominant-baseline="middle"
                      fill="#ffffff"
                      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
                      font-size="16" font-weight="900" letter-spacing="3.5">
                    KIRISH
                </text>

                <g transform="translate(166, 21)" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
                    <line x1="0" y1="10" x2="16" y2="10"/>
                    <polyline points="10 4 16 10 10 16"/>
                </g>
            </svg>
        </button>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        function enterMarket() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }
            // Keyingi oynaga o'tish logikasini shu yerga qo'shamiz
            alert("KIRISH bosildi!");
        }
    </script>
</body>
</html>
