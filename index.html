<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A C A Z E S</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #d60d06;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    .splash-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #d60d06;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    .splash-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .moving-brand {
      color: #ffffff;
      font-size: clamp(28px, 8vw, 44px);
      font-weight: 900;
      letter-spacing: 0.28em;
      padding-left: 0.28em;
      text-transform: uppercase;
      animation: pulseFloat 2.2s ease-in-out infinite;
    }

    @keyframes pulseFloat {
      0% { transform: translateY(0px) scale(1); letter-spacing: 0.28em; }
      50% { transform: translateY(-7px) scale(1.04); letter-spacing: 0.33em; }
      100% { transform: translateY(0px) scale(1); letter-spacing: 0.28em; }
    }

    .main-layout {
      width: 100%;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background-color: #d60d06;
      position: relative;
    }

    .page-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px 14px 106px;
      display: none;
    }

    .page-content.active {
      display: block;
    }

    .hona-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .create-house-btn {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(125, 4, 2, 0.72);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
    }

    .create-house-btn:active {
      transform: scale(0.95);
    }

    .create-house-svg {
      width: 26px;
      height: 26px;
    }

    .rooms-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .room-card {
      background: rgba(125, 4, 2, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
      cursor: pointer;
    }

    .room-card:active {
      transform: scale(0.97);
    }

    .room-img-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: rgba(90, 2, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .room-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .room-alias {
      padding: 9px 10px;
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      text-align: center;
      min-height: 36px;
      word-break: break-word;
    }

    /* XONA ICHKI SAHNASI */
    .room-stage {
      display: none;
      flex-direction: column;
      gap: 10px;
      height: calc(100dvh - 122px);
    }

    .room-stage.active {
      display: flex;
    }

    .stage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(125, 4, 2, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 9px 12px;
      flex-shrink: 0;
    }

    .stage-room-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .stage-room-thumb {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      object-fit: cover;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      background: rgba(85, 2, 0, 0.8);
      flex-shrink: 0;
    }

    .stage-room-title {
      font-size: 15px;
      font-weight: 900;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stage-right-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* REAL VAQT ODAMLAR SONI PREMIUM SVG STIKER */
    .live-count-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 13px;
      background: rgba(85, 2, 0, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.28);
      font-size: 13px;
      font-weight: 900;
      color: #ffffff;
    }

    .live-count-svg {
      width: 18px;
      height: 18px;
    }

    .leave-room-btn {
      padding: 8px 11px;
      border-radius: 13px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(85, 2, 0, 0.78);
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    /* TEPADA KIRISH BILDIRISHNOMASI */
    .join-banner {
      display: none;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-radius: 14px;
      background: rgba(95, 2, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.28);
      font-size: 12px;
      font-weight: 800;
      color: #ffffff;
      text-align: center;
      flex-shrink: 0;
    }

    .join-banner.show {
      display: flex;
    }

    /* 1 TA EGASI O'RINDIG'I + 6 TA STOLCHA (QIMIRLAMAYDI) */
    .seats-panel {
      background: rgba(120, 4, 2, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 22px;
      padding: 12px 10px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .host-seat-row {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .seats-grid-six {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
    }

    .seat-slot {
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 2px;
    }

    .seat-visual {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.11);
      border: 1.5px solid rgba(255, 255, 255, 0.32);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .host-seat-row .seat-visual {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      border-color: rgba(255, 255, 255, 0.55);
    }

    .seat-slot.occupied .seat-visual {
      background: #ffffff;
      border-color: #ffffff;
    }

    .seat-svg {
      width: 32px;
      height: 32px;
    }

    .seat-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .seat-tag {
      font-size: 10.5px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.92);
      max-width: 84px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 14px;
    }

    /* XONA CHAT MAYDONI */
    .room-chat-box {
      flex: 1;
      min-height: 84px;
      background: rgba(110, 3, 1, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      padding: 8px 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chat-msg-item {
      background: rgba(85, 2, 0, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      padding: 6px 9px;
      font-size: 12px;
      line-height: 1.35;
      color: #ffffff;
      word-break: break-word;
    }

    .chat-msg-author {
      font-weight: 900;
      margin-right: 5px;
      color: #ffd5d3;
    }

    /* PASTKI BOSHQARUV PANELI: CHAT INPUT + KICHIK MIKROFON + PADARKA */
    .stage-bottom-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .room-chat-form {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(105, 3, 1, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 16px;
      padding: 4px 6px 4px 11px;
    }

    .room-chat-input {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      outline: none;
    }

    .room-chat-input::placeholder {
      color: rgba(255, 255, 255, 0.55);
    }

    .room-chat-send {
      width: 32px;
      height: 32px;
      border-radius: 11px;
      border: none;
      background: #ffffff;
      color: #d60d06;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* KICHIK MIKROFON (QIMIRLAMAYDI, YOQILGANDA OQ BO'LMAYDI, FAQAT QIZIL CHIZIQ YO'QOLADI) */
    .mic-mini-btn {
      display: none;
      width: 44px;
      height: 44px;
      border-radius: 15px;
      border: 1.5px solid rgba(255, 255, 255, 0.42);
      background: rgba(110, 3, 1, 0.88);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .mic-mini-btn.visible {
      display: inline-flex;
    }

    .mic-mini-svg {
      width: 22px;
      height: 22px;
    }

    .mic-slash {
      opacity: 1;
    }

    .mic-mini-btn.mic-on .mic-slash {
      opacity: 0;
    }

    /* PADARKA TUGMASI (MIKROFON OLDIDA, QIMIRLAMAYDI) */
    .gift-open-btn {
      width: 44px;
      height: 44px;
      border-radius: 15px;
      border: 1.5px solid rgba(255, 255, 255, 0.42);
      background: rgba(110, 3, 1, 0.88);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .gift-open-svg {
      width: 22px;
      height: 22px;
    }

    /* 60 TA PREMIUM SVG PADARKA OYNASI (QIMIRLAMAYDI, FAQAT O'RINDIQDAGILAR TANLANADI) */
    .gift-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 95;
      background: rgba(0, 0, 0, 0.58);
      backdrop-filter: blur(5px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
    }

    .gift-modal-backdrop.open {
      display: flex;
    }

    .gift-sheet {
      width: 100%;
      max-width: 460px;
      max-height: 76dvh;
      background: #b80a04;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 24px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .gift-sheet-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .gift-recipients-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0 4px;
      scrollbar-width: none;
    }

    .gift-recipients-bar::-webkit-scrollbar {
      display: none;
    }

    .recipient-chip {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 13px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(90, 2, 0, 0.72);
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .recipient-chip.selected {
      background: #ffffff;
      color: #d60d06;
      border-color: #ffffff;
    }

    .recipient-chip-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      object-fit: cover;
      background: #9e0803;
    }

    .gifts-60-grid {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding-right: 2px;
    }

    .gift-cell {
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(90, 2, 0, 0.65);
      border-radius: 16px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
    }

    .gift-cell.selected {
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.22);
    }

    .gift-cell svg {
      width: 30px;
      height: 30px;
    }

    .gift-cell-num {
      font-size: 10px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.88);
    }

    .send-gift-confirm-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 15px;
      background: #ffffff;
      color: #d60d06;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    .send-gift-confirm-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* HONA EGASI BOSGANDA USTMA-UST CHIQADIGAN AMALLAR */
    .seat-action-backdrop {
      position: fixed;
      inset: 0;
      z-index: 85;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .seat-action-backdrop.open {
      display: flex;
    }

    .seat-action-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 240px;
    }

    .premium-action-btn {
      width: 100%;
      padding: 14px 16px;
      border-radius: 20px;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      background: #b80a04;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.36);
      animation: actionStickerFloat 1.9s ease-in-out infinite;
    }

    .premium-action-btn:nth-child(2) {
      animation-delay: 0.25s;
    }

    .action-svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    @keyframes actionStickerFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-3px) scale(1.04); }
    }

    /* HONA OCHISH MODALI (RASM VA NOM SHART) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 390px;
      background: #b80a04;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 24px;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
    }

    .modal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 900;
      color: #ffffff;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(90, 2, 0, 0.65);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .pick-photo-label {
      width: 100%;
      height: 140px;
      border-radius: 18px;
      border: 1.5px dashed rgba(255, 255, 255, 0.45);
      background: rgba(95, 2, 0, 0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      overflow: hidden;
    }

    .pick-photo-label.error {
      border-color: #ffffff;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.45);
    }

    .pick-photo-label img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .pick-photo-label.has-img img {
      display: block;
    }

    .pick-photo-label.has-img .pick-hint {
      display: none;
    }

    .pick-hint {
      font-size: 12px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
    }

    .alias-input-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .alias-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(90, 2, 0, 0.72);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      outline: none;
    }

    .alias-input.error {
      border-color: #ffffff;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.45);
    }

    .alias-input::placeholder {
      color: rgba(255, 255, 255, 0.55);
      font-weight: 500;
    }

    .char-counter {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
      text-align: right;
    }

    .save-room-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 15px;
      background: #ffffff;
      color: #d60d06;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    .save-room-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* PROFILM BO'LIMI */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 28px 16px;
      background: rgba(135, 6, 2, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 24px;
    }

    .avatar-ring {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #ffffff 0%, rgba(255, 255, 255, 0.35) 100%);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      margin-bottom: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #9e0803;
      display: block;
    }

    .profile-name-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .profile-name {
      font-size: 21px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.01em;
    }

    .verified-badge-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      animation: badgeFloatPulse 2s ease-in-out infinite;
    }

    .verified-svg {
      width: 24px;
      height: 24px;
      overflow: visible;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.32));
    }

    @keyframes badgeFloatPulse {
      0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
      50% { transform: translateY(-3px) rotate(6deg) scale(1.1); }
    }

    /* PASTKI 4 TA MENYU PANELI */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      padding: 10px 14px 16px;
      background: #d60d06;
      border-top: 1px solid rgba(255, 255, 255, 0.24);
      z-index: 50;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      background: rgba(125, 4, 2, 0.78);
      padding: 7px;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .nav-item {
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.85);
      border-radius: 16px;
      padding: 8px 4px;
      min-height: 58px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
    }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.38);
    }

    .premium-sticker {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.32);
      animation: stickerMove 2s ease-in-out infinite;
    }

    .nav-item.active .premium-sticker {
      background: #ffffff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.24);
    }

    .premium-svg {
      width: 18px;
      height: 18px;
      overflow: visible;
    }

    .svg-stroke-white { stroke: #ffffff; }
    .nav-item.active .svg-stroke-white { stroke: #d60d06; }
    .svg-fill-white { fill: #ffffff; }
    .nav-item.active .svg-fill-white { fill: #d60d06; }

    @keyframes stickerMove {
      0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
      50% { transform: translateY(-3px) rotate(-3.5deg) scale(1.07); }
    }

    .nav-label {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.15;
    }
  </style>
</head>
<body>
  <div class="splash-screen" id="splash">
    <div class="moving-brand">A C A Z E S</div>

  <div class="main-layout">
    <!-- 1. HONA BO'LIMI -->

          <!-- KICHIK MIKROFON (YOQILGANDA OQ BO'LMAYDI, FAQAT QIZIL CHIZIQ YO'QOLADI, QIMIRLAMAYDI) -->

          <!-- PADARKA TUGMASI -->

              <path d="M12 7C12 7 8.5 7 8 4.8C7.6 3.2 9.4 2.5 10.6 3.7L12 5.2L13.4 3.7C14.6 2.5 16.4 3.2 16 4.8C15.5 7 12 7 12 7Z" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>

    <section class="page-content" id="page-profile">

        <div class="avatar-ring">
          <img
            id="tgPhoto"

            src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><rect width='120' height='120' fill='%23990703'/><circle cx='60' cy='46' r='20' fill='%23ffffff' fill-opacity='0.9'/><path d='M24 102C24 81 40 68 60 68C80 68 96 81 96 102' fill='%23ffffff' fill-opacity='0.9'/></svg>"

    <!-- HONA EGASI BOSGANDA USTMA-UST CHIQADIGAN AMALLAR -->
    <div class="seat-action-backdrop" id="seatActionBackdrop">
      <div class="seat-action-stack">
        <button type="button" class="premium-action-btn" id="actionBlockUserBtn">
          <svg class="action-svg" viewBox="0 0 24 24" fill="none">

        <button type="button" class="premium-action-btn" id="actionStandUpBtn">

            <path d="M12 17V20.5M9 20.5H15" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
            <line x1="4.5" y1="4.5" x2="19.5" y2="19.5" stroke="#ff2b24" stroke-width="2.4" stroke-linecap="round"/>

    <!-- 60 TA PREMIUM SVG PADARKA OYNASI -->
    <div class="gift-modal-backdrop" id="giftModalBackdrop">

              <path class="svg-stroke-white" d="M4.5 6.8C4.5 5.4 5.6 4.3 7 4.3H17C18.4 4.3 19.5 5.4 19.5 6.8V13.6C19.5 15 18.4 16.1 17 16.1H10.8L6.8 19.7V16.1C5.5 15.8 4.5 14.8 4.5 13.6V6.8Z" stroke-width="1.9" stroke-linejoin="round"/>

              <circle class="svg-fill-white" cx="9.2" cy="9.4" r="1.1"/>

              <path class="svg-stroke-white" d="M5.5 19.2C5.5 16.1 8.4 14 12 14C15.6 14 18.5 16.1 18.5 19.2" stroke-width="1.9" stroke-linecap="round"/>

  <!-- HONA OCHISH MODALI (RASM VA NOM SHART) -->
  <div class="modal-backdrop" id="roomModal">
    <div class="modal-card">
      <div class="modal-top">
        <span class="modal-title">Hona ochish</span>
        <button type="button" class="close-btn" id="closeRoomModalBtn">✕</button>
      </div>

      <label class="pick-photo-label" id="pickPhotoLabel" for="roomPhotoInput">
        <img id="roomPreviewImg" src="" alt="" />
        <span class="pick-hint" id="pickPhotoHint">Rasm tanlash *</span>
      </label>
      <input type="file" id="roomPhotoInput" accept="image/*" hidden />

      <div class="alias-input-wrap">
        <input
          type="text"
          id="roomAliasInput"
          class="alias-input"
          maxlength="10"
          placeholder="Hona nomi (1–10 belgi) *"
        />
        <div class="char-counter" id="charCounter">0 / 10</div>
      </div>

      <button type="button" class="save-room-btn" id="saveRoomBtn" disabled>Ochish</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#d60d06");
      tg.setBackgroundColor("#d60d06");
    }

    setTimeout(() => {
      document.getElementById("splash").classList.add("hide");
    }, 1500);

    const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
    const urlParams = new URLSearchParams(window.location.search);

    const currentUserId = String(urlParams.get("uid") || (tgUser && tgUser.id) || "u_" + Math.random().toString(36).slice(2, 9));
    const fullName =
      urlParams.get("name") ||
      (tgUser ? [tgUser.first_name, tgUser.last_name].filter(Boolean).join(" ") : "") ||
      "Foydalanuvchi";
    const photoUrl = urlParams.get("photo") || "";

    document.getElementById("tgName").textContent = fullName;
    if (photoUrl) {
      document.getElementById("tgPhoto").src = photoUrl;
    }

    // REAL-TIME AUDIO (Web Audio + WebRTC tayyor ulanish)
    let localAudioStream = null;
    let micEnabled = false;
    const micMiniBtn = document.getElementById("micMiniBtn");

    async function setMicrophoneLive(enable) {
      if (enable) {
        try {
          if (!localAudioStream && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            localAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          }
          if (localAudioStream) {
            localAudioStream.getAudioTracks().forEach((t) => { t.enabled = true; });
          }
          micEnabled = true;
        } catch (_) {
          micEnabled = true;
        }
      } else {
        if (localAudioStream) {
          localAudioStream.getAudioTracks().forEach((t) => { t.enabled = false; });
        }
        micEnabled = false;
      }
      micMiniBtn.classList.toggle("mic-on", micEnabled);
    }

    micMiniBtn.addEventListener("click", async () => {
      await setMicrophoneLive(!micEnabled);
      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred("light");
      }
    });

    // TABLAR ALMASHINUVI
    const navItems = document.querySelectorAll(".nav-item");
    const pages = document.querySelectorAll(".page-content");

    navItems.forEach((btn) => {
      btn.addEventListener("click", () => {
        const targetId = btn.dataset.target;
        navItems.forEach((item) => item.classList.remove("active"));
        btn.classList.add("active");
        pages.forEach((page) => {
          page.classList.toggle("active", page.id === targetId);
        });
        syncMicVisibility();
      });
    });

    // HONA VA REAL VAQT KANALI (BroadcastChannel + localStorage)
    const STORAGE_KEY = "acazes_hona_rooms_v4";
    const channel = typeof BroadcastChannel !== "undefined" ? new BroadcastChannel("acazes_live_rooms") : null;

    const roomModal = document.getElementById("roomModal");
    const openRoomModalBtn = document.getElementById("openRoomModalBtn");
    const closeRoomModalBtn = document.getElementById("closeRoomModalBtn");
    const roomPhotoInput = document.getElementById("roomPhotoInput");
    const pickPhotoLabel = document.getElementById("pickPhotoLabel");
    const roomPreviewImg = document.getElementById("roomPreviewImg");
    const roomAliasInput = document.getElementById("roomAliasInput");
    const charCounter = document.getElementById("charCounter");
    const saveRoomBtn = document.getElementById("saveRoomBtn");
    const roomsGrid = document.getElementById("roomsGrid");

    const honaLobbyView = document.getElementById("honaLobbyView");
    const roomStageView = document.getElementById("roomStageView");
    const stageRoomPhoto = document.getElementById("stageRoomPhoto");
    const stageRoomTitle = document.getElementById("stageRoomTitle");
    const livePeopleCount = document.getElementById("livePeopleCount");
    const leaveRoomBtn = document.getElementById("leaveRoomBtn");
    const joinBanner = document.getElementById("joinBanner");
    const hostSeatRow = document.getElementById("hostSeatRow");
    const seatsSixGrid = document.getElementById("seatsSixGrid");

    const roomChatBox = document.getElementById("roomChatBox");
    const roomChatForm = document.getElementById("roomChatForm");
    const roomChatInput = document.getElementById("roomChatInput");

    const seatActionBackdrop = document.getElementById("seatActionBackdrop");
    const actionBlockUserBtn = document.getElementById("actionBlockUserBtn");
    const actionStandUpBtn = document.getElementById("actionStandUpBtn");

    const openGiftModalBtn = document.getElementById("openGiftModalBtn");
    const giftModalBackdrop = document.getElementById("giftModalBackdrop");
    const closeGiftModalBtn = document.getElementById("closeGiftModalBtn");
    const giftRecipientsBar = document.getElementById("giftRecipientsBar");
    const gifts60Grid = document.getElementById("gifts60Grid");
    const sendGiftConfirmBtn = document.getElementById("sendGiftConfirmBtn");

    let selectedRoomPhoto = "";
    let activeRoomId = null;
    let targetSeatIndexForAction = null;
    let selectedRecipientUserId = null;
    let selectedGiftIndex = null;
    let joinBannerTimer = null;

    function loadRooms() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (_) {
        return [];
      }
    }

    function saveRooms(rooms) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(rooms));
      } catch (_) {}
      if (channel) {
        channel.postMessage({ type: "rooms_updated" });
      }
    }

    function getActiveRoom() {
      if (activeRoomId === null) return null;
      return loadRooms().find((r) => r.id === activeRoomId) || null;
    }

    function isRoomHost(room) {
      return room && String(room.ownerId) === String(currentUserId);
    }

    function isUserSeatedInRoom(room) {
      if (!room) return false;
      if (room.hostOccupant && String(room.hostOccupant.userId) === String(currentUserId)) return true;
      return Array.isArray(room.seats) && room.seats.some((s) => s && String(s.userId) === String(currentUserId));
    }

    function syncMicVisibility() {
      const room = getActiveRoom();
      const onHonaPage = document.getElementById("page-hona").classList.contains("active");
      const insideRoom = roomStageView.classList.contains("active") && !!room;
      const shouldShow = onHonaPage && insideRoom && isUserSeatedInRoom(room);
      micMiniBtn.classList.toggle("visible", shouldShow);
      if (!shouldShow && micEnabled) {
        setMicrophoneLive(false);
      }
    }

    function showTopJoinBanner(text) {
      if (!text) return;
      joinBanner.textContent = text;
      joinBanner.classList.add("show");
      if (joinBannerTimer) clearTimeout(joinBannerTimer);
      joinBannerTimer = setTimeout(() => {
        joinBanner.classList.remove("show");
      }, 3600);
    }

    function createSeatSvg() {
      return `
        <svg class="seat-svg" viewBox="0 0 40 40" fill="none">
          <path
            d="M11 8.5C11 6.8 12.4 5.5 14.1 5.5H25.9C27.6 5.5 29 6.8 29 8.5V19.5H11V8.5Z"
            stroke="#ffffff"
            stroke-width="2.2"
            stroke-linejoin="round"
          />
          <rect x="7.5" y="19.5" width="25" height="8" rx="3.5" fill="#ffffff"/>
          <path d="M10.5 27.5V33.5M29.5 27.5V33.5" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round"/>
        </svg>
      `;
    }

    function createOccupantVisual(occupant) {
      if (occupant && occupant.photo) {
        const img = document.createElement("img");
        img.className = "seat-avatar-img";
        img.src = occupant.photo;
        img.alt = "";
        return img;
      }
      const wrap = document.createElement("div");
      wrap.innerHTML = `
        <svg class="seat-svg" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="14" r="6.5" fill="#d60d06"/>
          <path d="M9 32C9 25.5 13.8 22 20 22C26.2 22 31 25.5 31 32" fill="#d60d06"/>
        </svg>
      `;
      return wrap.firstElementChild;
    }

    function openSeatActions(seatIdx) {
      targetSeatIndexForAction = seatIdx;
      seatActionBackdrop.classList.add("open");
    }

    function closeSeatActions() {
      targetSeatIndexForAction = null;
      seatActionBackdrop.classList.remove("open");
    }

    seatActionBackdrop.addEventListener("click", (e) => {
      if (e.target === seatActionBackdrop) closeSeatActions();
    });

    actionStandUpBtn.addEventListener("click", () => {
      const room = getActiveRoom();
      if (room && isRoomHost(room) && targetSeatIndexForAction !== null) {
        const rooms = loadRooms().map((r) => {
          if (r.id !== room.id) return r;
          const nextSeats = [...r.seats];
          nextSeats[targetSeatIndexForAction] = null;
          return { ...r, seats: nextSeats };
        });
        saveRooms(rooms);
        renderActiveRoom();
      }
      closeSeatActions();
    });

    actionBlockUserBtn.addEventListener("click", () => {
      const room = getActiveRoom();
      if (room && isRoomHost(room) && targetSeatIndexForAction !== null) {
        const occupant = room.seats[targetSeatIndexForAction];
        if (occupant) {
          const rooms = loadRooms().map((r) => {
            if (r.id !== room.id) return r;
            const nextBlocked = Array.isArray(r.blockedUsers) ? [...r.blockedUsers] : [];
            if (!nextBlocked.includes(String(occupant.userId))) {
              nextBlocked.push(String(occupant.userId));
            }
            const nextSeats = [...r.seats];
            nextSeats[targetSeatIndexForAction] = null;
            const nextMembers = (r.members || []).filter((m) => String(m.userId) !== String(occupant.userId));
            return { ...r, blockedUsers: nextBlocked, seats: nextSeats, members: nextMembers };
          });
          saveRooms(rooms);
          renderActiveRoom();
        }
      }
      closeSeatActions();
    });

    function renderSeats(room) {
      hostSeatRow.innerHTML = "";
      seatsSixGrid.innerHTML = "";

      const hostOcc = room.hostOccupant;
      const hostBtn = document.createElement("button");
      hostBtn.type = "button";
      hostBtn.className = `seat-slot ${hostOcc ? "occupied" : ""}`;

      const hostVisual = document.createElement("div");
      hostVisual.className = "seat-visual";
      if (hostOcc) {
        hostVisual.appendChild(createOccupantVisual(hostOcc));
      } else {
        hostVisual.innerHTML = createSeatSvg();
      }

      const hostTag = document.createElement("span");
      hostTag.className = "seat-tag";
      hostTag.textContent = hostOcc ? (hostOcc.name || "") : "";

      hostBtn.appendChild(hostVisual);
      hostBtn.appendChild(hostTag);

      hostBtn.addEventListener("click", () => {
        if (!isRoomHost(room)) return;
        const rooms = loadRooms().map((r) => {
          if (r.id !== room.id) return r;
          if (r.hostOccupant) {
            return { ...r, hostOccupant: null };
          }
          const cleanSeats = r.seats.map((s) => (s && String(s.userId) === String(currentUserId) ? null : s));
          return {
            ...r,
            seats: cleanSeats,
            hostOccupant: { userId: currentUserId, name: fullName, photo: photoUrl }
          };
        });
        saveRooms(rooms);
        renderActiveRoom();
      });

      hostSeatRow.appendChild(hostBtn);

      for (let i = 0; i < 6; i++) {
        const occupant = room.seats[i] || null;
        const isMine = occupant && String(occupant.userId) === String(currentUserId);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `seat-slot ${occupant ? "occupied" : ""}`;

        const visual = document.createElement("div");
        visual.className = "seat-visual";
        if (occupant) {
          visual.appendChild(createOccupantVisual(occupant));
        } else {
          visual.innerHTML = createSeatSvg();
        }

        const tag = document.createElement("span");
        tag.className = "seat-tag";
        tag.textContent = occupant ? (occupant.name || "") : "";

        btn.appendChild(visual);
        btn.appendChild(tag);

        btn.addEventListener("click", () => {
          if (occupant) {
            if (isRoomHost(room) && !isMine) {
              openSeatActions(i);
              return;
            }
            if (isMine) {
              const rooms = loadRooms().map((r) => {
                if (r.id !== room.id) return r;
                const nextSeats = [...r.seats];
                nextSeats[i] = null;
                return { ...r, seats: nextSeats };
              });
              saveRooms(rooms);
              renderActiveRoom();
            }
            return;
          }

          if (isUserSeatedInRoom(room)) return;

          const rooms = loadRooms().map((r) => {
            if (r.id !== room.id) return r;
            const nextSeats = [...r.seats];
            nextSeats[i] = { userId: currentUserId, name: fullName, photo: photoUrl };
            return { ...r, seats: nextSeats };
          });
          saveRooms(rooms);
          renderActiveRoom();
        });

        seatsSixGrid.appendChild(btn);
      }
    }

    function renderRoomChat(room) {
      roomChatBox.innerHTML = "";
      const messages = Array.isArray(room.messages) ? room.messages : [];
      messages.forEach((m) => {
        const div = document.createElement("div");
        div.className = "chat-msg-item";
        div.innerHTML = `<span class="chat-msg-author">${escapeHtml(m.author)}:</span><span>${escapeHtml(m.text)}</span>`;
        roomChatBox.appendChild(div);
      });
      roomChatBox.scrollTop = roomChatBox.scrollHeight;
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderActiveRoom() {
      const room = getActiveRoom();
      if (!room) {
        if (activeRoomId !== null) {
          exitRoomLocalOnly();
        }
        return;
      }

      const blocked = Array.isArray(room.blockedUsers) ? room.blockedUsers : [];
      if (blocked.includes(String(currentUserId))) {
        exitRoomLocalOnly();
        return;
      }

      stageRoomTitle.textContent = (room.alias || "").slice(0, 10);
      stageRoomPhoto.src = room.photo || "";

      const members = Array.isArray(room.members) ? room.members : [];
      livePeopleCount.textContent = String(Math.max(1, members.length));

      if (room.lastJoinEvent && room.lastJoinEvent.text) {
        if (window.__lastSeenJoinTs !== room.lastJoinEvent.ts) {
          window.__lastSeenJoinTs = room.lastJoinEvent.ts;
          showTopJoinBanner(room.lastJoinEvent.text);
        }
      }

      renderSeats(room);
      renderRoomChat(room);
      syncMicVisibility();
    }

    function exitRoomLocalOnly() {
      activeRoomId = null;
      setMicrophoneLive(false);
      closeSeatActions();
      giftModalBackdrop.classList.remove("open");
      roomStageView.classList.remove("active");
      honaLobbyView.style.display = "block";
      syncMicVisibility();
      renderRooms();
    }

    function leaveOrDeleteRoom() {
      const room = getActiveRoom();
      if (!room) {
        exitRoomLocalOnly();
        return;
      }

      if (isRoomHost(room)) {
        const remaining = loadRooms().filter((r) => r.id !== room.id);
        saveRooms(remaining);
        exitRoomLocalOnly();
        return;
      }

      const rooms = loadRooms().map((r) => {
        if (r.id !== room.id) return r;
        const nextSeats = r.seats.map((s) => (s && String(s.userId) === String(currentUserId) ? null : s));
        const nextMembers = (r.members || []).filter((m) => String(m.userId) !== String(currentUserId));
        return { ...r, seats: nextSeats, members: nextMembers };
      });
      saveRooms(rooms);
      exitRoomLocalOnly();
    }

    leaveRoomBtn.addEventListener("click", leaveOrDeleteRoom);

    function enterRoom(roomId) {
      const rooms = loadRooms();
      const target = rooms.find((r) => r.id === roomId);
      if (!target) return;

      const blocked = Array.isArray(target.blockedUsers) ? target.blockedUsers : [];
      if (blocked.includes(String(currentUserId))) return;

      const joinText = `${fullName} honaga kirdi`;
      const updated = rooms.map((r) => {
        if (r.id !== roomId) return r;
        const members = Array.isArray(r.members) ? [...r.members] : [];
        if (!members.some((m) => String(m.userId) === String(currentUserId))) {
          members.push({ userId: currentUserId, name: fullName, photo: photoUrl });
        }
        const hostOcc =
          String(r.ownerId) === String(currentUserId)
            ? { userId: currentUserId, name: fullName, photo: photoUrl }
            : r.hostOccupant;

        return {
          ...r,
          members,
          hostOccupant: hostOcc,
          lastJoinEvent: { ts: Date.now(), text: joinText }
        };
      });

      saveRooms(updated);
      activeRoomId = roomId;
      honaLobbyView.style.display = "none";
      roomStageView.classList.add("active");
      renderActiveRoom();
    }

    function renderRooms() {
      const rooms = loadRooms();
      roomsGrid.innerHTML = "";
      rooms.forEach((room) => {
        const blocked = Array.isArray(room.blockedUsers) ? room.blockedUsers : [];
        if (blocked.includes(String(currentUserId))) return;

        const card = document.createElement("div");
        card.className = "room-card";

        const imgBox = document.createElement("div");
        imgBox.className = "room-img-box";
        if (room.photo) {
          const img = document.createElement("img");
          img.src = room.photo;
          img.alt = room.alias || "";
          imgBox.appendChild(img);
        }

        const aliasDiv = document.createElement("div");
        aliasDiv.className = "room-alias";
        aliasDiv.textContent = (room.alias || "").slice(0, 10);

        card.appendChild(imgBox);
        card.appendChild(aliasDiv);
        card.addEventListener("click", () => enterRoom(room.id));
        roomsGrid.appendChild(card);
      });
    }

    // CHAT YUBORISH (60 BELGI LIMIT, ESLATMASIZ)
    roomChatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const room = getActiveRoom();
      if (!room) return;
      const text = roomChatInput.value.trim().slice(0, 60);
      if (!text) return;

      const rooms = loadRooms().map((r) => {
        if (r.id !== room.id) return r;
        const messages = Array.isArray(r.messages) ? [...r.messages] : [];
        messages.push({ author: fullName, text });
        return { ...r, messages: messages.slice(-80) };
      });
      saveRooms(rooms);
      roomChatInput.value = "";
      renderActiveRoom();
    });

    // 60 TA PREMIUM SVG PADARKA GENERATORI (QIMIRLAMAYDI, FAQAT O'RINDIQDAGILAR TANLANADI)
    function createPremiumGiftSvg(idx) {
      const variant = idx % 6;
      const num = idx + 1;
      if (variant === 0) {
        return `<svg viewBox="0 0 32 32" fill="none"><polygon points="16,3 28,11 23,28 9,28 4,11" stroke="#ffffff" stroke-width="2" fill="rgba(255,255,255,0.16)"/><polygon points="16,8 22,13 19,23 13,23 10,13" fill="#ffffff"/></svg>`;
      }
      if (variant === 1) {
        return `<svg viewBox="0 0 32 32" fill="none"><path d="M5 23L8 9L16 15L24 9L27 23H5Z" stroke="#ffffff" stroke-width="2" fill="rgba(255,255,255,0.18)" stroke-linejoin="round"/><circle cx="8" cy="7" r="1.8" fill="#ffffff"/><circle cx="16" cy="11" r="1.8" fill="#ffffff"/><circle cx="24" cy="7" r="1.8" fill="#ffffff"/></svg>`;
      }
      if (variant === 2) {
        return `<svg viewBox="0 0 32 32" fill="none"><polygon points="16,3 20,11 29,12 22.5,18.2 24.2,27 16,22.6 7.8,27 9.5,18.2 3,12 12,11" stroke="#ffffff" stroke-width="2" fill="rgba(255,255,255,0.2)" stroke-linejoin="round"/></svg>`;
      }
      if (variant === 3) {
        return `<svg viewBox="0 0 32 32" fill="none"><path d="M16 27C16 27 5 20 5 12C5 8.5 7.8 6 11 6C13.2 6 15 7.2 16 8.8C17 7.2 18.8 6 21 6C24.2 6 27 8.5 27 12C27 20 16 27 16 27Z" stroke="#ffffff" stroke-width="2" fill="rgba(255,255,255,0.2)"/></svg>`;
      }
      if (variant === 4) {
        return `<svg viewBox="0 0 32 32" fill="none"><rect x="6" y="13" width="20" height="14" rx="3" stroke="#ffffff" stroke-width="2" fill="rgba(255,255,255,0.16)"/><rect x="4" y="9" width="24" height="4.5" rx="2" stroke="#ffffff" stroke-width="2"/><path d="M16 9V27" stroke="#ffffff" stroke-width="2"/></svg>`;
      }
      return `<svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="11" stroke="#ffffff" stroke-width="2" fill="rgba(255,255,255,0.16)"/><path d="M16 9L18.2 13.8L23.5 14.5L19.6 18.1L20.6 23.3L16 20.8L11.4 23.3L12.4 18.1L8.5 14.5L13.8 13.8L16 9Z" fill="#ffffff"/></svg>`;
    }

    function getSeatedPeople(room) {
      if (!room) return [];
      const list = [];
      if (room.hostOccupant) {
        list.push(room.hostOccupant);
      }
      if (Array.isArray(room.seats)) {
        room.seats.forEach((s) => {
          if (s && !list.some((x) => String(x.userId) === String(s.userId))) {
            list.push(s);
          }
        });
      }
      return list;
    }

    function updateGiftConfirmButton() {
      sendGiftConfirmBtn.disabled = !(selectedRecipientUserId && selectedGiftIndex !== null);
    }

    function openGiftModal() {
      const room = getActiveRoom();
      if (!room) return;
      const seatedList = getSeatedPeople(room);

      selectedRecipientUserId = seatedList.length > 0 ? String(seatedList[0].userId) : null;
      selectedGiftIndex = null;
      giftRecipientsBar.innerHTML = "";
      gifts60Grid.innerHTML = "";

      seatedList.forEach((person) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = `recipient-chip ${String(person.userId) === selectedRecipientUserId ? "selected" : ""}`;
        if (person.photo) {
          const av = document.createElement("img");
          av.className = "recipient-chip-avatar";
          av.src = person.photo;
          av.alt = "";
          chip.appendChild(av);
        }
        const sp = document.createElement("span");
        sp.textContent = person.name || "";
        chip.appendChild(sp);

        chip.addEventListener("click", () => {
          selectedRecipientUserId = String(person.userId);
          giftRecipientsBar.querySelectorAll(".recipient-chip").forEach((c) => c.classList.remove("selected"));
          chip.classList.add("selected");
          updateGiftConfirmButton();
        });
        giftRecipientsBar.appendChild(chip);
      });

      for (let i = 0; i < 60; i++) {
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "gift-cell";
        cell.innerHTML = `${createPremiumGiftSvg(i)}<span class="gift-cell-num">#${i + 1}</span>`;
        cell.addEventListener("click", () => {
          selectedGiftIndex = i;
          gifts60Grid.querySelectorAll(".gift-cell").forEach((c) => c.classList.remove("selected"));
          cell.classList.add("selected");
          updateGiftConfirmButton();
        });
        gifts60Grid.appendChild(cell);
      }

      updateGiftConfirmButton();
      giftModalBackdrop.classList.add("open");
    }

    openGiftModalBtn.addEventListener("click", openGiftModal);
    closeGiftModalBtn.addEventListener("click", () => {
      giftModalBackdrop.classList.remove("open");
    });
    giftModalBackdrop.addEventListener("click", (e) => {
      if (e.target === giftModalBackdrop) {
        giftModalBackdrop.classList.remove("open");
      }
    });

    sendGiftConfirmBtn.addEventListener("click", () => {
      const room = getActiveRoom();
      if (!room || !selectedRecipientUserId || selectedGiftIndex === null) return;
      const seatedList = getSeatedPeople(room);
      const targetPerson = seatedList.find((p) => String(p.userId) === selectedRecipientUserId);
      if (!targetPerson) return;

      const rooms = loadRooms().map((r) => {
        if (r.id !== room.id) return r;
        const messages = Array.isArray(r.messages) ? [...r.messages] : [];
        messages.push({
          author: fullName,
          text: `→ ${targetPerson.name} (#${selectedGiftIndex + 1})`
        });
        return { ...r, messages: messages.slice(-80) };
      });
      saveRooms(rooms);
      giftModalBackdrop.classList.remove("open");
      renderActiveRoom();
    });

    // HONA OCHISH (RASM VA NOM MAJBURIY)
    function validateRoomCreateForm() {
      const hasPhoto = Boolean(selectedRoomPhoto);
      const alias = roomAliasInput.value.trim();
      const hasAlias = alias.length >= 1 && alias.length <= 10;
      saveRoomBtn.disabled = !(hasPhoto && hasAlias);
    }

    function resetModalForm() {
      selectedRoomPhoto = "";
      roomPreviewImg.src = "";
      pickPhotoLabel.classList.remove("has-img", "error");
      roomPhotoInput.value = "";
      roomAliasInput.value = "";
      roomAliasInput.classList.remove("error");
      charCounter.textContent = "0 / 10";
      validateRoomCreateForm();
    }

    openRoomModalBtn.addEventListener("click", () => {
      resetModalForm();
      roomModal.classList.add("open");
    });

    closeRoomModalBtn.addEventListener("click", () => {
      roomModal.classList.remove("open");
    });

    roomModal.addEventListener("click", (e) => {
      if (e.target === roomModal) {
        roomModal.classList.remove("open");
      }
    });

    roomPhotoInput.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        selectedRoomPhoto = String(reader.result || "");
        roomPreviewImg.src = selectedRoomPhoto;
        pickPhotoLabel.classList.add("has-img");
        pickPhotoLabel.classList.remove("error");
        validateRoomCreateForm();
      };
      reader.readAsDataURL(file);
    });

    roomAliasInput.addEventListener("input", () => {
      if (roomAliasInput.value.length > 10) {
        roomAliasInput.value = roomAliasInput.value.slice(0, 10);
      }
      charCounter.textContent = `${roomAliasInput.value.length} / 10`;
      if (roomAliasInput.value.trim().length > 0) {
        roomAliasInput.classList.remove("error");
      }
      validateRoomCreateForm();
    });

    saveRoomBtn.addEventListener("click", () => {
      const alias = roomAliasInput.value.trim().slice(0, 10);
      if (!selectedRoomPhoto) {
        pickPhotoLabel.classList.add("error");
        return;
      }
      if (!alias) {
        roomAliasInput.classList.add("error");
        return;
      }

      const newRoomId = Date.now();
      const newRoom = {
        id: newRoomId,
        ownerId: currentUserId,
        ownerName: fullName,
        ownerPhoto: photoUrl,
        photo: selectedRoomPhoto,
        alias: alias,
        hostOccupant: { userId: currentUserId, name: fullName, photo: photoUrl },
        seats: [null, null, null, null, null, null],
        members: [{ userId: currentUserId, name: fullName, photo: photoUrl }],
        messages: [],
        blockedUsers: [],
        lastJoinEvent: { ts: Date.now(), text: `${fullName} honaga kirdi` }
      };

      const rooms = loadRooms();
      rooms.unshift(newRoom);
      saveRooms(rooms);
      roomModal.classList.remove("open");
      renderRooms();
      enterRoom(newRoomId);
    });

    if (channel) {
      channel.onmessage = () => {
        renderRooms();
        if (activeRoomId !== null) {
          renderActiveRoom();
        }
      };
    }

    window.addEventListener("storage", (e) => {
      if (e.key === STORAGE_KEY) {
        renderRooms();
        if (activeRoomId !== null) {
          renderActiveRoom();
        }
      }
    });

    window.addEventListener("beforeunload", () => {
      const room = getActiveRoom();
      if (room && isRoomHost(room)) {
        const remaining = loadRooms().filter((r) => r.id !== room.id);
        saveRooms(remaining);
      }
    });

    renderRooms();
    syncMicVisibility();
  </script>
</body>
</html>
