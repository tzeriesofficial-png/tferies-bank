<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            color: #000000;
            overflow: hidden;
            position: relative;
        }

        /* KIRISH QISMI: OQ FON, YOZUVSIZ, BLOKSIZ KATTA QORA PREMIUM SVG SAMOLYOT */
        .tg-splash-screen {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.45s ease;
            z-index: 60;
        }

        .tg-splash-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .plane-svg-wrap {
            width: 146px;
            height: 146px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: tgPlaneMotion 2.4s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes tgPlaneMotion {
            0% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
            35% { transform: translate(5px, -8px) rotate(-4deg) scale(1.04); }
            70% { transform: translate(-3px, -4px) rotate(3deg) scale(1.02); }
            100% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
        }

        .plane-svg-wrap svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        /* ASOSIY OYNA */
        .tg-main-shell {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .tg-content-area {
            flex: 1;
            width: 100%;
            overflow-y: auto;
            padding: 16px 14px;
        }

        .tg-section {
            display: none;
            width: 100%;
            height: 100%;
        }

        .tg-section.active {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sec-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            flex-shrink: 0;
        }

        .sec-title {
            font-size: 20px;
            font-weight: 800;
            color: #000000;
        }

        .btn-dark {
            background: #000000;
            color: #ffffff;
            border: 1.5px solid #000000;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-light-border {
            background: #ffffff;
            color: #000000;
            border: 1.5px solid rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }

        .list-stack {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 12px;
        }

        .row-card {
            background: #fafafa;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 16px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
        }

        .row-card:active {
            background: #f0f0f0;
        }

        .avatar-circle {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(0, 0, 0, 0.14);
            background: #f2f2f2;
            flex-shrink: 0;
        }

        /* PROFIL KARTASI */
        .profile-card {
            background: #fafafa;
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 20px;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .profile-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .profile-avatar-big {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #000000;
            background: #eeeeee;
            flex-shrink: 0;
            cursor: pointer;
        }

        .info-box {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .info-label {
            font-size: 11px;
            font-weight: 700;
            color: #666666;
        }

        .info-val {
            font-size: 14px;
            font-weight: 700;
            color: #000000;
            word-break: break-word;
        }

        /* CHAT OYNASI */
        .chat-window {
            display: none;
            flex-direction: column;
            height: 100%;
            background: #ffffff;
        }

        .chat-window.open {
            display: flex;
        }

        .chat-win-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }

        .peer-nick-row {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            max-width: 100%;
        }

        .peer-nick-text {
            font-size: 15px;
            font-weight: 800;
            color: #000000;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* QIMIRLAMAYDIGAN QORA PREMIUM SVG GALOCHKA */
        .static-black-check {
            width: 17px;
            height: 17px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .static-black-check svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .chat-msgs-area {
            flex: 1;
            overflow-y: auto;
            padding: 10px 2px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg-bubble {
            max-width: 82%;
            padding: 8px 12px;
            border-radius: 15px;
            font-size: 13.5px;
            font-weight: 500;
            word-break: break-word;
        }

        .msg-bubble.me {
            align-self: flex-end;
            background: #000000;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .msg-bubble.them {
            align-self: flex-start;
            background: #efefef;
            color: #000000;
            border-bottom-left-radius: 4px;
        }

        .msg-media-img {
            max-width: 210px;
            max-height: 220px;
            border-radius: 11px;
            display: block;
        }

        .msg-media-vid {
            max-width: 220px;
            max-height: 220px;
            border-radius: 11px;
            display: block;
            background: #000000;
        }

        .msg-voice-player {
            width: 195px;
            height: 34px;
            display: block;
        }

        /* YOZISH PANELI: RASM STIKERI + POISK/INPUT + MIKRO STIKERI (QIMIRLAMAYDI, YOZUVSIZ) */
        .chat-composer-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding-top: 8px;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            flex-shrink: 0;
        }

        .still-premium-btn {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            border: 1.5px solid #000000;
            background: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            padding: 0;
        }

        .still-premium-btn.recording {
            background: #000000;
            border-color: #000000;
        }

        .still-premium-btn.recording svg path,
        .still-premium-btn.recording svg rect,
        .still-premium-btn.recording svg circle {
            fill: #ffffff;
            stroke: #ffffff;
        }

        .still-premium-btn svg {
            width: 22px;
            height: 22px;
            display: block;
        }

        /* MODAL */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 80;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 390px;
            max-height: 88vh;
            overflow-y: auto;
            background: #ffffff;
            color: #000000;
            border: 1.5px solid #000000;
            border-radius: 20px;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .modal-heading {
            font-size: 17px;
            font-weight: 800;
            text-align: center;
        }

        .field-wrap {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .field-title {
            font-size: 12px;
            font-weight: 700;
            color: #222222;
        }

        .inp-field, .area-field {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: 1.5px solid #000000;
            border-radius: 12px;
            padding: 8px 10px;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }

        .area-field {
            min-height: 64px;
            resize: vertical;
        }

        .err-msg {
            font-size: 12px;
            font-weight: 700;
            color: #c62828;
            min-height: 16px;
        }

        .two-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        /* PASTKI 3 TA QORA TUGMALI MENYU */
        .tg-bottom-nav {
            width: 100%;
            background-color: #ffffff;
            border-top: 1px solid rgba(0, 0, 0, 0.12);
            padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            flex-shrink: 0;
        }

        .tg-nav-btn {
            position: relative;
            background: transparent;
            border: 1.5px solid transparent;
            border-radius: 18px;
            padding: 7px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: #000000;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .tg-nav-btn.active {
            background-color: rgba(0, 0, 0, 0.06);
            border-color: #000000;
            color: #000000;
        }

        .sms-count-badge {
            position: absolute;
            top: 2px;
            right: calc(50% - 26px);
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            border-radius: 999px;
            background: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;
            font-size: 11px;
            font-weight: 800;
            line-height: 16px;
            text-align: center;
            display: none;
            z-index: 3;
        }

        .sms-count-badge.visible {
            display: inline-block;
            animation: badgePop 0.25s ease;
        }

        @keyframes badgePop {
            0% { transform: scale(0.65); }
            70% { transform: scale(1.14); }
            100% { transform: scale(1); }
        }

        /* QIMIRLAB TURUVCHI PREMIUM SVG IKONKALAR (PASTKI MENYU UCHUN) */
        .premium-nav-svg {
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            animation: iconWigglePremium 2.1s ease-in-out infinite;
            transform-origin: center;
        }

        .tg-nav-btn:nth-child(2) .premium-nav-svg {
            animation-delay: 0.35s;
        }

        .tg-nav-btn:nth-child(3) .premium-nav-svg {
            animation-delay: 0.7s;
        }

        @keyframes iconWigglePremium {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            35% { transform: translateY(-2.5px) rotate(-6deg) scale(1.07); }
            70% { transform: translateY(1px) rotate(6deg) scale(1.04); }
        }

        .premium-nav-svg svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }
    </style>
</head>
<body>

    <!-- KIRISH QISMI: OQ FON, YOZUVSIZ, BLOKSIZ KATTA QORA PREMIUM SVG SAMOLYOT -->
    <div id="tgSplash" class="tg-splash-screen">
        <div class="plane-svg-wrap">
            <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="planeBlackMain" x1="16" y1="22" x2="104" y2="96" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#1a1a1a"/>
                        <stop offset="55%" stop-color="#0a0a0a"/>
                        <stop offset="100%" stop-color="#000000"/>
                    </linearGradient>
                    <linearGradient id="planeBlackLeft" x1="20" y1="54" x2="54" y2="74" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#2c2c2c"/>
                        <stop offset="100%" stop-color="#111111"/>
                    </linearGradient>
                    <linearGradient id="planeBlackRight" x1="48" y1="66" x2="88" y2="96" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#0f0f0f"/>
                        <stop offset="100%" stop-color="#000000"/>
                    </linearGradient>
                    <linearGradient id="planeBlackFold" x1="44" y1="62" x2="66" y2="86" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#050505"/>
                        <stop offset="100%" stop-color="#1f1f1f"/>
                    </linearGradient>
                </defs>

                <path d="M18 86C26 84 32 87 37 92" stroke="#111111" stroke-width="2.4" stroke-linecap="round" opacity="0.5"/>
                <path d="M12 73C19 72 24 75 28 79" stroke="#262626" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

                <path d="M102 24L18 57.5C15.5 58.5 15.6 61.9 18.2 62.7L39.5 69.3L95.5 32.2C97.8 30.7 100.3 33.7 98.3 35.6L51.5 76.2L84.4 98.8C86.6 100.3 89.6 99 90.2 96.4L106.4 28.1C107.1 25.1 104.7 22.8 102 24Z" fill="url(#planeBlackMain)"/>
                <path d="M18 57.5L102 24L39.5 69.3L18.2 62.7C15.6 61.9 15.5 58.5 18 57.5Z" fill="url(#planeBlackLeft)"/>
                <path d="M51.5 76.2L98.3 35.6L90.2 96.4C89.6 99 86.6 100.3 84.4 98.8L51.5 76.2Z" fill="url(#planeBlackRight)"/>
                <path d="M39.5 69.3L98.3 35.6L51.5 76.2L47.8 91.8C47.2 94.3 43.9 94.8 42.6 92.6L39.5 69.3Z" fill="url(#planeBlackFold)"/>
                <path d="M22 59.4L98.5 27.6" stroke="#525252" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
            </svg>
        </div>
    </div>

    <!-- ASOSIY SAHIFA -->
    <div id="tgMainShell" class="tg-main-shell">
        <div class="tg-content-area">

            <!-- 1. CHATLAR BO'LIMI -->
            <section id="sec-chatlar" class="tg-section active">
                <div id="chatListView" style="display:flex; flex-direction:column; height:100%; gap:10px;">
                    <div class="sec-header">
                        <div class="sec-title">Chatlar</div>
                    </div>
                    <div id="chatsListContainer" class="list-stack"></div>
                </div>

                <!-- ICHKI CHAT OYNASI -->
                <div id="chatRoomView" class="chat-window">
                    <div class="chat-win-header">
                        <button type="button" class="btn-light-border" onclick="closeActiveChat()">←</button>
                        <img id="activeChatAvatar" class="avatar-circle" style="width:38px; height:38px;" src="" alt="">
                        <div style="min-width:0; flex:1;">
                            <div class="peer-nick-row">
                                <span id="activeChatNick" class="peer-nick-text">@kontakt_nik</span>
                                <span class="static-black-check" title="Tasdiqlangan">
                                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <defs>
                                            <linearGradient id="blackBadgeGrad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                                                <stop offset="0%" stop-color="#2b2b2b"/>
                                                <stop offset="100%" stop-color="#000000"/>
                                            </linearGradient>
                                        </defs>
                                        <path d="M12 2.2L14.5 4.1L17.6 3.9L18.6 6.9L21.3 8.5L20.4 11.5L21.8 14.3L19.5 16.4L19.1 19.5L16 20.1L14 22.3L11.2 21.1L8.2 21.8L6.7 19.1L3.7 18.2L4 15.1L2.1 12.6L4 10.1L3.7 7L6.7 6.1L8.2 3.4L11.2 4.1L12 2.2Z" fill="url(#blackBadgeGrad)"/>
                                        <path d="M8.3 12.3L10.8 14.8L16.1 9.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </span>
                            </div>
                        </div>
                    </div>

                    <div id="chatMessagesStream" class="chat-msgs-area"></div>

                    <!-- RASM/VIDEO STIKERI + YOZISH (POISK/INPUT) + QIMIRLAMAYDIGAN MIKRO STIKERI -->
                    <div class="chat-composer-bar">
                        <input type="file" id="chatMediaFileInput" accept="image/*,video/*" style="display:none;" onchange="onChatMediaPicked(event)">

                        <!-- QIMIRLAMAYDIGAN PREMIUM SVG RASM STIKERI -->
                        <button type="button" class="still-premium-btn" onclick="document.getElementById('chatMediaFileInput').click()" aria-label="Rasm va video">
                            <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <defs>
                                    <linearGradient id="imgStickerGrad" x1="3" y1="4" x2="25" y2="24" gradientUnits="userSpaceOnUse">
                                        <stop offset="0%" stop-color="#2a2a2a"/>
                                        <stop offset="100%" stop-color="#000000"/>
                                    </linearGradient>
                                </defs>
                                <rect x="3.5" y="4.5" width="21" height="19" rx="4" fill="url(#imgStickerGrad)"/>
                                <circle cx="9.5" cy="10" r="2" fill="#ffffff"/>
                                <path d="M6 20L11.5 14L15.5 18L19 14.5L22.5 20H6Z" fill="#ffffff"/>
                            </svg>
                        </button>

                        <!-- YOZISH / POISK MAYDONI -->
                        <input type="text" id="chatMsgInput" class="inp-field" maxlength="400" placeholder="Yozish...">

                        <!-- QIMIRLAMAYDIGAN PREMIUM SVG MIKRO STIKERI (BOSIB TURIB OVOZLI XABAR) -->
                        <button
                            type="button"
                            id="holdMicBtn"
                            class="still-premium-btn"
                            aria-label="Mikrofon"
                            onpointerdown="startHoldVoice(event)"
                            onpointerup="stopHoldVoice(event)"
                            onpointercancel="stopHoldVoice(event)"
                            onpointerleave="if(isHoldingMic) stopHoldVoice(event)"
                        >
                            <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <defs>
                                    <linearGradient id="micStickerGrad" x1="8" y1="3" x2="20" y2="25" gradientUnits="userSpaceOnUse">
                                        <stop offset="0%" stop-color="#2b2b2b"/>
                                        <stop offset="100%" stop-color="#000000"/>
                                    </linearGradient>
                                </defs>
                                <rect x="10.2" y="4" width="7.6" height="12.5" rx="3.8" fill="url(#micStickerGrad)"/>
                                <path d="M7.2 13.5C7.2 17.3 10.2 20.3 14 20.3C17.8 20.3 20.8 17.3 20.8 13.5" stroke="#000000" stroke-width="2.1" stroke-linecap="round"/>
                                <line x1="14" y1="20.3" x2="14" y2="24.2" stroke="#000000" stroke-width="2.1" stroke-linecap="round"/>
                                <line x1="10.2" y1="24.2" x2="17.8" y2="24.2" stroke="#000000" stroke-width="2.1" stroke-linecap="round"/>
                            </svg>
                        </button>

                        <button type="button" class="btn-dark" onclick="sendChatMessage()">Yuborish</button>
                    </div>
                </div>
            </section>

            <!-- 2. KONTAKTLAR BO'LIMI -->
            <section id="sec-kontaktlar" class="tg-section">
                <div class="sec-header">
                    <div class="sec-title">Kontaktlar</div>
                    <button type="button" class="btn-dark" onclick="openAddContactModal()">Odam qoʻshish</button>
                </div>
                <div id="contactsListContainer" class="list-stack"></div>
            </section>

            <!-- 3. PROFIL BO'LIMI -->
            <section id="sec-profil" class="tg-section">
                <div class="sec-header">
                    <div class="sec-title">Profil</div>
                    <button type="button" class="btn-dark" onclick="openEditProfileModal()">Tahrirlash</button>
                </div>

                <div class="profile-card">
                    <div class="profile-top-row">
                        <div style="display:flex; align-items:center; gap:12px; min-width:0;">
                            <img id="profilePhotoView" class="profile-avatar-big" src="" alt="Profil" onclick="openEditProfileModal()">
                            <div style="min-width:0;">
                                <div id="profileNameView" style="font-size:19px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">ISNOOSH</div>
                                <div id="profileNikView" style="font-size:13.5px; font-weight:700; color:#333333; margin-top:2px;">@FarzonaTurayeva</div>
                            </div>
                        </div>
                    </div>

                    <div class="info-box">
                        <div class="info-label">Tavsif</div>
                        <div id="profileBioView" class="info-val">Tavsif kiritilmagan.</div>
                    </div>

                    <div class="info-box">
                        <div class="info-label">Virtual raqam</div>
                        <div id="profileVirtualPhoneView" class="info-val">+91 748 29 41</div>
                    </div>
                </div>
            </section>

        </div>

        <!-- PASTKI 3 TA QORA TUGMA VA BIR-BIRIGA O'XSHAMAYDIGAN QIMIRLAB TURUVCHI PREMIUM SVG STIKERLAR -->
        <nav class="tg-bottom-nav">
            <!-- 1. CHATLAR -->
            <button type="button" id="navBtn-chatlar" class="tg-nav-btn active" onclick="openSection('chatlar', this)">
                <span id="chatUnreadBadge" class="sms-count-badge">0</span>
                <span class="premium-nav-svg">

    </div>

    <!-- MODAL 1: KONTAKT QO'SHISH (YO'Q RAQAMLAR KIRITILMAYDI) -->
    <div id="addContactModal" class="modal-backdrop">
        <div class="modal-box">
            <div class="modal-heading">Kontakt qoʻshish</div>

            <div class="field-wrap">
                <label for="contactPhoneInput" class="field-title">Raqami (haqiqiy raqam kiriting)</label>
                <input type="text" id="contactPhoneInput" class="inp-field" maxlength="24" placeholder="+998 90 123 45 67">

            <div class="field-wrap">

                <button type="button" class="btn-light-border" onclick="closeAddContactModal()">Bekor qilish</button>
                <button type="button" class="btn-dark" onclick="saveNewContact()">Saqlash</button>
            </div>
        </div>
    </div>

    <!-- MODAL 2: PROFIL TAHRIRLASH -->
    <div id="editProfileModal" class="modal-backdrop">
        <div class="modal-box">
            <div class="modal-heading">Profilni tahrirlash</div>

            <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
                <img id="editPhotoPreview" class="profile-avatar-big" src="" alt="Rasm">
                <input type="file" id="editPhotoInput" accept="image/*" style="display:none;" onchange="onProfilePhotoPicked(event)">
                <button type="button" class="btn-light-border" onclick="document.getElementById('editPhotoInput').click()">Rasm tanlash</button>
            </div>

            <div class="field-wrap">
                <label for="editNameInput" class="field-title">Ism</label>
                <input type="text" id="editNameInput" class="inp-field" maxlength="32" placeholder="ISNOOSH">
            </div>

            <div class="field-wrap">
                <label for="editNikInput" class="field-title">Nik (xohlagan nik yoki 1 xonali son ham qoʻyish mumkin)</label>
                <input type="text" id="editNikInput" class="inp-field" maxlength="28" placeholder="@FarzonaTurayeva">
            </div>

            <div class="field-wrap">
                <label for="editBioInput" class="field-title">Tavsif</label>
                <textarea id="editBioInput" class="area-field" maxlength="160" placeholder="Oʻzingiz haqingizda tavsif yozing..."></textarea>
            </div>

            <div id="editProfileErr" class="err-msg"></div>

            <div class="two-btns">
                <button type="button" class="btn-light-border" onclick="closeEditProfileModal()">Bekor qilish</button>
                <button type="button" class="btn-dark" onclick="saveProfileChanges()">Saqlash</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const DEFAULT_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
                <rect width="120" height="120" fill="#eeeeee"/>
                <circle cx="60" cy="45" r="21" fill="#111111"/>
                <path d="M24 103C30 80 43 70 60 70C77 70 90 80 96 103" fill="#111111"/>
            </svg>
        `);

        const KEYS = {
            profile: "tg_clone_profile_v3",
            contacts: "tg_clone_contacts_v3",
            messages: "tg_clone_messages_v3",
            unread: "tg_clone_unread_v3"
        };

        function readStore(key, fallback) {
            try {
                const raw = localStorage.getItem(key);
                const parsed = raw ? JSON.parse(raw) : fallback;
                return parsed !== null && parsed !== undefined ? parsed : fallback;
            } catch (e) {
                return fallback;
            }
        }

        function writeStore(key, val) {
            try {
                localStorage.setItem(key, JSON.stringify(val));
            } catch (e) {}
        }

        function generateUniqueVirtualIndianNumber(existingPhones = new Set()) {
            let candidate = "";
            for (let i = 0; i < 50; i++) {
                const part1 = String(Math.floor(100 + Math.random() * 900));
                const part2 = String(Math.floor(10 + Math.random() * 90));
                const part3 = String(Math.floor(10 + Math.random() * 90));
                candidate = `+91 ${part1} ${part2} ${part3}`;
                if (!existingPhones.has(candidate)) return candidate;
            }
            return `+91 ${String(Date.now()).slice(-3)} ${String(Math.floor(10 + Math.random() * 89))} ${String(Math.floor(10 + Math.random() * 89))}`;
        }

        const defaultProfile = {
            name: "ISNOOSH",
            nik: "@FarzonaTurayeva",
            bio: "",
            photo: "",
            virtualPhone: generateUniqueVirtualIndianNumber()
        };

        let profileData = { ...defaultProfile, ...readStore(KEYS.profile, {}) };
        if (!profileData.nik) profileData.nik = "@FarzonaTurayeva";
        if (!profileData.virtualPhone) profileData.virtualPhone = generateUniqueVirtualIndianNumber();
        writeStore(KEYS.profile, profileData);

        let contactsList = readStore(KEYS.contacts, []);
        let messagesByContact = readStore(KEYS.messages, {});
        let unreadSmsCount = Number(readStore(KEYS.unread, 0)) || 0;

        let currentOpenContactId = null;
        let draftPhotoData = profileData.photo || "";

        // Ovozli xabar (bosib turib yuborish)
        let isHoldingMic = false;
        let holdMicStream = null;
        let holdMicRecorder = null;
        let holdMicChunks = [];

        function setUnreadSmsCount(val) {
            unreadSmsCount = Math.max(0, Number(val) || 0);
            writeStore(KEYS.unread, unreadSmsCount);
            const badge = document.getElementById("chatUnreadBadge");
            if (!badge) return;
            if (unreadSmsCount > 0) {
                badge.textContent = String(unreadSmsCount);
                badge.classList.add("visible");
            } else {
                badge.textContent = "0";
                badge.classList.remove("visible");
            }
        }

        function pushIncomingSmsToContact(contactId, text) {
            if (!contactId) return;
            if (!Array.isArray(messagesByContact[contactId])) {
                messagesByContact[contactId] = [];
            }
            messagesByContact[contactId].push({
                id: "m_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
                sender: "them",
                type: "text",
                text: String(text || ""),
                ts: Date.now()
            });
            writeStore(KEYS.messages, messagesByContact);

            const chatSectionActive = document.getElementById("sec-chatlar").classList.contains("active");
            const isViewingThisChat = chatSectionActive && currentOpenContactId === contactId;
            if (!isViewingThisChat) {
                setUnreadSmsCount(unreadSmsCount + 1);
            } else {
                renderChatMessages(contactId);
            }
            renderChatsList();
        }

        function escapeText(s) {
            return String(s || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function buildContactNick(contact) {
            const raw = (contact.name || "user")
                .toLowerCase()
                .replace(/\s+/g, "_")
                .replace(/[^a-z0-9_]/g, "");
            return "@" + (raw || "kontakt");
        }

        // PROFILNI CHIZISH VA TAHRIRLASH
        function renderProfileSection() {
            const imgEl = document.getElementById("profilePhotoView");
            imgEl.src = profileData.photo || DEFAULT_AVATAR;
            imgEl.onerror = () => { imgEl.src = DEFAULT_AVATAR; };

            document.getElementById("profileNameView").textContent = profileData.name || "ISNOOSH";
            document.getElementById("profileNikView").textContent = profileData.nik || "@FarzonaTurayeva";
            document.getElementById("profileBioView").textContent = profileData.bio || "Tavsif kiritilmagan.";
            document.getElementById("profileVirtualPhoneView").textContent = profileData.virtualPhone || "+91 748 29 41";
        }

        function openEditProfileModal() {
            draftPhotoData = profileData.photo || "";
            const prev = document.getElementById("editPhotoPreview");
            prev.src = draftPhotoData || DEFAULT_AVATAR;
            prev.onerror = () => { prev.src = DEFAULT_AVATAR; };

            document.getElementById("editNameInput").value = profileData.name || "ISNOOSH";
            document.getElementById("editNikInput").value = profileData.nik || "@FarzonaTurayeva";
            document.getElementById("editBioInput").value = profileData.bio || "";
            document.getElementById("editProfileErr").textContent = "";
            document.getElementById("editProfileModal").classList.add("open");
        }

        function closeEditProfileModal() {
            document.getElementById("editProfileModal").classList.remove("open");
        }

        function onProfilePhotoPicked(ev) {
            const file = ev.target.files && ev.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    let w = img.width, h = img.height, maxSide = 260;
                    if (w > h) {
                        if (w > maxSide) { h = Math.round((h * maxSide) / w); w = maxSide; }
                    } else {
                        if (h > maxSide) { w = Math.round((w * maxSide) / h); h = maxSide; }
                    }
                    canvas.width = w;
                    canvas.height = h;
                    canvas.getContext("2d").drawImage(img, 0, 0, w, h);
                    draftPhotoData = canvas.toDataURL("image/jpeg", 0.85);
                    document.getElementById("editPhotoPreview").src = draftPhotoData;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function formatOwnerNik(rawInput) {
            const trimmed = String(rawInput || "").trim();
            if (!trimmed) return "";
            if (trimmed.startsWith("@")) {
                return trimmed.length > 1 ? trimmed : "@";
            }
            return "@" + trimmed;
        }

        function saveProfileChanges() {
            const errEl = document.getElementById("editProfileErr");
            const nameVal = document.getElementById("editNameInput").value.trim();
            const nikRaw = document.getElementById("editNikInput").value;
            const bioVal = document.getElementById("editBioInput").value.trim();

            if (!nameVal) {
                errEl.textContent = "Ismni kiriting.";
                return;
            }

            const formattedNik = formatOwnerNik(nikRaw);
            if (!formattedNik || formattedNik === "@") {
                errEl.textContent = "Nik maydoniga qiymat kiriting.";
                return;
            }

            profileData.name = nameVal;
            profileData.nik = formattedNik;
            profileData.bio = bioVal;
            profileData.photo = draftPhotoData || profileData.photo || "";

            writeStore(KEYS.profile, profileData);
            closeEditProfileModal();
            renderProfileSection();
        }

        // YO'Q RAQAMLARNI TEKSHIRISH (FAQAT HAQIQIY RAQAM KIRITILADI)
        function validateRealPhone(rawPhone) {
            const clean = String(rawPhone || "").trim();
            const digitsOnly = clean.replace(/\D/g, "");
            if (digitsOnly.length < 7 || digitsOnly.length > 15) {
                return { error: "Haqiqiy telefon raqamini kiriting (kamida 7 ta raqam)." };
            }
            if (/^(\d)\1+$/.test(digitsOnly)) {
                return { error: "Bunday yoʻq raqam (bir xil raqamlar) kiritib boʻlmaydi." };
            }
            if (/^0+$/.test(digitsOnly)) {
                return { error: "Yoʻq raqam kiritib boʻlmaydi." };
            }
            return { value: clean };
        }

        // KONTAKTLAR VA CHATLAR
        function openAddContactModal() {
            document.getElementById("contactPhoneInput").value = "";
            document.getElementById("contactNameInput").value = "";
            document.getElementById("addContactErr").textContent = "";
            document.getElementById("addContactModal").classList.add("open");
        }

        function closeAddContactModal() {
            document.getElementById("addContactModal").classList.remove("open");
        }

        function saveNewContact() {
            const errEl = document.getElementById("addContactErr");
            const phoneRaw = document.getElementById("contactPhoneInput").value;
            const nameVal = document.getElementById("contactNameInput").value.trim();

            const phoneRes = validateRealPhone(phoneRaw);
            if (phoneRes.error) {
                errEl.textContent = phoneRes.error;
                return;
            }
            if (!nameVal) {
                errEl.textContent = "Odamga nom bering.";
                return;
            }

            const uniqueId = "cnt_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
            const newContact = {
                id: uniqueId,
                name: nameVal,
                phone: phoneRes.value,
                photo: DEFAULT_AVATAR,
                createdAt: Date.now()
            };

            messagesByContact[uniqueId] = [];
            contactsList.unshift(newContact);

            writeStore(KEYS.contacts, contactsList);
            writeStore(KEYS.messages, messagesByContact);

            closeAddContactModal();
            renderContactsList();
            renderChatsList();
        }

        function renderContactsList() {
            const box = document.getElementById("contactsListContainer");
            box.innerHTML = "";

            if (!contactsList.length) {
                box.innerHTML = `<div class="row-card" style="justify-content:center; cursor:default;"><span style="font-size:13px; color:#555555;">Hali kontakt yoʻq. «Odam qoʻshish» tugmasini bosing.</span></div>`;
                return;
            }

            contactsList.forEach(c => {
                const row = document.createElement("div");
                row.className = "row-card";
                row.onclick = () => {
                    const chatNavBtn = document.getElementById("navBtn-chatlar");
                    openSection("chatlar", chatNavBtn);
                    openChatWithContact(c.id);
                };
                row.innerHTML = `
                    <div style="display:flex; align-items:center; gap:10px; min-width:0; flex:1;">
                        <img class="avatar-circle" src="${escapeText(c.photo || DEFAULT_AVATAR)}" alt="">
                        <div style="min-width:0; flex:1;">
                            <div style="font-size:14.5px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeText(c.name)}</div>
                            <div style="font-size:12px; font-weight:600; color:#555555; margin-top:2px;">${escapeText(buildContactNick(c))}</div>
                        </div>
                    </div>
                    <span class="btn-light-border" style="padding:5px 9px; font-size:11px;">Chat</span>
                `;
                const im = row.querySelector("img");
                if (im) im.onerror = function() { this.src = DEFAULT_AVATAR; };
                box.appendChild(row);
            });
        }

        function renderChatsList() {
            const box = document.getElementById("chatsListContainer");
            box.innerHTML = "";

            if (!contactsList.length) {
                box.innerHTML = `<div class="row-card" style="justify-content:center; cursor:default;"><span style="font-size:13px; color:#555555;">Hali chatlar yoʻq. Kontaktlar boʻlimidan odam qoʻshing.</span></div>`;
                return;
            }

            contactsList.forEach(c => {
                const msgs = messagesByContact[c.id] || [];
                let previewText = buildContactNick(c);
                if (msgs.length) {
                    const last = msgs[msgs.length - 1];
                    if (last.type === "image") previewText = "Rasm";
                    else if (last.type === "video") previewText = "Video";
                    else if (last.type === "voice") previewText = "Ovozli xabar";
                    else previewText = last.text || "";
                }

                const row = document.createElement("div");
                row.className = "row-card";
                row.onclick = () => openChatWithContact(c.id);
                row.innerHTML = `
                    <div style="display:flex; align-items:center; gap:10px; min-width:0; flex:1;">
                        <img class="avatar-circle" src="${escapeText(c.photo || DEFAULT_AVATAR)}" alt="">
                        <div style="min-width:0; flex:1;">
                            <div style="font-size:14.5px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeText(c.name)}</div>
                            <div style="font-size:12px; font-weight:600; color:#555555; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px;">${escapeText(previewText)}</div>
                        </div>
                    </div>
                    <span style="font-size:11.5px; font-weight:700; color:#111111;">${escapeText(buildContactNick(c))}</span>
                `;
                const im = row.querySelector("img");
                if (im) im.onerror = function() { this.src = DEFAULT_AVATAR; };
                box.appendChild(row);
            });
        }

        function openChatWithContact(contactId) {
            const contact = contactsList.find(x => x.id === contactId);
            if (!contact) return;

            currentOpenContactId = contact.id;
            document.getElementById("chatListView").style.display = "none";
            document.getElementById("chatRoomView").classList.add("open");

            const av = document.getElementById("activeChatAvatar");
            av.src = contact.photo || DEFAULT_AVATAR;
            av.onerror = () => { av.src = DEFAULT_AVATAR; };

            document.getElementById("activeChatNick").textContent = buildContactNick(contact);
            setUnreadSmsCount(0);
            renderChatMessages(contact.id);
        }

        function closeActiveChat() {
            currentOpenContactId = null;
            document.getElementById("chatRoomView").classList.remove("open");
            document.getElementById("chatListView").style.display = "flex";
            renderChatsList();
        }

        function renderChatMessages(contactId) {
            const stream = document.getElementById("chatMessagesStream");
            const list = messagesByContact[contactId] || [];
            stream.innerHTML = "";

            list.forEach(m => {
                const bubble = document.createElement("div");
                bubble.className = "msg-bubble " + (m.sender === "me" ? "me" : "them");

                if (m.type === "image" && m.mediaUrl) {
                    const img = document.createElement("img");
                    img.className = "msg-media-img";
                    img.src = m.mediaUrl;
                    bubble.appendChild(img);
                } else if (m.type === "video" && m.mediaUrl) {
                    const vid = document.createElement("video");
                    vid.className = "msg-media-vid";
                    vid.src = m.mediaUrl;
                    vid.controls = true;
                    bubble.appendChild(vid);
                } else if (m.type === "voice" && m.audioUrl) {
                    const aud = document.createElement("audio");
                    aud.className = "msg-voice-player";
                    aud.src = m.audioUrl;
                    aud.controls = true;
                    bubble.appendChild(aud);
                } else {
                    bubble.textContent = m.text || "";
                }

                stream.appendChild(bubble);
            });
            stream.scrollTop = stream.scrollHeight;
        }

        function appendMsgToCurrentChat(msgObj) {
            if (!currentOpenContactId) return;
            if (!Array.isArray(messagesByContact[currentOpenContactId])) {
                messagesByContact[currentOpenContactId] = [];
            }
            messagesByContact[currentOpenContactId].push(msgObj);
            writeStore(KEYS.messages, messagesByContact);
            renderChatMessages(currentOpenContactId);
            renderChatsList();
        }

        function sendChatMessage() {
            if (!currentOpenContactId) return;
            const inp = document.getElementById("chatMsgInput");
            const txt = inp.value.trim();
            if (!txt) return;

            appendMsgToCurrentChat({
                id: "m_" + Date.now(),
                sender: "me",
                type: "text",
                text: txt,
                ts: Date.now()
            });
            inp.value = "";
        }

        // RASM VA VIDEO YUBORISH
        function onChatMediaPicked(ev) {
            if (!currentOpenContactId) return;
            const file = ev.target.files && ev.target.files[0];
            ev.target.value = "";
            if (!file) return;

            const isVideo = file.type.startsWith("video/");
            const reader = new FileReader();
            reader.onload = (e) => {
                const url = String(e.target.result || "");
                if (!url) return;
                appendMsgToCurrentChat({
                    id: "m_" + Date.now(),
                    sender: "me",
                    type: isVideo ? "video" : "image",
                    mediaUrl: url,
                    ts: Date.now()
                });
            };
            reader.readAsDataURL(file);
        }

        // MIKROFON STIKERIGA BOSIB TURIB OVOZLI XABAR JO'NATISH
        async function startHoldVoice(ev) {
            if (!currentOpenContactId || isHoldingMic) return;
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined") return;

            try {
                holdMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                isHoldingMic = true;
                holdMicChunks = [];
                document.getElementById("holdMicBtn").classList.add("recording");

                const rec = new MediaRecorder(holdMicStream);
                rec.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) holdMicChunks.push(e.data);
                };
                rec.onstop = () => {
                    const mime = rec.mimeType || "audio/webm";
                    const chunksCopy = holdMicChunks.slice();
                    holdMicChunks = [];
                    if (holdMicStream) {
                        holdMicStream.getTracks().forEach(t => t.stop());
                        holdMicStream = null;
                    }
                    if (!chunksCopy.length || !currentOpenContactId) return;
                    const blob = new Blob(chunksCopy, { type: mime });
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const dataUrl = String(reader.result || "");
                        if (dataUrl) {
                            appendMsgToCurrentChat({
                                id: "m_" + Date.now(),
                                sender: "me",
                                type: "voice",
                                audioUrl: dataUrl,
                                ts: Date.now()
                            });
                        }
                    };
                    reader.readAsDataURL(blob);
                };
                holdMicRecorder = rec;
                rec.start();
            } catch (err) {
                isHoldingMic = false;
                document.getElementById("holdMicBtn").classList.remove("recording");
            }
        }

        function stopHoldVoice(ev) {
            if (!isHoldingMic) return;
            isHoldingMic = false;
            document.getElementById("holdMicBtn").classList.remove("recording");
            if (holdMicRecorder && holdMicRecorder.state !== "inactive") {
                try { holdMicRecorder.stop(); } catch (e) {}
            }
            holdMicRecorder = null;
        }

        function openSection(secId, btnEl) {
            document.querySelectorAll(".tg-nav-btn").forEach(b => b.classList.remove("active"));
            if (btnEl) btnEl.classList.add("active");
            document.querySelectorAll(".tg-section").forEach(s => s.classList.remove("active"));
            const target = document.getElementById("sec-" + secId);
            if (target) target.classList.add("active");

            if (secId === "chatlar") {
                setUnreadSmsCount(0);
                if (currentOpenContactId) renderChatMessages(currentOpenContactId);
                else renderChatsList();
            } else if (secId === "kontaktlar") {
                renderContactsList();
            } else if (secId === "profil") {
                renderProfileSection();
            }
        }

        setUnreadSmsCount(unreadSmsCount);
        renderProfileSection();
        renderContactsList();
        renderChatsList();

        setTimeout(() => {
            const splash = document.getElementById("tgSplash");
            if (splash) splash.classList.add("fade-out");
        }, 1500);
    </script>
</body>
</html>
