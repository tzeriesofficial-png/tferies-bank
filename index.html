<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACAZES</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 15% 15%, #feda75 0%, transparent 38%),
                radial-gradient(circle at 85% 20%, #d62976 0%, transparent 45%),
                radial-gradient(circle at 25% 85%, #962fbf 0%, transparent 48%),
                radial-gradient(circle at 80% 85%, #fa7e1e 0%, transparent 42%),
                linear-gradient(135deg, #4f5bd5 0%, #962fbf 35%, #d62976 68%, #feda75 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .screen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 18px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease, transform 0.45s ease;
            transform: scale(0.97);
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        /* 1-EKRAN: A C A Z E S */
        .brand-title {
            font-size: clamp(36px, 9.5vw, 54px);
            font-weight: 950;
            color: #ffffff;
            letter-spacing: 6px;
            text-align: center;
            text-transform: uppercase;
            text-shadow:
                0 4px 0 rgba(0, 0, 0, 0.25),
                0 12px 28px rgba(0, 0, 0, 0.35);
            animation: brandPop 1.1s ease-out forwards;
        }

        @keyframes brandPop {
            0% {
                opacity: 0;
                transform: scale(0.82) translateY(10px);
            }
            70% {
                opacity: 1;
                transform: scale(1.04) translateY(-2px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* 2-EKRAN: YASHIL BLOKLAR */
        .auth-menu {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .green-action-block {
            width: 100%;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 20px;
            padding: 18px 20px;
            background: linear-gradient(135deg, #16a34a 0%, #15803d 55%, #166534 100%);
            box-shadow:
                0 12px 28px rgba(0, 0, 0, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            cursor: pointer;
            transition: transform 0.16s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .green-action-block:hover {
            filter: brightness(1.05);
            box-shadow:
                0 15px 32px rgba(0, 0, 0, 0.34),
                0 0 22px rgba(34, 197, 94, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .green-action-block:active {
            transform: scale(0.97);
        }

        .green-block-label {
            font-size: 19px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.4px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.28);
        }

        /* QIMIRLAB TURADIGAN PREMIUM SVG GALOCHKA */
        .premium-check-svg {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            animation: checkPulseMove 1.8s infinite ease-in-out;
            filter: drop-shadow(0 0 8px rgba(187, 247, 208, 0.7));
        }

        .green-action-block:nth-child(2) .premium-check-svg {
            animation-delay: 0.35s;
        }

        @keyframes checkPulseMove {
            0%, 100% {
                transform: scale(1) rotate(0deg) translateX(0px);
            }
            35% {
                transform: scale(1.18) rotate(-8deg) translateX(2px);
            }
            70% {
                transform: scale(1.12) rotate(7deg) translateX(-1px);
            }
        }
    </style>
</head>
<body>

    <!-- 1-BO'LIM: KIRISH YUZUVI -->
    <div id="introScreen" class="screen active">
        <div class="brand-title">A C A Z E S</div>
    </div>

    <!-- 2-BO'LIM: HISOB YARATISH / MAVJUD HISOB -->
    <div id="authScreen" class="screen">
        <div class="auth-menu">
            <button type="button" class="green-action-block" onclick="onSelectOption('create')">
                <span class="green-block-label">Hisob yaratish</span>
                <svg class="premium-check-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="checkBadgeGrad1" x1="3" y1="3" x2="29" y2="29" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#86efac"/>
                            <stop offset="55%" stop-color="#22c55e"/>
                            <stop offset="100%" stop-color="#15803d"/>
                        </linearGradient>
                    </defs>
                    <circle cx="16" cy="16" r="13" fill="url(#checkBadgeGrad1)" stroke="#ffffff" stroke-width="2"/>
                    <path d="M10.2 16.4L14.1 20.3L22.2 12" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

            <button type="button" class="green-action-block" onclick="onSelectOption('existing')">
                <span class="green-block-label">Mavjud hisob</span>
                <svg class="premium-check-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="checkBadgeGrad2" x1="3" y1="3" x2="29" y2="29" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#86efac"/>
                            <stop offset="55%" stop-color="#22c55e"/>
                            <stop offset="100%" stop-color="#15803d"/>
                        </linearGradient>
                    </defs>
                    <circle cx="16" cy="16" r="13" fill="url(#checkBadgeGrad2)" stroke="#ffffff" stroke-width="2"/>
                    <path d="M10.2 16.4L14.1 20.3L22.2 12" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Kirganda 1.6 soniya "A C A Z E S" ko'rinadi, keyin 2-bo'limga o'tadi
        setTimeout(() => {
            document.getElementById('introScreen').classList.remove('active');
            document.getElementById('authScreen').classList.add('active');
        }, 1600);

        function onSelectOption(choice) {
            // Keyingi oyna hozircha qo'shilmagan
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
            console.log('Tanlangan boʻlim:', choice);
        }
    </script>
</body>
</html>
