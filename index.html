<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRASH</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            height: 100vh;
            background:
                radial-gradient(circle at 22% 20%, rgba(168, 85, 247, 0.35), transparent 45%),
                radial-gradient(circle at 80% 30%, rgba(59, 130, 246, 0.28), transparent 50%),
                radial-gradient(circle at 50% 85%, rgba(124, 58, 237, 0.32), transparent 55%),
                linear-gradient(180deg, #130829 0%, #090517 55%, #04020b 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .page {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease;
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 7 ta alohida yulduzcha */
        .star-7 {
            position: absolute;
            pointer-events: none;
            z-index: 1;
        }

        .star-7:nth-of-type(1) { top: 11%; left: 14%; animation: twinkle1 2.2s infinite ease-in-out; }
        .star-7:nth-of-type(2) { top: 16%; right: 16%; animation: twinkle2 2.6s infinite ease-in-out 0.3s; }
        .star-7:nth-of-type(3) { top: 31%; left: 9%; animation: twinkle1 2.1s infinite ease-in-out 0.6s; }
        .star-7:nth-of-type(4) { top: 38%; right: 10%; animation: twinkle2 2.5s infinite ease-in-out 0.9s; }
        .star-7:nth-of-type(5) { bottom: 24%; left: 17%; animation: twinkle1 2.4s infinite ease-in-out 1.1s; }
        .star-7:nth-of-type(6) { bottom: 18%; right: 18%; animation: twinkle2 2.3s infinite ease-in-out 0.4s; }
        .star-7:nth-of-type(7) { top: 56%; left: 82%; animation: twinkle1 2.7s infinite ease-in-out 0.8s; }

        @keyframes twinkle1 {
            0%, 100% { transform: scale(0.85) rotate(0deg); opacity: 0.65; }
            50% { transform: scale(1.22) rotate(12deg); opacity: 1; }
        }

        @keyframes twinkle2 {
            0%, 100% { transform: scale(1.1) rotate(0deg); opacity: 0.75; }
            50% { transform: scale(0.82) rotate(-14deg); opacity: 1; }
        }

        /* 1-OYNA: KIRISH QISMI */
        #loaderPage {
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .loader-wrap {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 345px;
            padding: 0 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .crash-card {
            width: 100%;
            background: linear-gradient(160deg, rgba(109, 40, 217, 0.34) 0%, rgba(30, 12, 66, 0.68) 55%, rgba(10, 5, 25, 0.9) 100%);
            border: 1.5px solid rgba(192, 132, 252, 0.55);
            border-radius: 26px;
            padding: 24px 18px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-shadow: 0 20px 45px rgba(109, 40, 217, 0.38), inset 0 0 26px rgba(168, 85, 247, 0.18);
        }

        .plane-3d-box {
            width: 185px;
            height: 145px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 16px 26px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 18px rgba(168, 85, 247, 0.45));
        }

        /* Samolyotning havoda silliq qimirlab uchishi */
        .plane-flight-anim {
            animation: planeHover 2.3s infinite ease-in-out;
            transform-origin: 90px 70px;
        }

        @keyframes planeHover {
            0%, 100% {
                transform: translate(0px, 3px) rotate(-2deg) scale(1);
            }
            50% {
                transform: translate(5px, -7px) rotate(3deg) scale(1.05);
            }
        }

        /* Oldingi parrak (propeller) aylanish effekti */
        .propeller-spin {
            animation: propBlur 0.22s infinite alternate ease-in-out;
            transform-origin: 146px 61px;
        }

        @keyframes propBlur {
            0% { transform: scaleY(1); opacity: 0.95; }
            100% { transform: scaleY(0.28); opacity: 0.65; }
        }

        .crash-label {
            font-size: 34px;
            font-weight: 950;
            font-style: italic;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow:
                0 3px 0 #4c1d95,
                0 0 22px rgba(192, 132, 252, 0.85);
        }

        .deco-lines {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .line-bar {
            height: 2.5px;
            border-radius: 99px;
            background: linear-gradient(90deg, transparent, #c084fc, #facc15, transparent);
            animation: linePulse 1.8s infinite ease-in-out;
        }

        .line-bar.a { width: 24px; }
        .line-bar.b { width: 64px; animation-delay: 0.2s; }
        .line-bar.c { width: 24px; animation-delay: 0.4s; }

        @keyframes linePulse {
            0%, 100% { opacity: 0.4; transform: scaleX(0.88); }
            50% { opacity: 1; transform: scaleX(1.1); }
        }

        .progress-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 99px;
            overflow: hidden;
            border: 1px solid rgba(192, 132, 252, 0.28);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #9333ea, #c084fc, #facc15);
            border-radius: 99px;
            box-shadow: 0 0 14px rgba(192, 132, 252, 0.8);
            transition: width 0.05s linear;
        }

        .progress-percent {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #f3e8ff;
        }

        /* 2-OYNA: ASOSIY SAHIFA VA PASTKI 4 TA BO'LIM */
        #mainPage {
            justify-content: space-between;
            z-index: 10;
        }

        .content-area {
            position: relative;
            z-index: 2;
            flex: 1;
            width: 100%;
            padding: 28px 18px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        .tab-panel {
            display: none;
            width: 100%;
            max-width: 360px;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            text-align: center;
        }

        .tab-panel.active {
            display: flex;
        }

        .panel-card {
            width: 100%;
            background: linear-gradient(160deg, rgba(109, 40, 217, 0.28) 0%, rgba(25, 11, 56, 0.72) 60%, rgba(10, 5, 24, 0.92) 100%);
            border: 1.5px solid rgba(192, 132, 252, 0.45);
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 16px 38px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(168, 85, 247, 0.14);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .panel-title {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 0.8px;
            color: #ffffff;
        }

        .panel-desc {
            font-size: 13.5px;
            color: #ddd6fe;
            line-height: 1.5;
        }

        /* HISOB BO'LIMI */
        .profile-photo-ring {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #38bdf8, #c084fc, #facc15);
            box-shadow: 0 0 24px rgba(168, 85, 247, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-photo-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #140a2e;
        }

        .user-nick-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 2px;
        }

        .moving-badge-svg {
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            animation: badgeMove 1.8s infinite ease-in-out;
            flex-shrink: 0;
        }

        @keyframes badgeMove {
            0%, 100% { transform: scale(1) rotate(0deg); }
            30% { transform: scale(1.22) rotate(-10deg); }
            70% { transform: scale(1.14) rotate(10deg); }
        }

        .user-nick-text {
            font-size: 19px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.4px;
        }

        /* PASTKI 4 TA BO'LIM PANELI VA HAR BIRINING QIMIRLAYDIGAN IKONKASI */
        .bottom-nav {
            position: relative;
            z-index: 5;
            width: 100%;
            background: rgba(11, 6, 26, 0.92);
            backdrop-filter: blur(14px);
            border-top: 1px solid rgba(192, 132, 252, 0.28);
            padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .nav-item {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 16px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            color: #a78bfa;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            background: rgba(139, 92, 246, 0.22);
            border-color: rgba(192, 132, 252, 0.5);
            color: #ffffff;
            box-shadow: 0 0 16px rgba(139, 92, 246, 0.28);
        }

        .nav-icon {
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* Har bir bo'lim ikonkasining o'ziga xos qimirlash animatsiyasi */
        .anim-games {
            animation: iconWobble 2.1s infinite ease-in-out;
        }

        .anim-plane {
            animation: iconFly 1.9s infinite ease-in-out;
        }

        .anim-wallet {
            animation: iconBounce 2.2s infinite ease-in-out 0.25s;
        }

        .anim-user {
            animation: iconPulse 2.3s infinite ease-in-out 0.45s;
        }

        @keyframes iconWobble {
            0%, 100% { transform: rotate(0deg) scale(1); }
            30% { transform: rotate(-10deg) scale(1.1); }
            70% { transform: rotate(10deg) scale(1.1); }
        }

        @keyframes iconFly {
            0%, 100% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
            50% { transform: translate(2px, -3px) rotate(6deg) scale(1.12); }
        }

        @keyframes iconBounce {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-3px) scale(1.1); }
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.14); }
        }

        .nav-label {
            font-size: 11.5px;
            font-weight: 800;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

    <!-- 7 TA YULDUZCHA (HAR XIL JOYDA) -->
    <svg class="star-7" viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
        <polygon points="12,2 14.9,8.6 22,9.3 16.6,14 18.2,21 12,17.3 5.8,21 7.4,14 2,9.3 9.1,8.6" fill="#facc15"/>

    </svg>
    <svg class="star-7" viewBox="0 0 24 24" width="15" height="15" xmlns="http://www.w3.org/2000/svg">
        <polygon points="12,2 14.9,8.6 22,9.3 16.6,14 18.2,21 12,17.3 5.8,21 7.4,14 2,9.3 9.1,8.6" fill="#f59e0b"/>
    </svg>
    <svg class="star-7" viewBox="0 0 24 24" width="22" height="22" xmlns="http://www.w3.org/2000/svg">
        <polygon points="12,2 14.9,8.6 22,9.3 16.6,14 18.2,21 12,17.3 5.8,21 7.4,14 2,9.3 9.1,8.6" fill="#facc15"/>

    <svg class="star-7" viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">

    <svg class="star-7" viewBox="0 0 24 24" width="19" height="19" xmlns="http://www.w3.org/2000/svg">

    </svg>

    <!-- 1-OYNA: KIRISH QISMI (🛩 KUKURUZNIK SAMOLYOT BILAN) -->
    <div id="loaderPage" class="page active">
        <div class="loader-wrap">
            <div class="crash-card">
                <div class="plane-3d-box">
                    <svg viewBox="0 0 180 140" width="180" height="140" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- Fonga mos binafsha-oq 3D fyuzelyaj -->
                            <linearGradient id="planeBodyGrad" x1="35" y1="45" x2="140" y2="85" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#ffffff"/>
                                <stop offset="55%" stop-color="#e9d5ff"/>
                                <stop offset="100%" stop-color="#9333ea"/>
                            </linearGradient>
                            <!-- Qanotlar gradienti -->
                            <linearGradient id="wingGrad" x1="65" y1="30" x2="115" y2="95" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#c084fc"/>
                                <stop offset="100%" stop-color="#581c87"/>
                            </linearGradient>
                            <!-- Kabina oynasi -->
                            <linearGradient id="cockpitGrad" x1="85" y1="44" x2="108" y2="58" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#7dd3fc"/>
                                <stop offset="100%" stop-color="#1d4ed8"/>
                            </linearGradient>
                            <!-- Tumshuq qismi -->
                            <linearGradient id="noseCapGrad" x1="130" y1="50" x2="146" y2="72" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#facc15"/>
                                <stop offset="100%" stop-color="#d97706"/>
                            </linearGradient>
                        </defs>

                        <g class="plane-flight-anim" transform="rotate(-14 90 70)">
                            <!-- Yuqori biplan qanoti (🛩 shakli) -->
                            <path d="M68 42 L114 38 C119 38 122 42 119 45 L72 49 C67 49 65 44 68 42 Z" fill="url(#wingGrad)" stroke="#f3e8ff" stroke-width="1.2"/>

                            <!-- Qanot tirgaklari -->
                            <line x1="78" y1="47" x2="76" y2="66" stroke="#ddd6fe" stroke-width="2" stroke-linecap="round"/>
                            <line x1="108" y1="44" x2="106" y2="63" stroke="#ddd6fe" stroke-width="2" stroke-linecap="round"/>

                            <!-- Dum qanoti va kili -->
                            <path d="M26 62 L34 42 L48 58 Z" fill="url(#wingGrad)" stroke="#e9d5ff" stroke-width="1.2"/>
                            <path d="M22 64 L44 60 L40 69 L24 69 Z" fill="#a855f7"/>

                            <!-- Tekis, to'g'ri burnli asosiy fyuzelyaj -->
                            <path d="M32 61 L132 50 C138 50 141 55 141 61 C141 67 138 72 132 72 L34 69 C29 69 28 62 32 61 Z" fill="url(#planeBodyGrad)" stroke="#ffffff" stroke-width="1.4"/>

                            <!-- Yon dekorativ binafsha chiziq -->
                            <path d="M44 64 L132 58" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round"/>

                            <!-- Kabina oynasi -->
                            <path d="M84 53 C88 47 101 47 106 52 L84 54 Z" fill="url(#cockpitGrad)" stroke="#ffffff" stroke-width="1.2"/>

                            <!-- Pastki biplan qanoti -->
                            <path d="M62 68 L112 64 C117 64 119 69 114 72 L65 76 C60 76 58 70 62 68 Z" fill="url(#wingGrad)" stroke="#e9d5ff" stroke-width="1.2"/>

                            <!-- G'ildirak shassisi -->
                            <line x1="104" y1="72" x2="110" y2="87" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
                            <line x1="94" y1="73" x2="107" y2="87" stroke="#9333ea" stroke-width="2" stroke-linecap="round"/>
                            <circle cx="110" cy="89" r="6.5" fill="#1e1b4b" stroke="#e9d5ff" stroke-width="2"/>
                            <circle cx="110" cy="89" r="2.2" fill="#facc15"/>

                            <!-- Dum g'ildiragi -->
                            <circle cx="33" cy="72" r="3" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.4"/>

                            <!-- Tekis tumshuq qismi va aylanuvchi parrak (propeller) -->
                            <path d="M135 51 L143 53 C145 55 145 67 143 69 L135 71 Z" fill="url(#noseCapGrad)"/>
                            <g class="propeller-spin">
                                <rect x="144.5" y="36" width="3.5" height="50" rx="1.8" fill="#ffffff" opacity="0.9"/>
                            </g>
                            <circle cx="146" cy="61" r="3.5" fill="#facc15" stroke="#ffffff" stroke-width="1"/>
                        </g>
                    </svg>
                </div>

                <div class="crash-label">CRASH</div>

                <div class="deco-lines">
                    <span class="line-bar a"></span>
                    <span class="line-bar b"></span>
                    <span class="line-bar c"></span>

            </div>

            <div class="progress-area">
                <div class="progress-track">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <div id="progressPercent" class="progress-percent">0%</div>
            </div>

    <!-- 2-OYNA: ASOSIY SAHIFA -->
    <div id="mainPage" class="page">
        <div class="content-area">
            <!-- 1. o'yinlar -->
            <div id="panel-games" class="tab-panel">
                <div class="panel-card">
                    <div class="panel-title">oʻyinlar</div>
                    <div class="panel-desc">Oʻyinlar boʻlimi tayyor. Keyingi funksiyalarni qoʻshishimiz mumkin.</div>
                </div>
            </div>

            <!-- 2. crash -->
            <div id="panel-crash" class="tab-panel active">
                <div class="panel-card">
                    <div class="panel-title">crash</div>
                    <div class="panel-desc">CRASH boʻlimi tayyor.</div>
                </div>
            </div>

            <!-- 3. hisobim -->

                <div class="panel-card">

            <!-- 4. hisob -->

        <!-- PASTKI 4 TA BO'LIM (HAR BIRI QIMIRLAYDIGAN PREMIUM SVG IKONKA BILAN) -->
        <nav class="bottom-nav">
            <!-- o'yinlar -->
            <button class="nav-item" data-tab="games" onclick="switchTab('games', this)">
                <span class="nav-icon anim-games">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">

                </span>
                <span class="nav-label">oʻyinlar</span>
            </button>

            <!-- crash (🛩 KUKURUZNIK SAMOLYOT IKONKASI) -->
            <button class="nav-item active" data-tab="crash" onclick="switchTab('crash', this)">
                <span class="nav-icon anim-plane">
                    <svg viewBox="0 0 28 24" width="26" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <g transform="rotate(-14 14 12)">
                            <!-- Yuqori qanot -->
                            <rect x="9" y="5" width="9" height="2.2" rx="1.1" fill="#c084fc"/>
                            <!-- Dum -->
                            <path d="M3 10.5L5 7L7.5 10Z" fill="#a855f7"/>
                            <!-- Tekis fyuzelyaj -->
                            <path d="M4 10.5L21 8.5C22.2 8.5 22.8 9.5 22.8 10.5C22.8 11.5 22.2 12.5 21 12.5L4.5 12C3.5 12 3.3 10.7 4 10.5Z" fill="#f3e8ff" stroke="#a855f7" stroke-width="1"/>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        function loadTelegramUser() {
            const user = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
            const nameEl = document.getElementById('userName');
            const photoEl = document.getElementById('userPhoto');

            let displayName = '@foydalanuvchi';
            if (user) {
                if (user.username) {
                    displayName = '@' + user.username;
                } else {
                    displayName = [user.first_name, user.last_name].filter(Boolean).join(' ') || '@foydalanuvchi';
                }
            }
            nameEl.textContent = displayName;

            const defaultAvatar = "data:image/svg+xml;utf8," + encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                    <rect width="100" height="100" fill="#1e103f"/>
                    <circle cx="50" cy="38" r="18" fill="#c084fc"/>
                    <path d="M20 86C24 68 36 60 50 60C64 60 76 68 80 86" fill="#7c3aed"/>
                </svg>
            `);

            photoEl.src = (user && user.photo_url) ? user.photo_url : defaultAvatar;
            photoEl.onerror = function () {
                this.src = defaultAvatar;
            };
        }
        loadTelegramUser();

        let current = 0;
        const fillEl = document.getElementById('progressFill');
        const percentEl = document.getElementById('progressPercent');

        const interval = setInterval(() => {
            if (current < 100) {
                current++;
                fillEl.style.width = current + '%';
                percentEl.textContent = current + '%';
            } else {
                clearInterval(interval);
                setTimeout(() => {
                    document.getElementById('loaderPage').classList.remove('active');
                    document.getElementById('mainPage').classList.add('active');
                }, 350);
            }
        }, 25);

        function switchTab(tabName, btnEl) {
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');

            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
            const targetPanel = document.getElementById('panel-' + tabName);
            if (targetPanel) targetPanel.classList.add('active');
        }
    </script>
</body>
