<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yangi Loyiha</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 1-OYNA: KATTA QORA PREMIUM SVG ALMAZ */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 35px;
            width: 100%;
            max-width: 340px;
        }

        .diamond-wrapper {
            width: 165px;
            height: 165px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: diamondFloat 2.2s infinite ease-in-out;
            filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.25));
        }

        .diamond-glint {
            animation: glintPulse 2.2s infinite ease-in-out;
        }

        @keyframes diamondFloat {
            0%, 100% {
                transform: scale(1) translateY(0) rotate(0deg);
            }
            35% {
                transform: scale(1.12) translateY(-10px) rotate(-4deg);
            }
            70% {
                transform: scale(1.08) translateY(-6px) rotate(4deg);
            }
        }

        @keyframes glintPulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 0.85; }
        }

        .progress-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.15);
        }

        /* Chiziq to'ladigan joyi ham qora rangda */
        .progress-bar-fill {
            height: 100%;
            width: 1%;
            background: #000000;
            border-radius: 12px;
            transition: width 0.08s linear;
        }

        .percentage-text {
            font-size: 20px;
            font-weight: 900;
            color: #000000;
            letter-spacing: 1.5px;
        }

        /* 2-OYNA: KEYINGI ASOSIY EKRAN */
        .main-placeholder {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <!-- 1-OYNA: QORA PREMIUM ALMAZ LOADING -->
    <div id="loaderPage" class="page active">
        <div class="loader-container">
            <div class="diamond-wrapper">
                <svg viewBox="0 0 120 120" width="160" height="160" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="dTop" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#3a3a3a"/>
                            <stop offset="100%" stop-color="#0a0a0a"/>
                        </linearGradient>
                        <linearGradient id="dLeft" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#222222"/>
                            <stop offset="100%" stop-color="#000000"/>
                        </linearGradient>
                        <linearGradient id="dCenter" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#4d4d4d"/>
                            <stop offset="50%" stop-color="#141414"/>
                            <stop offset="100%" stop-color="#000000"/>
                        </linearGradient>
                        <linearGradient id="dRight" x1="100%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#1a1a1a"/>
                            <stop offset="100%" stop-color="#000000"/>
                        </linearGradient>
                    </defs>

                    <polygon points="34,18 86,18 110,44 10,44" fill="url(#dTop)"/>
                    <polygon points="34,18 60,44 10,44" fill="#2b2b2b"/>
                    <polygon points="86,18 110,44 60,44" fill="#181818"/>
                    <polygon points="34,18 86,18 60,44" fill="#454545"/>

                    <polygon points="10,44 38,44 60,106" fill="url(#dLeft)"/>
                    <polygon points="38,44 82,44 60,106" fill="url(#dCenter)"/>
                    <polygon points="82,44 110,44 60,106" fill="url(#dRight)"/>

                    <polyline points="10,44 110,44" stroke="#666666" stroke-width="1.2"/>
                    <polyline points="34,18 38,44 60,106 82,44 86,18" stroke="#555555" stroke-width="1"/>
                    <polygon class="diamond-glint" points="34,18 60,44 38,44" fill="#ffffff" opacity="0.25"/>
                </svg>
            </div>

            <div class="progress-wrapper">
                <div class="progress-bar-container">
                    <div id="progressBarFill" class="progress-bar-fill"></div>
                </div>
                <div id="percentageVal" class="percentage-text">1%</div>
            </div>
        </div>
    </div>

    <!-- 2-OYNA: KEYINGI SAHIFA -->
    <div id="mainPage" class="page">
        <div class="main-placeholder">
            <div style="font-size: 20px; font-weight: 900; color: #000000;">Asosiy oyna tayyor</div>
            <div style="font-size: 13px; font-weight: 700; color: #666666;">Keyingi qadamda nima qilamiz?</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        let currentProgress = 1;
        const fillElement = document.getElementById('progressBarFill');
        const percentageElement = document.getElementById('percentageVal');

        const loadingInterval = setInterval(() => {
            if (currentProgress < 100) {
                currentProgress++;
                fillElement.style.width = currentProgress + '%';
                percentageElement.textContent = currentProgress + '%';
            } else {
                clearInterval(loadingInterval);
                setTimeout(() => {
                    document.getElementById('loaderPage').classList.remove('active');
                    document.getElementById('mainPage').classList.add('active');
                }, 350);
            }
        }, 30);
    </script>
</body>
</html>
