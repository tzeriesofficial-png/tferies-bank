<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACAZES — ASMR Kalkulyator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 15px;
            position: relative;
            transition: background-color 0.4s ease;
        }

        /* ================= 1. KIRISH EKRANI (MATEMATIKA FON ANIMATSIYASI) ================= */
        .math-bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background-color: #ffffff;
            overflow: hidden;
        }

        .math-formula {
            position: absolute;
            color: rgba(0, 0, 0, 0.08);
            font-family: 'Cinzel', serif;
            font-weight: 700;
            white-space: nowrap;
            animation: floatFormula linear infinite;
        }

        @keyframes floatFormula {
            0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(15deg); opacity: 0; }
        }

        .splash-screen {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 390px;
            animation: fadeIn 0.5s ease;
        }

        .title-acazes {
            font-family: 'Cinzel', serif;
            font-size: 38px;
            letter-spacing: 12px;
            font-weight: 900;
            margin-bottom: 8px;
            text-transform: uppercase;
            color: #000000;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.1));
        }

        .subtitle-select {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 35px;
            font-weight: 800;
            color: #333333;
        }

        .gender-cards {
            display: flex;
            gap: 16px;
            width: 100%;
            justify-content: center;
        }

        .gender-card {
            flex: 1;
            max-width: 165px;
            padding: 26px 15px;
            border-radius: 22px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .gender-card:active {
            transform: scale(0.94);
        }

        .gender-card.male-card, .gender-card.female-card {
            background: #ffffff;
            border: 2.5px solid #000000;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
            color: #000000;
        }

        .gender-card.male-card svg, .gender-card.female-card svg {
            width: 54px;
            height: 54px;
            fill: none;
            stroke: #000000;
            stroke-width: 2.3;
        }

        .card-label {
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ================= 2. KALKULYATOR EKRANI ================= */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            display: none;
        }

        .calculator-wrapper {
            position: relative;
            z-index: 2;
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 380px;
            border-radius: 22px;
            padding: 20px;
            animation: fadeIn 0.4s ease-out;
        }

        .calc-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .calc-header {
            font-family: 'Cinzel', serif;
            font-size: 15px;
            letter-spacing: 4px;
            font-weight: 900;
        }

        .top-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-top-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-family: 'Montserrat', sans-serif;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.5px;
            padding: 6px 8px;
            border-radius: 8px;
            text-transform: uppercase;
            transition: transform 0.15s ease;
        }

        .icon-top-btn:active {
            transform: scale(0.92);
        }

        .icon-top-btn svg {
            width: 14px;
            height: 14px;
        }

        .display-screen {
            width: 100%;
            height: 98px;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 18px;
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .prev-operand {
            font-size: 14px;
            height: 20px;
            line-height: 20px;
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
        }

        .prev-operand::-webkit-scrollbar {
            display: none;
        }

        .curr-operand {
            font-size: 34px;
            height: 44px;
            line-height: 44px;
            font-weight: 800;
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
        }

        .curr-operand::-webkit-scrollbar {
            display: none;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .calc-btn {
            border-radius: 14px;
            height: 62px;
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .calc-btn:active {
            transform: scale(0.91);
        }

        .calc-btn.zero-btn {
            grid-column: span 2;
        }

        .calc-btn.equals {
            grid-column: span 2;
            font-size: 28px;
        }

        /* ================= MODAL OYINLAR (ADMINKA VA SHARH) ================= */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .modal-card {
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 20px;
            padding: 22px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            color: #000000;
        }

        .modal-title {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 900;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .modal-text {
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 20px;
            font-weight: 600;
            color: #333333;
            text-align: left;
            background: #f7f7f9;
            padding: 12px;
            border-radius: 10px;
            border-left: 3px solid #000000;
        }

        /* Play Market uslubidagi 6 ta yulduzcha */
        .stars-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 15px;
        }

        .star-svg {
            width: 32px;
            height: 32px;
            cursor: pointer;
            fill: #e0e0e0;
            transition: transform 0.15s ease, fill 0.15s ease;
        }

        .star-svg.active {
            fill: #ffb700;
            filter: drop-shadow(0 0 6px rgba(255, 183, 0, 0.6));
        }

        .review-textarea {
            width: 100%;
            height: 90px;
            border: 1.5px solid #cccccc;
            border-radius: 10px;
            padding: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            resize: none;
            outline: none;
            margin-bottom: 6px;
            background: #fafafa;
        }

        .review-textarea:focus {
            border-color: #000000;
        }

        .char-counter {
            font-size: 10px;
            color: #777777;
            text-align: right;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .modal-btns {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            border: 1.5px solid #000000;
            transition: transform 0.1s ease;
        }

        .modal-btn:active {
            transform: scale(0.95);
        }

        .modal-btn.cancel {
            background: #ffffff;
            color: #000000;
        }

        .modal-btn.confirm {
            background: #000000;
            color: #ffffff;
        }

        /* ================= JENSKIY TEMA (PUSHTI) ================= */
        body.theme-female {
            background-color: #14030c;
        }

        body.theme-female .calculator-wrapper {
            background: rgba(32, 6, 20, 0.95);
            border: 1.5px solid #ff1493;
            box-shadow: 0 0 35px rgba(255, 20, 147, 0.4);
        }

        body.theme-female .calc-header {
            color: #ff69b4;
        }

        body.theme-female .icon-top-btn {
            color: #ff69b4;
            border: 1px solid #8b0046;
            background: rgba(255, 20, 147, 0.12);
        }

        body.theme-female .icon-top-btn svg {
            stroke: #ff69b4;
            fill: none;
        }

        body.theme-female .display-screen {
            background-color: #0d0208;
            border: 1px solid #8b0046;
            box-shadow: inset 0 0 15px rgba(255, 20, 147, 0.25);
        }

        body.theme-female .prev-operand {
            color: #b34781;
        }

        body.theme-female .curr-operand {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.7);
        }

        body.theme-female .calc-btn {
            background-color: #210715;
            border: 1px solid #8b0046;
            color: #ffb6c1;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        body.theme-female .calc-btn.operator {
            background-color: #380922;
            border-color: #ff1493;
            color: #ff1493;
            font-size: 26px;
        }

        body.theme-female .calc-btn.clear {
            background-color: #2b071a;
            color: #ff69b4;
            font-size: 18px;
        }

        body.theme-female .calc-btn.equals {
            background: linear-gradient(135deg, #c70067 0%, #ff1493 100%);
            border: 1px solid #ff1493;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.6);
        }

        body.theme-female .modal-card {
            background: #1a0511;
            border-color: #ff1493;
            color: #ff69b4;
            box-shadow: 0 0 35px rgba(255, 20, 147, 0.5);
        }

        body.theme-female .modal-text {
            background: #2b071a;
            color: #ffb6c1;
            border-left-color: #ff1493;
        }

        body.theme-female .review-textarea {
            background: #0d0208;
            border-color: #8b0046;
            color: #ffffff;
        }

        body.theme-female .modal-btn.cancel {
            background: #210715;
            color: #ff69b4;
            border-color: #8b0046;
        }

        body.theme-female .modal-btn.confirm {
            background: #ff1493;
            color: #ffffff;
            border-color: #ff69b4;
        }

        /* ================= MUJISKOY TEMA (OQ & QORA) ================= */
        body.theme-male {
            background-color: #ffffff;
        }

        body.theme-male .calculator-wrapper {
            background: #f5f5f7;
            border: 2px solid #000000;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.18);
        }

        body.theme-male .calc-header {
            color: #000000;
        }

        body.theme-male .icon-top-btn {
            color: #000000;
            border: 1.5px solid #000000;
            background: #ffffff;
        }

        body.theme-male .icon-top-btn svg {
            stroke: #000000;
            fill: none;
        }

        body.theme-male .display-screen {
            background-color: #ffffff;
            border: 2px solid #000000;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        body.theme-male .prev-operand {
            color: #555555;
            font-weight: 700;
        }

        body.theme-male .curr-operand {
            color: #000000;
        }

        body.theme-male .calc-btn {
            background-color: #0a0a0a;
            border: 1px solid #000000;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        body.theme-male .calc-btn.operator {
            background-color: #1c1c1e;
            border: 1.5px solid #000000;
            color: #ffffff;
            font-size: 26px;
        }

        body.theme-male .calc-btn.clear {
            background-color: #262626;
            color: #e0e0e0;
            font-size: 18px;
        }

        body.theme-male .calc-btn.equals {
            background: #000000;
            border: 1.5px solid #000000;
            color: #ffffff;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.35);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Kirish ekrani uchun harakatlanuvchi matematika formulalari foni -->
    <div class="math-bg-container" id="mathBg"></div>

    <!-- Kalkulyator ochilganda ko'rinadigan fon naqshlari -->
    <svg class="bg-pattern" id="bgSvg" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <defs>
            <pattern id="gridPattern" width="35" height="35" patternUnits="userSpaceOnUse">
                <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.1"/>
                <circle cx="0" cy="0" r="1.2" fill="#ffffff" fill-opacity="0.2"/>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#gridPattern)" />
    </svg>

    <!-- 1. KIRISH VA TANLOV EKRANI (ACAZES) -->
    <div class="splash-screen" id="splashScreen">
        <div class="title-acazes">ACAZES</div>
        <div class="subtitle-select">Rejimni tanlang</div>

        <div class="gender-cards">
            <!-- Mujiskoy SVG Premium tugma -->
            <div class="gender-card male-card" onclick="selectMode('male')">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="10" cy="14" r="6"></circle>
                    <line x1="14.5" y1="9.5" x2="20" y2="4"></line>
                    <polyline points="15 4 20 4 20 9"></polyline>
                </svg>
                <span class="card-label">MUJISKOY</span>
            </div>

            <!-- Jenskiy SVG Premium tugma -->
            <div class="gender-card female-card" onclick="selectMode('female')">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="9" r="6"></circle>
                    <line x1="12" y1="15" x2="12" y2="22"></line>
                    <line x1="9" y1="19" x2="15" y2="19"></line>
                </svg>
                <span class="card-label">JENSKIY</span>
            </div>
        </div>
    </div>

    <!-- 2. KALKULYATOR EKRANI -->
    <div class="calculator-wrapper" id="calcApp">
        <div class="calc-top-bar">
            <div class="calc-header">ACAZES</div>
            <div class="top-controls">
                <!-- Sharh yozish tugmasi -->
                <button class="icon-top-btn" onclick="openModal('reviewModal')" title="Sharh">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                    <span>SHARH</span>
                </button>

                <!-- Adminka tugmasi -->
                <button class="icon-top-btn" onclick="openModal('adminModal')" title="Adminka">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>ADMINKA</span>
                </button>

                <!-- Rejimni o'zgartirish tugmasi -->
                <button class="icon-top-btn" onclick="goBackToSelection()" title="Rejim">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    <span>REJIM</span>
                </button>
            </div>
        </div>
        
        <div class="display-screen">
            <div class="prev-operand" id="prevOperand"></div>
            <div class="curr-operand" id="currOperand">0</div>
        </div>

        <div class="buttons-grid">
            <button class="calc-btn clear" onclick="clearDisplay()">AC</button>
            <button class="calc-btn clear" onclick="deleteLast()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                    <line x1="18" y1="9" x2="12" y2="15"></line>
                    <line x1="12" y1="9" x2="18" y2="15"></line>
                </svg>
            </button>
            <button class="calc-btn operator" onclick="chooseOperation('÷')">÷</button>
            <button class="calc-btn operator" onclick="chooseOperation('×')">×</button>

            <button class="calc-btn" onclick="appendNumber('7')">7</button>
            <button class="calc-btn" onclick="appendNumber('8')">8</button>
            <button class="calc-btn" onclick="appendNumber('9')">9</button>
            <button class="calc-btn operator" onclick="chooseOperation('-')">−</button>

            <button class="calc-btn" onclick="appendNumber('4')">4</button>
            <button class="calc-btn" onclick="appendNumber('5')">5</button>
            <button class="calc-btn" onclick="appendNumber('6')">6</button>
            <button class="calc-btn operator" onclick="chooseOperation('+')">+</button>

            <button class="calc-btn" onclick="appendNumber('1')">1</button>
            <button class="calc-btn" onclick="appendNumber('2')">2</button>
            <button class="calc-btn" onclick="appendNumber('3')">3</button>
            <button class="calc-btn" onclick="appendNumber('.')">.</button>

            <button class="calc-btn zero-btn" onclick="appendNumber('0')">0</button>
            <button class="calc-btn equals" onclick="compute()">=</button>
        </div>
    </div>

    <!-- 3. ADMINKA MODAL OYNASI -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal-card">
            <div class="modal-title">XATOLAR TUSHUNTIRISHI</div>
            <div class="modal-text">
                Iltimos, faqat mani so'kmang. Xatolarim sababini shunchaki tushuntiring 🥰
            </div>
            <div class="modal-btns">
                <button class="modal-btn cancel" onclick="closeModal('adminModal')">Yopish</button>
                <button class="modal-btn confirm" onclick="goToAdmin()">Roziman</button>
            </div>
        </div>
    </div>

    <!-- 4. SHARH MODAL OYNASI (6 ta yulduzcha va 500 ta belgi) -->
    <div class="modal-overlay" id="reviewModal">
        <div class="modal-card">
            <div class="modal-title">ILOVANI BAHOLANG</div>
            
            <!-- 6 ta Play Market uslubidagi SVG yulduzcha -->
            <div class="stars-container" id="starsContainer">
                <svg class="star-svg active" viewBox="0 0 24 24" onclick="setRating(1)"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                <svg class="star-svg active" viewBox="0 0 24 24" onclick="setRating(2)"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                <svg class="star-svg active" viewBox="0 0 24 24" onclick="setRating(3)"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                <svg class="star-svg active" viewBox="0 0 24 24" onclick="setRating(4)"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                <svg class="star-svg active" viewBox="0 0 24 24" onclick="setRating(5)"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                <svg class="star-svg active" viewBox="0 0 24 24" onclick="setRating(6)"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            </div>

            <textarea class="review-textarea" id="reviewText" maxlength="500" placeholder="Fikr va mulohazalaringizni yozing..." oninput="updateCharCount()"></textarea>
            <div class="char-counter" id="charCounter">0 / 500</div>

            <div class="modal-btns">
                <button class="modal-btn cancel" onclick="closeModal('reviewModal')">Bekor qilish</button>
                <button class="modal-btn confirm" onclick="submitReview()">Tasdiqlash</button>
            </div>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // ================= MATEMATIKA FON ANIMATSIYASI =================
        const formulas = [
            "E = mc²", "∫ f(x)dx", "a² + b² = c²", "π ≈ 3.14159", 
            "∑ xᵢ", "sin²α + cos²α = 1", "√x", "log(x)", 
            "f'(x) = 3x²", "A = πr²", "x = (-b ± √(b² - 4ac)) / 2a",
            "1, 2, 3, 5, 8, 13", "sin(90°) = 1", "10 × 10 = 100", "Δx → 0"
        ];

        function createMathBackground() {
            const container = document.getElementById('mathBg');
            for (let i = 0; i < 22; i++) {
                const el = document.createElement('div');
                el.className = 'math-formula';
                el.innerText = formulas[Math.floor(Math.random() * formulas.length)];
                el.style.left = Math.random() * 90 + '%';
                el.style.fontSize = (Math.random() * 10 + 14) + 'px';
                el.style.animationDuration = (Math.random() * 8 + 7) + 's';
                el.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(el);
            }
        }
        createMathBackground();

        // ================= ASMR SUV "BULQ" OVOZ SINTEZATORI =================
        let audioCtx = null;
        let isSoundEnabled = true;
        let currentThemeMode = 'female';

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playWaterBubble(type = 'normal') {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred(type === 'equals' ? 'medium' : 'light');
            }

            if (!isSoundEnabled) return;
            initAudio();

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';

            if (type === 'equals') {
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
                osc.frequency.exponentialRampToValueAtTime(1100, now + 0.15);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.3, now + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.22);
                return;
            }

            if (type === 'clear') {
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(180, now + 0.09);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.25, now + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            } else {
                const startFreq = currentThemeMode === 'female' ? 420 : 320;
                const peakFreq = currentThemeMode === 'female' ? 980 : 760;
                const endFreq = currentThemeMode === 'female' ? 600 : 450;

                osc.frequency.setValueAtTime(startFreq, now);
                osc.frequency.exponentialRampToValueAtTime(peakFreq, now + 0.04);
                osc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.08);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.32, now + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
            }

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.09);
        }

        // ================= REJIM VA EKRAN BOSHQARUVI =================
        const splashScreen = document.getElementById('splashScreen');
        const mathBg = document.getElementById('mathBg');
        const bgSvg = document.getElementById('bgSvg');
        const calcApp = document.getElementById('calcApp');
        const gridPattern = document.getElementById('gridPattern');

        function selectMode(mode) {
            currentThemeMode = mode;
            playWaterBubble('equals');

            document.body.classList.remove('theme-male', 'theme-female');
            mathBg.style.display = 'none';
            bgSvg.style.display = 'block';
            
            if (mode === 'male') {
                document.body.classList.add('theme-male');
                gridPattern.innerHTML = `
                    <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#000000" stroke-width="0.6" stroke-opacity="0.08"/>
                    <circle cx="0" cy="0" r="1.2" fill="#000000" fill-opacity="0.18"/>
                `;
            } else {
                document.body.classList.add('theme-female');
                gridPattern.innerHTML = `
                    <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#ff1493" stroke-width="0.6" stroke-opacity="0.22"/>
                    <circle cx="0" cy="0" r="1.2" fill="#ff69b4" fill-opacity="0.35"/>
                `;
            }

            splashScreen.style.display = 'none';
            calcApp.style.display = 'flex';
        }

        function goBackToSelection() {
            playWaterBubble('clear');
            document.body.classList.remove('theme-male', 'theme-female');
            bgSvg.style.display = 'none';
            mathBg.style.display = 'block';
            calcApp.style.display = 'none';
            splashScreen.style.display = 'flex';
        }

        // ================= MODAL VA LICHKA BOSHQARUVI =================
        function openModal(modalId) {
            playWaterBubble('normal');
            document.getElementById(modalId).style.display = 'flex';
        }

        function closeModal(modalId) {
            playWaterBubble('clear');
            document.getElementById(modalId).style.display = 'none';
        }

        function goToAdmin() {
            playWaterBubble('equals');
            const message = encodeURIComponent("Iltimos, faqat mani so'kmang. Xatolarim sababini shunchaki tushuntiring 🥰");
            window.location.href = `https://t.me/FarzonaTurayeva?text=${message}`;
        }

        // Sharh yulduzchalari va matn
        let selectedRating = 6;
        function setRating(rating) {
            playWaterBubble('normal');
            selectedRating = rating;
            const stars = document.querySelectorAll('.star-svg');
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        function updateCharCount() {
            const text = document.getElementById('reviewText').value;
            if (text.length > 500) {
                document.getElementById('reviewText').value = text.substring(0, 500);
            }
            document.getElementById('charCounter').innerText = `${document.getElementById('reviewText').value.length} / 500`;
        }

        function submitReview() {
            playWaterBubble('equals');
            const review = document.getElementById('reviewText').value || "Sharh yozilmagan";
            const stats = `⭐ Baho: ${selectedRating} / 6\n💬 Sharh: ${review}`;
            const encodedStats = encodeURIComponent(`Ilova uchun yuborilgan statistika:\n\n${stats}`);
            window.location.href = `https://t.me/FarzonaTurayeva?text=${encodedStats}`;
        }

        // ================= KALKULYATOR LOGIKASI =================
        let currentOperand = '0';
        let previousOperand = '';
        let operation = undefined;

        const currDisplay = document.getElementById('currOperand');
        const prevDisplay = document.getElementById('prevOperand');

        function adjustFontSize() {
            const len = currentOperand.toString().length;
            if (len > 15) {
                currDisplay.style.fontSize = '20px';
            } else if (len > 11) {
                currDisplay.style.fontSize = '26px';
            } else {
                currDisplay.style.fontSize = '34px';
            }
        }

        function updateDisplay() {
            currDisplay.innerText = currentOperand;
            adjustFontSize();
            currDisplay.scrollLeft = currDisplay.scrollWidth;

            if (operation != null) {
                prevDisplay.innerText = `${previousOperand} ${operation}`;
            } else {
                prevDisplay.innerText = '';
            }
        }

        function appendNumber(number) {
            playWaterBubble('normal');
            if (number === '.' && currentOperand.toString().includes('.')) return;
            if (currentOperand === '0' && number !== '.') {
                currentOperand = number.toString();
            } else {
                currentOperand = currentOperand.toString() + number.toString();
            }
            updateDisplay();
        }

        function chooseOperation(op) {
            playWaterBubble('normal');
            if (currentOperand === '') return;
            if (previousOperand !== '') {
                compute(false);
            }
            operation = op;
            previousOperand = currentOperand;
            currentOperand = '';
            updateDisplay();
        }

        function compute(playSound = true) {
            if (playSound) playWaterBubble('equals');
            let computation;
            const prev = parseFloat(previousOperand);
            const current = parseFloat(currentOperand);
            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+':
                    computation = prev + current;
                    break;
                case '-':
                    computation = prev - current;
                    break;
                case '×':
                    computation = prev * current;
                    break;
                case '÷':
                    if (current === 0) {
                        currentOperand = 'Xato';
                        previousOperand = '';
                        operation = undefined;
                        updateDisplay();
                        return;
                    }
                    computation = prev / current;
                    break;
                default:
                    return;
            }

            currentOperand = Math.round(computation * 100000000) / 100000000;
            operation = undefined;
            previousOperand = '';
            updateDisplay();
        }

        function clearDisplay() {
            playWaterBubble('clear');
            currentOperand = '0';
            previousOperand = '';
            operation = undefined;
            updateDisplay();
        }

        function deleteLast() {
            playWaterBubble('clear');
            if (currentOperand === 'Xato') {
                clearDisplay();
                return;
            }
            currentOperand = currentOperand.toString().slice(0, -1);
            if (currentOperand === '' || currentOperand === '-') {
                currentOperand = '0';
            }
            updateDisplay();
        }
    </script>
</body>
</html>
