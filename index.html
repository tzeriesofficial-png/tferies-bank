
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080811">
<title>MONETA BANK</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070710;color:white;font-family:Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:520px;margin:auto;min-height:100vh;padding:15px 13px 100px;background:radial-gradient(ellipse at 10% 0%,#351052,transparent 35%),radial-gradient(ellipse at 100% 30%,#063b35,transparent 30%),#080811}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0 20px}
.brand{display:flex;align-items:center;gap:8px}
.crown{font-size:30px;filter:drop-shadow(0 0 8px gold)}
.brand h1{font-size:20px;margin:0;font-weight:900;background:linear-gradient(90deg,#fff,#c4a1ff,#ffdc83);color:transparent;background-clip:text}
.brand small{font-size:9px;color:#b9a9d4;letter-spacing:1px}
.balance{background:linear-gradient(130deg,#281342,#111020);border:1px solid #8552c5;border-radius:25px;padding:10px;color:#ffe28a;font-weight:bold;white-space:nowrap}
.banner{border:1px solid #a64cff;border-radius:19px;padding:18px;background:radial-gradient(circle at 10% 80%,#a63aff88,transparent 40%),linear-gradient(120deg,#160a2c,#39106c,#100c25);display:flex;justify-content:space-between;align-items:center;box-shadow:0 0 22px #a02cff55;min-height:135px}
.banner h2{font-size:26px;font-style:italic;margin:0 0 8px}
.banner p{font-size:12px;color:#f4d9ff;margin:0}
.diamond{font-size:49px;filter:drop-shadow(0 0 10px #5ceaff)}
.gold{border:1px solid #ffe69a;border-radius:22px;padding:10px 15px;background:linear-gradient(#fff19a,#ffae22);color:#321800;font-weight:900;margin-top:12px}
.tabs{display:flex;gap:8px;margin:18px 0;overflow:auto}
.tab{border:1px solid #423454;background:#171522;color:#d1c5e3;border-radius:22px;padding:11px 16px;font-weight:bold;white-space:nowrap}
.tab.active{background:linear-gradient(120deg,#a400ff,#5b24ff);color:white;border-color:#c57dff;box-shadow:0 0 15px #8b36ff55}
.heading{display:flex;justify-content:space-between;margin:18px 3px 11px;font-weight:bold}
.heading small{color:#aaa;font-weight:normal}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.card{border:1px solid #7141a3;border-radius:17px;overflow:hidden;background:#171522;box-shadow:0 5px 18px #0009;min-width:0;cursor:pointer;transition:.15s}
.card:active{transform:scale(.97)}
.art{height:120px;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(135deg,var(--a),var(--b));overflow:hidden}
.art:before{content:"";position:absolute;width:150px;height:150px;border:1px solid #ffffff44;border-radius:50%;box-shadow:0 0 0 15px #ffffff0d,0 0 0 30px #ffffff09}
.art:after{content:"";position:absolute;width:90px;height:90px;border:1px solid #ffffff40;transform:rotate(35deg);right:-25px;bottom:-45px}
.art strong{font-size:22px;font-weight:1000;text-align:center;text-shadow:0 3px 10px black;z-index:1;padding:5px}
.tag{position:absolute;left:7px;top:7px;background:#ff315b;border-radius:20px;padding:5px 8px;font-size:9px;font-weight:bold;z-index:2}
.art .crown-small{position:absolute;right:8px;top:5px;font-size:22px;z-index:2}
.info{padding:10px}
.info h3{font-size:14px;margin:0 0 5px}
.info p{font-size:10px;color:#b4a9c5;margin:0 0 10px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:3px}
.price{font-size:10px;color:#ffdb76;font-weight:bold}
.go{background:linear-gradient(#fff09a,#ffae22);border:1px solid #ffe28a;color:#351900;border-radius:20px;padding:6px 11px;font-size:10px;font-weight:900}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:flex;justify-content:space-around;background:#110d20ed;border:1px solid #7843b1;border-bottom:0;border-radius:20px 20px 0 0;padding:12px 5px 17px;backdrop-filter:blur(15px);z-index:5}
nav button{background:none;border:0;color:#b9add0;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
nav b{font-size:22px}
nav button.selected{color:#dba7ff}
.overlay{display:none;position:fixed;inset:0;background:#05040cf5;z-index:10;overflow:auto;padding:18px 12px}
.modal{max-width:460px;margin:25px auto;background:linear-gradient(150deg,#241333,#11111f);border:1px solid #9854ce;border-radius:21px;padding:20px;box-shadow:0 0 30px #8c30ff55}
.close{float:right;background:#392747;border:0;color:white;border-radius:50%;width:33px;height:33px;font-size:20px}
.modal h2{font-size:23px;margin:12px 0}
.muted{color:#b7aac9;font-size:12px;line-height:1.5}
.option{display:flex;justify-content:space-between;align-items:center;padding:13px;margin:9px 0;border:1px solid #514064;border-radius:12px;background:#211b30;font-size:13px;gap:8px}
.field{width:100%;padding:14px;border-radius:11px;border:1px solid #63477e;background:#0d0b16;color:white;margin:8px 0 13px;font-size:16px}
.wide{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(100deg,#a52cff,#5e37ff);color:white;font-weight:900;margin-top:10px}
.method{border:1px solid #665080;border-radius:13px;padding:15px;margin:10px 0;background:#1c1729;display:flex;justify-content:space-between;align-items:center;font-weight:bold;color:white;width:100%;text-align:left}
.note{font-size:11px;color:#ffdf9a;background:#302310;border:1px solid #735324;padding:11px;border-radius:10px;margin-top:12px;line-height:1.5}
.total{font-size:19px;color:#ffe28a;font-weight:900}
.empty{text-align:center;padding:30px 10px;color:#b7aac9}
</style>
</head>
<body>
<div class="app">

<header>
 <div class="brand">
  <span class="crown">👑</span>
  <div>
   <h1>MONETA BANK</h1>
   <small>BIGGER OPPORTUNITIES • MORE REWARDS</small>
  </div>
 </div>
 <div class="balance">◆ <span id="balance">12 500</span></div>
</header>

<section class="banner">
 <div>
  <h2>TOP UP <span style="color:#e5a1ff">NOW!</span></h2>
  <p>Get more coins & bonuses</p>
  <button class="gold" onclick="topup()">RECHARGE ›</button>
 </div>
 <div class="diamond">💎</div>
</section>

<div class="tabs">
 <button class="tab active" onclick="filter('All',this)">⭐ ALL</button>
 <button class="tab" onclick="filter('Live',this)">◉ LIVE</button>
 <button class="tab" onclick="filter('Games',this)">🎮 GAMES</button>
</div>

<div class="heading">
 <span id="heading">✨ POPULAR SERVICES</span>
 <small>12 SERVICES</small>
</div>

<div class="cards" id="cards"></div>
<div id="page" style="display:none"></div>

</div>

<nav>
 <button class="selected" onclick="showPage('Home',this)"><b>⌂</b>Home</button>
 <button onclick="showPage('Discover',this)"><b>◉</b>Discover</button>
 <button onclick="showPage('Orders',this)"><b>▤</b>Orders</button>
 <button onclick="showPage('Ranking',this)"><b>♜</b>Ranking</button>
 <button onclick="showPage('Profile',this)"><b>♟</b>Profile</button>
</nav>

<div class="overlay" id="overlay">
 <div class="modal">
  <button class="close" onclick="closeModal()">×</button>
  <div id="modalContent"></div>
 </div>
</div>

<script>
const TELEGRAM="https://t.me/monetabankuz";

const services=[
 {name:"Poppo Live",type:"Live",unit:"tanga",rate:19,display:"1 tanga = 19 so‘m",logo:"POPPO",a:"#ff00a8",b:"#ffb000",tag:"HOT"},
 {name:"Yalla Live",type:"Live",unit:"tanga",rate:null,display:"Narx admin bilan kelishiladi",logo:"YALLA",a:"#00c9b8",b:"#007baf",tag:"HOT"},
 {name:"PUBG Mobile",type:"Games",unit:"60 UC paketi",rate:12000,display:"60 UC = 12 000 so‘m",logo:"PUBG",a:"#135c9b",b:"#e2a34a",tag:"TOP"},
 {name:"Free Fire",type:"Games",unit:"100 diamond paketi",rate:15000,display:"100 diamond = 15 000 so‘m",logo:"FREE FIRE",a:"#a31537",b:"#ff8a23",tag:"TOP"},
 {name:"Mobile Legends",type:"Games",unit:"86 diamond paketi",rate:18000,display:"86 diamond = 18 000 so‘m",logo:"MLBB",a:"#2937a4",b:"#a24cdb",tag:"HOT"},
 {name:"Roblox",type:"Games",unit:"80 Robux paketi",rate:20000,display:"80 Robux = 20 000 so‘m",logo:"ROBLOX",a:"#25365d",b:"#11121c",tag:"NEW"},
 {name:"Minecraft",type:"Games",unit:"paket",rate:25000,display:"1 paket = 25 000 so‘m",logo:"MINECRAFT",a:"#347e35",b:"#8d5b31",tag:"NEW"},
 {name:"Standoff 2",type:"Games",unit:"100 gold paketi",rate:20000,display:"100 gold = 20 000 so‘m",logo:"STANDOFF 2",a:"#a51b22",b:"#252a43",tag:"TOP"},
 {name:"Blood Strike",type:"Games",unit:"100 gold paketi",rate:18000,display:"100 gold = 18 000 so‘m",logo:"BLOOD STRIKE",a:"#092d77",b:"#09a5bb",tag:"HOT"},
 {name:"Call of Duty Mobile",type:"Games",unit:"80 CP paketi",rate:15000,display:"80 CP = 15 000 so‘m",logo:"CALL OF DUTY",a:"#44433b",b:"#9a7541",tag:"TOP"},
 {name:"Brawl Stars",type:"Games",unit:"30 gem paketi",rate:15000,display:"30 gem = 15 000 so‘m",logo:"BRAWL STARS",a:"#134dc5",b:"#f0a71b",tag:"NEW"},
 {name:"Clash of Clans",type:"Games",unit:"80 gem paketi",rate:15000,display:"80 gem = 15 000 so‘m",logo:"CLASH OF CLANS",a:"#aa4b12",b:"#e8b34d",tag:"TOP"}
];

let orders=[];
let currentFilter="All";
let chosen=null;

function render(){
 const cards=document.getElementById("cards");
 cards.innerHTML="";
 services.filter(s=>currentFilter==="All"||s.type===currentFilter).forEach(s=>{
  const el=document.createElement("div");
  el.className="card";
  el.innerHTML=`
   <div class="art" style="--a:${s.a};--b:${s.b}">
    <span class="tag">${s.tag}</span>
    <span class="crown-small">♛</span>
    <strong>${s.logo}</strong>
   </div>
   <div class="info">
    <h3>${s.name}</h3>
    <p>${s.type==="Live"?"Live service":"Game service"}</p>
    <div class="foot">
     <span class="price">${s.display}</span>
     <button class="go">GO ›</button>
    </div>
   </div>`;
  el.onclick=()=>openService(s);
  cards.appendChild(el);
 });
}

function filter(type,button){
 currentFilter=type;
 document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
 button.classList.add("active");
 render();
}

function modal(html){
 document.getElementById("modalContent").innerHTML=html;
 document.getElementById("overlay").style.display="block";
}
function closeModal(){
 document.getElementById("overlay").style.display="none";
}

function openService(s){
 chosen=s;
 modal(`
  <div style="color:#c79aff;font-size:10px;letter-spacing:2px">MONETA BANK • ORDER</div>
  <h2>${s.name}</h2>
  <p class="muted">${s.display}</p>

  <label class="muted">Qancha ${s.unit} olmoqchisiz?</label>
  <input class="field" id="quantity" type="number" min="1" step="1" placeholder="Miqdorni kiriting">

  <div class="option">
   <span>Birlik narxi</span>
   <b>${s.rate===null?"Admin bilan kelishiladi":s.rate.toLocaleString("uz-UZ")+" so‘m"}</b>
  </div>

  <div class="option">
   <span>Jami narx</span>
   <b class="total" id="total">0 so‘m</b>
  </div>

  <label class="muted">O‘yin / ilova ID raqamingiz</label>
  <input class="field" id="uid" placeholder="ID raqamingizni kiriting">

  <button class="wide" id="orderBtn">BUYURTMA BERISH</button>
  <div class="note">Buyurtma Telegram orqali admin bilan kelishiladi. Narx va miqdorni tekshiring.</div>
 `);

 const q=document.getElementById("quantity");
 const total=document.getElementById("total");

 function calculate(){
  const n=Number(q.value);
  if(!n||n<1||!Number.isInteger(n)){
   total.textContent="0 so‘m";
   return;
  }
  if(s.rate===null){
   total.textContent="Admin tasdiqlaydi";
   return;
  }
  total.textContent=(n*s.rate).toLocaleString("uz-UZ")+" so‘m";
 }

 q.addEventListener("input",calculate);

 document.getElementById("orderBtn").onclick=()=>{
  const n=Number(q.value);
  const id=document.getElementById("uid").value.trim();

  if(!n||n<1||!Number.isInteger(n)){
   alert("To‘g‘ri miqdor kiriting");
   return;
  }
  if(!id){
   alert("ID raqamingizni kiriting");
   return;
  }

  const amount=s.rate===null?
   "Narx admin bilan kelishiladi":
   (n*s.rate).toLocaleString("uz-UZ")+" so‘m";

  const message=
`Salom! MONETA BANK orqali buyurtma bermoqchiman.

Xizmat: ${s.name}
Miqdor: ${n} ${s.unit}
ID: ${id}
Jami narx: ${amount}

Iltimos, buyurtmamni tasdiqlang.`;

  orders.unshift({
   name:s.name,
   quantity:n,
   unit:s.unit,
   id:id,
   price:amount
  });

  window.location.href=TELEGRAM+"?text="+encodeURIComponent(message);
 };
}

function topup(){
 modal(`
  <h2>💎 HISOBNI TO‘LDIRISH</h2>
  <p class="muted">O‘zingiz foydalanadigan to‘lov tizimini tanlang.</p>

  <button class="method" onclick="payment('HUMO')">
   <span>🔵 HUMO</span><span>›</span>
  </button>

  <button class="method" onclick="payment('UZCARD')">
   <span>🟢 UZCARD</span><span>›</span>
  </button>

  <div class="note">
   To‘lov bo‘yicha savolingiz Telegram orqali yuboriladi.
   Pul o‘tkazishdan oldin admin bilan rekvizitlarni tasdiqlang.
  </div>
 `);
}

function payment(method){
 const message=
 "Salom! Qaysi to‘lov tizimiga pul tashashim kerak? Men "+method+" orqali to‘lamoqchiman.";

 window.location.href=TELEGRAM+"?text="+encodeURIComponent(message);
}

function showPage(name,button){
 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("selected"));
 button.classList.add("selected");

 const cards=document.getElementById("cards");
 const tabs=document.querySelector(".tabs");
 const page=document.getElementById("page");
 const heading=document.getElementById("heading");

 if(name==="Home"||name==="Discover"){
  cards.style.display="grid";
  tabs.style.display="flex";
  page.style.display="none";
  heading.textContent=name==="Home"?"✨ POPULAR SERVICES":"🔎 DISCOVER SERVICES";
  return;
 }

 cards.style.display="none";
 tabs.style.display="none";
 page.style.display="block";
 heading.textContent=name.toUpperCase();

 if(name==="Orders"){
  page.innerHTML="<h3>📦 MY ORDERS</h3>"+(
   orders.length?
   orders.map(o=>`
    <div class="option">
     <span>${o.name}<br><small>${o.quantity} ${o.unit} • ID: ${o.id}</small></span>
     <b>${o.price}</b>
    </div>
   `).join(""):
   "<p class='empty'>Hozircha buyurtmalar yo‘q.</p>"
  );
 }else if(name==="Profile"){
  page.innerHTML=`
   <h3>👤 MY PROFILE</h3>
   <div class="option"><span>MONETA USER</span><b>USER</b></div>
   <div class="option"><span>Buyurtmalar</span><b>${orders.length}</b></div>
   <button class="wide" onclick="topup()">HISOBNI TO‘LDIRISH</button>
  `;
 }else{
  page.innerHTML=`
   <h3>🏆 RANKING</h3>
   <p class="muted">Reyting bo‘limi foydalanuvchilar tizimi ulangandan keyin ishlaydi.</p>
  `;
 }
}

document.getElementById("overlay").addEventListener("click",function(e){
 if(e.target===this)closeModal();
});

render();
</script>
</body>
</html>
