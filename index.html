<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AviaXStars</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: #050a14;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .page {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease;
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* KIRISH QISMI (AviaXStars) */
        #loaderPage {
            background: radial-gradient(circle at top, #0f294a 0%, #061021 55%, #02050a 100%);
            z-index: 100;
        }

        .avia-loader {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .title-wrap {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* Yon-atrofdagi dekorativ chiziqchalar */
        .deco-lines-top {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .line-dash {
            height: 2.5px;
            border-radius: 99px;
            background: linear-gradient(90deg, transparent, #38bdf8, transparent);
            animation: dashPulse 1.8s infinite ease-in-out;
        }

        .line-dash.sm { width: 24px; animation-delay: 0.1s; }
        .line-dash.md { width: 52px; animation-delay: 0.3s; }
        .line-dash.lg { width: 86px; animation-delay: 0.5s; }

        @keyframes dashPulse {
            0%, 100% { opacity: 0.35; transform: scaleX(0.85); }
            50% { opacity: 1; transform: scaleX(1.1); }
        }

        .brand-title {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 3px;
            color: #ffffff;
            text-shadow: 0 0 24px rgba(56, 189, 248, 0.55);
            animation: titleFloat 2.4s infinite ease-in-out;
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        /* Chiziqchalar ostidagi parvoz/yorug'lik yo'lagi */
        .wave-lines {
            width: 240px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .wave-bar {
            height: 2px;
            border-radius: 99px;
            background: linear-gradient(90deg, transparent, #0ea5e9, #7dd3fc, #0ea5e9, transparent);
            animation: slideLine 2s infinite ease-in-out;
        }

        .wave-bar:nth-child(1) { width: 190px; animation-delay: 0s; }
        .wave-bar:nth-child(2) { width: 130px; animation-delay: 0.25s; opacity: 0.75; }
        .wave-bar:nth-child(3) { width: 70px; animation-delay: 0.5s; opacity: 0.5; }

        @keyframes slideLine {
            0%, 100% { transform: translateX(-12px); opacity: 0.4; }
            50% { transform: translateX(12px); opacity: 1; }
        }

        /* Yuklanish chizig'i */
        .progress-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        .progress-track {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0284c7, #38bdf8);
            border-radius: 99px;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
            transition: width 0.05s linear;
        }

        .progress-num {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #bae6fd;
        }

        /* ASOSIY OYNA */
        #mainPage {
            background: #060d1a;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 12px;
        }

        .ready-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .ready-sub {
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- KIRISH QISMI -->
    <div id="loaderPage" class="page active">
        <div class="avia-loader">
            <div class="deco-lines-top">
                <span class="line-dash sm"></span>
                <span class="line-dash md"></span>
                <span class="line-dash lg"></span>
                <span class="line-dash md"></span>
                <span class="line-dash sm"></span>
            </div>

            <div class="title-wrap">
                <div class="brand-title">AviaXStars</div>
                <div class="wave-lines">
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                </div>
            </div>

            <div class="progress-box">
                <div class="progress-track">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <div id="progressNum" class="progress-num">0%</div>
            </div>
        </div>
    </div>

    <!-- ASOSIY OYNA -->
    <div id="mainPage" class="page">
        <div class="ready-title">AviaXStars</div>
        <div class="ready-sub">Kirish qismi tayyor. Keyingi boʻlimlarni sozlashimiz mumkin.</div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        let progress = 0;
        const fillEl = document.getElementById('progressFill');
        const numEl = document.getElementById('progressNum');

        const timer = setInterval(() => {
            if (progress < 100) {
                progress++;
                fillEl.style.width = progress + '%';
                numEl.textContent = progress + '%';
            } else {
                clearInterval(timer);
                setTimeout(() => {
                    document.getElementById('loaderPage').classList.remove('active');
                    document.getElementById('mainPage').classList.add('active');
                }, 350);
            }
        }, 25);
    </script>
</body>
</html>
