<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACAZES</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        /* Qoq o'rtada va yorqin neon effektli qimirlab turuvchi yozuv */
        .glossy-logo {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #111111;
            text-align: center;
            animation: neonGlow 1.5s infinite alternate ease-in-out;
        }
        @keyframes neonGlow {
            0% {
                text-shadow: 0 0 5px rgba(0, 0, 0, 0.1), 0 0 10px rgba(0, 0, 0, 0.05);
                transform: scale(1);
            }
            100% {
                text-shadow: 0 0 15px rgba(0, 0, 0, 0.35), 0 0 30px rgba(0, 0, 0, 0.15), 0 0 45px rgba(0, 0, 0, 0.05);
                transform: scale(1.04);
            }
        }
    </style>
</head>
<body>

    <div class="glossy-logo">A C A Z E S</div>

</body>
</html>
