<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reduz Drop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: #0a0a0a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 340px;
            padding: 20px;
        }

        /* Reduz Drop Logotipi */
        .logo-text {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
        }

        .logo-reduz {
            color: #ff0033;
        }

        .logo-drop {
            color: #ffffff;
        }

        /* Foiz ko'rsatkichi */
        .percentage-text {
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
        }

        /* Qizil yuklanish chizig'i (Progress bar) */
        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(255, 0, 51, 0.3);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff0033, #ff3366);
            border-radius: 10px;
            box-shadow: 0 0 10px #ff0033;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <div class="loader-container">
        <!-- Logotip -->
        <div class="logo-text">
            <span class="logo-reduz">Reduz</span><span class="logo-drop">Drop</span>
        </div>

        <!-- Progress bar va foiz -->
        <div style="width: 100%; display: flex; flex-direction: column; gap: 12px; align-items: center;">
            <div class="progress-bar-container">
                <div id="progressBarFill" class="progress-bar-fill"></div>
            </div>
            <div id="percentageVal" class="percentage-text">1%</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { tg.ready(); tg.expand(); }

        let currentProgress = 1;
        const fillElement = document.getElementById('progressBarFill');
        const percentageElement = document.getElementById('percentageVal');

        // 1 dan 100 gacha avtomatik to'lish jarayoni
        const loadingInterval = setInterval(() => {
            if (currentProgress < 100) {
                currentProgress++;
                fillElement.style.width = currentProgress + '%';
                percentageElement.textContent = currentProgress + '%';
            } else {
                clearInterval(loadingInterval);
                // 100% bo'lgach keyingi oyna hozircha ochilmaydi (talabingiz bo'yicha)
            }
        }, 30); // Tezligini shu yerdan o'zgartirishingiz mumkin
    </script>
</body>
</html>
