<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XILCOIN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .intro-screen {
            width: 100%;
            height: 100vh;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .xilcoin-brand {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            animation: brandAppear 0.9s ease-out forwards;
        }

        .premium-coin-svg {
            width: clamp(42px, 11vw, 58px);
            height: clamp(42px, 11vw, 58px);
            flex-shrink: 0;
            animation: coinMove 2s infinite ease-in-out;
            filter: drop-shadow(0 0 14px rgba(250, 204, 21, 0.45));
        }

        .xilcoin-word {
            font-size: clamp(34px, 9.5vw, 52px);
            font-weight: 950;
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 4px 18px rgba(255, 255, 255, 0.16);
        }

        @keyframes brandAppear {
            0% {
                opacity: 0;
                transform: translateY(12px) scale(0.92);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes coinMove {
            0%, 100% {
                transform: translateY(0px) rotate(0deg) scale(1);
            }
            30% {
                transform: translateY(-5px) rotate(-12deg) scale(1.1);
            }
            70% {
                transform: translateY(2px) rotate(10deg) scale(1.05);
            }
        }
    </style>
</head>
<body>

    <div class="intro-screen">
        <div class="xilcoin-brand">
            <svg class="premium-coin-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="coinOuterGrad" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#fef08a"/>
                        <stop offset="48%" stop-color="#facc15"/>
                        <stop offset="100%" stop-color="#ca8a04"/>
                    </linearGradient>
                    <linearGradient id="coinInnerGrad" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#fde047"/>
                        <stop offset="100%" stop-color="#eab308"/>
                    </linearGradient>
                </defs>
                <circle cx="32" cy="32" r="27" fill="url(#coinOuterGrad)" stroke="#ffffff" stroke-width="2.5"/>
                <circle cx="32" cy="32" r="21" fill="url(#coinInnerGrad)" stroke="#fef9c3" stroke-width="1.6" stroke-opacity="0.8"/>
                <path d="M23 22L41 42M41 22L23 42" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round"/>
                <circle cx="32" cy="32" r="5" fill="#ffffff"/>
            </svg>
            <span class="xilcoin-word">XILCOIN</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }
    </script>
</body>
</html>
