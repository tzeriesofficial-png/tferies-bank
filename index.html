<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACAZES</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #2998ff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .page.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.96);
        }

        .page.active {
            opacity: 1;
            transform: scale(1);
        }

        /* 1-Oyna: Landing (Kirish) */
        .landing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 54px;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .logo-svg {
            width: 100%;
            max-width: 350px;
            height: auto;
            overflow: visible;
        }

        @keyframes letterAppear {
            0% {
                opacity: 0;
                transform: translateY(22px) scale(0.75);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes whiteGlowPulse {
            0%, 100% {
                filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.65)) drop-shadow(0 0 22px rgba(255, 255, 255, 0.35));
            }
            50% {
                filter: drop-shadow(0 0 18px rgba(255, 255, 255, 1)) drop-shadow(0 0 38px rgba(255, 255, 255, 0.75));
            }
        }

        .animated-logo {
            animation: whiteGlowPulse 2.4s infinite ease-in-out 1.5s;
        }

        .char-1 { opacity: 0; animation: letterAppear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.15s forwards; }
        .char-2 { opacity: 0; animation: letterAppear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.35s forwards; }
        .char-3 { opacity: 0; animation: letterAppear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.55s forwards; }
        .char-4 { opacity: 0; animation: letterAppear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.75s forwards; }
        .char-5 { opacity: 0; animation: letterAppear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.95s forwards; }
        .char-6 { opacity: 0; animation: letterAppear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.15s forwards; }

        .enter-svg-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            outline: none;
            opacity: 0;
            animation: letterAppear 0.6s ease 1.45s forwards;
            transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
            filter: drop-shadow(0 12px 26px rgba(0, 60, 130, 0.22));
        }

        .enter-svg-btn:active {
            transform: scale(0.93);
        }

        .btn-shine {
            animation: shineMove 3s infinite linear;
        }

        @keyframes shineMove {
            0% { transform: translateX(-220px); }
            50%, 100% { transform: translateX(260px); }
        }

        /* 2-Oyna: Asosiy Market Konteyneri */
        .market-container {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 16px 0 16px;
        }

        .tab-view {
            display: none;
            flex: 1;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            overflow-y: auto;
        }

        .tab-view.active {
            display: flex;
        }

        .tab-content-box h2 {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.15);
        }

        .tab-content-box p {
            font-size: 14.5px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 600;
        }

        /* Admin karta stili */
        .admin-card {
            background: rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(18px);
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            border-radius: 26px;
            padding: 22px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 290px;
            box-shadow: 0 16px 36px rgba(0, 50, 120, 0.25);
        }

        .admin-photo-wrap {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            overflow: hidden;
            box-shadow: 0 8px 22px rgba(0,0,0,0.22);
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .admin-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .admin-fallback-letter {
            font-size: 30px;
            font-weight: 900;
            color: #ffffff;
            display: none;
        }

        .admin-name-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .admin-name-row h3 {
            font-size: 17px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        .admin-username {
            font-size: 12.5px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 700;
            background: rgba(0, 0, 0, 0.18);
            padding: 4px 12px;
            border-radius: 10px;
            margin-bottom: 4px;
        }

        /* Support bo'limi uchun adminlar ro'yxati */
        .support-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 310px;
        }

        /* Premium SVG Lichkaga o'tish tugmasi */
        .dm-svg-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            outline: none;
            transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
            filter: drop-shadow(0 6px 16px rgba(0, 40, 100, 0.25));
        }

        .dm-svg-btn:active {
            transform: scale(0.94);
        }

        .dm-shine {
            animation: shineMove 3s infinite linear;
        }

        /* Qora qimirlab turuvchi galochka */
        .black-check-wrap {
            width: 20px;
            height: 20px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            animation: wiggleCheck 1.8s infinite ease-in-out;
            filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.5));
        }

        /* Pushti qimirlab turuvchi galochka */
        .pink-check-wrap {
            width: 20px;
            height: 20px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            animation: wiggleCheck 1.8s infinite ease-in-out;
            filter: drop-shadow(0 0 6px rgba(255, 105, 180, 0.8));
        }

        @keyframes wiggleCheck {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.16) rotate(-8deg); }
            50% { transform: scale(0.95) rotate(4deg); }
            75% { transform: scale(1.12) rotate(8deg); }
        }

        /* Pastki 4 ta Ikonkali Navigatsiya */
        .bottom-nav {
            width: 100%;
            height: 78px;
            background: rgba(0, 60, 140, 0.35);
            backdrop-filter: blur(25px);
            border: 1.5px solid rgba(255, 255, 255, 0.22);
            border-radius: 22px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
            box-shadow: 0 10px 30px rgba(0, 50, 120, 0.25);
            flex-shrink: 0;
        }

        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            width: 25%;
            height: 100%;
            opacity: 0.65;
            transition: all 0.25s ease;
        }

        .nav-item.active {
            opacity: 1;
            transform: translateY(-3px);
        }

        .nav-item.active span {
            color: #ffffff;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        .nav-svg-icon {
            width: 26px;
            height: 26px;
            stroke: #ffffff;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-bottom: 5px;
            animation: iconWiggle 2s infinite ease-in-out;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.6));
        }

        .nav-item.active .nav-svg-icon {
            stroke-width: 2.6;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.95));
        }

        @keyframes iconWiggle {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.12) rotate(-6deg); }
            50% { transform: scale(0.95) rotate(4deg); }
            75% { transform: scale(1.08) rotate(6deg); }
        }

        .nav-item span {
            font-size: 11px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 0.2px;
        }
    </style>
</head>

                    <svg class="nav-svg-icon" viewBox="0 0 24 24">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        <polyline points="9 12 11 14 15 10"></polyline>
                    </svg>
                    <span>Admin</span>
                </button>
                <button class="nav-item" onclick="switchTab('support', this)">
                    <svg class="nav-svg-icon" viewBox="0 0 24 24">
                        <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                    </svg>
                    <span>Support</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        function goToMarket() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }
            document.getElementById('landingPage').classList.remove('active');
            document.getElementById('landingPage').classList.add('hidden');
            
            document.getElementById('marketPage').classList.remove('hidden');
            document.getElementById('marketPage').classList.add('active');
        }

        function switchTab(tabName, btn) {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.selectionChanged();
            }
            
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');

            document.querySelectorAll('.tab-view').forEach(view => view.classList.remove('active'));
            document.getElementById('view-' + tabName).classList.add('active');
        }
    </script>
</body>
</html>
