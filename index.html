<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACAZES LIVE — Registration</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 20px;
            position: relative;
        }

        /* Fon uchun premium SVG nuqtalar va chiziqlar */
        .bg-svg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.15;
        }

        /* ================= 1. ACAZES LIVE EKRANI ================= */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeOutSplash 0.6s ease 2.2s forwards;
        }

        .splash-title {
            font-family: 'Cinzel', serif;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 12px;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            animation: pulseTitle 1.5s infinite alternate;
        }

        @keyframes pulseTitle {
            0% { transform: scale(1); opacity: 0.85; }
            100% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 35px rgba(255, 20, 147, 0.6); }
        }

        @keyframes fadeOutSplash {
            to { opacity: 0; visibility: hidden; pointer-events: none; }
        }

        /* ================= 2. REGISTRATION BO'LIMI ================= */
        .reg-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 380px;
            background: rgba(18, 18, 20, 0.85);
            border: 1.5px solid #222225;
            border-radius: 24px;
            padding: 25px 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            animation: fadeInReg 0.8s ease 2.2s both;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @keyframes fadeInReg {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .reg-header {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 4px;
            text-align: center;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .reg-subtitle {
            font-size: 10px;
            letter-spacing: 2px;
            text-align: center;
            color: #888888;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        /* Profil rasmini tanlash */
        .avatar-upload-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .avatar-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #111115;
            border: 2px dashed #ff1493;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.2);
        }

        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .avatar-preview svg {
            width: 28px;
            height: 28px;
            stroke: #ff1493;
            fill: none;
            stroke-width: 2;
        }

        .avatar-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #aaaaaa;
            text-transform: uppercase;
        }

        #fileInput {
            display: none;
        }

        /* Inputlar va tanlovlar bloki */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-label {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #aaaaaa;
            text-transform: uppercase;
        }

        .custom-input {
            width: 100%;
            background: #0b0b0e;
            border: 1.5px solid #2b2b30;
            border-radius: 12px;
            padding: 12px 14px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            color: #ffffff;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .custom-input:focus {
            border-color: #ff1493;
            box-shadow: 0 0 10px rgba(255, 20, 147, 0.3);
        }

        .char-hint {
            font-size: 9px;
            color: #666666;
            text-align: right;
            font-weight: 700;
        }

        /* SVG Premium Sana va Yil Tanlash Grid */
        .date-select-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr;
            gap: 8px;
        }

        .select-wrapper {
            position: relative;
            background: #0b0b0e;
            border: 1.5px solid #2b2b30;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .select-wrapper select {
            width: 100%;
            background: transparent;
            border: none;
            padding: 11px 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            text-align: center;
        }

        .select-wrapper select option {
            background: #151518;
            color: #ffffff;
        }

        .select-wrapper::after {
            content: '▼';
            font-size: 8px;
            color: #ff1493;
            position: absolute;
            right: 10px;
            pointer-events: none;
        }

        /* ================= 3. TSADIQLASH TUGMASI (YONIB-O'CHUVCHI NEON) ================= */
        .submit-btn {
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 15px;
            border-radius: 14px;
            border: 2px solid #ffffff;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            margin-top: 5px;
            animation: neonMultiGlow 3s infinite alternate;
            transition: transform 0.15s ease;
        }

        .submit-btn:active {
            transform: scale(0.96);
        }

        @keyframes neonMultiGlow {
            0% {
                border-color: #ff1493;
                box-shadow: 0 0 10px rgba(255, 20, 147, 0.4), inset 0 0 10px rgba(255, 20, 147, 0.2);
            }
            33% {
                border-color: #ffffff;
                box-shadow: 0 0 12px rgba(255, 255, 255, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.2);
            }
            66% {
                border-color: #00ffff;
                box-shadow: 0 0 12px rgba(0, 255, 255, 0.4), inset 0 0 10px rgba(0, 255, 255, 0.2);
            }
            100% {
                border-color: #ff1493;
                box-shadow: 0 0 15px rgba(255, 20, 147, 0.6), inset 0 0 12px rgba(255, 20, 147, 0.3);
            }
        }
    </style>
</head>
<body>

    <!-- Fon SVG Naqshlari -->
    <svg class="bg-svg-pattern" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <defs>
            <pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse">
                <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.3"/>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#dotGrid)" />
    </svg>

    <!-- 1. ACAZES LIVE KIRISH EKRANI -->
    <div class="splash-screen" id="splashScreen">
        <div class="splash-title">ACAZES LIVE</div>
    </div>

    <!-- 2. REGISTRATION BO'LIMI -->
    <div class="reg-container" id="regContainer">
        <div>
            <div class="reg-header">RO'YXATDAN O'TISH</div>
            <div class="subtitle-select">Ma'lumotlaringizni kiriting</div>
        </div>

        <!-- Profil rasm yuklash -->
        <div class="avatar-upload-wrapper">
            <div class="avatar-preview" onclick="document.getElementById('fileInput').click()" id="avatarBox">
                <svg viewBox="0 0 24 24">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <img id="avatarImg" src="" alt="Avatar">
            </div>
            <span class="avatar-label">Profil rasm tanlash</span>
            <input type="file" id="fileInput" accept="image/*" onchange="previewAvatar(event)">
        </div>

        <!-- Nickname kiritish -->
        <div class="input-group">
            <label class="input-label">Nickname (Taxallus)</label>
            <input type="text" id="nicknameInput" class="custom-input" placeholder="Masalan: shohruz" maxlength="18" oninput="checkNickname()">
            <div class="char-hint" id="charHint">6 - 18 ta harf</div>
        </div>

        <!-- Tug'ilgan yil va sana (SVG Premium uslubida) -->
        <div class="input-group">
            <label class="input-label">Tug'ilgan sana va yil</label>
            <div class="date-select-grid">
                <div class="select-wrapper">
                    <select id="yearSelect">
                        <option value="" disabled selected>Yil</option>
                    </select>
                </div>
                <div class="select-wrapper">
                    <select id="monthSelect">
                        <option value="" disabled selected>Oy</option>
                        <option value="1">Yanvar</option>
                        <option value="2">Fevral</option>
                        <option value="3">Mart</option>
                        <option value="4">Aprel</option>
                        <option value="5">May</option>
                        <option value="6">Iyun</option>
                        <option value="7">Iyul</option>
                        <option value="8">Avgust</option>
                        <option value="9">Sentabr</option>
                        <option value="10">Oktabr</option>
                        <option value="11">Noyabr</option>
                        <option value="12">Dekabr</option>
                    </select>
                </div>
                <div class="select-wrapper">
                    <select id="daySelect">
                        <option value="" disabled selected>Kun</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- TSADIQLASH TUGMASI -->
        <button class="submit-btn" onclick="submitRegistration()">TSADIQLASH</button>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // Yillarni dinamik to'ldirish (2016 dan 1950 gacha)
        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2016; y >= 1950; y--) {
            let opt = document.createElement('option');
            opt.value = y;
            opt.innerText = y + "-yil";
            yearSelect.appendChild(opt);
        }

        // Kunlarni dinamik to'ldirish (1 dan 31 gacha)
        const daySelect = document.getElementById('daySelect');
        for (let d = 1; d <= 31; d++) {
            let opt = document.createElement('option');
            opt.value = d;
            opt.innerText = d + "-kun";
            daySelect.appendChild(opt);
        }

        // Galereyadan rasm tanlash va ko'rsatish
        function previewAvatar(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('avatarImg');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    document.querySelector('#avatarBox svg').style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        }

        // Nickname uzunligini tekshirish (6 tadan 18 tagacha)
        function checkNickname() {
            const val = document.getElementById('nicknameInput').value;
            const hint = document.getElementById('charHint');
            const len = val.length;

            if (len === 0) {
                hint.innerText = "6 - 18 ta harf";
                hint.style.color = "#666666";
            } else if (len < 6) {
                hint.innerText = `Yana ${6 - len} ta harf kiriting (${len}/18)`;
                hint.style.color = "#ff4d4d";
            } else if (len <= 18) {
                hint.innerText = `Ajoyib! (${len}/18)`;
                hint.style.color = "#00ffcc";
            } else {
                hint.innerText = "Ko'pi bilan 18 ta harf bo'lishi kerak!";
                hint.style.color = "#ff4d4d";
            }
        }

        // Tasdiqlash tugmasi bosilganda tekshiruv
        function submitRegistration() {
            const nickname = document.getElementById('nicknameInput').value.trim();
            const year = yearSelect.value;
            const month = document.getElementById('monthSelect').value;
            const day = daySelect.value;

            if (nickname.length < 6 || nickname.length > 18) {
                alert("Nickname kamida 6 tadan va ko'pi bilan 18 ta harfdan iborat bo'lishi kerak!");
                return;
            }

            if (!year || !month || !day) {
                alert("Iltimos, tug'ilgan sanangizni to'liq tanlang!");
                return;
            }

            alert(`Tabriklaymiz, ${nickname}! Ro'yxatdan muvaffaqiyatli o'tdingiz.`);
        }
    </script>
</body>
</html>
