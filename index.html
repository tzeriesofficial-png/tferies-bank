<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACAZES</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #000000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Support Premium SVG Stiker (Yuqori o'ng burchak) */
        .support-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: #0d0d0d;
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            width: 56px;
            height: 56px;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.15), inset 0 2px 6px rgba(255, 255, 255, 0.2);
            transition: transform 0.15s ease;
        }

        .support-btn.visible {
            display: flex;
        }

        .support-btn:active {
            transform: scale(0.9);
        }

        .support-svg-wrap {
            width: 36px;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: supportPremiumWiggle 2.4s infinite ease-in-out;
        }

        @keyframes supportPremiumWiggle {
            0%, 100% { transform: scale(1) rotate(0deg) translateY(0); filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.4)); }
            25% { transform: scale(1.16) rotate(-12deg) translateY(-2px); filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.8)); }
            50% { transform: scale(0.95) rotate(8deg) translateY(1px); }
            75% { transform: scale(1.1) rotate(-6deg) translateY(-1px); }
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.35s ease, transform 0.35s ease;
            z-index: 10;
        }

        .page.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.96);
        }

        .page.active {
            opacity: 1;
            transform: scale(1);
        }

        /* 1-Oyna: Landing */
        .landing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 45px;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .brand-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
        }

        .acazes-svg-logo {
            width: 240px;
            height: auto;
            overflow: visible;
        }

        @keyframes letterDrop {
            0% { opacity: 0; transform: translateY(-30px) scale(0.6); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .t-char {
            opacity: 0;
            transform-origin: center;
            fill: #ffffff;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.6));
        }

        .c-1 { animation: letterDrop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.1s forwards; }
        .c-2 { animation: letterDrop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.2s forwards; }
        .c-3 { animation: letterDrop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.3s forwards; }
        .c-4 { animation: letterDrop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.4s forwards; }
        .c-5 { animation: letterDrop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.5s forwards; }
        .c-6 { animation: letterDrop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.6s forwards; }

        .premium-badge-wrap {
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            animation: badgeEntrance 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.75s forwards,
                       badgeSuperMotion 2.8s ease-in-out 1.45s infinite;
        }

        @keyframes badgeEntrance {
            0% { opacity: 0; transform: scale(0) rotate(-90deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        @keyframes badgeSuperMotion {
            0%, 100% { transform: scale(1) rotate(0deg) translateY(0); filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.4)); }
            20% { transform: scale(1.18) rotate(12deg) translateY(-4px); filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.7)); }
            50% { transform: scale(0.95) rotate(-8deg) translateY(2px); }
            80% { transform: scale(1.02) rotate(5deg) translateY(0); }
        }

        .enter-btn {
            background: #ffffff;
            border: none;
            border-radius: 20px;
            padding: 16px 52px;
            color: #000000;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 4px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.25);
            opacity: 0;
            animation: btnFadeUp 0.6s ease 0.9s forwards;
            transition: transform 0.15s ease, background 0.2s ease;
        }

        @keyframes btnFadeUp {
            0% { opacity: 0; transform: translateY(25px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .enter-btn:active {
            transform: scale(0.94);
            background: #e2e8f0;
        }

        /* Market Konteyneri */
        .market-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 76px 16px 20px 16px;
        }

        .service-box {
            background: #0a0a0a;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 26px;
            padding: 22px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 390px;
            max-height: 620px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), inset 0 1px 3px rgba(255, 255, 255, 0.15);
            overflow-y: auto;
        }

        .box-header {
            font-size: 19px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }

        .box-desc {
            font-size: 12px;
            font-weight: 700;
            color: #a1a1aa;
            text-align: center;
            line-height: 1.4;
        }

        /* Kanallar ro'yxati */
        .channels-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .channel-card {
            background: #000000;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 11px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .channel-card:active {
            transform: scale(0.96);
            background: #171717;
        }

        .channel-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .channel-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            background: #111111;
        }

        .channel-title {
            font-size: 14.5px;
            font-weight: 900;
            color: #ffffff;
        }

        .channel-sub {
            font-size: 11px;
            font-weight: 700;
            color: #a1a1aa;
        }

        /* NFT / Gift Arenda Qismi */
        .rental-section {
            width: 100%;
            background: #000000;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .rental-title {
            font-size: 14px;
            font-weight: 900;
            color: #ffffff;
            text-align: center;
        }

        .rental-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111111;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .rental-time-val {
            font-size: 15px;
            font-weight: 900;
            color: #38bdf8;
        }

        .rental-price-val {
            font-size: 16px;
            font-weight: 900;
            color: #4ade80;
        }

        /* Uzun tayoqcha (Range Slider) */
        .range-slider {
            width: 100%;
            height: 10px;
            -webkit-appearance: none;
            appearance: none;
            background: #222222;
            outline: none;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
            transition: transform 0.1s;
        }

        .range-slider::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }

        .rent-action-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 14px;
            padding: 12px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
            transition: transform 0.15s, background 0.2s;
        }

        .rent-action-btn:active {
            transform: scale(0.96);
            background: #e2e8f0;
        }

        /* Qimirlab turuvchi galochka */
        .big-wiggle-badge {
            width: 22px;
            height: 22px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            animation: bigWiggle 2s infinite ease-in-out;
        }

        @keyframes bigWiggle {
            0%, 100% { transform: scale(1) rotate(0deg); }
            20% { transform: scale(1.25) rotate(-14deg); }
            40% { transform: scale(0.92) rotate(8deg); }
            60% { transform: scale(1.20) rotate(14deg); }
            80% { transform: scale(0.96) rotate(-6deg); }
        }
    </style>
</head>
<body>

    <!-- Tepadagi Support Stikeri (@FarzonaTurayeva ga o'tadi) -->
    <a id="supportBtn" href="https://t.me/FarzonaTurayeva" target="_blank" class="support-btn" onclick="hapticClick()" aria-label="Support">
        <div class="support-svg-wrap">
            <svg viewBox="0 0 48 48" width="36" height="36" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="premiumSupportGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="50%" stop-color="#e2e8f0"/>
                        <stop offset="100%" stop-color="#94a3b8"/>
                    </linearGradient>
                </defs>
                <path d="M24 3L29.5 7.5L36.5 6.8L38.8 13.5L44.5 17.5L42.5 24.3L44.5 31.1L38.8 35.1L36.5 41.8L29.5 41.1L24 45.6L18.5 41.1L11.5 41.8L9.2 35.1L3.5 31.1L5.5 24.3L3.5 17.5L9.2 13.5L11.5 6.8L18.5 7.5L24 3Z" fill="url(#premiumSupportGrad)" stroke="#ffffff" stroke-width="1.2"/>
                <path d="M16 25V22C16 17.5817 19.5817 14 24 14C28.4183 14 32 17.5817 32 22V25" fill="none" stroke="#000000" stroke-width="3.2" stroke-linecap="round"/>
                <rect x="13" y="23" width="5" height="8" rx="2.5" fill="#000000"/>
                <rect x="30" y="23" width="5" height="8" rx="2.5" fill="#000000"/>
                <path d="M32.5 30C32.5 32.5 30 34.5 26 34.5H23" fill="none" stroke="#000000" stroke-width="2.6" stroke-linecap="round"/>
            </svg>
        </div>
    </a>

    <!-- 1-OYNA: Landing -->
    <div id="landingPage" class="page active">
        <div class="landing-container">
            <div class="brand-row">
                <svg class="acazes-svg-logo" viewBox="0 0 240 70" xmlns="http://www.w3.org/2000/svg">
                    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" text-anchor="middle">
                        <text class="t-char c-1" x="20" y="52">A</text>
                        <text class="t-char c-2" x="58" y="52">C</text>
                        <text class="t-char c-3" x="96" y="52">A</text>
                        <text class="t-char c-4" x="134" y="52">Z</text>
                        <text class="t-char c-5" x="172" y="52">E</text>
                        <text class="t-char c-6" x="210" y="52">S</text>
                    </g>
                </svg>

                <div class="premium-badge-wrap">
                    <svg viewBox="0 0 48 48" width="40" height="40" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="whiteBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ffffff"/>
                                <stop offset="100%" stop-color="#cbd5e1"/>
                            </linearGradient>
                        </defs>
                        <path d="M24 4L28.6 7.8L34.5 7.1L36.5 12.7L41.5 16L39.8 21.8L41.5 27.6L36.5 30.9L34.5 36.5L28.6 35.8L24 39.6L19.4 35.8L13.5 36.5L11.5 30.9L6.5 27.6L8.2 21.8L6.5 16L11.5 12.7L13.5 7.1L19.4 7.8L24 4Z" fill="url(#whiteBadgeGrad)" stroke="#ffffff" stroke-width="1"/>
                        <polyline points="17 22.5 21.8 27.3 31.5 17.5" fill="none" stroke="#000000" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>

            <button class="enter-btn" onclick="goToMarket()">
                KIRISH
            </button>
        </div>
    </div>

    <!-- 2-OYNA: Asosiy Market -->
    <div id="marketPage" class="page hidden">
        <div class="market-container">
            <div class="service-box">
                <div class="box-header">
                    <span>ACAZES Xizmatlari</span>
                </div>
                <div class="box-desc">
                    Rasmiy kanallarimiz va NFT / Gift arenda xizmati.
                </div>
                
                <!-- Kanallar ro'yxati -->
                <div class="channels-list">
                    <!-- 1. Acazes Chat -->
                    <a href="https://t.me/acazes_chati" target="_blank" class="channel-card" onclick="hapticClick()">
                        <div class="channel-info">
                            <img src="https://t.me/i/userpic/320/acazes_chati.jpg" alt="Acazes Chat" class="channel-avatar" onerror="this.src='https://via.placeholder.com/44/000000/ffffff?text=Chat'">
                            <div>
                                <div class="channel-title">Acazes Chat</div>
                                <div class="channel-sub">@acazes_chati</div>
                            </div>
                        </div>
                        <div class="big-wiggle-badge">
                            <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 2L14.8 4.2L18.4 3.8L19.6 7.2L22.6 9.2L21.6 12.7L22.6 16.2L19.6 18.2L18.4 21.6L14.8 21.2L12 23.4L9.2 21.2L5.6 21.6L4.4 18.2L1.4 16.2L2.4 12.7L1.4 9.2L4.4 7.2L5.6 3.8L9.2 4.2L12 2Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
                                <polyline points="8.5 12.5 11 15 16 9.5" fill="none" stroke="#000000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                    </a>

                    <!-- 2. Acazes Kanali -->
                    <a href="https://t.me/acazes_kanali" target="_blank" class="channel-card" onclick="hapticClick()">
                        <div class="channel-info">
                            <img src="https://t.me/i/userpic/320/acazes_kanali.jpg" alt="Acazes Kanali" class="channel-avatar" onerror="this.src='https://via.placeholder.com/44/000000/ffffff?text=Kanal'">
                            <div>
                                <div class="channel-title">Acazes Kanali</div>
                                <div class="channel-sub">@acazes_kanali</div>
                            </div>
                        </div>
                        <div class="big-wiggle-badge">
                            <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 2L14.8 4.2L18.4 3.8L19.6 7.2L22.6 9.2L21.6 12.7L22.6 16.2L19.6 18.2L18.4 21.6L14.8 21.2L12 23.4L9.2 21.2L5.6 21.6L4.4 18.2L1.4 16.2L2.4 12.7L1.4 9.2L4.4 7.2L5.6 3.8L9.2 4.2L12 2Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
                                <polyline points="8.5 12.5 11 15 16 9.5" fill="none" stroke="#000000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                    </a>

                    <!-- 3. Acazes (Asosiy) -->
                    <a href="https://t.me/acazes" target="_blank" class="channel-card" onclick="hapticClick()">
                        <div class="channel-info">
                            <img src="https://t.me/i/userpic/320/acazes.jpg" alt="Acazes" class="channel-avatar" onerror="this.src='https://via.placeholder.com/44/000000/ffffff?text=Acazes'">
                            <div>
                                <div class="channel-title">Acazes Asosiy</div>
                                <div class="channel-sub">@acazes</div>
                            </div>
                        </div>
                        <div class="big-wiggle-badge">
                            <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 2L14.8 4.2L18.4 3.8L19.6 7.2L22.6 9.2L21.6 12.7L22.6 16.2L19.6 18.2L18.4 21.6L14.8 21.2L12 23.4L9.2 21.2L5.6 21.6L4.4 18.2L1.4 16.2L2.4 12.7L1.4 9.2L4.4 7.2L5.6 3.8L9.2 4.2L12 2Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
                                <polyline points="8.5 12.5 11 15 16 9.5" fill="none" stroke="#000000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                    </a>
                </div>

                <!-- NFT & Gift Arenda Tayoqchasi (Slider) -->
                <div class="rental-section">
                    <div class="rental-title">NFT / Gift Arenda Muddati</div>
                    <div class="rental-display">
                        <span id="rentalTime" class="rental-time-val">2 soat</span>
                        <span id="rentalPrice" class="rental-price-val">220 soʻm</span>
                    </div>
                    <!-- Uzun tayoqcha -->
                    <input type="range" id="rentalSlider" class="range-slider" min="0" max="4" step="1" value="0" oninput="updateRental(this.value)">
                    <a id="rentBtn" href="https://t.me/FarzonaTurayeva" target="_blank" class="rent-action-btn" onclick="hapticClick()">
                        Arendaga olish
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // Arenda ma'lumotlari
        const rentalData = [
            { time: "2 soat", price: "220 soʻm" },
            { time: "6 soat", price: "990 soʻm" },
            { time: "1 kunlik", price: "2 300 soʻm" },
            { time: "2 kunlik", price: "3 500 soʻm" },
            { time: "4 kunlik", price: "6 700 soʻm" }
        ];

        function updateRental(val) {
            hapticClick();
            const data = rentalData[val];
            document.getElementById('rentalTime').innerText = data.time;
            document.getElementById('rentalPrice').innerText = data.price;
        }

        function goToMarket() {
            hapticClick();
            document.getElementById('landingPage').classList.remove('active');
            document.getElementById('landingPage').classList.add('hidden');
            document.getElementById('marketPage').classList.remove('hidden');
            document.getElementById('marketPage').classList.add('active');
            
            document.getElementById('supportBtn').classList.add('visible');
        }

        function hapticClick() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }
        }
    </script>
</body>
</html>
