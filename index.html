<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACAZES — ASMR Kalkulyator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 15px;
            position: relative;
            transition: background-color 0.4s ease;
        }

        /* ================= 1. KIRISH EKRANI (IKKALA TARAFI OQ SVG SPLIT) ================= */
        .split-bg-svg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .splash-screen {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 390px;
            animation: fadeIn 0.5s ease;
        }

        .title-acazes {
            font-family: 'Cinzel', serif;
            font-size: 38px;
            letter-spacing: 12px;
            font-weight: 900;
            margin-bottom: 8px;
            text-transform: uppercase;
            color: #000000;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.15));
        }

        .subtitle-select {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 35px;
            font-weight: 800;
            color: #333333;
        }

        .gender-cards {
            display: flex;
            gap: 16px;
            width: 100%;
            justify-content: center;
        }

        .gender-card {
            flex: 1;
            max-width: 165px;
            padding: 26px 15px;
            border-radius: 22px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .gender-card:active {
            transform: scale(0.94);
        }

        /* Ikkala karta ham oq fonda qora dizaynda */
        .gender-card.male-card, .gender-card.female-card {
            background: #ffffff;
            border: 2.5px solid #000000;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
            color: #000000;
        }

        .gender-card.male-card svg, .gender-card.female-card svg {
            width: 54px;
            height: 54px;
            fill: none;
            stroke: #000000;
            stroke-width: 2.3;
        }

        .card-label {
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ================= 2. KALKULYATOR UMUMIY TUZILISHI ================= */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            display: none;
        }

        .calculator-wrapper {
            position: relative;
            z-index: 2;
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 380px;
            border-radius: 22px;
            padding: 20px;
            animation: fadeIn 0.4s ease-out;
        }

        .calc-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .calc-header {
            font-family: 'Cinzel', serif;
            font-size: 15px;
            letter-spacing: 4px;
            font-weight: 900;
        }

        .top-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-top-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 6px 10px;
            border-radius: 8px;
            text-transform: uppercase;
            transition: transform 0.15s ease;
        }

        .icon-top-btn:active {
            transform: scale(0.92);
        }

        .icon-top-btn svg {
            width: 14px;
            height: 14px;
        }

        .display-screen {
            width: 100%;
            height: 98px;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 18px;
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .prev-operand {
            font-size: 14px;
            height: 20px;
            line-height: 20px;
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
        }

        .prev-operand::-webkit-scrollbar {
            display: none;
        }

        .curr-operand {
            font-size: 34px;
            height: 44px;
            line-height: 44px;
            font-weight: 800;
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
        }

        .curr-operand::-webkit-scrollbar {
            display: none;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .calc-btn {
            border-radius: 14px;
            height: 62px;
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .calc-btn:active {
            transform: scale(0.91);
        }

        .calc-btn.zero-btn {
            grid-column: span 2;
        }

        .calc-btn.equals {
            grid-column: span 2;
            font-size: 28px;
        }

        /* ================= JENSKIY TEMA (PUSHTI) ================= */
        body.theme-female {
            background-color: #14030c;
        }

        body.theme-female .calculator-wrapper {
            background: rgba(32, 6, 20, 0.95);
            border: 1.5px solid #ff1493;
            box-shadow: 0 0 35px rgba(255, 20, 147, 0.4);
        }

        body.theme-female .calc-header {
            color: #ff69b4;
        }

        body.theme-female .icon-top-btn {
            color: #ff69b4;
            border: 1px solid #8b0046;
            background: rgba(255, 20, 147, 0.12);
        }

        body.theme-female .icon-top-btn svg {
            stroke: #ff69b4;
            fill: none;
        }

        body.theme-female .display-screen {
            background-color: #0d0208;
            border: 1px solid #8b0046;
            box-shadow: inset 0 0 15px rgba(255, 20, 147, 0.25);
        }

        body.theme-female .prev-operand {
            color: #b34781;
        }

        body.theme-female .curr-operand {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.7);
        }

        body.theme-female .calc-btn {
            background-color: #210715;
            border: 1px solid #8b0046;
            color: #ffb6c1;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        body.theme-female .calc-btn:active {
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.6);
            border-color: #ff69b4;
        }

        body.theme-female .calc-btn.operator {
            background-color: #380922;
            border-color: #ff1493;
            color: #ff1493;
            font-size: 26px;
        }

        body.theme-female .calc-btn.clear {
            background-color: #2b071a;
            color: #ff69b4;
            font-size: 18px;
        }

        body.theme-female .calc-btn.equals {
            background: linear-gradient(135deg, #c70067 0%, #ff1493 100%);
            border: 1px solid #ff1493;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.6);
        }

        /* ================= MUJISKOY TEMA (OQ FON & QORA TUGMALAR) ================= */
        body.theme-male {
            background-color: #ffffff;
        }

        body.theme-male .calculator-wrapper {
            background: #f5f5f7;
            border: 2px solid #000000;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.18);
        }

        body.theme-male .calc-header {
            color: #000000;
        }

        body.theme-male .icon-top-btn {
            color: #000000;
            border: 1.5px solid #000000;
            background: #ffffff;
        }

        body.theme-male .icon-top-btn svg {
            stroke: #000000;
            fill: none;
        }

        body.theme-male .display-screen {
            background-color: #ffffff;
            border: 2px solid #000000;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        body.theme-male .prev-operand {
            color: #555555;
            font-weight: 700;
        }

        body.theme-male .curr-operand {
            color: #000000;
        }

        body.theme-male .calc-btn {
            background-color: #0a0a0a;
            border: 1px solid #000000;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        body.theme-male .calc-btn:active {
            background-color: #2b2b2b;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
        }

        body.theme-male .calc-btn.operator {
            background-color: #1c1c1e;
            border: 1.5px solid #000000;
            color: #ffffff;
            font-size: 26px;
        }

        body.theme-male .calc-btn.clear {
            background-color: #262626;
            color: #e0e0e0;
            font-size: 18px;
        }

        body.theme-male .calc-btn.equals {
            background: #000000;
            border: 1.5px solid #000000;
            color: #ffffff;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.35);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Kirish ekrani uchun ikkala tarafi ham OQ rangdagi SVG split fon -->
    <svg class="split-bg-svg" id="splitBgSvg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs>
            <linearGradient id="whiteSideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="100%" stop-color="#f0f0f5"/>
            </linearGradient>
            <pattern id="splitDots" width="5" height="5" patternUnits="userSpaceOnUse">
                <circle cx="1" cy="1" r="0.25" fill="#000000" fill-opacity="0.12"/>
            </pattern>
        </defs>
        <!-- Ikkala tomoni ham toza Oq -->
        <polygon points="0,0 100,0 100,100 0,100" fill="url(#whiteSideGrad)"/>
        <!-- Nozik nuqtali tekstura -->
        <rect width="100" height="100" fill="url(#splitDots)"/>
        <!-- Markaziy yupqa ajratuvchi chiziq -->
        <line x1="50" y1="0" x2="50" y2="100" stroke="#000000" stroke-width="0.3" stroke-opacity="0.2"/>
    </svg>

    <!-- Kalkulyator ochilganda ko'rinadigan fon naqshlari -->
    <svg class="bg-pattern" id="bgSvg" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <defs>
            <pattern id="gridPattern" width="35" height="35" patternUnits="userSpaceOnUse">
                <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.1"/>
                <circle cx="0" cy="0" r="1.2" fill="#ffffff" fill-opacity="0.2"/>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#gridPattern)" />
    </svg>

    <!-- 1. KIRISH VA TANLOV EKRANI (ACAZES) -->
    <div class="splash-screen" id="splashScreen">
        <div class="title-acazes">ACAZES</div>
        <div class="subtitle-select">Rejimni tanlang</div>

        <div class="gender-cards">
            <!-- Mujiskoy SVG Premium tugma -->
            <div class="gender-card male-card" onclick="selectMode('male')">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="10" cy="14" r="6"></circle>
                    <line x1="14.5" y1="9.5" x2="20" y2="4"></line>
                    <polyline points="15 4 20 4 20 9"></polyline>
                </svg>
                <span class="card-label">MUJISKOY</span>
            </div>

            <!-- Jenskiy SVG Premium tugma -->
            <div class="gender-card female-card" onclick="selectMode('female')">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="9" r="6"></circle>
                    <line x1="12" y1="15" x2="12" y2="22"></line>
                    <line x1="9" y1="19" x2="15" y2="19"></line>
                </svg>
                <span class="card-label">JENSKIY</span>
            </div>
        </div>
    </div>

    <!-- 2. KALKULYATOR EKRANI -->
    <div class="calculator-wrapper" id="calcApp">
        <div class="calc-top-bar">
            <div class="calc-header">ACAZES</div>
            <div class="top-controls">
                <!-- ASMR Ovozni yoqish/o'chirish tugmasi -->
                <button class="icon-top-btn" id="soundToggleBtn" onclick="toggleSound()" title="ASMR Ovoz">
                    <svg id="soundIconOn" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    </svg>
                    <svg id="soundIconOff" style="display: none;" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <line x1="23" y1="9" x2="17" y2="15"></line>
                        <line x1="17" y1="9" x2="23" y2="15"></line>
                    </svg>
                </button>

                <!-- Rejimni o'zgartirish tugmasi -->
                <button class="icon-top-btn" onclick="goBackToSelection()">
                    <svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    <span>REJIM</span>
                </button>
            </div>
        </div>
        
        <div class="display-screen">
            <div class="prev-operand" id="prevOperand"></div>
            <div class="curr-operand" id="currOperand">0</div>
        </div>

        <div class="buttons-grid">
            <button class="calc-btn clear" onclick="clearDisplay()">AC</button>
            <button class="calc-btn clear" onclick="deleteLast()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                    <line x1="18" y1="9" x2="12" y2="15"></line>
                    <line x1="12" y1="9" x2="18" y2="15"></line>
                </svg>
            </button>
            <button class="calc-btn operator" onclick="chooseOperation('÷')">÷</button>
            <button class="calc-btn operator" onclick="chooseOperation('×')">×</button>

            <button class="calc-btn" onclick="appendNumber('7')">7</button>
            <button class="calc-btn" onclick="appendNumber('8')">8</button>
            <button class="calc-btn" onclick="appendNumber('9')">9</button>
            <button class="calc-btn operator" onclick="chooseOperation('-')">−</button>

            <button class="calc-btn" onclick="appendNumber('4')">4</button>
            <button class="calc-btn" onclick="appendNumber('5')">5</button>
            <button class="calc-btn" onclick="appendNumber('6')">6</button>
            <button class="calc-btn operator" onclick="chooseOperation('+')">+</button>

            <button class="calc-btn" onclick="appendNumber('1')">1</button>
            <button class="calc-btn" onclick="appendNumber('2')">2</button>
            <button class="calc-btn" onclick="appendNumber('3')">3</button>
            <button class="calc-btn" onclick="appendNumber('.')">.</button>

            <!-- Faqat 1 ta 0 va = tugmasi -->
            <button class="calc-btn zero-btn" onclick="appendNumber('0')">0</button>
            <button class="calc-btn equals" onclick="compute()">=</button>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // ================= ASMR "SUV BULQ" OVOZ SINTEZATORI =================
        let audioCtx = null;
        let isSoundEnabled = true;
        let currentThemeMode = 'female';

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleSound() {
            isSoundEnabled = !isSoundEnabled;
            document.getElementById('soundIconOn').style.display = isSoundEnabled ? 'block' : 'none';
            document.getElementById('soundIconOff').style.display = isSoundEnabled ? 'none' : 'block';
            if (isSoundEnabled) playWaterBubble('normal');
        }

        // Real suvning "bulq" (water bubble / drop pop) ASMR tovushi
        function playWaterBubble(type = 'normal') {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred(type === 'equals' ? 'medium' : 'light');
            }

            if (!isSoundEnabled) return;
            initAudio();

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';

            if (type === 'equals') {
                // Teng (=) bosilganda suv tomchisi va qo'shaloq "bulq" akkordi
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
                osc.frequency.exponentialRampToValueAtTime(1100, now + 0.15);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.3, now + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.22);
                return;
            }

            if (type === 'clear') {
                // Tozalash (AC / Backspace) yumshoq suv oqimi tovushi
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(180, now + 0.09);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.25, now + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            } else {
                // Suvning o'ziga xos chuqur va yoqimli "bulq" (bubble pop) effekti
                // Frekans pastdan yuqoriga tez ko'tarilib tushadi (suv pufakchasi yorilishi)
                const startFreq = currentThemeMode === 'female' ? 420 : 320;
                const peakFreq = currentThemeMode === 'female' ? 980 : 760;
                const endFreq = currentThemeMode === 'female' ? 600 : 450;

                osc.frequency.setValueAtTime(startFreq, now);
                osc.frequency.exponentialRampToValueAtTime(peakFreq, now + 0.04);
                osc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.08);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.32, now + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
            }

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.09);
        }

        // ================= REJIM VA EKRAN BOSHQARUVI =================
        const splashScreen = document.getElementById('splashScreen');
        const splitBgSvg = document.getElementById('splitBgSvg');
        const bgSvg = document.getElementById('bgSvg');
        const calcApp = document.getElementById('calcApp');
        const gridPattern = document.getElementById('gridPattern');

        function selectMode(mode) {
            currentThemeMode = mode;
            playWaterBubble('equals');

            document.body.classList.remove('theme-male', 'theme-female');
            splitBgSvg.style.display = 'none';
            bgSvg.style.display = 'block';
            
            if (mode === 'male') {
                document.body.classList.add('theme-male');
                gridPattern.innerHTML = `
                    <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#000000" stroke-width="0.6" stroke-opacity="0.08"/>
                    <circle cx="0" cy="0" r="1.2" fill="#000000" fill-opacity="0.18"/>
                `;
            } else {
                document.body.classList.add('theme-female');
                gridPattern.innerHTML = `
                    <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#ff1493" stroke-width="0.6" stroke-opacity="0.22"/>
                    <circle cx="0" cy="0" r="1.2" fill="#ff69b4" fill-opacity="0.35"/>
                `;
            }

            splashScreen.style.display = 'none';
            calcApp.style.display = 'flex';
        }

        function goBackToSelection() {
            playWaterBubble('clear');
            document.body.classList.remove('theme-male', 'theme-female');
            bgSvg.style.display = 'none';
            splitBgSvg.style.display = 'block';
            calcApp.style.display = 'none';
            splashScreen.style.display = 'flex';
        }

        // ================= KALKULYATOR LOGIKASI =================
        let currentOperand = '0';
        let previousOperand = '';
        let operation = undefined;

        const currDisplay = document.getElementById('currOperand');
        const prevDisplay = document.getElementById('prevOperand');

        function adjustFontSize() {
            const len = currentOperand.toString().length;
            if (len > 15) {
                currDisplay.style.fontSize = '20px';
            } else if (len > 11) {
                currDisplay.style.fontSize = '26px';
            } else {
                currDisplay.style.fontSize = '34px';
            }
        }

        function updateDisplay() {
            currDisplay.innerText = currentOperand;
            adjustFontSize();
            currDisplay.scrollLeft = currDisplay.scrollWidth;

            if (operation != null) {
                prevDisplay.innerText = `${previousOperand} ${operation}`;
            } else {
                prevDisplay.innerText = '';
            }
        }

        function appendNumber(number) {
            playWaterBubble('normal');
            if (number === '.' && currentOperand.toString().includes('.')) return;
            if (currentOperand === '0' && number !== '.') {
                currentOperand = number.toString();
            } else {
                currentOperand = currentOperand.toString() + number.toString();
            }
            updateDisplay();
        }

        function chooseOperation(op) {
            playWaterBubble('normal');
            if (currentOperand === '') return;
            if (previousOperand !== '') {
                compute(false);
            }
            operation = op;
            previousOperand = currentOperand;
            currentOperand = '';
            updateDisplay();
        }

        function compute(playSound = true) {
            if (playSound) playWaterBubble('equals');
            let computation;
            const prev = parseFloat(previousOperand);
            const current = parseFloat(currentOperand);
            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+':
                    computation = prev + current;
                    break;
                case '-':
                    computation = prev - current;
                    break;
                case '×':
                    computation = prev * current;
                    break;
                case '÷':
                    if (current === 0) {
                        currentOperand = 'Xato';
                        previousOperand = '';
                        operation = undefined;
                        updateDisplay();
                        return;
                    }
                    computation = prev / current;
                    break;
                default:
                    return;
            }

            currentOperand = Math.round(computation * 100000000) / 100000000;
            operation = undefined;
            previousOperand = '';
            updateDisplay();
        }

        function clearDisplay() {
            playWaterBubble('clear');
            currentOperand = '0';
            previousOperand = '';
            operation = undefined;
            updateDisplay();
        }

        function deleteLast() {
            playWaterBubble('clear');
            if (currentOperand === 'Xato') {
                clearDisplay();
                return;
            }
            currentOperand = currentOperand.toString().slice(0, -1);
            if (currentOperand === '' || currentOperand === '-') {
                currentOperand = '0';
            }
            updateDisplay();
        }
    </script>
</body>
