<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACAZES — Kalkulyator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #080808;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 15px;
            position: relative;
            transition: background-color 0.4s ease;
        }

        /* Orqa fon SVG naqshlari */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        /* ================= 1. KIRISH VA TANLOV EKRANI (ACAZES) ================= */
        .splash-screen {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 380px;
            animation: fadeIn 0.6s ease;
        }

        .title-acazes {
            font-family: 'Cinzel', serif;
            font-size: 36px;
            letter-spacing: 12px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: 900;
        }

        .subtitle-select {
            font-size: 11px;
            letter-spacing: 3px;
            color: #888888;
            text-transform: uppercase;
            margin-bottom: 35px;
            font-weight: 700;
        }

        .gender-cards {
            display: flex;
            gap: 18px;
            width: 100%;
            justify-content: center;
        }

        .gender-card {
            flex: 1;
            max-width: 165px;
            padding: 25px 15px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .gender-card:active {
            transform: scale(0.95);
        }

        /* Mujiskoy tanlov kartasi */
        .gender-card.male-card {
            background: linear-gradient(145deg, #ffffff 0%, #e6e6e6 100%);
            border: 2px solid #000000;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.15);
            color: #000000;
        }

        .gender-card.male-card svg {
            width: 54px;
            height: 54px;
            fill: none;
            stroke: #000000;
            stroke-width: 2.2;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.25));
        }

        /* Jenskiy tanlov kartasi */
        .gender-card.female-card {
            background: linear-gradient(145deg, #1f0514 0%, #0d0208 100%);
            border: 2px solid #ff1493;
            box-shadow: 0 10px 25px rgba(255, 20, 147, 0.35);
            color: #ff69b4;
        }

        .gender-card.female-card svg {
            width: 54px;
            height: 54px;
            fill: none;
            stroke: #ff1493;
            stroke-width: 2.2;
            filter: drop-shadow(0 0 10px #ff1493);
        }

        .card-label {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ================= 2. KALKULYATOR UMUMIY TUZILISHI ================= */
        .calculator-wrapper {
            position: relative;
            z-index: 2;
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 380px;
            border-radius: 22px;
            padding: 20px;
            animation: fadeIn 0.4s ease-out;
            transition: all 0.3s ease;
        }

        .calc-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .calc-header {
            font-family: 'Cinzel', serif;
            font-size: 15px;
            letter-spacing: 4px;
            font-weight: 900;
        }

        .switch-mode-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 6px 10px;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .switch-mode-btn svg {
            width: 14px;
            height: 14px;
        }

        /* Displey ekrani - balandligi qat'iy o'zgarmaydi */
        .display-screen {
            width: 100%;
            height: 98px; /* Qat'iy balandlik - pastga tushib ketmaydi */
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 18px;
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .prev-operand {
            font-size: 14px;
            height: 20px;
            line-height: 20px;
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
        }

        .prev-operand::-webkit-scrollbar {
            display: none;
        }

        .curr-operand {
            font-size: 34px;
            height: 44px;
            line-height: 44px;
            font-weight: 800;
            white-space: nowrap; /* Hech qachon yangi qatorga tushmaydi */
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
        }

        .curr-operand::-webkit-scrollbar {
            display: none;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .calc-btn {
            border-radius: 14px;
            height: 62px;
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.12s ease, background-color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .calc-btn:active {
            transform: scale(0.94);
        }

        .calc-btn.equals {
            grid-column: span 2;
            font-size: 28px;
        }

        /* ================= JENSKIY TEMA (PUSHTI & QORA) ================= */
        body.theme-female {
            background-color: #0d0208;
        }

        body.theme-female .calculator-wrapper {
            background: rgba(26, 5, 17, 0.94);
            border: 1.5px solid #ff1493;
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.35);
        }

        body.theme-female .calc-header {
            color: #ff69b4;
        }

        body.theme-female .switch-mode-btn {
            color: #ff69b4;
            border: 1px solid #8b0046;
            background: rgba(255, 20, 147, 0.1);
        }

        body.theme-female .switch-mode-btn svg {
            stroke: #ff69b4;
            fill: none;
        }

        body.theme-female .display-screen {
            background-color: #0d0208;
            border: 1px solid #8b0046;
            box-shadow: inset 0 0 15px rgba(255, 20, 147, 0.2);
        }

        body.theme-female .prev-operand {
            color: #b34781;
        }

        body.theme-female .curr-operand {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.7);
        }

        body.theme-female .calc-btn {
            background-color: #1f0614;
            border: 1px solid #8b0046;
            color: #ffb6c1;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        body.theme-female .calc-btn.operator {
            background-color: #360921;
            border-color: #ff1493;
            color: #ff1493;
            font-size: 26px;
        }

        body.theme-female .calc-btn.clear {
            background-color: #2b071a;
            color: #ff69b4;
            font-size: 18px;
        }

        body.theme-female .calc-btn.equals {
            background: linear-gradient(135deg, #c70067 0%, #ff1493 100%);
            border: 1px solid #ff69b4;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.6);
        }

        /* ================= MUJISKOY TEMA (OQ FON & QORA TUGMALAR) ================= */
        body.theme-male {
            background-color: #ffffff;
        }

        body.theme-male .calculator-wrapper {
            background: #f5f5f7;
            border: 2px solid #000000;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.18);
        }

        body.theme-male .calc-header {
            color: #000000;
        }

        body.theme-male .switch-mode-btn {
            color: #000000;
            border: 1.5px solid #000000;
            background: #ffffff;
        }

        body.theme-male .switch-mode-btn svg {
            stroke: #000000;
            fill: none;
        }

        body.theme-male .display-screen {
            background-color: #ffffff;
            border: 2px solid #000000;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        body.theme-male .prev-operand {
            color: #555555;
            font-weight: 700;
        }

        body.theme-male .curr-operand {
            color: #000000;
        }

        body.theme-male .calc-btn {
            background-color: #0a0a0a;
            border: 1px solid #000000;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        body.theme-male .calc-btn:active {
            background-color: #2b2b2b;
        }

        body.theme-male .calc-btn.operator {
            background-color: #1c1c1e;
            border: 1.5px solid #000000;
            color: #ffffff;
            font-size: 26px;
        }

        body.theme-male .calc-btn.clear {
            background-color: #262626;
            color: #e0e0e0;
            font-size: 18px;
        }

        body.theme-male .calc-btn.equals {
            background: #000000;
            border: 1.5px solid #000000;
            color: #ffffff;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.35);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- SVG Orqa fon naqshlari -->
    <svg class="bg-pattern" id="bgSvg" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <defs>
            <pattern id="gridPattern" width="35" height="35" patternUnits="userSpaceOnUse">
                <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.1"/>
                <circle cx="0" cy="0" r="1.2" fill="#ffffff" fill-opacity="0.2"/>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#gridPattern)" />
    </svg>

    <!-- 1. KIRISH VA TANLOV EKRANI (ACAZES) -->
    <div class="splash-screen" id="splashScreen">
        <div class="title-acazes">ACAZES</div>
        <div class="subtitle-select">Rejimni tanlang</div>

        <div class="gender-cards">
            <!-- Mujiskoy SVG Premium tugma -->
            <div class="gender-card male-card" onclick="selectMode('male')">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="10" cy="14" r="6"></circle>
                    <line x1="14.5" y1="9.5" x2="20" y2="4"></line>
                    <polyline points="15 4 20 4 20 9"></polyline>
                </svg>
                <span class="card-label">MUJISKOY</span>
            </div>

            <!-- Jenskiy SVG Premium tugma -->
            <div class="gender-card female-card" onclick="selectMode('female')">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="9" r="6"></circle>
                    <line x1="12" y1="15" x2="12" y2="22"></line>
                    <line x1="9" y1="19" x2="15" y2="19"></line>
                </svg>
                <span class="card-label">JENSKIY</span>
            </div>
        </div>
    </div>

    <!-- 2. KALKULYATOR EKRANI -->
    <div class="calculator-wrapper" id="calcApp">
        <div class="calc-top-bar">
            <div class="calc-header">ACAZES</div>
            <button class="switch-mode-btn" onclick="goBackToSelection()">
                <svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                <span>REJIM</span>
            </button>
        </div>
        
        <div class="display-screen">
            <div class="prev-operand" id="prevOperand"></div>
            <div class="curr-operand" id="currOperand">0</div>
        </div>

        <div class="buttons-grid">
            <button class="calc-btn clear" onclick="clearDisplay()">AC</button>
            <button class="calc-btn clear" onclick="deleteLast()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                    <line x1="18" y1="9" x2="12" y2="15"></line>
                    <line x1="12" y1="9" x2="18" y2="15"></line>
                </svg>
            </button>
            <button class="calc-btn operator" onclick="chooseOperation('÷')">÷</button>
            <button class="calc-btn operator" onclick="chooseOperation('×')">×</button>

            <button class="calc-btn" onclick="appendNumber('7')">7</button>
            <button class="calc-btn" onclick="appendNumber('8')">8</button>
            <button class="calc-btn" onclick="appendNumber('9')">9</button>
            <button class="calc-btn operator" onclick="chooseOperation('-')">−</button>

            <button class="calc-btn" onclick="appendNumber('4')">4</button>
            <button class="calc-btn" onclick="appendNumber('5')">5</button>
            <button class="calc-btn" onclick="appendNumber('6')">6</button>
            <button class="calc-btn operator" onclick="chooseOperation('+')">+</button>

            <button class="calc-btn" onclick="appendNumber('1')">1</button>
            <button class="calc-btn" onclick="appendNumber('2')">2</button>
            <button class="calc-btn" onclick="appendNumber('3')">3</button>
            <button class="calc-btn" onclick="appendNumber('.')">.</button>

            <button class="calc-btn" onclick="appendNumber('0')">0</button>
            <button class="calc-btn" onclick="appendNumber('00')">00</button>
            <button class="calc-btn equals" onclick="compute()">=</button>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const splashScreen = document.getElementById('splashScreen');
        const calcApp = document.getElementById('calcApp');
        const gridPattern = document.getElementById('gridPattern');

        // Rejimni tanlash (Mujiskoy yoki Jenskiy)
        function selectMode(mode) {
            document.body.classList.remove('theme-male', 'theme-female');
            
            if (mode === 'male') {
                document.body.classList.add('theme-male');
                gridPattern.innerHTML = `
                    <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#000000" stroke-width="0.6" stroke-opacity="0.1"/>
                    <circle cx="0" cy="0" r="1.2" fill="#000000" fill-opacity="0.2"/>
                `;
            } else {
                document.body.classList.add('theme-female');
                gridPattern.innerHTML = `
                    <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#ff1493" stroke-width="0.6" stroke-opacity="0.2"/>
                    <circle cx="0" cy="0" r="1.2" fill="#ff69b4" fill-opacity="0.35"/>
                `;
            }

            splashScreen.style.display = 'none';
            calcApp.style.display = 'flex';
        }

        // Orqaga rejim tanlashga qaytish
        function goBackToSelection() {
            document.body.classList.remove('theme-male', 'theme-female');
            gridPattern.innerHTML = `
                <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.1"/>
                <circle cx="0" cy="0" r="1.2" fill="#ffffff" fill-opacity="0.2"/>
            `;
            calcApp.style.display = 'none';
            splashScreen.style.display = 'flex';
        }

        // Kalkulyator logikasi
        let currentOperand = '0';
        let previousOperand = '';
        let operation = undefined;

        const currDisplay = document.getElementById('currOperand');
        const prevDisplay = document.getElementById('prevOperand');

        function adjustFontSize() {
            const len = currentOperand.toString().length;
            if (len > 15) {
                currDisplay.style.fontSize = '20px';
            } else if (len > 11) {
                currDisplay.style.fontSize = '26px';
            } else {
                currDisplay.style.fontSize = '34px';
            }
        }

        function updateDisplay() {
            currDisplay.innerText = currentOperand;
            adjustFontSize();
            currDisplay.scrollLeft = currDisplay.scrollWidth;

            if (operation != null) {
                prevDisplay.innerText = `${previousOperand} ${operation}`;
            } else {
                prevDisplay.innerText = '';
            }
        }

        function appendNumber(number) {
            if (number === '.' && currentOperand.toString().includes('.')) return;
            if (currentOperand === '0' && number !== '.') {
                if (number === '00') return;
                currentOperand = number.toString();
            } else {
                currentOperand = currentOperand.toString() + number.toString();
            }
            updateDisplay();
        }

        function chooseOperation(op) {
            if (currentOperand === '') return;
            if (previousOperand !== '') {
                compute();
            }
            operation = op;
            previousOperand = currentOperand;
            currentOperand = '';
            updateDisplay();
        }

        function compute() {
            let computation;
            const prev = parseFloat(previousOperand);
            const current = parseFloat(currentOperand);
            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+':
                    computation = prev + current;
                    break;
                case '-':
                    computation = prev - current;
                    break;
                case '×':
                    computation = prev * current;
                    break;
                case '÷':
                    if (current === 0) {
                        currentOperand = 'Xato';
                        previousOperand = '';
                        operation = undefined;
                        updateDisplay();
                        return;
                    }
                    computation = prev / current;
                    break;
                default:
                    return;
            }

            currentOperand = Math.round(computation * 100000000) / 100000000;
            operation = undefined;
            previousOperand = '';
            updateDisplay();
        }

        function clearDisplay() {
            currentOperand = '0';
            previousOperand = '';
            operation = undefined;
            updateDisplay();
        }

        function deleteLast() {
            if (currentOperand === 'Xato') {
                clearDisplay();
                return;
            }
            currentOperand = currentOperand.toString().slice(0, -1);
            if (currentOperand === '' || currentOperand === '-') {
                currentOperand = '0';
            }
            updateDisplay();
        }
    </script>
</body>
</html>
