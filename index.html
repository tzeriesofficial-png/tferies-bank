<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACAZES</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .page.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.96);
        }

        .page.active {
            opacity: 1;
            transform: scale(1);
        }

        /* 1-Oyna: Landing */
        .landing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 45px;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            z-index: 10;
        }

        .brand-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
        }

        .acazes-svg-logo {
            width: 240px;
            height: auto;
            overflow: visible;
        }

        @keyframes letterDrop {
            0% {
                opacity: 0;
                transform: translateY(-30px) scale(0.6);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .t-char {
            opacity: 0;
            transform-origin: center;
        }

        .c-1 { animation: letterDrop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.1s forwards; }
        .c-2 { animation: letterDrop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.2s forwards; }
        .c-3 { animation: letterDrop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.3s forwards; }
        .c-4 { animation: letterDrop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.4s forwards; }
        .c-5 { animation: letterDrop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.5s forwards; }
        .c-6 { animation: letterDrop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.6s forwards; }

        .premium-badge-wrap {
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            animation: badgeEntrance 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.75s forwards,
                       badgeSuperMotion 2.8s ease-in-out 1.45s infinite;
        }

        @keyframes badgeEntrance {
            0% { opacity: 0; transform: scale(0) rotate(-90deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        @keyframes badgeSuperMotion {
            0%, 100% { transform: scale(1) rotate(0deg) translateY(0); filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.2)); }
            20% { transform: scale(1.18) rotate(12deg) translateY(-4px); filter: drop-shadow(0 0 12px rgba(0, 0, 0, 0.3)); }
            50% { transform: scale(0.95) rotate(-8deg) translateY(2px); }
            80% { transform: scale(1.02) rotate(5deg) translateY(0); }
        }

        .enter-btn {
            background: #000000;
            border: none;
            border-radius: 20px;
            padding: 16px 52px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            opacity: 0;
            animation: btnFadeUp 0.6s ease 0.9s forwards;
            transition: transform 0.15s ease, background 0.2s ease;
        }

        @keyframes btnFadeUp {
            0% { opacity: 0; transform: translateY(25px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .enter-btn:active {
            transform: scale(0.94);
            background: #222222;
        }

        /* 2-Oyna: Market */
        .market-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px 16px 16px 16px;
            z-index: 10;
        }

        .stars-box {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 26px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            max-width: 360px;
            margin: auto;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.08);
        }

        .stars-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 19px;
            font-weight: 900;
            color: #0f172a;
        }

        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
        }

        .input-group label {
            font-size: 11.5px;
            font-weight: 700;
            color: #475569;
        }

        .stars-input {
            width: 100%;
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 14px;
            padding: 12px 14px;
            color: #0f172a;
            font-size: 16px;
            font-weight: 800;
            outline: none;
            text-align: center;
        }

        .preset-prices {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            width: 100%;
        }

        .preset-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 8px;
            color: #0f172a;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s;
        }

        .preset-btn:hover {
            background: #f1f5f9;
        }

        .price-display {
            font-size: 15px;
            font-weight: 900;
            color: #0f172a;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 10px 14px;
            border-radius: 12px;
            width: 100%;
            text-align: center;
        }

        .buy-action-btn {
            background: #000000;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            width: 100%;
            text-align: center;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
            transition: transform 0.15s ease;
        }

        .buy-action-btn:active {
            transform: scale(0.96);
        }

        /* 5 ta Ikonkali Pastki Navigatsiya Panel */
        .bottom-nav {
            width: 100%;
            max-width: 380px;
            height: 76px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 22px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 6px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            flex-shrink: 0;
        }

        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            width: 20%;
            height: 100%;
            opacity: 0.65;
            transition: all 0.25s ease;
        }

        .nav-item.active {
            opacity: 1;
            transform: translateY(-2px);
        }

        .nav-item.active span {
            color: #000000;
            font-weight: 900;
        }

        .nav-svg-wrap {
            width: 28px;
            height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 3px;
            animation: iconWiggle 2s infinite ease-in-out;
        }

        @keyframes iconWiggle {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.18) rotate(-10deg); }
            50% { transform: scale(0.92) rotate(6deg); }
            75% { transform: scale(1.12) rotate(8deg); }
        }

        .nav-item span {
            font-size: 10.5px;
            font-weight: 800;
            color: #000000;
        }

        /* Modal oynalar (Dilerlar ro'yxati) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 26px;
            width: 90%;
            max-width: 350px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            transform: scale(0.85);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.open .modal-content {
            transform: scale(1);
        }

        .modal-title {
            font-size: 16px;
            font-weight: 900;
            color: #0f172a;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .dealers-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .dealer-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .dealer-card:active {
            transform: scale(0.97);
            background: #f1f5f9;
        }

        .dealer-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dealer-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #cbd5e1;
            background: #e2e8f0;
        }

        .dealer-text {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .dealer-name-row {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dealer-name {
            font-size: 14.5px;
            font-weight: 900;
            color: #0f172a;
        }

        .dealer-username {
            font-size: 11.5px;
            font-weight: 700;
            color: #64748b;
        }

        .dealer-action-badge {
            font-size: 11px;
            font-weight: 800;
            background: #000000;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 10px;
        }

        .close-modal-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            padding: 11px;
            color: #0f172a;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            margin-top: 4px;
            transition: background 0.2s;
        }

        .close-modal-btn:active {
            background: #e2e8f0;
        }

        .big-wiggle-badge {
            width: 22px;
            height: 22px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            animation: bigWiggle 2s infinite ease-in-out;
        }

        @keyframes bigWiggle {
            0%, 100% { transform: scale(1) rotate(0deg); }
            20% { transform: scale(1.25) rotate(-14deg); }
            40% { transform: scale(0.92) rotate(8deg); }
            60% { transform: scale(1.20) rotate(14deg); }
            80% { transform: scale(0.96) rotate(-6deg); }
        }
    </style>
</head>
<body>

    <!-- 1-OYNA: Landing -->
    <div id="landingPage" class="page active">
        <div class="landing-container">
            <div class="brand-row">
                <svg class="acazes-svg-logo" viewBox="0 0 240 70" xmlns="http://www.w3.org/2000/svg">

                <div class="premium-badge-wrap">

            <button class="enter-btn" onclick="goToMarket()">
                KIRISH
            </button>
        </div>
    </div>

    <!-- 2-OYNA: Market -->
    <div id="marketPage" class="page hidden">
        <div class="market-container">
            <div class="stars-box">
                <div class="stars-header">
                    <span>⚡ Telegram Stars</span>
                </div>

                <div class="input-group">
                    <label for="starsCount">Stars miqdorini kiriting (Min: 50, Maks: 5000):</label>
                    <input type="number" id="starsCount" class="stars-input" value="50" min="50" max="5000" oninput="calculatePrice()">
                </div>

                <div class="preset-prices">
                    <button class="preset-btn" onclick="setPreset(50)">50 ta (11k)</button>
                    <button class="preset-btn" onclick="setPreset(75)">75 ta (16k)</button>
                    <button class="preset-btn" onclick="setPreset(100)">100 ta (22k)</button>
                    <button class="preset-btn" onclick="setPreset(200)">200 ta (43k)</button>
                </div>

                <div class="price-display" id="priceDisplay">
                    Narxi: 11 000 soʻm
                </div>

                <button class="buy-action-btn" onclick="openDealersModal()">
                    Sotib olish
                </button>
            </div>

            <!-- 5 ta Ikonkali Qimirlovchi Premium SVG Navigatsiya -->
            <div class="bottom-nav">
                <!-- Stars -->
                <button class="nav-item active" onclick="switchNav(this)">
                    <div class="nav-svg-wrap">
                        <svg viewBox="0 0 24 24" width="26" height="26" fill="#000000">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                        </svg>
                    </div>
                    <span>Stars ⭐</span>
                </button>

                <!-- Nft -->
                <button class="nav-item" onclick="switchNav(this)">
                    <div class="nav-svg-wrap">
                        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                            <polyline points="2 17 12 22 22 17"></polyline>
                            <polyline points="2 12 12 17 22 12"></polyline>
                        </svg>
                    </div>
                    <span>Nft 💎</span>
                </button>

                <!-- Gift -->
                <button class="nav-item" onclick="switchNav(this)">
                    <div class="nav-svg-wrap">
                        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 12 20 22 4 22 4 12"></polyline>

                    <span>Gift 🎁</span>

                <!-- Donat -->
                <button class="nav-item" onclick="switchNav(this)">
                    <div class="nav-svg-wrap">
                        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                            <line x1="1" y1="10" x2="23" y2="10"></line>
                        </svg>
                    </div>
                    <span>Donat 💳</span>
                </button>

                <!-- Channel -->
                <button class="nav-item" onclick="switchNav(this)">
                    <div class="nav-svg-wrap">
                        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                    </div>
                    <span>Channel 📢</span>
                </button>
            </div>
        </div>
    </div>

            <button class="close-modal-btn" onclick="closeDealersModal()">Yopish</button>

    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        function goToMarket() {
            hapticClick();
            document.getElementById('landingPage').classList.remove('active');
            document.getElementById('landingPage').classList.add('hidden');
            document.getElementById('marketPage').classList.remove('hidden');
            document.getElementById('marketPage').classList.add('active');
        }

        function switchNav(btn) {
            hapticClick();
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
        }

        function openDealersModal() {
            hapticClick();
            document.getElementById('dealersModal').classList.add('open');
        }

        function closeDealersModal() {
            hapticClick();
            document.getElementById('dealersModal').classList.remove('open');
        }

        function hapticClick() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }
        }

        function calculatePrice() {
            let input = document.getElementById('starsCount');
            let val = parseInt(input.value);

            if (isNaN(val) || val < 50) {
                val = 50;
            } else if (val > 5000) {
                val = 5000;
                input.value = 5000;
            }

            let totalPrice = val * 220;
            let formattedPrice = totalPrice.toLocaleString('uz-UZ');
            document.getElementById('priceDisplay').innerText = `Narxi: ${formattedPrice} soʻm`;
        }

        function setPreset(count) {
            document.getElementById('starsCount').value = count;
            calculatePrice();
        }

        calculatePrice();
    </script>
</body>
</html>
