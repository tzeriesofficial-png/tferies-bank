<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXE OPANG GIFT - CRASH</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: #070414;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .page {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease;
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 1-OYNA: CRASH USLUBIDAGI KIRISH QISMI */
        #loaderPage {
            background:
                radial-gradient(circle at 25% 20%, rgba(168, 85, 247, 0.42), transparent 48%),
                radial-gradient(circle at 80% 35%, rgba(59, 130, 246, 0.35), transparent 50%),
                radial-gradient(circle at 50% 85%, rgba(124, 58, 237, 0.35), transparent 55%),
                linear-gradient(180deg, #130829 0%, #090517 55%, #04020b 100%);
            z-index: 100;
        }

        .crash-loader {
            width: 100%;
            max-width: 345px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            position: relative;
            z-index: 2;
        }

        .top-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .brand-main {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 3px;
            color: #f3e8ff;
            text-shadow: 0 0 18px rgba(192, 132, 252, 0.65);
        }

        .brand-gift {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #facc15;
            text-shadow: 0 0 14px rgba(250, 204, 21, 0.55);
        }

        /* CRASH kartasi uslubidagi markaziy sahna */
        .crash-hero-box {
            width: 100%;
            background: linear-gradient(160deg, rgba(88, 28, 135, 0.48) 0%, rgba(30, 12, 66, 0.72) 55%, rgba(12, 6, 30, 0.9) 100%);
            border: 2px solid rgba(192, 132, 252, 0.55);
            border-radius: 26px;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 18px 42px rgba(109, 40, 217, 0.45), inset 0 0 24px rgba(168, 85, 247, 0.22);
        }

        .crash-svg-stage {
            width: 170px;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .crash-rocket-anim {
            animation: crashClimb 2s infinite ease-in-out;
            transform-origin: 85px 65px;
        }

        @keyframes crashClimb {
            0%, 100% { transform: translate(0px, 2px) rotate(-2deg) scale(1); }
            50% { transform: translate(4px, -6px) rotate(4deg) scale(1.06); }
        }

        .crash-title-badge {
            font-size: 34px;
            font-weight: 950;
            font-style: italic;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow:
                0 3px 0 #4c1d95,
                0 0 22px rgba(192, 132, 252, 0.9);
        }

        .deco-lines {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .line-dash {
            height: 2.5px;
            border-radius: 99px;
            background: linear-gradient(90deg, transparent, #c084fc, #facc15, transparent);
            animation: dashGlow 1.7s infinite ease-in-out;
        }

        .line-dash.s1 { width: 26px; }
        .line-dash.s2 { width: 62px; animation-delay: 0.2s; }
        .line-dash.s3 { width: 26px; animation-delay: 0.4s; }

        @keyframes dashGlow {
            0%, 100% { opacity: 0.4; transform: scaleX(0.88); }
            50% { opacity: 1; transform: scaleX(1.1); }
        }

        /* Yuklanish chizig'i */
        .progress-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 99px;
            overflow: hidden;
            border: 1px solid rgba(192, 132, 252, 0.3);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #9333ea, #c084fc, #facc15);
            border-radius: 99px;
            box-shadow: 0 0 14px rgba(192, 132, 252, 0.85);
            transition: width 0.05s linear;
        }

        .progress-num {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #f3e8ff;
        }

        /* 2-OYNA: GALAKTIKA YULDUZCHALI ASOSIY EKRAN (FAQAT CRASH + CASHOUT) */
        #mainPage {
            background:
                radial-gradient(circle at 20% 20%, rgba(124, 58, 237, 0.32), transparent 45%),
                radial-gradient(circle at 80% 30%, rgba(59, 130, 246, 0.25), transparent 50%),
                radial-gradient(circle at 50% 85%, rgba(168, 85, 247, 0.22), transparent 55%),
                linear-gradient(180deg, #090518 0%, #0d0724 55%, #04020c 100%);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .stars-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: #ffffff;
            animation: starTwinkle infinite ease-in-out;
        }

        @keyframes starTwinkle {
            0%, 100% { opacity: 0.25; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.35); }
        }

        .main-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .mode-pill {
            background: rgba(124, 58, 237, 0.22);
            border: 1px solid rgba(192, 132, 252, 0.45);
            color: #e9d5ff;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 2px;
            padding: 7px 18px;
            border-radius: 99px;
        }

        .cashout-btn {
            width: 100%;
            background: #000000;
            color: #ffffff;
            border: 1.5px solid rgba(255, 255, 255, 0.24);
            border-radius: 20px;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            cursor: pointer;
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.7), 0 0 24px rgba(139, 92, 246, 0.3);
            transition: transform 0.18s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .cashout-btn:active {
            transform: scale(0.96);
        }

        .rocket-svg-wrap {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            animation: rocketFly 1.9s infinite ease-in-out;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.45));
        }

        @keyframes rocketFly {
            0%, 100% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
            35% { transform: translate(2px, -4px) rotate(6deg) scale(1.1); }
            70% { transform: translate(-1px, 2px) rotate(-3deg) scale(0.98); }
        }

        .cashout-label {
            font-size: 19px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1.5px;
        }

        .status-toast {
            min-height: 20px;
            font-size: 13px;
            font-weight: 700;
            color: #ddd6fe;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 1-OYNA: CRASH USLUBIDAGI KIRISH QISMI -->
    <div id="loaderPage" class="page active">
        <div id="loaderStars" class="stars-layer"></div>

        <div class="crash-loader">
            <div class="top-brand">
                <div class="brand-main">AXE OPANG</div>
                <div class="brand-gift">GIFT</div>
            </div>

            <div class="crash-hero-box">
                <div class="crash-svg-stage">
                    <svg viewBox="0 0 170 130" width="170" height="130" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="graphGrad" x1="20" y1="110" x2="150" y2="25" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.35"/>
                                <stop offset="100%" stop-color="#c084fc" stop-opacity="0.85"/>
                            </linearGradient>
                            <linearGradient id="flameGrad" x1="55" y1="85" x2="35" y2="112" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#facc15"/>
                                <stop offset="60%" stop-color="#f97316"/>
                                <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
                            </linearGradient>
                        </defs>

                        <!-- O'suvchi grafik strelkasi -->
                        <path d="M22 106 C58 102, 95 78, 134 34" stroke="url(#graphGrad)" stroke-width="6" stroke-linecap="round"/>
                        <path d="M118 33 L136 32 L135 50" stroke="#e9d5ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

                        <!-- Raketa va alangasi -->
                        <g class="crash-rocket-anim">
                            <path d="M58 76 L34 102 L48 95 L53 108 L68 84 Z" fill="url(#flameGrad)"/>
                            <path d="M108 26 C108 26 124 28 126 44 C128 56 116 68 104 75 L78 49 C85 37 97 25 108 26Z" fill="#f3e8ff" stroke="#a855f7" stroke-width="2.5"/>
                            <circle cx="105" cy="46" r="7" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
                            <path d="M84 55 L64 52 L58 61 L78 67 Z" fill="#9333ea"/>
                            <path d="M98 69 L101 89 L92 95 L86 75 Z" fill="#9333ea"/>
                        </g>

                        <!-- Yulduzchalar -->
                        <polygon points="34,32 37,39 45,39 39,44 41,51 34,47 27,51 29,44 23,39 31,39" fill="#facc15"/>
                        <polygon points="142,74 144,79 150,79 145,82 147,88 142,85 137,88 139,82 134,79 140,79" fill="#facc15"/>
                    </svg>
                </div>

                <div class="crash-title-badge">CRASH</div>

                <div class="deco-lines">
                    <span class="line-dash s1"></span>
                    <span class="line-dash s2"></span>
                    <span class="line-dash s3"></span>
                </div>
            </div>

            <div class="progress-box">
                <div class="progress-track">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <div id="progressNum" class="progress-num">0%</div>
            </div>
        </div>
    </div>

    <!-- 2-OYNA: GALAKTIKA YULDUZCHALI ASOSIY EKRAN -->
    <div id="mainPage" class="page">
        <div id="mainStars" class="stars-layer"></div>

        <div class="main-content">
            <div class="mode-pill">CRASH</div>

            <button class="cashout-btn" onclick="handleCashout()">
                <span class="rocket-svg-wrap">
                    <svg viewBox="0 0 28 28" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18.5 3.5C18.5 3.5 23.5 4.2 24.5 9.5C25.2 13.2 22.4 16.8 19.6 18.8L16.5 15.7L12.3 11.5L9.2 8.4C11.2 5.6 14.8 2.8 18.5 3.5Z" fill="#ffffff"/>
                        <circle cx="18.2" cy="9.8" r="2.2" fill="#000000"/>
                        <path d="M11.6 12.2L6.8 11.2L5 13.5L9.8 15.6L11.6 12.2Z" fill="#e2e8f0"/>
                        <path d="M15.8 16.4L16.8 21.2L14.5 23L12.4 18.2L15.8 16.4Z" fill="#e2e8f0"/>
                        <path d="M9.6 16.2L6.2 19.6L8.4 21.8L11.8 18.4L9.6 16.2Z" fill="#ffffff"/>
                        <circle cx="5.4" cy="22.6" r="1.8" fill="#ffffff" opacity="0.85"/>
                    </svg>
                </span>
                <span class="cashout-label">Cashout</span>
            </button>

            <div id="statusToast" class="status-toast"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        function populateStars(containerId, count) {
            const layer = document.getElementById(containerId);
            for (let i = 0; i < count; i++) {
                const star = document.createElement('span');
                star.className = 'star';
                const size = (Math.random() * 2.5 + 1).toFixed(1);
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = (Math.random() * 100).toFixed(2) + '%';
                star.style.top = (Math.random() * 100).toFixed(2) + '%';
                star.style.animationDuration = (Math.random() * 2.4 + 1.4).toFixed(2) + 's';
                star.style.animationDelay = (Math.random() * 2.4).toFixed(2) + 's';
                if (i % 5 === 0) {
                    star.style.background = '#e9d5ff';
                    star.style.boxShadow = '0 0 6px #c084fc';
                } else if (i % 8 === 0) {
                    star.style.background = '#fef08a';
                    star.style.boxShadow = '0 0 6px #facc15';
                }
                layer.appendChild(star);
            }
        }
        populateStars('loaderStars', 45);
        populateStars('mainStars', 70);

        let progress = 0;
        const fillEl = document.getElementById('progressFill');
        const numEl = document.getElementById('progressNum');

        const timer = setInterval(() => {
            if (progress < 100) {
                progress++;
                fillEl.style.width = progress + '%';
                numEl.textContent = progress + '%';
            } else {
                clearInterval(timer);
                setTimeout(() => {
                    document.getElementById('loaderPage').classList.remove('active');
                    document.getElementById('mainPage').classList.add('active');
                }, 350);
            }
        }, 25);

        function handleCashout() {
            const toast = document.getElementById('statusToast');
            toast.textContent = 'Cashout tugmasi bosildi.';
        }
    </script>
</body>
</html>
