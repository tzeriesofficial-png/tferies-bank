<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XILCOIN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Arial Black', Impact, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .screen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 1-EKRAN: XILCOIN + O'NGDAGI TANGA */
        .xilcoin-brand {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            animation: brandAppear 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .xilcoin-word {
            font-size: clamp(36px, 10vw, 56px);
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 5px;
            line-height: 1;
            text-transform: uppercase;
            text-shadow:
                0 2px 0 #d4d4d8,
                0 5px 0 #71717a,
                0 10px 24px rgba(255, 255, 255, 0.22),
                0 0 36px rgba(250, 204, 21, 0.14);
        }

        .intro-coin-svg {
            width: clamp(42px, 11vw, 58px);
            height: clamp(42px, 11vw, 58px);
            flex-shrink: 0;
            animation: coinMove 2.1s infinite ease-in-out;
            filter: drop-shadow(0 0 16px rgba(250, 204, 21, 0.55));
        }

        @keyframes brandAppear {
            0% {
                opacity: 0;
                transform: translateY(14px) scale(0.9);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes coinMove {
            0%, 100% {
                transform: translateY(0px) rotate(0deg) scale(1);
            }
            30% {
                transform: translateY(-5px) rotate(12deg) scale(1.1);
            }
            70% {
                transform: translateY(2px) rotate(-10deg) scale(1.05);
            }
        }

        /* 2-EKRAN: ASOSIY O'YIN MAYDONI */
        #appScreen {
            justify-content: space-between;
        }

        .main-stage {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            overflow-y: auto;
        }

        .tab-view {
            display: none;
            width: 100%;
            max-width: 390px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            text-align: center;
        }

        .tab-view.active {
            display: flex;
        }

        .coin-counter-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .big-tap-coin-btn {
            width: 210px;
            height: 210px;
            border-radius: 50%;
            border: none;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.08s ease;
            filter: drop-shadow(0 0 24px rgba(250, 204, 21, 0.45));
        }

        .big-tap-coin-btn:active {
            transform: scale(0.92);
        }

        .big-tap-coin-svg {
            width: 196px;
            height: 196px;
            animation: bigCoinIdle 2.4s infinite ease-in-out;
        }

        @keyframes bigCoinIdle {
            0%, 100% {
                transform: scale(1) rotate(0deg);
            }
            50% {
                transform: scale(1.03) rotate(3deg);
            }
        }

        .section-heading {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .section-sub {
            font-size: 14px;
            font-weight: 700;
            color: #d4d4d8;
        }

        /* PASTKI 4 TA BO'LIM PANELI */
        .bottom-bar {
            width: 100%;
            background-color: #000000;
            border-top: 1px solid rgba(255, 255, 255, 0.16);
            padding: 10px 8px calc(12px + env(safe-area-inset-bottom));
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .nav-tab-btn {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 14px;
            padding: 10px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            color: #a1a1aa;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-tab-btn.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.22);
        }

        .nav-svg-wrap {
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .svg-move-tap {
            animation: svgTapWobble 1.9s infinite ease-in-out;
        }

        .svg-move-boost {
            animation: svgRocketLift 1.7s infinite ease-in-out;
        }

        .svg-move-wallet {
            animation: svgWalletBounce 2.1s infinite ease-in-out;
        }

        .svg-move-user {
            animation: svgUserPulse 2.2s infinite ease-in-out;
        }

        @keyframes svgTapWobble {
            0%, 100% { transform: rotate(0deg) scale(1); }
            45% { transform: rotate(-12deg) scale(1.14); }
        }

        @keyframes svgRocketLift {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(1.5px, -3px) scale(1.14); }
        }

        @keyframes svgWalletBounce {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-2.5px) scale(1.12); }
        }

        @keyframes svgUserPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
    </style>
</head>
<body>

    <!-- 1-EKRAN: KIRISH -->
    <div id="introScreen" class="screen active">
        <div class="xilcoin-brand">
            <span class="xilcoin-word">XILCOIN</span>
            <svg class="intro-coin-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="coinOuterGrad" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#fef08a"/>
                        <stop offset="50%" stop-color="#facc15"/>
                        <stop offset="100%" stop-color="#ca8a04"/>
                    </linearGradient>
                    <linearGradient id="coinInnerGrad" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#fde047"/>
                        <stop offset="100%" stop-color="#eab308"/>
                    </linearGradient>
                </defs>
                <circle cx="32" cy="32" r="27" fill="url(#coinOuterGrad)" stroke="#fef08a" stroke-width="2"/>
                <circle cx="32" cy="32" r="21" fill="url(#coinInnerGrad)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.75"/>
                <path d="M23 22L41 42M41 22L23 42" stroke="#ffffff" stroke-width="4.4" stroke-linecap="round"/>
            </svg>
        </div>
    </div>

    <!-- 2-EKRAN: ASOSIY SAHIFA -->
    <div id="appScreen" class="screen">
        <div class="main-stage">

            <!-- COINTAP BO'LIMI -->
            <div id="view-cointap" class="tab-view active">
                <div class="coin-counter-box">
                    <svg viewBox="0 0 32 32" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="16" cy="16" r="13.5" fill="#facc15" stroke="#fef08a" stroke-width="1.5"/>
                        <path d="M11.5 11.5L20.5 20.5M20.5 11.5L11.5 20.5" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
                    </svg>
                    <span id="coinBalanceText">0</span>
                </div>

                <button type="button" class="big-tap-coin-btn" onclick="tapBigCoin()">
                    <svg class="big-tap-coin-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="bigCoinOuter" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#fef08a"/>
                                <stop offset="50%" stop-color="#facc15"/>
                                <stop offset="100%" stop-color="#ca8a04"/>
                            </linearGradient>
                            <linearGradient id="bigCoinInner" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#fde047"/>
                                <stop offset="100%" stop-color="#eab308"/>
                            </linearGradient>
                        </defs>
                        <circle cx="32" cy="32" r="27" fill="url(#bigCoinOuter)" stroke="#fef08a" stroke-width="2"/>
                        <circle cx="32" cy="32" r="21" fill="url(#bigCoinInner)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.75"/>
                        <path d="M23 22L41 42M41 22L23 42" stroke="#ffffff" stroke-width="4.4" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>

            <!-- BOOST BO'LIMI -->
            <div id="view-boost" class="tab-view">
                <div class="section-heading">Boost</div>
                <div class="section-sub">Tezlashtirish boʻlimi</div>
            </div>

            <!-- WALLET BO'LIMI -->
            <div id="view-wallet" class="tab-view">
                <div class="section-heading">Wallet</div>
                <div class="section-sub">Hamyon boʻlimi</div>
            </div>

            <!-- HISOB BO'LIMI -->
            <div id="view-hisob" class="tab-view">
                <div class="section-heading">Hisob</div>
                <div class="section-sub">Profil boʻlimi</div>
            </div>

        </div>

        <!-- 4 TA BO'LIM: IKONKA YOZUVNING OLDIDA -->
        <nav class="bottom-bar">
            <button type="button" class="nav-tab-btn active" onclick="switchView('cointap', this)">
                <span class="nav-svg-wrap svg-move-tap">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="9" fill="#facc15" stroke="#ffffff" stroke-width="1.6"/>
                        <path d="M9 9L15 15M15 9L9 15" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </span>
                <span>CoinTap</span>
            </button>

            <button type="button" class="nav-tab-btn" onclick="switchView('boost', this)">
                <span class="nav-svg-wrap svg-move-boost">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M13 2L5 13H12L11 22L19 11H12L13 2Z" fill="#facc15" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
                    </svg>
                </span>
                <span>Boost</span>
            </button>

            <button type="button" class="nav-tab-btn" onclick="switchView('wallet', this)">
                <span class="nav-svg-wrap svg-move-wallet">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="6" width="18" height="13" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
                        <path d="M3 10H21" stroke="#000000" stroke-width="2"/>
                        <circle cx="16.5" cy="14.5" r="1.5" fill="#facc15"/>
                    </svg>
                </span>
                <span>Wallet</span>
            </button>

            <button type="button" class="nav-tab-btn" onclick="switchView('hisob', this)">
                <span class="nav-svg-wrap svg-move-user">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="8" r="4" fill="#ffffff"/>
                        <path d="M4.5 20C5.3 16.3 8.3 14.5 12 14.5C15.7 14.5 18.7 16.3 19.5 20" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
                    </svg>
                </span>
                <span>Hisob</span>
            </button>
        </nav>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        setTimeout(() => {
            document.getElementById('introScreen').classList.remove('active');
            document.getElementById('appScreen').classList.add('active');
        }, 1500);

        let coinsCount = Number(localStorage.getItem('xilcoin_balance_v1') || 0);
        const coinBalanceTextEl = document.getElementById('coinBalanceText');
        coinBalanceTextEl.textContent = coinsCount.toLocaleString('en-US');

        function tapBigCoin() {
            coinsCount += 1;
            localStorage.setItem('xilcoin_balance_v1', String(coinsCount));
            coinBalanceTextEl.textContent = coinsCount.toLocaleString('en-US');
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        function switchView(viewName, btnEl) {
            document.querySelectorAll('.nav-tab-btn').forEach(btn => btn.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');

            document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
            const target = document.getElementById('view-' + viewName);
            if (target) target.classList.add('active');
        }
    </script>
</body>
</html>
