<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        .tg-splash-screen {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.45s ease;
        }

        .tg-splash-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .plane-stage {
            width: 156px;
            height: 156px;
            border-radius: 40px;
            background: linear-gradient(155deg, #f3f9ff 0%, #e4f2fd 100%);
            border: 1.5px solid rgba(36, 161, 222, 0.22);
            box-shadow: 0 18px 38px rgba(36, 161, 222, 0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .plane-svg-wrap {
            width: 98px;
            height: 98px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: tgPlaneMotion 2.4s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes tgPlaneMotion {
            0% {
                transform: translate(0px, 0px) rotate(0deg) scale(1);
            }
            35% {
                transform: translate(4px, -6px) rotate(-4deg) scale(1.04);
            }
            70% {
                transform: translate(-2px, -3px) rotate(3deg) scale(1.02);
            }
            100% {
                transform: translate(0px, 0px) rotate(0deg) scale(1);
            }
        }

        .plane-svg-wrap svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }
    </style>
</head>
<body>

    <!-- KIRISH QISMI: OQ FON, YOZUVSIZ, QIMIRLAB TURUVCHI PREMIUM SVG SAMOLYOT -->
    <div id="tgSplash" class="tg-splash-screen">
        <div class="plane-stage">
            <div class="plane-svg-wrap">
                <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="planeBodyGrad" x1="16" y1="22" x2="104" y2="96" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#37aee2"/>
                            <stop offset="55%" stop-color="#249fd8"/>
                            <stop offset="100%" stop-color="#1884be"/>
                        </linearGradient>
                        <linearGradient id="planeWingLeft" x1="20" y1="54" x2="54" y2="74" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#76ccf2"/>
                            <stop offset="100%" stop-color="#39a8dc"/>
                        </linearGradient>
                        <linearGradient id="planeWingRight" x1="48" y1="66" x2="88" y2="96" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#218ec4"/>
                            <stop offset="100%" stop-color="#146d9e"/>
                        </linearGradient>
                        <linearGradient id="planeFoldShade" x1="44" y1="62" x2="66" y2="86" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#156fa0"/>
                            <stop offset="100%" stop-color="#0d5278"/>
                        </linearGradient>
                    </defs>

                    <!-- Yengil qog'oz/samolyot izi chiziqlari -->
                    <path d="M18 86C26 84 32 87 37 92" stroke="#57bce8" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
                    <path d="M12 73C19 72 24 75 28 79" stroke="#7ccbf0" stroke-width="2" stroke-linecap="round" opacity="0.45"/>

                    <!-- Asosiy samolyot korpusi -->
                    <path d="M102 24L18 57.5C15.5 58.5 15.6 61.9 18.2 62.7L39.5 69.3L95.5 32.2C97.8 30.7 100.3 33.7 98.3 35.6L51.5 76.2L84.4 98.8C86.6 100.3 89.6 99 90.2 96.4L106.4 28.1C107.1 25.1 104.7 22.8 102 24Z" fill="url(#planeBodyGrad)"/>

                    <!-- Chap qanot / yuqori qirra -->
                    <path d="M18 57.5L102 24L39.5 69.3L18.2 62.7C15.6 61.9 15.5 58.5 18 57.5Z" fill="url(#planeWingLeft)"/>

                    <!-- O'ng pastki qanot -->
                    <path d="M51.5 76.2L98.3 35.6L90.2 96.4C89.6 99 86.6 100.3 84.4 98.8L51.5 76.2Z" fill="url(#planeWingRight)"/>

                    <!-- Ichki buklama soyasi -->
                    <path d="M39.5 69.3L98.3 35.6L51.5 76.2L47.8 91.8C47.2 94.3 43.9 94.8 42.6 92.6L39.5 69.3Z" fill="url(#planeFoldShade)"/>

                    <!-- Yaltiroq oq qirra -->
                    <path d="M22 59.4L98.5 27.6" stroke="#e6f7ff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
                </svg>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }
    </script>
</body>
</html>
