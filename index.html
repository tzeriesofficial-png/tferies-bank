<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACAZES TERRORIZM</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@600;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000000;
            color: #8b0000;
            font-family: 'Cinzel', 'Montserrat', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 15px;
        }

        /* Chuqur qorong'ulik va nurlanish effekti */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(25, 0, 0, 0.45) 0%, rgba(0, 0, 0, 1) 90%);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        /* Sarlavhalar va to'g'ri ketma-ketlik */
        .title-acazes {
            font-size: 24px;
            letter-spacing: 10px;
            color: #8b0000;
            text-shadow: 0 0 12px rgba(139, 0, 0, 0.9), 0 0 25px rgba(255, 0, 0, 0.5);
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: 900;
            width: 100%;
        }

        .title-terrorizm {
            font-size: 26px;
            letter-spacing: 6px;
            color: #ab0000;
            text-shadow: 0 0 14px rgba(171, 0, 0, 0.9), 0 0 30px rgba(255, 0, 0, 0.6);
            text-transform: uppercase;
            font-weight: 900;
            margin-bottom: 35px;
            width: 100%;
        }

        /* SVG Loader container */
        .loader-container {
            width: 55px;
            height: 55px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .loader-svg {
            width: 100%;
            height: 100%;
            animation: rotate 3s linear infinite;
        }

        .loader-svg circle {
            fill: none;
            stroke-width: 3;
            stroke-dasharray: 150;
            stroke-dashoffset: 75;
            transform-origin: center;
        }

        .loader-outer {
            stroke: #5a0000;
            animation: dash 2s ease-in-out infinite;
        }

        .loader-inner {
            stroke: #ff0000;
            stroke-width: 2;
            animation: rotate-reverse 1.5s linear infinite;
            filter: drop-shadow(0px 0px 6px #ff0000);
        }

        /* Uzun chiziqli progress bar */
        .progress-bar-container {
            width: 100%;
            background-color: #110000;
            border: 1px solid #5a0000;
            border-radius: 4px;
            height: 8px;
            padding: 1px;
            margin-bottom: 12px;
            box-shadow: 0 0 10px rgba(139, 0, 0, 0.3);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #8b0000, #ff0000);
            border-radius: 2px;
            box-shadow: 0 0 8px #ff0000;
            transition: width 0.12s linear;
        }

        /* Foiz va sonlar matni */
        .progress-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 800;
            color: #ff3333;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
            margin-bottom: 18px;
        }

        /* Ma'lumot / Izoh qismi va SVG Premium Icon */
        .security-info {
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 600;
            color: #d12e2e;
            line-height: 1.5;
            letter-spacing: 0.5px;
            text-shadow: 0 0 6px rgba(209, 46, 46, 0.5);
            border-left: 2px solid #ff0000;
            padding-left: 10px;
            text-align: left;
            opacity: 0.9;
        }

        /* SVG Premium Warning Icon */
        .svg-warning {
            width: 14px;
            height: 14px;
            vertical-align: middle;
            margin-right: 4px;
            fill: #ff0000;
            filter: drop-shadow(0 0 5px #ff0000);
            display: inline-block;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        @keyframes rotate-reverse {
            100% { transform: rotate(-360deg); }
        }

        @keyframes dash {
            0% { stroke-dashoffset: 150; }
            50% { stroke-dashoffset: 35; }
            100% { stroke-dashoffset: 150; }
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="container">
        <!-- To'g'ri ketma-ketlikdagi sarlavhalar -->
        <div class="title-acazes">A C A Z E S</div>
        <div class="title-terrorizm">TERRORIZM</div>

        <!-- Premium SVG Loader -->
        <div class="loader-container">
            <svg class="loader-svg" viewBox="0 0 50 50">
                <circle class="loader-outer" cx="25" cy="25" r="20"></circle>
                <circle class="loader-inner" cx="25" cy="25" r="12" stroke-dasharray="40" stroke-dashoffset="10"></circle>
            </svg>
        </div>

        <!-- Uzun chiziqli zagruzka (1000 gacha) -->
        <div class="progress-bar-container">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- Sanash raqami -->
        <div class="progress-text" id="progressText">SHIFRLASH BOSQICHI: 0 / 1000</div>

        <!-- DXX va Ichki ishlar haqidagi maxfiy izoh (SVG Icon bilan) -->
        <div class="security-info">
            <svg class="svg-warning" viewBox="0 0 24 24">
                <path d="M12 2L1 21h22L12 2zm1 16h-2v-2h2v2zm1-4H10V7h4v7z"/>
            </svg>
            TERRORIZM ilovasi haqiqiy maxfiy platforma hisoblanadi. Ma'lumotlar xavfsizligini ta'minlash va DXX hamda Ichki Ishlar organlarining raqamli kuzatuvidan yashirinish uchun tizim 1000 bosqichli shifrlash protokolini bajarmoqda.
        </div>
    </div>

    <script>
        // Telegram WebApp ni kengaytirish
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // 1000 gacha aniq 2 daqiqa (120000 ms) davomida asta-sekin to'lish logikasi
        let currentCount = 0;
        const maxCount = 1000;
        const totalDurationMs = 120 * 1000; // 2 daqiqa
        const intervalTime = totalDurationMs / maxCount; // Har bir qadam uchun vaqt (~120ms)

        const fillElement = document.getElementById('progressFill');
        const textElement = document.getElementById('progressText');

        const timer = setInterval(() => {
            currentCount += 1;
            if (currentCount >= maxCount) {
                currentCount = maxCount;
                clearInterval(timer);
                textElement.innerHTML = "TIZIMGA ULANISH MUVAFFAQIYATLI YAKUNLANDI";
                textElement.style.color = "#ff0000";
            }
            
            let percentage = (currentCount / maxCount) * 100;
            fillElement.style.width = percentage + '%';
            textElement.innerHTML = `SHIFRLASH BOSQICHI: ${currentCount} / ${maxCount}`;
        }, intervalTime);
    </script>
</body>
</html>
