<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACAZES market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #070709;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Orqa fon SVG setka va nur */
        .bg-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Sahifalar */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .page.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.96);
        }

        .page.active {
            opacity: 1;
            transform: scale(1);
        }

        /* 1-Oyna: Landing */
        .landing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 42px;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .logo-svg {
            width: 100%;
            max-width: 340px;
            height: auto;
            overflow: visible;
            animation: svgPulse 2.2s infinite alternate ease-in-out;
        }

        @keyframes svgPulse {
            0% {
                transform: scale(0.98);
                filter: drop-shadow(0 0 14px rgba(255, 38, 38, 0.75)) drop-shadow(0 0 32px rgba(255, 38, 38, 0.35));
            }
            100% {
                transform: scale(1.03);
                filter: drop-shadow(0 0 18px rgba(255, 208, 0, 0.85)) drop-shadow(0 0 40px rgba(255, 136, 0, 0.45));
            }
        }

        .enter-svg-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            outline: none;
            transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
            filter: drop-shadow(0 10px 25px rgba(255, 72, 0, 0.35));
        }

        .enter-svg-btn:active {
            transform: scale(0.93);
        }

        .btn-shine {
            animation: shineMove 3s infinite linear;
        }

        @keyframes shineMove {
            0% { transform: translateX(-220px); }
            50%, 100% { transform: translateX(260px); }
        }

        /* 2-Oyna: Asosiy Market Konteyneri */
        .market-container {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px 16px 0 16px;
            background: #070709;
            z-index: 20;
        }

        /* Tab oynalari */
        .tab-view {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
        }

        .tab-view.active {
            display: flex;
        }

        /* Qidiruv bo'limi */
        .search-box {
            position: relative;
            width: 100%;
            margin-bottom: 14px;
        }

        .search-box input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            padding: 14px 16px 14px 46px;
            border-radius: 16px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            outline: none;
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: #ff2a2a;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(255, 42, 42, 0.25);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            stroke: rgba(255, 255, 255, 0.5);
            fill: none;
            stroke-width: 2.2;
        }

        /* Ilovalar ro'yxati */
        .apps-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 12px;
        }

        .apps-list::-webkit-scrollbar {
            width: 4px;
        }
        .apps-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
        }

        .app-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #fff;
            transition: all 0.2s;
        }

        .app-card:active {
            transform: scale(0.98);
            background: rgba(255, 42, 42, 0.08);
            border-color: rgba(255, 42, 42, 0.4);
        }

        .app-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* Qizil qimirlab turuvchi Premium SVG Galochka konteyneri */
        .red-check-wrap {
            width: 46px;
            height: 46px;
            background: radial-gradient(circle, rgba(255, 30, 30, 0.22) 0%, rgba(255, 30, 30, 0.04) 100%);
            border: 1.5px solid rgba(255, 42, 42, 0.45);
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            box-shadow: 0 0 14px rgba(255, 30, 30, 0.25);
        }

        .red-check-svg {
            width: 26px;
            height: 26px;
            animation: wiggleCheck 1.8s infinite ease-in-out;
            filter: drop-shadow(0 0 6px rgba(255, 30, 30, 0.8));
        }

        @keyframes wiggleCheck {
            0%, 100% {
                transform: scale(1) rotate(0deg);
            }
            25% {
                transform: scale(1.14) rotate(-8deg);
            }
            50% {
                transform: scale(0.96) rotate(4deg);
            }
            75% {
                transform: scale(1.1) rotate(8deg);
            }
        }

        .app-details h4 {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.3px;
            margin-bottom: 2px;
        }

        .app-details span {
            font-size: 11.5px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
        }

        /* Skachat tugmasi */
        .download-badge {
            font-size: 12.5px;
            font-weight: 900;
            letter-spacing: 0.4px;
            background: linear-gradient(135deg, #ff1e1e 0%, #ff7b00 100%);
            color: #ffffff;
            padding: 9px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(255, 42, 42, 0.35);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Boshqa bo'limlar markaziy ko'rinishi */
        .empty-tab-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            gap: 14px;
        }

        .empty-tab-icon {
            width: 72px;
            height: 72px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 208, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(255, 153, 0, 0.15);
        }

        .empty-tab-icon svg {
            width: 34px;
            height: 34px;
            stroke: #ffd000;
            fill: none;
            stroke-width: 2;
        }

        .empty-tab-box h3 {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .empty-tab-box p {
            font-size: 13.5px;
            color: rgba(255, 255, 255, 0.55);
            max-width: 260px;
            line-height: 1.5;
        }

        /* Pastki 5 ta Premium Navigatsiya */
        .bottom-nav {
            width: 100%;
            height: 74px;
            background: rgba(12, 12, 16, 0.96);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            width: 20%;
            height: 100%;
            opacity: 0.48;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            opacity: 1;
            transform: translateY(-2px);
        }

        .nav-item.active span {
            color: #ffd000;
            font-weight: 800;
        }

        .nav-item svg {
            width: 21px;
            height: 21px;
            stroke: #ffffff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-bottom: 5px;
        }

        .nav-item.active svg {
            stroke: #ffd000;
            stroke-width: 2.4;
            filter: drop-shadow(0 0 6px rgba(255, 208, 0, 0.5));
        }

        .nav-item span {
            font-size: 9.5px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 0.1px;
        }
    </style>
</head>
<body>

    <!-- Orqa fon SVG setka -->
    <svg class="bg-svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <pattern id="premiumGrid" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
                <circle cx="0" cy="0" r="1" fill="rgba(255, 180, 0, 0.12)"/>
            </pattern>
            <radialGradient id="ambientGlow" cx="50%" cy="42%" r="55%">
                <stop offset="0%" stop-color="#ff2a2a" stop-opacity="0.18"/>
                <stop offset="45%" stop-color="#ffaa00" stop-opacity="0.06"/>
                <stop offset="100%" stop-color="#070709" stop-opacity="0"/>
            </radialGradient>
        </defs>
        <rect width="100%" height="100%" fill="url(#premiumGrid)"/>
        <rect width="100%" height="100%" fill="url(#ambientGlow)"/>
    </svg>

    <!-- 1-OYNA: Landing Sahifasi -->
    <div id="landingPage" class="page active">
        <div class="landing-container">
            <!-- A C A Z E S market logotipi -->
            <svg class="logo-svg" viewBox="0 0 360 135" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ff1e1e">
                            <animate attributeName="stop-color" values="#ff1e1e; #ffd000; #ff1e1e" dur="2.4s" repeatCount="indefinite"/>
                        </stop>
                        <stop offset="50%" stop-color="#ff8800">
                            <animate attributeName="stop-color" values="#ff8800; #ff2a2a; #ff8800" dur="2.4s" repeatCount="indefinite"/>
                        </stop>
                        <stop offset="100%" stop-color="#ffd000">
                            <animate attributeName="stop-color" values="#ffd000; #ff1e1e; #ffd000" dur="2.4s" repeatCount="indefinite"/>
                        </stop>
                    </linearGradient>
                    <linearGradient id="subFireGrad" x1="100%" y1="0%" x2="0%" y2="0%">
                        <stop offset="0%" stop-color="#ffd000">
                            <animate attributeName="stop-color" values="#ffd000; #ff2a2a; #ffd000" dur="2.4s" repeatCount="indefinite"/>
                        </stop>
                        <stop offset="100%" stop-color="#ff2a2a">
                            <animate attributeName="stop-color" values="#ff2a2a; #ffd000; #ff2a2a" dur="2.4s" repeatCount="indefinite"/>
                        </stop>
                    </linearGradient>
                    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="rgba(255, 42, 42, 0.55)"/>
                        <stop offset="50%" stop-color="rgba(255, 208, 0, 0.2)"/>
                        <stop offset="100%" stop-color="rgba(255, 208, 0, 0.65)"/>
                    </linearGradient>
                </defs>
                <path d="M 24 18 L 10 18 L 10 32" fill="none" stroke="url(#frameGrad)" stroke-width="2" stroke-linecap="round"/>
                <path d="M 336 18 L 350 18 L 350 32" fill="none" stroke="url(#frameGrad)" stroke-width="2" stroke-linecap="round"/>
                <path d="M 24 118 L 10 118 L 10 104" fill="none" stroke="url(#frameGrad)" stroke-width="2" stroke-linecap="round"/>
                <path d="M 336 118 L 350 118 L 350 104" fill="none" stroke="url(#frameGrad)" stroke-width="2" stroke-linecap="round"/>
                <text x="186" y="62" text-anchor="middle" dominant-baseline="middle" fill="url(#fireGrad)" font-size="44" font-weight="900" letter-spacing="13">ACAZES</text>
                <line x1="95" y1="86" x2="265" y2="86" stroke="url(#frameGrad)" stroke-width="1.2" stroke-linecap="round"/>
                <text x="184" y="106" text-anchor="middle" dominant-baseline="middle" fill="url(#subFireGrad)" font-size="16" font-weight="800" letter-spacing="9">market</text>
            </svg>

            <!-- KIRISH Tugmasi -->
            <button class="enter-svg-btn" onclick="goToMarket()" aria-label="Kirish">
                <svg width="240" height="62" viewBox="0 0 240 62" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="btnBg" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff2222"/>
                            <stop offset="50%" stop-color="#ff6a00"/>
                            <stop offset="100%" stop-color="#ffbb00"/>
                        </linearGradient>
                        <linearGradient id="btnBorder" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="rgba(255, 255, 255, 0.75)"/>
                            <stop offset="100%" stop-color="rgba(255, 255, 255, 0.1)"/>
                        </linearGradient>
                        <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
                            <stop offset="50%" stop-color="rgba(255,255,255,0.45)"/>
                            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
                        </linearGradient>
                        <clipPath id="btnClip">
                            <rect x="2" y="2" width="236" height="58" rx="18"/>
                        </clipPath>
                    </defs>
                    <rect x="2" y="2" width="236" height="58" rx="18" fill="url(#btnBg)"/>
                    <rect x="2" y="2" width="236" height="58" rx="18" fill="none" stroke="url(#btnBorder)" stroke-width="1.5"/>
                    <g clip-path="url(#btnClip)">
                        <polygon class="btn-shine" points="0,0 45,0 20,62 -25,62" fill="url(#shineGrad)"/>
                    </g>
                    <text x="106" y="32" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-size="16" font-weight="900" letter-spacing="3.5">KIRISH</text>
                    <g transform="translate(166, 21)" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
                        <line x1="0" y1="10" x2="16" y2="10"/>
                        <polyline points="10 4 16 10 10 16"/>
                    </g>
                </svg>
            </button>
        </div>
    </div>

    <!-- 2-OYNA: Asosiy Sahifa -->
    <div id="marketPage" class="page hidden">
        <div class="market-container">
            
            <!-- ROOM BO'LIMI (Ilovalar va Qidiruv shu yerda) -->
            <div id="view-room" class="tab-view active">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchInput" placeholder="O'yin yoki ilova qidirish..." oninput="filterApps()">
                </div>

                <!-- Ilovalar ro'yxati (JavaScript orqali qizil jonli SVG galochka bilan chiziladi) -->
                <div class="apps-list" id="appsList"></div>
            </div>

            <!-- CREATE GAME BO'LIMI -->
            <div id="view-creategame" class="tab-view">
                <div class="empty-tab-box">
                    <div class="empty-tab-icon">
                        <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="4"></rect><line x1="6" y1="12" x2="10" y2="12"></line><line x1="8" y1="10" x2="8" y2="14"></line><circle cx="15" cy="11" r="1" fill="#ffd000"></circle><circle cx="17" cy="13" r="1" fill="#ffd000"></circle></svg>
                    </div>
                    <h3>CreateGame</h3>
                    <p>Yangi o'yin xonalari va turnirlar yaratish bo'limi.</p>
                </div>
            </div>

            <!-- GAME SUPPORT BO'LIMI -->
            <div id="view-support" class="tab-view">
                <div class="empty-tab-box">
                    <div class="empty-tab-icon">
                        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    </div>
                    <h3>GameSupport</h3>
                    <p>Texnik yordam va savollar bo'yicha murojaat qilish bo'limi.</p>
                </div>
            </div>

            <!-- CHANNEL BO'LIMI -->
            <div id="view-channel" class="tab-view">
                <div class="empty-tab-box">
                    <div class="empty-tab-icon">
                        <svg viewBox="0 0 24 24"><path d="M22 2L11 13"></path><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </div>
                    <h3>Channel</h3>
                    <p>ACAZES market rasmiy Telegram kanali va yangiliklar.</p>
                </div>
            </div>

            <!-- ADMINKA BO'LIMI -->
            <div id="view-adminka" class="tab-view">
                <div class="empty-tab-box">
                    <div class="empty-tab-icon">
                        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><polyline points="9 12 11 14 15 10"></polyline></svg>
                    </div>
                    <h3>Adminka</h3>
                    <p>Boshqaruv paneli va tizim sozlamalari.</p>
                </div>
            </div>

            <!-- Pastki 5 ta Premium SVG Navigatsiya (Room qo'shildi) -->
            <div class="bottom-nav">
                <button class="nav-item active" onclick="switchTab('room', this)">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg>
                    <span>Room</span>
                </button>
                <button class="nav-item" onclick="switchTab('creategame', this)">
                    <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="4"></rect><line x1="6" y1="12" x2="10" y2="12"></line><line x1="8" y1="10" x2="8" y2="14"></line><circle cx="15" cy="11" r="1"></circle><circle cx="17" cy="13" r="1"></circle></svg>
                    <span>CreateGame</span>
                </button>
                <button class="nav-item" onclick="switchTab('support', this)">
                    <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    <span>GameSupport</span>
                </button>
                <button class="nav-item" onclick="switchTab('channel', this)">
                    <svg viewBox="0 0 24 24"><path d="M22 2L11 13"></path><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    <span>Channel</span>
                </button>
                <button class="nav-item" onclick="switchTab('adminka', this)">
                    <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    <span>Adminka</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // Ilovalar va o'yinlar bazasi
        const appsData = [
            { name: "Standoff 2", cat: "Action • Shooter", url: "https://play.google.com/store/apps/details?id=com.axlebolt.standoff2" },
            { name: "PUBG MOBILE", cat: "Battle Royale • Action", url: "https://play.google.com/store/apps/details?id=com.tencent.ig" },
            { name: "Free Fire", cat: "Survival • Shooter", url: "https://play.google.com/store/apps/details?id=com.dts.freefireth" },
            { name: "Free Fire Max", cat: "Ultra Graphics • Action", url: "https://play.google.com/store/apps/details?id=com.dts.freefiremax" },
            { name: "Blood Strike", cat: "FPS • Battle Royale", url: "https://play.google.com/store/apps/details?id=com.netease.bloodstrike" },
            { name: "YouTube", cat: "Video • Streaming", url: "https://play.google.com/store/apps/details?id=com.google.android.youtube" },
            { name: "TikTok", cat: "Social • Short Videos", url: "https://play.google.com/store/apps/details?id=com.zhiliaoapp.musically" },
            { name: "Poppo Live", cat: "Live Streaming • Chat", url: "https://play.google.com/store/apps/details?id=com.poppo.android" },
            { name: "Bigo Live", cat: "Broadcasting • Social", url: "https://play.google.com/store/apps/details?id=sg.bigo.live" }
        ];

        // Qizil qimirlab turuvchi premium SVG galochka bilan ro'yxatni chiqarish
        const appsListContainer = document.getElementById('appsList');
        appsData.forEach((app, index) => {
            const delay = (index * 0.15).toFixed(2);
            const cardHTML = `
                <a href="${app.url}" target="_blank" class="app-card" data-name="${app.name.toLowerCase()}">
                    <div class="app-info">
                        <div class="red-check-wrap">
                            <svg class="red-check-svg" style="animation-delay: ${delay}s;" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <defs>
                                    <linearGradient id="redBadgeGrad${index}" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stop-color="#ff1e1e"/>
                                        <stop offset="100%" stop-color="#b80000"/>
                                    </linearGradient>
                                </defs>
                                <path d="M12 2L14.8 4.2L18.4 3.8L19.6 7.2L22.6 9.2L21.6 12.7L22.6 16.2L19.6 18.2L18.4 21.6L14.8 21.2L12 23.4L9.2 21.2L5.6 21.6L4.4 18.2L1.4 16.2L2.4 12.7L1.4 9.2L4.4 7.2L5.6 3.8L9.2 4.2L12 2Z" fill="url(#redBadgeGrad${index})" stroke="#ff6b6b" stroke-width="0.8"/>
                                <polyline points="8.5 12.5 11 15 16 9.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <div class="app-details">
                            <h4>${app.name}</h4>
                            <span>${app.cat}</span>
                        </div>
                    </div>
                    <div class="download-badge">Skachat</div>
                </a>
            `;
            appsListContainer.insertAdjacentHTML('beforeend', cardHTML);
        });

        function goToMarket() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }
            document.getElementById('landingPage').classList.remove('active');
            document.getElementById('landingPage').classList.add('hidden');
            
            document.getElementById('marketPage').classList.remove('hidden');
            document.getElementById('marketPage').classList.add('active');
        }

        // Qidiruv funksiyasi (Room ichida)
        function filterApps() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('app-card');

            for (let i = 0; i < cards.length; i++) {
                let name = cards[i].getAttribute('data-name');
                if (name.includes(input)) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        // Pastki 5 ta tabni almashtirish
        function switchTab(tabName, btn) {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.selectionChanged();
            }
            
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');

            document.querySelectorAll('.tab-view').forEach(view => view.classList.remove('active'));
            document.getElementById('view-' + tabName).classList.add('active');
        }
    </script>
</body>
</html>
