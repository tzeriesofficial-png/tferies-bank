<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A C A Z E S</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Arial Black', Impact, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ORQA FONDAGI NOZIK PREMIUM NURLANISH */
        .ambient-glow {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(250, 204, 21, 0.04) 40%, transparent 72%);
            pointer-events: none;
            animation: glowBreath 3.5s infinite ease-in-out;
        }

        @keyframes glowBreath {
            0%, 100% { transform: scale(0.92); opacity: 0.65; }
            50% { transform: scale(1.12); opacity: 1; }
        }

        .intro-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 36px;
            padding: 24px;
        }

        /* A C A Z E S YOZUVI */
        .acazes-title {
            font-size: clamp(34px, 9.5vw, 54px);
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 8px;
            text-align: center;
            text-transform: uppercase;
            padding-left: 8px;
            text-shadow:
                0 2px 0 #d4d4d8,
                0 5px 0 #52525b,
                0 12px 28px rgba(255, 255, 255, 0.24);
            animation: titleFadeIn 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes titleFadeIn {
            0% {
                opacity: 0;
                transform: translateY(14px) scale(0.92);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* DUMALOQ PREMIUM SVG 5 SEKUNDLIK TAYMER */
        .circle-timer-box {
            position: relative;
            width: 96px;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.18));
        }

        .timer-svg {
            width: 96px;
            height: 96px;
            transform: rotate(-90deg);
        }

        .timer-bg-ring {
            fill: rgba(255, 255, 255, 0.04);
            stroke: rgba(255, 255, 255, 0.16);
            stroke-width: 5;
        }

        .timer-progress-ring {
            fill: none;
            stroke: url(#premiumRingGrad);
            stroke-width: 5.5;
            stroke-linecap: round;
            stroke-dasharray: 251.33;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.1s linear;
        }

        .timer-orbit-dot {
            animation: orbitSpin 2.4s infinite linear;
            transform-origin: 48px 48px;
        }

        @keyframes orbitSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .timer-number {
            position: absolute;
            font-size: 30px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.35);
            animation: numTick 1s infinite ease-in-out;
        }

        @keyframes numTick {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.14); }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="intro-container">
        <div class="acazes-title">A C A Z E S</div>

        <div class="circle-timer-box">
            <svg class="timer-svg" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="premiumRingGrad" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="55%" stop-color="#fef08a"/>
                        <stop offset="100%" stop-color="#facc15"/>
                    </linearGradient>
                </defs>
                <circle class="timer-bg-ring" cx="48" cy="48" r="40"/>
                <circle id="timerProgressRing" class="timer-progress-ring" cx="48" cy="48" r="40"/>
                <g class="timer-orbit-dot">
                    <circle cx="88" cy="48" r="3.5" fill="#ffffff"/>
                </g>
            </svg>
            <span id="timerNumber" class="timer-number">5</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const TOTAL_SECONDS = 5;
        const CIRCUMFERENCE = 2 * Math.PI * 40; // 251.33
        const ringEl = document.getElementById('timerProgressRing');
        const numEl = document.getElementById('timerNumber');

        ringEl.style.strokeDasharray = CIRCUMFERENCE;
        ringEl.style.strokeDashoffset = '0';

        const startTime = Date.now();
        const durationMs = TOTAL_SECONDS * 1000;

        const countdownInterval = setInterval(() => {
            const elapsed = Date.now() - startTime;
            const remainingMs = Math.max(0, durationMs - elapsed);
            const progress = Math.min(1, elapsed / durationMs);

            // Halqa asta-sekin tugab boradi
            ringEl.style.strokeDashoffset = (CIRCUMFERENCE * progress).toFixed(2);

            // Raqam 5 -> 4 -> 3 -> 2 -> 1 -> 0 sanaydi
            const secLeft = Math.ceil(remainingMs / 1000);
            numEl.textContent = String(secLeft);

            if (remainingMs <= 0) {
                clearInterval(countdownInterval);
                numEl.textContent = '0';
                // Keyingi bo'limlar keyin qo'shiladi
            }
        }, 50);
    </script>
</body>
</html>
