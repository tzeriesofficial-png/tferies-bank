<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACAZES Trading</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            color: #111111;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Kirish qismi (Splash Screen) - Kumushsimon-kulrang fon */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #f4f6f9 0%, #dce1e8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            overflow: hidden;
            transition: opacity 0.8s ease;
        }

        /* Orqa fondagi nozik trading setkasi (Grid) */
        .trading-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(0,0,0,0.035) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.035) 1px, transparent 1px);
            background-size: 32px 32px;
            z-index: 0;
        }

        /* SVG shamchalar konteyneri */
        .candle-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .svg-candle {
            position: absolute;
            bottom: -160px;
            animation: floatCandle linear infinite;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.12));
        }

        @keyframes floatCandle {
            0% {
                transform: translateY(0) scale(0.95);
                opacity: 0;
            }
            15% {
                opacity: 0.9;
            }
            85% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-115vh) scale(1.05);
                opacity: 0;
            }
        }

        /* Markaziy yaltiroq SVG ACAZES logotipi */
        .logo-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: logoPulse 2s infinite alternate ease-in-out;
        }

        @keyframes logoPulse {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.15));
            }
            100% {
                transform: scale(1.04);
                filter: drop-shadow(0 8px 25px rgba(0, 0, 0, 0.35));
            }
        }

        /* Asosiy Oyna */
        .main-content {
            display: none;
            flex: 1;
            width: 100%;
            max-width: 400px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .main-content.active {
            display: flex;
        }

        .welcome-title {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .welcome-subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

    <!-- Kirish Qismi (Splash Screen) -->
    <div id="splash">
        <div class="trading-grid"></div>
        <div class="candle-bg" id="candleBg"></div>
        
        <!-- Yaltiroq Qora SVG ACAZES Yozuvi -->
        <div class="logo-wrapper">
            <svg width="320" height="70" viewBox="0 0 320 70" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="glossyBlack" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#000000"/>
                        <stop offset="45%" stop-color="#3a3a3a"/>
                        <stop offset="55%" stop-color="#000000"/>
                        <stop offset="100%" stop-color="#222222"/>
                    </linearGradient>
                </defs>
                <text x="50%" y="52%" dominant-baseline="middle" text-anchor="middle" 
                      fill="url(#glossyBlack)" font-size="42" font-weight="900" 
                      letter-spacing="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
                    ACAZES
                </text>
            </svg>
        </div>
    </div>

    <!-- Asosiy Oyna -->
    <div class="main-content active" id="tab-main">
        <div class="welcome-title">ACAZES Trading</div>
        <div class="welcome-subtitle">Keyingi qadamda asosiy savdo oynasi va bo'limlarni qo'shamiz</div>
    </div>

    <script>
        // Premium SVG Trading Shamchalarini (Oq va Qora) generatsiya qilish
        const candleBg = document.getElementById('candleBg');
        const totalCandles = 18;

        for (let i = 0; i < totalCandles; i++) {
            const isWhite = i % 2 === 0;
            const bodyHeight = Math.floor(Math.random() * 55) + 35; // Shamcha tanasi uzunligi
            const topWick = Math.floor(Math.random() * 25) + 12;    // Tepasidagi pilta
            const bottomWick = Math.floor(Math.random() * 25) + 12; // Pastidagi pilta
            const totalHeight = topWick + bodyHeight + bottomWick;

            const fillColor = isWhite ? '#ffffff' : '#111111';
            const strokeColor = '#111111';

            const svgHTML = `
                <svg class="svg-candle" width="24" height="${totalHeight}" viewBox="0 0 24 ${totalHeight}" 
                     style="left: ${Math.random() * 92 + 2}%; animation-duration: ${Math.random() * 4 + 4.5}s; animation-delay: ${Math.random() * 2.5}s;"
                     xmlns="http://www.w3.org/2000/svg">
                    <!-- Yuqori va pastki pilta (Wick) -->
                    <line x1="12" y1="0" x2="12" y2="${totalHeight}" stroke="${strokeColor}" stroke-width="2" stroke-linecap="round"/>
                    <!-- Shamcha tanasi (Body) -->
                    <rect x="4" y="${topWick}" width="16" height="${bodyHeight}" rx="3" fill="${fillColor}" stroke="${strokeColor}" stroke-width="1.8"/>
                </svg>
            `;
            candleBg.insertAdjacentHTML('beforeend', svgHTML);
        }

        // 2.8 sekunddan keyin asosiy oynaga o'tish
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash');
                splash.style.opacity = '0';
                setTimeout(() => splash.remove(), 800);
            }, 2800);
        });
    </script>
</body>
</html>
