<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXE OPANG GIFT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: #030612;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .page {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease;
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 1-OYNA: KIRISH QISMI */
        #loaderPage {
            background: radial-gradient(circle at top, #102447 0%, #070d1a 55%, #03060c 100%);
            z-index: 100;
        }

        .gift-loader {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        .brand-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .main-brand {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 3px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.45);
        }

        .sub-brand {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ff3b5c;
            text-shadow: 0 0 16px rgba(255, 59, 92, 0.5);
        }

        .deco-lines {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 2px;
        }

        .line-pill {
            height: 2.5px;
            border-radius: 99px;
            background: linear-gradient(90deg, transparent, #38bdf8, #ff3b5c, transparent);
            animation: pillPulse 1.8s infinite ease-in-out;
        }

        .line-pill.a { width: 28px; animation-delay: 0s; }
        .line-pill.b { width: 64px; animation-delay: 0.2s; }
        .line-pill.c { width: 28px; animation-delay: 0.4s; }

        @keyframes pillPulse {
            0%, 100% { opacity: 0.4; transform: scaleX(0.85); }
            50% { opacity: 1; transform: scaleX(1.12); }
        }

        .gift-svg-wrap {
            width: 170px;
            height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 14px 26px rgba(0, 168, 255, 0.25));
            animation: boxWiggle 2.2s infinite ease-in-out;
        }

        @keyframes boxWiggle {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-3deg) scale(1.03); }
            75% { transform: rotate(3deg) scale(1.03); }
        }

        .lid-group {
            transform-origin: 60px 52px;
            animation: lidPop 2.2s infinite ease-in-out;
        }

        @keyframes lidPop {
            0%, 40%, 100% { transform: translateY(0px) rotate(0deg); }
            55%, 80% { transform: translateY(-9px) rotate(-6deg); }
        }

        .bear-group {
            animation: bearPeek 2.2s infinite ease-in-out;
        }

        @keyframes bearPeek {
            0%, 38%, 100% { transform: translateY(14px); opacity: 0.85; }
            55%, 82% { transform: translateY(-4px); opacity: 1; }
        }

        .progress-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .progress-track {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00b4ff, #ff2e55);
            border-radius: 99px;
            box-shadow: 0 0 12px rgba(0, 180, 255, 0.7);
            transition: width 0.05s linear;
        }

        .progress-num {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #e2e8f0;
        }

        /* 2-OYNA: GALAKTIKA YULDUZCHALI ASOSIY EKRAN */
        #mainPage {
            background:
                radial-gradient(circle at 20% 20%, rgba(124, 58, 237, 0.28), transparent 45%),
                radial-gradient(circle at 80% 30%, rgba(14, 165, 233, 0.25), transparent 50%),
                radial-gradient(circle at 50% 85%, rgba(236, 72, 153, 0.18), transparent 50%),
                linear-gradient(180deg, #050816 0%, #090d24 50%, #03040c 100%);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .stars-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: #ffffff;
            animation: starTwinkle infinite ease-in-out;
        }

        @keyframes starTwinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.35); }
        }

        .main-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Qora tugma, oq yozuv, oldida qimirlaydigan oq premium SVG raketa */
        .cashout-btn {
            width: 100%;
            background: #000000;
            color: #ffffff;
            border: 1.5px solid rgba(255, 255, 255, 0.22);
            border-radius: 20px;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            cursor: pointer;
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.65), 0 0 22px rgba(139, 92, 246, 0.25);
            transition: transform 0.18s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .cashout-btn:hover {
            border-color: rgba(255, 255, 255, 0.45);
            box-shadow: 0 16px 38px rgba(0, 0, 0, 0.8), 0 0 28px rgba(56, 189, 248, 0.35);
        }

        .cashout-btn:active {
            transform: scale(0.96);
        }

        .rocket-svg-wrap {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            animation: rocketFly 1.9s infinite ease-in-out;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.45));
        }

        @keyframes rocketFly {
            0%, 100% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
            35% { transform: translate(2px, -4px) rotate(6deg) scale(1.1); }
            70% { transform: translate(-1px, 2px) rotate(-3deg) scale(0.98); }
        }

        .cashout-label {
            font-size: 19px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1.5px;
        }

        .status-toast {
            min-height: 20px;
            font-size: 13px;
            font-weight: 700;
            color: #cbd5e1;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 1-OYNA: KIRISH QISMI -->
    <div id="loaderPage" class="page active">
        <div class="gift-loader">
            <div class="brand-block">
                <div class="main-brand">AXE OPANG</div>
                <div class="sub-brand">GIFT</div>
                <div class="deco-lines">
                    <span class="line-pill a"></span>
                    <span class="line-pill b"></span>
                    <span class="line-pill c"></span>
                </div>
            </div>

            <div class="gift-svg-wrap">
                <svg viewBox="0 0 140 140" width="165" height="165" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="liquidBlue" x1="25" y1="50" x2="115" y2="125" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#4dd2ff"/>
                            <stop offset="50%" stop-color="#009dff"/>
                            <stop offset="100%" stop-color="#005bb5"/>
                        </linearGradient>
                        <linearGradient id="richRed" x1="20" y1="30" x2="120" y2="65" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#ff4d6d"/>
                            <stop offset="100%" stop-color="#c9184a"/>
                        </linearGradient>
                        <linearGradient id="tanBear" x1="45" y1="20" x2="95" y2="75" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#d49a6a"/>
                            <stop offset="100%" stop-color="#9c663c"/>
                        </linearGradient>
                    </defs>

                    <g class="bear-group">
                        <circle cx="51" cy="37" r="9" fill="#9c663c"/>
                        <circle cx="51" cy="37" r="4.5" fill="#e6b89c"/>
                        <circle cx="89" cy="37" r="9" fill="#9c663c"/>
                        <circle cx="89" cy="37" r="4.5" fill="#e6b89c"/>
                        <circle cx="70" cy="52" r="21" fill="url(#tanBear)"/>
                        <ellipse cx="70" cy="57" rx="8" ry="6" fill="#e6b89c"/>
                        <circle cx="70" cy="55" r="2.8" fill="#3d2314"/>
                        <circle cx="62" cy="49" r="2.6" fill="#1e1b18"/>
                        <circle cx="78" cy="49" r="2.6" fill="#1e1b18"/>
                        <circle cx="62.8" cy="48.2" r="0.9" fill="#ffffff"/>
                        <circle cx="78.8" cy="48.2" r="0.9" fill="#ffffff"/>
                        <path d="M66.5 59.5C68 61.5 72 61.5 73.5 59.5" stroke="#3d2314" stroke-width="2" stroke-linecap="round"/>
                    </g>

                    <rect x="28" y="62" width="84" height="56" rx="12" fill="url(#liquidBlue)"/>
                    <path d="M34 74C46 69 58 79 70 74C82 69 94 79 106 74" stroke="#b8f0ff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
                    <rect x="63" y="62" width="14" height="56" fill="url(#richRed)"/>

                    <g class="lid-group">
                        <path d="M70 46C64 36 47 36 47 45C47 51 58 50 70 46Z" fill="url(#richRed)"/>
                        <path d="M70 46C76 36 93 36 93 45C93 51 82 50 70 46Z" fill="url(#richRed)"/>
                        <circle cx="70" cy="46" r="5" fill="#ff758f"/>
                        <rect x="23" y="47" width="94" height="18" rx="7" fill="url(#richRed)"/>
                        <rect x="63" y="47" width="14" height="18" fill="#ff4d6d"/>
                    </g>
                </svg>
            </div>

            <div class="progress-box">
                <div class="progress-track">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <div id="progressNum" class="progress-num">0%</div>
            </div>
        </div>
    </div>

    <!-- 2-OYNA: GALAKTIKA YULDUZCHALI ASOSIY EKRAN -->
    <div id="mainPage" class="page">
        <div id="starsLayer" class="stars-layer"></div>

        <div class="main-content">
            <button class="cashout-btn" onclick="handleCashout()">
                <!-- Premium SVG Oq Raketa -->
                <span class="rocket-svg-wrap">
                    <svg viewBox="0 0 28 28" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18.5 3.5C18.5 3.5 23.5 4.2 24.5 9.5C25.2 13.2 22.4 16.8 19.6 18.8L16.5 15.7L12.3 11.5L9.2 8.4C11.2 5.6 14.8 2.8 18.5 3.5Z" fill="#ffffff"/>
                        <circle cx="18.2" cy="9.8" r="2.2" fill="#000000"/>
                        <path d="M11.6 12.2L6.8 11.2L5 13.5L9.8 15.6L11.6 12.2Z" fill="#e2e8f0"/>
                        <path d="M15.8 16.4L16.8 21.2L14.5 23L12.4 18.2L15.8 16.4Z" fill="#e2e8f0"/>
                        <path d="M9.6 16.2L6.2 19.6L8.4 21.8L11.8 18.4L9.6 16.2Z" fill="#ffffff"/>
                        <circle cx="5.4" cy="22.6" r="1.8" fill="#ffffff" opacity="0.85"/>
                    </svg>
                </span>
                <span class="cashout-label">Cashout</span>
            </button>

            <div id="statusToast" class="status-toast"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Galaktika yulduzchalarini yaratish
        function createStars() {
            const layer = document.getElementById('starsLayer');
            const starCount = 70;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('span');
                star.className = 'star';
                const size = (Math.random() * 2.6 + 1).toFixed(1);
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = (Math.random() * 100).toFixed(2) + '%';
                star.style.top = (Math.random() * 100).toFixed(2) + '%';
                star.style.animationDuration = (Math.random() * 2.5 + 1.5).toFixed(2) + 's';
                star.style.animationDelay = (Math.random() * 2.5).toFixed(2) + 's';
                if (i % 7 === 0) {
                    star.style.background = '#bae6fd';
                    star.style.boxShadow = '0 0 6px #7dd3fc';
                } else if (i % 11 === 0) {
                    star.style.background = '#e9d5ff';
                    star.style.boxShadow = '0 0 6px #c084fc';
                }
                layer.appendChild(star);
            }
        }
        createStars();

        // Kirish chizig'i 100% gacha to'lishi
        let progress = 0;
        const fillEl = document.getElementById('progressFill');
        const numEl = document.getElementById('progressNum');

        const timer = setInterval(() => {
            if (progress < 100) {
                progress++;
                fillEl.style.width = progress + '%';
                numEl.textContent = progress + '%';
            } else {
                clearInterval(timer);
                setTimeout(() => {
                    document.getElementById('loaderPage').classList.remove('active');
                    document.getElementById('mainPage').classList.add('active');
                }, 350);
            }
        }, 25);

        function handleCashout() {
            const toast = document.getElementById('statusToast');
            toast.textContent = 'Cashout tugmasi bosildi. Keyingi sozlamani yozishingiz mumkin.';
        }
    </script>
</body>
</html>
