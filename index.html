<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tferies Bank</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #08140e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding-bottom: 80px;
            min-height: 100vh;
        }

        /* --- Katta T harfi chiqib keladigan Splash Ekrani --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #08140e;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        .splash-logo {
            font-size: 80px;
            font-weight: 900;
            background: linear-gradient(135deg, #d4af37, #f3e5ab);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
            animation: pulseLogo 1.2s infinite alternate;
        }

        .splash-text {
            color: #8b9a90;
            font-size: 14px;
            margin-top: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @keyframes pulseLogo {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.5)); }
        }

        /* --- PIN-KOD EKRANI --- */
        #pin-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0b1d13 0%, #040906 100%);
            z-index: 99999;
            display: none; /* Boshida yashirin, splashdan keyin chiqadi */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .pin-title {
            color: #d4af37;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .pin-subtitle {
            color: #8b9a90;
            font-size: 13px;
            margin-bottom: 30px;
            text-align: center;
        }

        .pin-dots {
            display: flex;
            gap: 16px;
            margin-bottom: 40px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border: 2px solid #d4af37;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .dot.filled {
            background-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px 22px;
            width: 100%;
            max-width: 280px;
        }

        .key {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(19, 51, 33, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #ffffff;
            font-size: 26px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin: 0 auto;
            outline: none;
            transition: background 0.1s, transform 0.1s;
        }

        .key:active {
            background: #d4af37;
            color: #08140e;
            transform: scale(0.90);
        }

        .key-action {
            font-size: 15px;
            font-weight: bold;
            color: #d4af37;
            background: rgba(19, 51, 33, 0.4);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        /* --- BANK INTERFEYSI --- */
        .header {
            padding: 20px 20px 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand {
            color: #d4af37;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
        }
        .profile-icon {
            width: 36px;
            height: 36px;
            background: #133321;
            border: 1px solid #d4af37;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d4af37;
            font-weight: bold;
        }
        .card-container {
            padding: 0 16px;
            margin-top: 10px;
        }
        .card {
            background: linear-gradient(135deg, #133321, #0b1d13);
            border: 1px solid #d4af37;
            border-radius: 20px;
            padding: 24px;
        }
        .card-title {
            font-size: 13px;
            color: #8b9a90;
            text-transform: uppercase;
        }
        .balance-amount {
            font-size: 32px;
            font-weight: bold;
            color: #ffffff;
            margin: 8px 0 20px 0;
        }
        .card-actions {
            display: flex;
            gap: 10px;
        }
        .card-btn {
            flex: 1;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
        }
        .card-btn.primary {
            background: #d4af37;
            color: #08140e;
            border: none;
        }
        .page-content {
            display: none;
            padding: 20px 16px;
        }
        .page-content.active {
            display: block;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 15px;
        }
        .services-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 20px;
        }
        .service-item {
            background: #133321;
            border: 1px solid #1a442d;
            border-radius: 14px;
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }
        .service-icon {
            font-size: 20px;
            margin-bottom: 6px;
            color: #d4af37;
            font-weight: bold;
        }
        .service-text {
            font-size: 11px;
            color: #cbd5d0;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            font-size: 12px;
            color: #8b9a90;
            display: block;
            margin-bottom: 5px;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            background: #08140e;
            border: 1px solid #1a442d;
            border-radius: 10px;
            color: #fff;
            font-size: 14px
