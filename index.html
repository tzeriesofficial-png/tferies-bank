<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-BOX</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Arial Black', Impact, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .screen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 1-EKRAN: X-BOX (O'RTADA, SOYASIZ) */
        .xbox-title {
            font-size: clamp(38px, 10.5vw, 60px);
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 6px;
            line-height: 1;
            text-align: center;
            text-transform: uppercase;
            text-shadow: none;
            filter: none;
            box-shadow: none;
        }

        /* 2-EKRAN: ASOSIY OYNA */
        #mainScreen {
            justify-content: space-between;
        }

        .content-area {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-y: auto;
        }

        .tab-panel {
            display: none;
            width: 100%;
            max-width: 410px;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-align: center;
        }

        .tab-panel.active {
            display: flex;
        }

        #panel-tanishuv {
            justify-content: flex-start;
            padding-top: 6px;
        }

        .panel-title {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
            text-transform: lowercase;
        }

        .panel-subtitle {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 13.5px;
            font-weight: 600;
            color: #a1a1aa;
        }

        /* X-TANISHUV RO'YXATI */
        .tanishuv-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 4px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.14);
        }

        .tanishuv-count-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 900;
            color: #facc15;
        }

        .users-feed-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            padding-bottom: 14px;
        }

        .user-profile-card {
            width: 100%;
            background: #0b0b0b;
            border: 1.5px solid rgba(255, 255, 255, 0.16);
            border-radius: 18px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            text-align: left;
            transition: border-color 0.2s ease, transform 0.15s ease;
        }

        .user-profile-card.is-me {
            border-color: rgba(250, 204, 21, 0.55);
            background: rgba(250, 204, 21, 0.05);
        }

        .user-card-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .user-tg-photo {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffffff;
            background: #18181b;
            flex-shrink: 0;
        }

        .user-tg-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .user-tg-username {
            font-size: 15px;
            font-weight: 900;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-tg-fullname {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 12.5px;
            font-weight: 600;
            color: #a1a1aa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-open-tg-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            flex-shrink: 0;
            text-decoration: none;
        }

        .user-open-tg-btn:active {
            transform: scale(0.95);
        }

        /* PASTKI 3 TA PREMIUM SVG IKONKA PANELI */
        .bottom-nav {
            width: 100%;
            background-color: #000000;
            border-top: 1px solid rgba(255, 255, 255, 0.16);
            padding: 10px 10px calc(12px + env(safe-area-inset-bottom));
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .nav-item-btn {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 16px;
            padding: 9px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #a1a1aa;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-item-btn.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.24);
        }

        .svg-icon-box {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* QIMIRLAB TURUVCHI PREMIUM ANIMATSIYALAR */
        .anim-xbox-svg {
            animation: xboxSpinFloat 2.2s infinite ease-in-out;
            filter: drop-shadow(0 0 8px rgba(250, 204, 21, 0.45));
        }

        .anim-tanishuv-svg {
            animation: tanishuvBeat 1.7s infinite ease-in-out;
            filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.5));
        }

        .anim-wallet-svg {
            animation: walletTilt 2.0s infinite ease-in-out;
            filter: drop-shadow(0 0 8px rgba(250, 204, 21, 0.4));
        }

        @keyframes xboxSpinFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            35% { transform: translateY(-3px) rotate(12deg) scale(1.12); }
            70% { transform: translateY(1px) rotate(-10deg) scale(1.06); }
        }

        @keyframes tanishuvBeat {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.18) rotate(-6deg); }
            50% { transform: scale(1.04) rotate(0deg); }
            75% { transform: scale(1.15) rotate(6deg); }
        }

        @keyframes walletTilt {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            40% { transform: translateY(-3px) rotate(-8deg) scale(1.12); }
            80% { transform: translateY(1px) rotate(6deg) scale(1.05); }
        }
    </style>
</head>
<body>

    <!-- 1-EKRAN: X-BOX -->
    <div id="splashScreen" class="screen active">
        <div class="xbox-title">X-BOX</div>
    </div>

    <!-- 2-EKRAN: ASOSIY OYNA -->
    <div id="mainScreen" class="screen">
        <div class="content-area">
            <!-- X-BOX BO'LIMI -->
            <div id="panel-xbox" class="tab-panel active">
                <div class="panel-title">x-box</div>
                <div class="panel-subtitle">Asosiy lenta boʻlimi</div>
            </div>

            <!-- X-TANISHUV BO'LIMI -->
            <div id="panel-tanishuv" class="tab-panel">
                <div class="tanishuv-header">
                    <div class="panel-title">x-tanishuv</div>
                    <div class="tanishuv-count-badge">
                        <span id="tanishuvUserCount">0</span> ta aʼzo
                    </div>
                </div>

                <div id="usersFeedList" class="users-feed-list"></div>
            </div>

            <!-- X-WALLET BO'LIMI -->
            <div id="panel-wallet" class="tab-panel">
                <div class="panel-title">x-wallet</div>
                <div class="panel-subtitle">Hamyon va balans boʻlimi</div>
            </div>
        </div>

        <!-- PASTKI 3 TA BO'LIM: x-box, x-tanishuv, x-wallet -->
        <nav class="bottom-nav">
            <!-- 1. x-box -->
            <button type="button" class="nav-item-btn active" onclick="openPanel('xbox', this)">
                <span class="svg-icon-box anim-xbox-svg">
                    <svg viewBox="0 0 32 32" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="xboxBadgeGrad" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#fef08a"/>
                                <stop offset="55%" stop-color="#facc15"/>
                                <stop offset="100%" stop-color="#ca8a04"/>
                            </linearGradient>
                        </defs>
                        <rect x="3" y="3" width="26" height="26" rx="8" fill="url(#xboxBadgeGrad)" stroke="#ffffff" stroke-width="1.8"/>
                        <path d="M10.5 10.5L21.5 21.5M21.5 10.5L10.5 21.5" stroke="#000000" stroke-width="3.2" stroke-linecap="round"/>
                    </svg>
                </span>
                <span>x-box</span>
            </button>

            <!-- 2. x-tanishuv -->
            <button type="button" class="nav-item-btn" onclick="openPanel('tanishuv', this)">
                <span class="svg-icon-box anim-tanishuv-svg">
                    <svg viewBox="0 0 32 32" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="tanishuvGrad" x1="4" y1="5" x2="28" y2="27" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#fda4af"/>
                                <stop offset="50%" stop-color="#ef4444"/>
                                <stop offset="100%" stop-color="#b91c1c"/>
                            </linearGradient>
                        </defs>
                        <path d="M16 27.2C16 27.2 4.5 19.8 4.5 11.4C4.5 7.7 7.4 5 10.9 5C13.1 5 15 6.1 16 7.8C17 6.1 18.9 5 21.1 5C24.6 5 27.5 7.7 27.5 11.4C27.5 19.8 16 27.2 16 27.2Z" fill="url(#tanishuvGrad)" stroke="#ffffff" stroke-width="1.7" stroke-linejoin="round"/>
                        <path d="M12.5 12.5L19.5 18.5M19.5 12.5L12.5 18.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
                    </svg>
                </span>
                <span>x-tanishuv</span>
            </button>

            <!-- 3. x-wallet -->
            <button type="button" class="nav-item-btn" onclick="openPanel('wallet', this)">
                <span class="svg-icon-box anim-wallet-svg">
                    <svg viewBox="0 0 32 32" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="walletBodyGrad" x1="3" y1="7" x2="29" y2="26" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#ffffff"/>
                                <stop offset="100%" stop-color="#d4d4d8"/>
                            </linearGradient>
                        </defs>
                        <rect x="3.5" y="7.5" width="25" height="17" rx="4.5" fill="url(#walletBodyGrad)" stroke="#facc15" stroke-width="1.8"/>
                        <path d="M3.5 12.5H28.5" stroke="#000000" stroke-width="2.2"/>
                        <rect x="20" y="15.5" width="8.5" height="5.5" rx="2.2" fill="#000000"/>
                        <circle cx="22.8" cy="18.25" r="1.5" fill="#facc15"/>
                    </svg>
                </span>
                <span>x-wallet</span>
            </button>
        </nav>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const FIREBASE_DB_URL = "https://xbox-tanishuv-default-rtdb.firebaseio.com";
        const LOCAL_USERS_KEY = "xbox_tanishuv_directory_v1";

        const fallbackAvatar = "data:image/svg+xml;utf8," + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                <rect width="100" height="100" fill="#18181b"/>
                <circle cx="50" cy="38" r="18" fill="#facc15"/>
                <path d="M20 86C24 68 36 60 50 60C64 60 76 68 80 86" fill="#3f3f46"/>
            </svg>
        `);

        function getCurrentTgUser() {
            const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;
            if (u && u.id) {
                const fullName = [u.first_name, u.last_name].filter(Boolean).join(' ') || 'Foydalanuvchi';
                const atName = u.username ? ('@' + u.username) : fullName;
                return {
                    id: String(u.id),
                    username: u.username || '',
                    atName: atName,
                    fullName: fullName,
                    photo: u.photo_url || '',
                    lastSeen: Date.now()
                };
            }

            let guestId = localStorage.getItem('xbox_guest_uid_v1');
            if (!guestId) {
                guestId = 'guest_' + Math.random().toString(36).slice(2, 9);
                localStorage.setItem('xbox_guest_uid_v1', guestId);
            }
            return {
                id: guestId,
                username: '',
                atName: '@mehmon_' + guestId.slice(-4),
                fullName: 'Mehmon foydalanuvchi',
                photo: '',
                lastSeen: Date.now()
            };
        }

        const currentUser = getCurrentTgUser();

        function loadLocalDirectory() {
            try {
                const raw = localStorage.getItem(LOCAL_USERS_KEY);
                const parsed = raw ? JSON.parse(raw) : {};
                return (parsed && typeof parsed === 'object') ? parsed : {};
            } catch (e) {
                return {};
            }
        }

        function saveLocalDirectory(mapObj) {
            try {
                localStorage.setItem(LOCAL_USERS_KEY, JSON.stringify(mapObj));
            } catch (e) {}
        }

        async function syncAndLoadUsers() {
            const localMap = loadLocalDirectory();
            localMap[currentUser.id] = currentUser;
            saveLocalDirectory(localMap);

            let combinedMap = { ...localMap };

            if (FIREBASE_DB_URL) {
                const base = FIREBASE_DB_URL.replace(/\/+$/, '');
                try {
                    await fetch(`${base}/tanishuv_users/${encodeURIComponent(currentUser.id)}.json`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(currentUser)
                    });
                    const res = await fetch(`${base}/tanishuv_users.json`);
                    if (res.ok) {
                        const remoteData = await res.json();
                        if (remoteData && typeof remoteData === 'object') {
                            combinedMap = { ...combinedMap, ...remoteData };
                            saveLocalDirectory(combinedMap);
                        }
                    }
                } catch (err) {}
            }

            renderTanishuvUsers(combinedMap);
        }

        function renderTanishuvUsers(usersMap) {
            const listEl = document.getElementById('usersFeedList');
            const countEl = document.getElementById('tanishuvUserCount');

            const usersArr = Object.values(usersMap || {})
                .filter(u => u && u.id)
                .sort((a, b) => (b.lastSeen || 0) - (a.lastSeen || 0));

            countEl.textContent = String(usersArr.length);
            listEl.innerHTML = '';

            usersArr.forEach(user => {
                const isMe = String(user.id) === String(currentUser.id);
                const card = document.createElement('div');
                card.className = 'user-profile-card' + (isMe ? ' is-me' : '');

                const left = document.createElement('div');
                left.className = 'user-card-left';

                const img = document.createElement('img');
                img.className = 'user-tg-photo';
                img.src = user.photo || fallbackAvatar;
                img.alt = user.atName || 'User';
                img.onerror = () => { img.src = fallbackAvatar; };

                const meta = document.createElement('div');
                meta.className = 'user-tg-meta';

                const nameLine = document.createElement('div');
                nameLine.className = 'user-tg-username';
                nameLine.textContent = (user.atName || '@foydalanuvchi') + (isMe ? ' (Siz)' : '');

                const fullLine = document.createElement('div');
                fullLine.className = 'user-tg-fullname';
                fullLine.textContent = user.fullName || 'Telegram foydalanuvchisi';

                meta.appendChild(nameLine);
                meta.appendChild(fullLine);

                left.appendChild(img);
                left.appendChild(meta);
                card.appendChild(left);

                if (user.username) {
                    const msgBtn = document.createElement('button');
                    msgBtn.type = 'button';
                    msgBtn.className = 'user-open-tg-btn';
                    msgBtn.textContent = 'Yozish';
                    msgBtn.onclick = () => {
                        const link = 'https://t.me/' + user.username;
                        if (tg && tg.openTelegramLink) {
                            tg.openTelegramLink(link);
                        } else {
                            window.open(link, '_blank', 'noopener,noreferrer');
                        }
                    };
                    card.appendChild(msgBtn);
                }

                listEl.appendChild(card);
            });
        }

        syncAndLoadUsers();

        setTimeout(() => {
            document.getElementById('splashScreen').classList.remove('active');
            document.getElementById('mainScreen').classList.add('active');
        }, 1600);

        function openPanel(panelName, btnEl) {
            document.querySelectorAll('.nav-item-btn').forEach(btn => btn.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');

            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
            const activePanel = document.getElementById('panel-' + panelName);
            if (activePanel) activePanel.classList.add('active');

            if (panelName === 'tanishuv') {
                syncAndLoadUsers();
            }

            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.selectionChanged();
            }
        }
    </script>
</body>
</html>
