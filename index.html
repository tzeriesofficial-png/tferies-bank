
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100b20">
<title>MONETA BANK</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080811;color:white;
 font-family:Arial,sans-serif
}
.app{
 max-width:520px;min-height:100vh;margin:auto;
 padding:20px 15px 105px;
 background:
 radial-gradient(ellipse at 0% 10%,#42105c,transparent 38%),
 radial-gradient(ellipse at 100% 65%,#034b43,transparent 35%),
 #080811
}
header{
 display:flex;align-items:center;justify-content:space-between;
 gap:8px;margin:8px 0 24px
}
.brand{display:flex;align-items:center;gap:11px}
.logo{
 width:45px;height:45px;border-radius:14px;
 display:grid;place-items:center;
 background:linear-gradient(140deg,#f4d5ff,#8534d4);
 color:#27113b;font-size:26px;font-weight:900;
 box-shadow:0 0 20px #a34aff55
}
.brand h1{
 margin:0;font-size:19px;
 background:linear-gradient(90deg,#fff,#d4a7ff);
 color:transparent;background-clip:text
}
.brand small{font-size:9px;color:#b9a9d4;letter-spacing:1px}
.balance{
 padding:12px;border-radius:30px;
 border:1px solid #8750c4;background:#211333;
 color:#ffe28a;font-weight:bold;font-size:13px;
 white-space:nowrap
}
.banner{
 border:1px solid #a64cff;border-radius:22px;
 padding:22px;background:linear-gradient(115deg,#411077,#210b42,#100d25);
 box-shadow:0 0 25px #8e32db44
}
.banner h2{font-size:25px;font-style:italic;margin:0 0 9px}
.banner p{color:#e1c9fa;font-size:13px;line-height:1.6}
.main-btn{
 border:0;border-radius:30px;padding:14px 19px;
 background:linear-gradient(#fff1a4,#ffb52c);
 color:#351900;font-weight:900
}
.tabs{display:flex;gap:9px;margin:22px 0;overflow-x:auto}
.tab{
 padding:12px 17px;border-radius:25px;
 border:1px solid #47335c;background:#191522;
 color:#d5c8e8;font-weight:bold;white-space:nowrap
}
.tab.active{background:linear-gradient(110deg,#a900ff,#562bff);color:white}
.search{
 width:100%;padding:15px 16px;border-radius:14px;
 border:1px solid #57406f;background:#151020;
 color:white;font-size:14px;margin-bottom:20px;outline:none
}
.heading{
 display:flex;justify-content:space-between;
 margin:20px 3px 14px;font-weight:bold
}
.heading small{color:#aaa;font-weight:normal}
.cards{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px
}
.card{
 border:1px solid #7545a4;border-radius:20px;overflow:hidden;
 background:#171522;min-width:0;
 box-shadow:0 5px 18px #0009;cursor:pointer;transition:.2s
}
.card:active{transform:scale(.97)}

/* RASM QISMI: MATN YO‘Q, TASHQI RASM KERAK EMAS */
.art{
 height:155px;position:relative;overflow:hidden;
 display:block;isolation:isolate;
 background:linear-gradient(135deg,var(--a),var(--b))
}
.art:before{
 content:"";position:absolute;
 width:190px;height:190px;border-radius:50%;
 right:-60px;top:-75px;
 border:2px solid #ffffff35;
 box-shadow:0 0 0 18px #ffffff0c,0 0 0 38px #ffffff08;
}
.art:after{
 content:"";position:absolute;
 width:125px;height:125px;border-radius:35px;
 left:-40px;bottom:-75px;
 transform:rotate(35deg);
 background:linear-gradient(135deg,#ffffff35,#ffffff05)
}
.art .orb{
 position:absolute;width:90px;height:90px;border-radius:50%;
 left:50%;top:50%;transform:translate(-50%,-50%);
 background:radial-gradient(circle at 35% 30%,#ffffff99,#ffffff15 55%,transparent 70%);
 box-shadow:0 0 45px #ffffff33;
}
.art .ring{
 position:absolute;width:125px;height:125px;border-radius:50%;
 border:2px solid #ffffff45;
 left:50%;top:50%;transform:translate(-50%,-50%);
}
.art .shape{
 position:absolute;width:65px;height:65px;
 border-radius:22px;left:50%;top:50%;
 transform:translate(-50%,-50%) rotate(35deg);
 background:linear-gradient(135deg,#ffffff50,#ffffff10);
 border:1px solid #ffffff55;
}
.art.poppo{
 background:
 radial-gradient(circle at 20% 20%,#ff9be9,transparent 35%),
 linear-gradient(135deg,#f000a8,#7a00c9,#ff9b00)
}
.art.yalla{
 background:
 radial-gradient(circle at 80% 15%,#b9fff7,transparent 35%),
 linear-gradient(135deg,#00c9b8,#00a8bb,#0874a9)
}
.art.room1{
 background:radial-gradient(circle at 50% 40%,#ffc8f1,#a32ed0 42%,#32105d)
}
.art.room2{
 background:radial-gradient(circle at 50% 40%,#ffe2a0,#d57a24 42%,#5b1836)
}
.art.room3{
 background:radial-gradient(circle at 50% 40%,#9fffe5,#159c9a 42%,#073b52)
}
.art.room4{
 background:radial-gradient(circle at 50% 40%,#c9b5ff,#6240c8 42%,#20124d)
}
.info{padding:13px}
.info h3{font-size:14px;margin:0 0 7px}
.info p{
 font-size:11px;color:#c0b4d0;
 margin:0 0 12px;min-height:25px;line-height:1.4
}
.foot{
 display:flex;align-items:center;justify-content:space-between;gap:5px
}
.price{font-size:10px;color:#ffdc80;font-weight:bold;line-height:1.5}
.go{
 border:0;border-radius:22px;padding:9px 11px;
 background:linear-gradient(#fff1a4,#ffb52c);
 color:#351900;font-weight:900;font-size:10px;white-space:nowrap
}
.empty{grid-column:1/-1;text-align:center;padding:35px 10px;color:#b9a9d4}

nav{
 position:fixed;bottom:0;left:50%;transform:translateX(-50%);
 width:min(100%,520px);display:flex;justify-content:space-around;
 background:#110d20ed;border:1px solid #7843b1;border-bottom:0;
 border-radius:20px 20px 0 0;padding:13px 4px 17px;
 backdrop-filter:blur(15px);z-index:5
}
nav button{
 background:none;border:0;color:#b9add0;font-size:10px;
 display:flex;flex-direction:column;align-items:center;gap:5px
}
nav svg{
 width:23px;height:23px;stroke:currentColor;fill:none;
 stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round
}
nav button.selected{color:#dba7ff}

.overlay{
 display:none;position:fixed;inset:0;background:#05040cf5;
 z-index:10;overflow:auto;padding:18px 12px
}
.modal{
 max-width:460px;margin:25px auto;
 background:linear-gradient(150deg,#241333,#11111f);
 border:1px solid #9854ce;border-radius:21px;padding:20px
}
.close{
 float:right;background:#392747;border:0;color:white;
 border-radius:50%;width:33px;height:33px;font-size:20px
}
.modal h2{font-size:23px;margin:12px 0}
.muted{color:#b7aac9;font-size:12px;line-height:1.5}
.option{
 display:flex;justify-content:space-between;align-items:center;
 padding:13px;margin:9px 0;border:1px solid #514064;
 border-radius:12px;background:#211b30;font-size:13px;gap:8px
}
.field{
 width:100%;padding:14px;border-radius:11px;
 border:1px solid #63477e;background:#0d0b16;
 color:white;margin:8px 0 13px;font-size:16px;outline:none
}
.wide{
 width:100%;padding:14px;border:0;border-radius:13px;
 background:linear-gradient(100deg,#a52cff,#5e37ff);
 color:white;font-weight:900;margin-top:10px
}
.note{
 font-size:11px;color:#ffdf9a;background:#302310;
 border:1px solid #735324;padding:11px;border-radius:10px;
 margin-top:12px;line-height:1.5
}
.method{
 width:100%;border:1px solid #665080;border-radius:13px;
 padding:15px;margin:10px 0;background:#1c1729;
 color:white;text-align:left;font-weight:bold
}
.order-item{
 padding:12px;border:1px solid #514064;border-radius:12px;
 margin:9px 0;background:#211b30;font-size:12px;line-height:1.7
}
@media(max-width:360px){
 .brand h1{font-size:16px}.balance{font-size:11px;padding:10px}
 .art{height:125px}.info{padding:9px}
}
</style>
</head>

<body>
<div class="app">

<header>
 <div class="brand">
  <div class="logo">M</div>
  <div>
   <h1>MONETA BANK</h1>
   <small>RAQAMLI XIZMATLAR MARKAZI</small>
  </div>
 </div>
 <div class="balance">0 so‘m</div>
</header>

<section class="banner">
 <h2>HISOBNI TO‘LDIRING</h2>
 <p>O‘zingizga kerakli xizmatni tanlang va buyurtma tafsilotlarini yuboring.</p>
 <button class="main-btn" onclick="topup()">HISOBNI TO‘LDIRISH →</button>
</section>

<div class="tabs">
 <button class="tab active" onclick="filter('All',this)">Barchasi</button>
 <button class="tab" onclick="filter('Live',this)">Ilovalar</button>
 <button class="tab" onclick="filter('Rooms',this)">Voice chat</button>
</div>

<input class="search" id="search" placeholder="Xizmat nomini qidiring..." oninput="render()">

<div class="heading">
 <span id="headingTitle">XIZMATLAR</span>
 <small id="serviceCount">6 ta xizmat</small>
</div>

<div class="cards" id="cards"></div>
</div>

<nav>
 <button class="selected" onclick="showPage('Home',this)">
  <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-7H9v7H3z"/></svg>
  Asosiy
 </button>
 <button onclick="showPage('Discover',this)">
  <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5M9 9l5-2-2 5-5 2z"/></svg>
  Qidiruv
 </button>
 <button onclick="showPage('Orders',this)">
  <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
  Buyurtmalar
 </button>
 <button onclick="showPage('Profile',this)">
  <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 3-8 8-8s8 3 8 8"/></svg>
  Profil
 </button>
</nav>

<div class="overlay" id="overlay">
 <div class="modal">
  <button class="close" onclick="closeModal()">×</button>
  <div id="modalContent"></div>
 </div>
</div>

<script>
const TELEGRAM="https://t.me/monetabankuz";

const services=[
 {
  name:"Poppo Live",type:"Live",unit:"tanga",
  packageSize:1,rate:9,
  display:"1 tanga = 9 so‘m",
  art:"poppo",label:"Poppo Live"
 },
 {
  name:"Yalla Live",type:"Live",unit:"tanga",
  packageSize:1,rate:null,
  display:"Narx admin bilan kelishiladi",
  art:"yalla",label:"Yalla Live"
 },
 {
  name:"Lounge Room",type:"Rooms",unit:"xizmat",
  packageSize:1,rate:5000,
  display:"5 000 so‘mdan",
  art:"room1",label:"Lounge Room"
 },
 {
  name:"Music Room",type:"Rooms",unit:"xizmat",
  packageSize:1,rate:7000,
  display:"7 000 so‘mdan",
  art:"room2",label:"Music Room"
 },
 {
  name:"Friends Room",type:"Rooms",unit:"xizmat",
  packageSize:1,rate:9000,
  display:"9 000 so‘mdan",
  art:"room3",label:"Friends Room"
 },
 {
  name:"VIP Room",type:"Rooms",unit:"xizmat",
  packageSize:1,rate:12000,
  display:"12 000 so‘mdan",
  art:"room4",label:"VIP Room"
 }
];

let orders=[];
try{
 orders=JSON.parse(localStorage.getItem("monetaOrders")||"[]");
 if(!Array.isArray(orders))orders=[];
}catch(e){orders=[]}

let currentFilter="All";

function render(){
 const cards=document.getElementById("cards");
 const search=document.getElementById("search").value.toLowerCase().trim();
 cards.innerHTML="";

 const list=services.filter(s=>{
  const category=currentFilter==="All"||s.type===currentFilter;
  return category&&s.name.toLowerCase().includes(search);
 });

 document.getElementById("serviceCount").textContent=list.length+" ta xizmat";

 if(!list.length){
  cards.innerHTML='<div class="empty">Xizmat topilmadi.</div>';
  return;
 }

 list.forEach(s=>{
  const el=document.createElement("div");
  el.className="card";

  const art=document.createElement("div");
  art.className="art "+s.art;

  /* Rasm ustida hech qanday yozuv yo‘q */
  art.innerHTML='<div class="orb"></div><div class="ring"></div><div class="shape"></div>';

  const info=document.createElement("div");
  info.className="info";

  const heading=document.createElement("h3");
  heading.textContent=s.name;

  const description=document.createElement("p");
  description.textContent=s.type==="Live"?"Jonli efir ilovasi":"Voice chat xonasi";

  const foot=document.createElement("div");
  foot.className="foot";

  const price=document.createElement("span");
  price.className="price";
  price.textContent=s.display;

  const button=document.createElement("button");
  button.className="go";
  button.textContent="Tanlash →";

  foot.append(price,button);
  info.append(heading,description,foot);
  el.append(art,info);

  el.onclick=()=>openService(s);
  cards.appendChild(el);
 });
}

function filter(type,button){
 currentFilter=type;
 document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
 button.classList.add("active");
 render();
}

function modal(html){
 document.getElementById("modalContent").innerHTML=html;
 document.getElementById("overlay").style.display="block";
}

function closeModal(){
 document.getElementById("overlay").style.display="none";
}

function openService(s){
 const isPackage=s.packageSize>1;

 modal(`
  <div style="color:#c79aff;font-size:10px;letter-spacing:2px">MONETA BANK • BUYURTMA</div>
  <h2>${s.name}</h2>
  <p class="muted">${s.display}</p>

  <label class="muted">${s.type==="Rooms"?"Nechta xona xizmati kerak?":"Qancha "+s.unit+" olmoqchisiz?"}</label>
  <input class="field" id="quantity" type="number" min="1" step="1" value="1">

  <div class="option">
   <span>Bir birlik narxi</span>
   <b>${s.rate===null?"Admin bilan kelishiladi":s.rate.toLocaleString("uz-UZ")+" so‘m"}</b>
  </div>

  <div class="option">
   <span>Jami miqdor</span>
   <b id="amount">1 ${s.unit}</b>
  </div>

  <div class="option">
   <span>Jami narx</span>
   <b id="total">${s.rate===null?"Admin tasdiqlaydi":s.rate.toLocaleString("uz-UZ")+" so‘m"}</b>
  </div>

  <label class="muted">Foydalanuvchi ID yoki aloqa ma’lumoti</label>
  <input class="field" id="uid" placeholder="ID raqamingizni kiriting">

  <button class="wide" id="orderBtn">BUYURTMA SO‘ROVINI YUBORISH</button>

  <div class="note">
   Buyurtma admin tomonidan tasdiqlanadi. Yakuniy narx va xizmat mavjudligi Telegram orqali kelishiladi.
  </div>
 `);

 const q=document.getElementById("quantity");
 const total=document.getElementById("total");
 const amount=document.getElementById("amount");

 q.addEventListener("input",()=>{
  const n=Number(q.value);

  if(!Number.isInteger(n)||n<1){
   total.textContent="0 so‘m";
   amount.textContent="0 "+s.unit;
   return;
  }

  amount.textContent=(n*s.packageSize).toLocaleString("uz-UZ")+" "+s.unit;
  total.textContent=s.rate===null
   ?"Admin tasdiqlaydi"
   :(n*s.rate).toLocaleString("uz-UZ")+" so‘m";
 });

 document.getElementById("orderBtn").onclick=()=>{
  const n=Number(q.value);
  const id=document.getElementById("uid").value.trim();

  if(!Number.isInteger(n)||n<1){
   alert("Miqdorni to‘g‘ri kiriting.");
   return;
  }

  if(!id){
   alert("ID yoki aloqa ma’lumotini kiriting.");
   return;
  }

  const itemCount=n*s.packageSize;
  const price=s.rate===null
   ?"Admin tasdiqlaydi"
   :(n*s.rate).toLocaleString("uz-UZ")+" so‘m";

  const message=
`Salom! MONETA BANK buyurtmasi haqida ma’lumot olmoqchiman.

Xizmat: ${s.name}
Soni: ${n}
Miqdor: ${itemCount} ${s.unit}
ID yoki aloqa: ${id}
Hisoblangan narx: ${price}

Iltimos, xizmat shartlarini tushuntirib bering.`;

  const order={
   name:s.name,quantity:n,amount:itemCount,
   unit:s.unit,id:id,price:price,
   date:new Date().toLocaleString("uz-UZ")
  };

  orders.unshift(order);
  try{
   localStorage.setItem("monetaOrders",JSON.stringify(orders));
  }catch(e){}

  window.open(TELEGRAM+"?text="+encodeURIComponent(message),"_blank");
 };
}

function topup(){
 modal(`
  <h2>Hisobni to‘ldirish</h2>
  <p class="muted">To‘lov bo‘yicha ma’lumot olish uchun admin bilan bog‘laning.</p>

  <button class="method" onclick="payment('HUMO')">HUMO bo‘yicha ma’lumot →</button>
  <button class="method" onclick="payment('UZCARD')">UZCARD bo‘yicha ma’lumot →</button>

  <div class="note">
   Bu tugmalar faqat ma’lumot olish uchun Telegram suhbatini ochadi.
   Karta PIN-kodi yoki SMS-kodni hech kimga yubormang.
  </div>
 `);
}

function payment(method){
 const message="Salom! MONETA BANK bo‘yicha "+method+" to‘lov tizimi haqida ma’lumot olmoqchiman.";
 window.open(TELEGRAM+"?text="+encodeURIComponent(message),"_blank");
}

function showPage(name,button){
 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("selected"));
 button.classList.add("selected");

 const cards=document.getElementById("cards");
 const tabs=document.querySelector(".tabs");
 const search=document.getElementById("search");
 const title=document.getElementById("headingTitle");

 cards.style.display="grid";
 tabs.style.display="flex";
 search.style.display="block";

 if(name==="Home"){
  currentFilter="All";
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".tab")[0].classList.add("active");
  title.textContent="XIZMATLAR";
  render();
  return;
 }

 if(name==="Discover"){
  title.textContent="XIZMATLARNI QIDIRISH";
  render();
  search.focus();
  return;
 }

 tabs.style.display="none";
 search.style.display="none";

 if(name==="Orders"){
  title.textContent="BUYURTMALAR";
  cards.innerHTML="";

  if(!orders.length){
   cards.innerHTML='<div class="empty">Hozircha buyurtmalar yo‘q.</div>';
  }else{
   orders.forEach(o=>{
    const el=document.createElement("div");
    el.className="order-item";
    el.innerHTML=`
     <b>${o.name}</b><br>
     Miqdor: ${o.amount} ${o.unit}<br>
     Narx: ${o.price}<br>
     ID: ${o.id}<br>
     <span style="color:#b9a9d4">${o.date||""}</span>
    `;
    cards.appendChild(el);
   });
  }
 }

 if(name==="Profile"){
  title.textContent="PROFIL";
  cards.innerHTML=`
   <div class="empty">
    <div style="font-size:30px;margin-bottom:10px">M</div>
    <b>MONETA BANK</b>
    <p>Raqamli xizmatlar markazi</p>
    <p>Balans: 0 so‘m</p>
    <button class="main-btn" onclick="window.open('${TELEGRAM}','_blank')">ADMIN BILAN BOG‘LANISH</button>
   </div>
  `;
 }

}

document.getElementById("overlay").addEventListener("click",e=>{
 if(e.target===e.currentTarget)closeModal();
});

render();
</script>
</body>
</html>
