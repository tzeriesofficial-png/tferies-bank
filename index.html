<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USERGG Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: all 0.2s ease;
        }

        body {
            height: 100vh;
            background: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 1-OYNA: GELIK KÖK-QORA KIRISH QISMI */
        #loaderPage {
            background: linear-gradient(180deg, #0b1d3a 0%, #050d1a 55%, #000000 100%);
            z-index: 300;
        }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 320px;
        }

        .loader-logo {
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(0, 136, 255, 0.6);
            animation: logoGlow 2s infinite ease-in-out;
        }

        @keyframes logoGlow {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .long-progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 136, 255, 0.3);
        }

        .long-progress-fill {
            height: 100%;
            width: 0%;
            background: #0088ff;
            border-radius: 10px;
            box-shadow: 0 0 10px #0088ff;
            transition: width 0.05s linear;
        }

        .loader-percent {
            font-size: 16px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 2px;
        }

        /* 2-OYNA: ASOSIY EKRAN */
        #mainPage {
            justify-content: flex-start;
            padding: 25px 20px 20px 20px;
            background: #ffffff;
            overflow-y: auto;
        }

        .header-row {
            width: 100%;
            max-width: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .main-header {
            font-size: 22px;
            font-weight: 900;
            color: #000000;
            letter-spacing: 0.5px;
        }

        .nick-list {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-bottom: 20px;
        }

        .nick-card {
            width: 100%;
            background: #000000;
            border-radius: 18px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nick-main-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .left-group {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            flex: 1;
        }

        .nick-text {
            font-size: 16px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        /* Qimirlaydigan ko'k galochka */
        .moving-blue-check {
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            animation: checkMotion 1.8s infinite ease-in-out;
            flex-shrink: 0;
        }

        @keyframes checkMotion {
            0%, 100% { transform: scale(1) rotate(0deg); }
            30% { transform: scale(1.25) rotate(-10deg); }
            70% { transform: scale(1.15) rotate(10deg); }
        }

        .right-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .price-btn-label {
            background: rgba(0, 136, 255, 0.2);
            color: #0088ff;
            font-size: 11px;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(0, 136, 255, 0.4);
            text-transform: uppercase;
            cursor: pointer;
        }

        /* Qimirlaydigan premium ko'k savatcha stikeri */
        .moving-cart-svg {
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            animation: cartMotion 2s infinite ease-in-out;
            cursor: pointer;
        }

        @keyframes cartMotion {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.18) rotate(6deg); }
        }

        /* Narx qismi */
        .nick-price-row {
            display: none;
            align-items: center;
            gap: 6px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            font-size: 15px;
            font-weight: 900;
            color: #0088ff;
        }

        .nick-card.open .nick-price-row {
            display: flex;
        }

        /* Nikimni sotaman tugmasi */
        .sell-card {
            width: 100%;
            background: #000000;
            border-radius: 18px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(0, 136, 255, 0.3);
            text-decoration: none;
            cursor: pointer;
            margin-top: 6px;
        }

        .sell-text {
            font-size: 15px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .sell-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <!-- 1-OYNA: KIRISH QISMI -->
    <div id="loaderPage" class="page active">
        <div class="loader-container">
            <div class="loader-logo">USERGG</div>
            <div class="long-progress-container">
                <div id="longProgressFill" class="long-progress-fill"></div>
            </div>
            <div id="loaderPercent" class="loader-percent">0%</div>
        </div>
    </div>

    <!-- 2-OYNA: ASOSIY EKRAN -->
    <div id="mainPage" class="page">
        <div class="header-row">
            <div class="main-header">mavjud usernamelar</div>
            <span class="moving-blue-check">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" fill="#0088ff"/>
                    <path d="M8 12L11 15L16 9" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
        </div>
        
        <div class="nick-list">
            <!-- 1-Nik -->
            <div class="nick-card" id="card-1">
                <div class="nick-main-row">
                    <div class="left-group" onclick="togglePrice('card-1')">
                        <span class="nick-text">@okenft</span>
                        <span class="moving-blue-check">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="12" cy="12" r="10" fill="#0088ff"/>
                                <path d="M8 12L11 15L16 9" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                    </div>
                    <div class="right-group">
                        <span class="price-btn-label" onclick="togglePrice('card-1')">Narx</span>
                        <span class="moving-cart-svg" onclick="buyAxeoka()">
                            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M3 3h2l.4 2M7 13h10l3-8H6.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H19" stroke="#0088ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <circle cx="9" cy="20" r="1.5" fill="#0088ff"/>
                                <circle cx="18" cy="20" r="1.5" fill="#0088ff"/>
                            </svg>
                        </span>
                    </div>
                </div>
                <div class="nick-price-row">
                    <span>Narxi: 10,000 soʻm</span>
                </div>
            </div>

            <!-- 2-Nik -->
            <div class="nick-card" id="card-2">
                <div class="nick-main-row">
                    <div class="left-group" onclick="togglePrice('card-2')">
                        <span class="nick-text">@axeoka</span>
                        <span class="moving-blue-check">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="12" cy="12" r="10" fill="#0088ff"/>
                                <path d="M8 12L11 15L16 9" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                    </div>
                    <div class="right-group">
                        <span class="price-btn-label" onclick="togglePrice('card-2')">Narx</span>
                        <span class="moving-cart-svg" onclick="buyAxeoka()">
                            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M3 3h2l.4 2M7 13h10l3-8H6.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H19" stroke="#0088ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <circle cx="9" cy="20" r="1.5" fill="#0088ff"/>
                                <circle cx="18" cy="20" r="1.5" fill="#0088ff"/>
                            </svg>
                        </span>
                    </div>
                </div>
                <div class="nick-price-row">
                    <span>Narxi: 10,000 soʻm</span>
                </div>
            </div>

            <!-- 3-Nik -->
            <div class="nick-card" id="card-3">
                <div class="nick-main-row">
                    <div class="left-group" onclick="togglePrice('card-3')">
                        <span class="nick-text">@axeake</span>
                        <span class="moving-blue-check">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="12" cy="12" r="10" fill="#0088ff"/>
                                <path d="M8 12L11 15L16 9" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                    </div>
                    <div class="right-group">
                        <span class="price-btn-label" onclick="togglePrice('card-3')">Narx</span>
                        <span class="moving-cart-svg" onclick="buyAxeoka()">
                            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M3 3h2l.4 2M7 13h10l3-8H6.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H19" stroke="#0088ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <circle cx="9" cy="20" r="1.5" fill="#0088ff"/>
                                <circle cx="18" cy="20" r="1.5" fill="#0088ff"/>
                            </svg>
                        </span>
                    </div>
                </div>
                <div class="nick-price-row">
                    <span>Narxi: 10,000 soʻm</span>
                </div>
            </div>

            <!-- Nikimni sotaman bo'limi -->
            <div class="sell-card" onclick="sellUsername()">
                <span class="sell-text">nikimni sotaman</span>
                <div class="sell-right">
                    <span class="moving-blue-check">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="10" fill="#0088ff"/>
                            <path d="M8 12L11 15L16 9" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <span class="moving-cart-svg">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 3h2l.4 2M7 13h10l3-8H6.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H19" stroke="#0088ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="9" cy="20" r="1.5" fill="#0088ff"/>
                            <circle cx="18" cy="20" r="1.5" fill="#0088ff"/>
                        </svg>
                    </span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { tg.ready(); tg.expand(); }

        let currentProgress = 0;
        const fillElement = document.getElementById('longProgressFill');
        const percentElement = document.getElementById('loaderPercent');

        const loadingInterval = setInterval(() => {
            if (currentProgress < 100) {
                currentProgress++;
                fillElement.style.width = currentProgress + '%';
                percentElement.textContent = currentProgress + '%';
            } else {
                clearInterval(loadingInterval);
                setTimeout(() => {
                    document.getElementById('loaderPage').classList.remove('active');
                    document.getElementById('mainPage').classList.add('active');
                }, 400);
            }
        }, 25);

        function togglePrice(cardId) {
            const cardElement = document.getElementById(cardId);
            document.querySelectorAll('.nick-card').forEach(card => {
                if (card !== cardElement) card.classList.remove('open');
            });
            cardElement.classList.toggle('open');
        }

        // Qaysi savatcha bosilsa ham doim @axeoka va 10,000 so'm yozilib lichkaga o'tadi
        function buyAxeoka() {
            const text = encodeURIComponent(`Assalomu alaykum, @axeoka ni 10,000 soʻmga sotib olmoqchiman!`);
            const url = `https://t.me/pauladeroza?text=${text}`;
            
            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink(url);
            } else {
                window.location.href = url;
            }
        }

        function sellUsername() {
            const text = encodeURIComponent(`Assalomu alaykum, o'z username'imni sotmoqchiman.`);
            const url = `https://t.me/pauladeroza?text=${text}`;
            
            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink(url);
            } else {
                window.location.href = url;
            }
        }
    </script>
</body>
</html>
