<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACAZES Trading</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            color: #111111;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Splash Screen */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #f4f6f9 0%, #dce1e8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            overflow: hidden;
            transition: opacity 0.8s ease;
        }

        .trading-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(0,0,0,0.035) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.035) 1px, transparent 1px);
            background-size: 32px 32px;
            z-index: 0;
        }

        .candle-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .svg-candle {
            position: absolute;
            bottom: -160px;
            animation: floatCandle linear infinite;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.12));
        }

        @keyframes floatCandle {
            0% { transform: translateY(0) scale(0.95); opacity: 0; }
            15% { opacity: 0.9; }
            85% { opacity: 0.9; }
            100% { transform: translateY(-115vh) scale(1.05); opacity: 0; }
        }

        .logo-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: logoPulse 2s infinite alternate ease-in-out;
        }

        @keyframes logoPulse {
            0% { transform: scale(1); filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.15)); }
            100% { transform: scale(1.04); filter: drop-shadow(0 8px 25px rgba(0, 0, 0, 0.35)); }
        }

        /* Yuqori Header */
        .app-header {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            background: rgba(255, 255, 255, 0.95);
            z-index: 100;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 3px;
            color: #111111;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .online-badge {
            font-size: 11px;
            font-weight: 700;
            background: #f1f3f5;
            padding: 3px 8px;
            border-radius: 8px;
            color: #333;
            border: 1px solid #e1e4e8;
        }

        .settings-btn {
            background: #f4f6f9;
            border: 1.5px solid #e1e4e8;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .settings-btn:active {
            transform: scale(0.92);
            background: #111111;
        }

        .settings-btn:active svg {
            stroke: #ffffff;
        }
