<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A C A Z E S</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #d60d06;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    /* 1. KIRISH EKRANI */
    .splash-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #d60d06;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    .splash-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .moving-brand {
      color: #ffffff;
      font-size: clamp(28px, 8vw, 44px);
      font-weight: 900;
      letter-spacing: 0.28em;
      padding-left: 0.28em;
      text-transform: uppercase;
      animation: pulseFloat 2.2s ease-in-out infinite;
    }

    @keyframes pulseFloat {
      0% {
        transform: translateY(0px) scale(1);
        letter-spacing: 0.28em;
      }
      50% {
        transform: translateY(-7px) scale(1.04);
        letter-spacing: 0.33em;
      }
      100% {
        transform: translateY(0px) scale(1);
        letter-spacing: 0.28em;
      }
    }

    /* 2. ASOSIY KONTENT MAYDONI */
    .main-layout {
      width: 100%;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background-color: #d60d06;
    }

    .page-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px 118px;
      display: none;
    }

    .page-content.active {
      display: block;
      animation: fadeTab 0.25s ease;
    }

    @keyframes fadeTab {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* PROFILM BO'LIMI */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 28px 16px;
      background: rgba(135, 6, 2, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 24px;
    }

    .avatar-ring {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #ffffff 0%, rgba(255, 255, 255, 0.35) 100%);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      margin-bottom: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #9e0803;
      display: block;
    }

    .profile-name-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .profile-name {
      font-size: 21px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.01em;
    }

    /* QIMIRLAB TURADIGAN OQ PREMIUM SVG GALOCHKA */
    .verified-badge-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      animation: badgeFloatPulse 2s ease-in-out infinite;
    }

    .verified-svg {
      width: 24px;
      height: 24px;
      overflow: visible;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.32));
    }

    .verified-check {
      animation: checkDrawPulse 2s ease-in-out infinite;
    }

    @keyframes badgeFloatPulse {
      0%, 100% {
        transform: translateY(0px) rotate(0deg) scale(1);
      }
      50% {
        transform: translateY(-3px) rotate(6deg) scale(1.1);
      }
    }

    @keyframes checkDrawPulse {
      0%, 100% {
        transform: scale(1);
        transform-origin: center;
      }
      50% {
        transform: scale(1.08);
        transform-origin: center;
      }
    }

    /* 3. PASTKI KATTA MENYU PANELI (HONA + PREMIUM QIMIRLOVCHI SVG STIKER) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      padding: 12px 14px 18px;
      background: #d60d06;
      border-top: 1px solid rgba(255, 255, 255, 0.24);
      z-index: 50;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      background: rgba(125, 4, 2, 0.78);
      padding: 8px;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .nav-item {
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.82);
      border-radius: 16px;
      padding: 9px 4px;
      min-height: 58px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: background 0.22s ease, color 0.22s ease, transform 0.15s ease;
    }

    .nav-item:active {
      transform: scale(0.96);
    }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.36);
    }

    .hona-sticker-box {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.3);
      animation: honaStickerMove 1.9s ease-in-out infinite;
    }

    .nav-item.active .hona-sticker-box {
      background: #ffffff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }

    .hona-svg {
      width: 19px;
      height: 19px;
      overflow: visible;
    }

    .hona-roof {
      transform-origin: center;
      animation: roofBounce 1.9s ease-in-out infinite;
    }

    @keyframes honaStickerMove {
      0%, 100% {
        transform: translateY(0px) rotate(0deg) scale(1);
      }
      50% {
        transform: translateY(-3px) rotate(-4deg) scale(1.08);
      }
    }

    @keyframes roofBounce {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-1.6px);
      }
    }

    .nav-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.01em;
      line-height: 1.15;
    }
  </style>
</head>
<body>
  <!-- KIRISH QISMI -->
  <div class="splash-screen" id="splash">
    <div class="moving-brand">A C A Z E S</div>
  </div>

  <!-- ASOSIY OYNA -->
  <div class="main-layout">
    <!-- 1. TAXI BO'LIMI -->
    <section class="page-content active" id="page-taxi"></section>

    <!-- 2. CHATLAR BO'LIMI -->
    <section class="page-content" id="page-chats"></section>

    <!-- 3. PROFILM BO'LIMI -->
    <section class="page-content" id="page-profile">
      <div class="profile-header">
        <div class="avatar-ring">
          <img
            id="tgPhoto"
            class="avatar-img"
            src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><rect width='120' height='120' fill='%23990703'/><circle cx='60' cy='46' r='20' fill='%23ffffff' fill-opacity='0.9'/><path d='M24 102C24 81 40 68 60 68C80 68 96 81 96 102' fill='%23ffffff' fill-opacity='0.9'/></svg>"
            alt=""
          />
        </div>

        <div class="profile-name-row">
          <span class="profile-name" id="tgName"></span>
          <span class="verified-badge-wrap">
            <svg class="verified-svg" viewBox="0 0 24 24" fill="none">
              <path
                d="M12 2.2L14.4 4.1L17.4 3.8L18.4 6.7L21.1 8.2L20.3 11.1L21.8 13.8L19.6 15.9L19.5 19L16.5 19.6L14.8 22.1L12 21L9.2 22.1L7.5 19.6L4.5 19L4.4 15.9L2.2 13.8L3.7 11.1L2.9 8.2L5.6 6.7L6.6 3.8L9.6 4.1L12 2.2Z"
                fill="#ffffff"
              />
              <path
                class="verified-check"
                d="M8.3 12.2L10.8 14.7L15.9 9.5"
                stroke="#d60d06"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </div>
      </div>
    </section>

    <!-- 4. GURPA BO'LIMI -->
    <section class="page-content" id="page-group"></section>

    <!-- 5. HONA BO'LIMI -->
    <section class="page-content" id="page-hona"></section>

    <!-- PASTKI KATTA MENYU PANELI -->
    <nav class="bottom-nav">
      <div class="nav-grid">
        <button type="button" class="nav-item active" data-target="page-taxi" aria-label="1"></button>
        <button type="button" class="nav-item" data-target="page-chats" aria-label="2"></button>
        <button type="button" class="nav-item" data-target="page-profile" aria-label="3"></button>
        <button type="button" class="nav-item" data-target="page-group" aria-label="4"></button>

        <!-- HONA + QIMIRLOVCHI PREMIUM SVG STIKER -->
        <button type="button" class="nav-item" data-target="page-hona">
          <span class="hona-sticker-box">
            <svg class="hona-svg" viewBox="0 0 24 24" fill="none">
              <path
                class="hona-roof"
                d="M3.5 11.2L12 4L20.5 11.2"
                stroke="#d60d06"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M6.2 9.5V18.8C6.2 19.4 6.6 19.8 7.2 19.8H16.8C17.4 19.8 17.8 19.4 17.8 18.8V9.5"
                stroke="#d60d06"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <rect
                x="10.2"
                y="13.5"
                width="3.6"
                height="6.3"
                rx="1"
                fill="#d60d06"
              />
            </svg>
          </span>
          <span class="nav-label">Hona</span>
        </button>
      </div>
    </nav>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#d60d06");
      tg.setBackgroundColor("#d60d06");
    }

    setTimeout(() => {
      document.getElementById("splash").classList.add("hide");
    }, 1500);

    const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
    const urlParams = new URLSearchParams(window.location.search);

    const fullName =
      urlParams.get("name") ||
      (tgUser ? [tgUser.first_name, tgUser.last_name].filter(Boolean).join(" ") : "") ||
      "";

    const photoUrl = urlParams.get("photo") || "";
    document.getElementById("tgName").textContent = fullName;

    const photoEl = document.getElementById("tgPhoto");
    if (photoUrl) {
      photoEl.src = photoUrl;
    }

    const navItems = document.querySelectorAll(".nav-item");
    const pages = document.querySelectorAll(".page-content");

    navItems.forEach((btn) => {
      btn.addEventListener("click", () => {
        const targetId = btn.dataset.target;

        navItems.forEach((item) => item.classList.remove("active"));
        btn.classList.add("active");

        pages.forEach((page) => {
          page.classList.toggle("active", page.id === targetId);
        });

        if (tg && tg.HapticFeedback) {
          tg.HapticFeedback.selectionChanged();
        }
      });
    });
  </script>
</body>
</html>
