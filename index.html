<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRASH</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            height: 100vh;
            background:
                radial-gradient(circle at 22% 20%, rgba(168, 85, 247, 0.35), transparent 45%),
                radial-gradient(circle at 80% 30%, rgba(59, 130, 246, 0.28), transparent 50%),
                radial-gradient(circle at 50% 85%, rgba(124, 58, 237, 0.32), transparent 55%),
                linear-gradient(180deg, #130829 0%, #090517 55%, #04020b 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .page {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease;
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 7 ta alohida yulduzcha */
        .star-7 {
            position: absolute;
            pointer-events: none;
            z-index: 1;
        }

        .star-7:nth-of-type(1) {
            top: 11%;
            left: 14%;
            animation: twinkle1 2.2s infinite ease-in-out;
        }

        .star-7:nth-of-type(2) {
            top: 16%;
            right: 16%;
            animation: twinkle2 2.6s infinite ease-in-out 0.3s;
        }

        .star-7:nth-of-type(3) {
            top: 31%;
            left: 9%;
            animation: twinkle1 2.1s infinite ease-in-out 0.6s;
        }

        .star-7:nth-of-type(4) {
            top: 38%;
            right: 10%;
            animation: twinkle2 2.5s infinite ease-in-out 0.9s;
        }

        .star-7:nth-of-type(5) {
            bottom: 24%;
            left: 17%;
            animation: twinkle1 2.4s infinite ease-in-out 1.1s;
        }

        .star-7:nth-of-type(6) {
            bottom: 18%;
            right: 18%;
            animation: twinkle2 2.3s infinite ease-in-out 0.4s;
        }

        .star-7:nth-of-type(7) {
            top: 56%;
            left: 82%;
            animation: twinkle1 2.7s infinite ease-in-out 0.8s;
        }

        @keyframes twinkle1 {
            0%, 100% { transform: scale(0.85) rotate(0deg); opacity: 0.65; }
            50% { transform: scale(1.22) rotate(12deg); opacity: 1; }
        }

        @keyframes twinkle2 {
            0%, 100% { transform: scale(1.1) rotate(0deg); opacity: 0.75; }
            50% { transform: scale(0.82) rotate(-14deg); opacity: 1; }
        }

        /* 1-OYNA: KIRISH QISMI */
        #loaderPage {
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .loader-wrap {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 345px;
            padding: 0 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .crash-card {
            width: 100%;
            background: linear-gradient(160deg, rgba(109, 40, 217, 0.34) 0%, rgba(30, 12, 66, 0.68) 55%, rgba(10, 5, 25, 0.9) 100%);
            border: 1.5px solid rgba(192, 132, 252, 0.55);
            border-radius: 26px;
            padding: 24px 18px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-shadow: 0 20px 45px rgba(109, 40, 217, 0.38), inset 0 0 26px rgba(168, 85, 247, 0.18);
        }

        .rocket-3d-box {
            width: 175px;
            height: 145px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 16px 26px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 18px rgba(168, 85, 247, 0.45));
        }

        .rocket-3d-flight {
            animation: flight3D 2.4s infinite ease-in-out;
            transform-origin: 88px 72px;
        }

        @keyframes flight3D {
            0%, 100% {
                transform: translate(0px, 3px) rotate(-2deg) scale(1);
            }
            50% {
                transform: translate(5px, -7px) rotate(4deg) scale(1.06);
            }
        }

        .flame-3d {
            animation: flamePulse 0.45s infinite alternate ease-in-out;
            transform-origin: 54px 92px;
        }

        @keyframes flamePulse {
            0% { transform: scale(0.92); opacity: 0.85; }
            100% { transform: scale(1.12); opacity: 1; }
        }

        .crash-label {
            font-size: 34px;
            font-weight: 950;
            font-style: italic;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow:
                0 3px 0 #4c1d95,
                0 0 22px rgba(192, 132, 252, 0.85);
        }

        .deco-lines {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .line-bar {
            height: 2.5px;
            border-radius: 99px;
            background: linear-gradient(90deg, transparent, #c084fc, #facc15, transparent);
            animation: linePulse 1.8s infinite ease-in-out;
        }

        .line-bar.a { width: 24px; }
        .line-bar.b { width: 64px; animation-delay: 0.2s; }
        .line-bar.c { width: 24px; animation-delay: 0.4s; }

        @keyframes linePulse {
            0%, 100% { opacity: 0.4; transform: scaleX(0.88); }
            50% { opacity: 1; transform: scaleX(1.1); }
        }

        .progress-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 99px;
            overflow: hidden;
            border: 1px solid rgba(192, 132, 252, 0.28);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #9333ea, #c084fc, #facc15);
            border-radius: 99px;
            box-shadow: 0 0 14px rgba(192, 132, 252, 0.8);
            transition: width 0.05s linear;
        }

        .progress-percent {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #f3e8ff;
        }

        /* 2-OYNA: ASOSIY SAHIFA VA PASTKI 4 TA BO'LIM */
        #mainPage {
            justify-content: space-between;
            z-index: 10;
        }

        .content-area {
            position: relative;
            z-index: 2;
            flex: 1;
            width: 100%;
            padding: 28px 18px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        .tab-panel {
            display: none;
            width: 100%;
            max-width: 360px;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            text-align: center;
        }

        .tab-panel.active {
            display: flex;
        }

        .panel-card {
            width: 100%;
            background: linear-gradient(160deg, rgba(109, 40, 217, 0.28) 0%, rgba(25, 11, 56, 0.72) 60%, rgba(10, 5, 24, 0.92) 100%);
            border: 1.5px solid rgba(192, 132, 252, 0.45);
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 16px 38px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(168, 85, 247, 0.14);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .panel-title {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 0.8px;
            color: #ffffff;
        }

        .panel-desc {
            font-size: 13.5px;
            color: #ddd6fe;
            line-height: 1.5;
        }

        /* HISOB BO'LIMI: {photo} va {name} + Qimirlaydigan Premium SVG Galochka */
        .profile-photo-ring {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #38bdf8, #c084fc, #facc15);
            box-shadow: 0 0 24px rgba(168, 85, 247, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-photo-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #140a2e;
        }

        .user-nick-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 2px;
        }

        .moving-badge-svg {
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            animation: badgeMove 1.8s infinite ease-in-out;
            flex-shrink: 0;
        }

        @keyframes badgeMove {
            0%, 100% { transform: scale(1) rotate(0deg); }
            30% { transform: scale(1.22) rotate(-10deg); }
            70% { transform: scale(1.14) rotate(10deg); }
        }

        .user-nick-text {
            font-size: 19px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.4px;
        }

        /* PASTKI 4 TA BO'LIM PANELI */
        .bottom-nav {
            position: relative;
            z-index: 5;
            width: 100%;
            background: rgba(11, 6, 26, 0.92);
            backdrop-filter: blur(14px);
            border-top: 1px solid rgba(192, 132, 252, 0.28);
            padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .nav-item {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 16px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            color: #a78bfa;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            background: rgba(139, 92, 246, 0.22);
            border-color: rgba(192, 132, 252, 0.5);
            color: #ffffff;
            box-shadow: 0 0 16px rgba(139, 92, 246, 0.28);
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .nav-item.active .nav-icon {
            transform: translateY(-1px) scale(1.08);
        }

        .nav-label {
            font-size: 11.5px;
            font-weight: 800;
            letter-spacing: 0.3px;
        }
    </style>
</head>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Telegram foydalanuvchi ma'lumotlari ({name} va {photo})
        function loadTelegramUser() {
            const user = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
            const nameEl = document.getElementById('userName');
            const photoEl = document.getElementById('userPhoto');

            let displayName = '@foydalanuvchi';
            if (user) {
                if (user.username) {
                    displayName = '@' + user.username;
                } else {
                    displayName = [user.first_name, user.last_name].filter(Boolean).join(' ') || '@foydalanuvchi';
                }
            }
            nameEl.textContent = displayName;

            const defaultAvatar = "data:image/svg+xml;utf8," + encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                    <rect width="100" height="100" fill="#1e103f"/>
                    <circle cx="50" cy="38" r="18" fill="#c084fc"/>
                    <path d="M20 86C24 68 36 60 50 60C64 60 76 68 80 86" fill="#7c3aed"/>
                </svg>
            `);

            photoEl.src = (user && user.photo_url) ? user.photo_url : defaultAvatar;
            photoEl.onerror = function () {
                this.src = defaultAvatar;
            };
        }
        loadTelegramUser();

        // Kirish chizig'i 100% gacha to'lib, keyingi oynaga o'tadi
        let current = 0;
        const fillEl = document.getElementById('progressFill');
        const percentEl = document.getElementById('progressPercent');

        const interval = setInterval(() => {
            if (current < 100) {
                current++;
                fillEl.style.width = current + '%';
                percentEl.textContent = current + '%';
            } else {
                clearInterval(interval);
                setTimeout(() => {
                    document.getElementById('loaderPage').classList.remove('active');
                    document.getElementById('mainPage').classList.add('active');
                }, 350);
            }
        }, 25);

        // Pastki 4 ta bo'lim o'rtasida o'tish
        function switchTab(tabName, btnEl) {
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');

            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
            const targetPanel = document.getElementById('panel-' + tabName);
            if (targetPanel) targetPanel.classList.add('active');
        }
    </script>
</body>
</html>
