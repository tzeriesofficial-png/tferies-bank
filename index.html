<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRASH & STARS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            height: 100vh;
            background:
                radial-gradient(circle at 22% 20%, rgba(168, 85, 247, 0.35), transparent 45%),
                radial-gradient(circle at 80% 30%, rgba(59, 130, 246, 0.28), transparent 50%),
                radial-gradient(circle at 50% 85%, rgba(124, 58, 237, 0.32), transparent 55%),
                linear-gradient(180deg, #130829 0%, #090517 55%, #04020b 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .page {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 7 TA SAP-SARIQ YULDUZCHA */
        .star-7 {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            filter: drop-shadow(0 0 6px rgba(250, 204, 21, 0.65));
        }

        .star-7:nth-of-type(1) { top: 10%; left: 14%; animation: twinkle1 2.2s infinite ease-in-out; }
        .star-7:nth-of-type(2) { top: 15%; right: 16%; animation: twinkle2 2.6s infinite ease-in-out 0.3s; }
        .star-7:nth-of-type(3) { top: 30%; left: 9%; animation: twinkle1 2.1s infinite ease-in-out 0.6s; }
        .star-7:nth-of-type(4) { top: 37%; right: 10%; animation: twinkle2 2.5s infinite ease-in-out 0.9s; }
        .star-7:nth-of-type(5) { bottom: 24%; left: 17%; animation: twinkle1 2.4s infinite ease-in-out 1.1s; }
        .star-7:nth-of-type(6) { bottom: 18%; right: 18%; animation: twinkle2 2.3s infinite ease-in-out 0.4s; }
        .star-7:nth-of-type(7) { top: 55%; left: 82%; animation: twinkle1 2.7s infinite ease-in-out 0.8s; }

        @keyframes twinkle1 {
            0%, 100% { transform: scale(0.85) rotate(0deg); opacity: 0.7; }
            50% { transform: scale(1.22) rotate(12deg); opacity: 1; }
        }

        @keyframes twinkle2 {
            0%, 100% { transform: scale(1.1) rotate(0deg); opacity: 0.75; }
            50% { transform: scale(0.82) rotate(-14deg); opacity: 1; }
        }

        /* KOSMO KEMA */
        .ufo-flyby {
            position: fixed;
            top: 22%;
            left: -90px;
            z-index: 2;
            pointer-events: none;
            animation: ufoCross 11s infinite linear;
            filter: drop-shadow(0 0 14px rgba(125, 211, 252, 0.55));
        }

        @keyframes ufoCross {
            0% { transform: translate(-90px, 0px) rotate(-6deg); opacity: 0; }
            8% { opacity: 1; }
            50% { transform: translate(55vw, -24px) rotate(4deg); opacity: 1; }
            92% { opacity: 1; }
            100% { transform: translate(115vw, 12px) rotate(-4deg); opacity: 0; }
        }

        /* TELEGRAM PREMIUM STAR ANIMATSIYASI */
        .tg-star-anim {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            animation: tgStarPulse 2s infinite ease-in-out;
            filter: drop-shadow(0 0 8px rgba(250, 204, 21, 0.55));
        }

        @keyframes tgStarPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.18) rotate(10deg); }
        }

        /* 1-OYNA: KIRISH QISMI */
        #loaderPage {
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .loader-wrap {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 345px;
            padding: 0 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .crash-card {
            width: 100%;
            background: linear-gradient(160deg, rgba(109, 40, 217, 0.34) 0%, rgba(30, 12, 66, 0.68) 55%, rgba(10, 5, 25, 0.9) 100%);
            border: 1.5px solid rgba(192, 132, 252, 0.55);
            border-radius: 26px;
            padding: 24px 18px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-shadow: 0 20px 45px rgba(109, 40, 217, 0.38), inset 0 0 26px rgba(168, 85, 247, 0.18);
        }

        .plane-3d-box {
            width: 185px;
            height: 145px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 16px 26px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 18px rgba(168, 85, 247, 0.45));
        }

        .plane-flight-anim {
            animation: planeHover 2.3s infinite ease-in-out;
            transform-origin: 90px 70px;
        }

        @keyframes planeHover {
            0%, 100% { transform: translate(0px, 3px) rotate(-2deg) scale(1); }
            50% { transform: translate(5px, -7px) rotate(3deg) scale(1.05); }
        }

        .propeller-spin {
            animation: propBlur 0.22s infinite alternate ease-in-out;
            transform-origin: 146px 61px;
        }

        @keyframes propBlur {
            0% { transform: scaleY(1); opacity: 0.95; }
            100% { transform: scaleY(0.28); opacity: 0.65; }
        }

        .crash-label {
            font-size: 34px;
            font-weight: 950;
            font-style: italic;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 3px 0 #4c1d95, 0 0 22px rgba(192, 132, 252, 0.85);
        }

        .deco-lines {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .line-bar {
            height: 2.5px;
            border-radius: 99px;
            background: linear-gradient(90deg, transparent, #c084fc, #facc15, transparent);
            animation: linePulse 1.8s infinite ease-in-out;
        }

        .line-bar.a { width: 24px; }
        .line-bar.b { width: 64px; animation-delay: 0.2s; }
        .line-bar.c { width: 24px; animation-delay: 0.4s; }

        @keyframes linePulse {
            0%, 100% { opacity: 0.4; transform: scaleX(0.88); }
            50% { opacity: 1; transform: scaleX(1.1); }
        }

        .progress-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 99px;
            overflow: hidden;
            border: 1px solid rgba(192, 132, 252, 0.28);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #9333ea, #c084fc, #facc15);
            border-radius: 99px;
            box-shadow: 0 0 14px rgba(192, 132, 252, 0.8);
            transition: width 0.05s linear;
        }

        .progress-percent {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #f3e8ff;
        }

        /* 2-OYNA: ASOSIY SAHIFA */
        #mainPage {
            justify-content: space-between;
            z-index: 10;
        }

        .content-area {
            position: relative;
            z-index: 3;
            flex: 1;
            width: 100%;
            padding: 12px 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        .tab-panel {
            display: none;
            width: 100%;
            max-width: 390px;
            flex-direction: column;
            align-items: center;
            gap: 11px;
        }

        .tab-panel.active {
            display: flex;
        }

        /* O'YINLAR BO'LIMI KARTALARI */
        .game-pick-card {
            width: 100%;
            background: linear-gradient(160deg, rgba(109, 40, 217, 0.36) 0%, rgba(28, 12, 62, 0.78) 60%, rgba(10, 5, 24, 0.94) 100%);
            border: 1.5px solid rgba(192, 132, 252, 0.55);
            border-radius: 22px;
            padding: 17px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            cursor: pointer;
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(139, 92, 246, 0.22);
        }

        .game-pick-card:active {
            transform: scale(0.97);
        }

        .game-pick-left {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }

        .game-pick-text {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .game-pick-title {
            font-size: 19px;
            font-weight: 950;
            letter-spacing: 0.8px;
            color: #ffffff;
        }

        .game-pick-sub {
            font-size: 11.5px;
            color: #ddd6fe;
            font-weight: 600;
        }

        .open-badge {
            background: linear-gradient(135deg, #9333ea, #c084fc);
            color: #ffffff;
            font-size: 12px;
            font-weight: 900;
            padding: 8px 14px;
            border-radius: 13px;
            flex-shrink: 0;
        }

        /* CRASH & SEKUNDAMER SHELL */
        .game-shell {
            width: 100%;
            background: linear-gradient(160deg, rgba(109, 40, 217, 0.28) 0%, rgba(20, 9, 48, 0.86) 60%, rgba(8, 4, 20, 0.96) 100%);
            border: 1.5px solid rgba(192, 132, 252, 0.45);
            border-radius: 24px;
            padding: 13px;
            display: flex;
            flex-direction: column;
            gap: 9px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65);
        }

        .game-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .stars-pill {
            background: rgba(15, 7, 36, 0.92);
            border: 1px solid rgba(250, 204, 21, 0.55);
            color: #fde047;
            font-size: 13px;
            font-weight: 900;
            padding: 6px 11px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .book-btn {
            background: rgba(139, 92, 246, 0.24);
            border: 1px solid rgba(192, 132, 252, 0.55);
            color: #ffffff;
            border-radius: 12px;
            padding: 6px 10px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11.5px;
            font-weight: 800;
            cursor: pointer;
        }

        .book-btn:active {
            transform: scale(0.96);
        }

        .history-strip {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .history-strip::-webkit-scrollbar {
            display: none;
        }

        .hist-chip {
            flex-shrink: 0;
            font-size: 11px;
            font-weight: 900;
            padding: 4px 8px;
            border-radius: 99px;
            background: rgba(124, 58, 237, 0.28);
            border: 1px solid rgba(192, 132, 252, 0.35);
            color: #f3e8ff;
        }

        .hist-chip.high {
            background: rgba(250, 204, 21, 0.18);
            border-color: rgba(250, 204, 21, 0.55);
            color: #fde047;
        }

        .hist-chip.low {
            background: rgba(244, 63, 94, 0.2);
            border-color: rgba(251, 113, 133, 0.5);
            color: #fda4af;
        }

        .flight-arena {
            position: relative;
            width: 100%;
            height: 158px;
            border-radius: 18px;
            background:
                radial-gradient(circle at 75% 25%, rgba(168, 85, 247, 0.26), transparent 55%),
                linear-gradient(180deg, rgba(16, 7, 38, 0.9) 0%, rgba(7, 3, 18, 0.96) 100%);
            border: 1px solid rgba(192, 132, 252, 0.32);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .multiplier-readout {
            position: relative;
            z-index: 3;
            font-size: 34px;
            font-weight: 950;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 0 22px rgba(192, 132, 252, 0.8);
        }

        .multiplier-readout.crashed {
            color: #fb7185;
            text-shadow: 0 0 22px rgba(244, 63, 94, 0.85);
        }

        .multiplier-readout.waiting {
            font-size: 18px;
            color: #fde047;
        }

        .live-plane-mover {
            position: absolute;
            left: 14%;
            bottom: 16%;
            z-index: 2;
            transition: left 0.08s linear, bottom 0.08s linear, transform 0.1s ease;
        }

        .live-plane-mover.crashed-plane {
            transform: rotate(35deg) scale(0.9);
            opacity: 0.55;
        }

        .bet-controls {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .bet-input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(9, 4, 22, 0.88);
            border: 1px solid rgba(192, 132, 252, 0.35);
            border-radius: 13px;
            padding: 6px 9px;
            gap: 8px;
        }

        .step-btn {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: 1px solid rgba(192, 132, 252, 0.45);
            background: rgba(124, 58, 237, 0.25);
            color: #ffffff;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
        }

        .step-btn:active {
            transform: scale(0.94);
        }

        .bet-amount-val {
            flex: 1;
            text-align: center;
            font-size: 14.5px;
            font-weight: 950;
            color: #ffffff;
        }

        .quick-bets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .q-btn {
            background: rgba(124, 58, 237, 0.2);
            border: 1px solid rgba(192, 132, 252, 0.35);
            color: #f3e8ff;
            font-size: 11px;
            font-weight: 800;
            padding: 5px 4px;
            border-radius: 9px;
            cursor: pointer;
        }

        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .bet-action-btn {
            padding: 12px 10px;
            border-radius: 14px;
            border: none;
            font-size: 13.5px;
            font-weight: 950;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: transform 0.14s ease, opacity 0.2s ease;
        }

        .bet-action-btn:active {
            transform: scale(0.96);
        }

        .btn-tikish {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4);
        }

        .btn-stop {
            background: linear-gradient(135deg, #eab308, #facc15);
            color: #14092c;
            box-shadow: 0 8px 20px rgba(250, 204, 21, 0.35);
        }

        .bet-action-btn:disabled {
            opacity: 0.38;
            cursor: not-allowed;
        }

        /* SEKUNDAMER O'YINI QO'SHIMCHA STILLARI */
        .stopwatch-ring-wrap {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .sw-needle-spin {
            animation: swTick 1.2s infinite ease-in-out;
            transform-origin: 36px 38px;
        }

        @keyframes swTick {
            0%, 100% { transform: rotate(-18deg) scale(1); }
            50% { transform: rotate(18deg) scale(1.08); }
        }

        .sw-status-line {
            font-size: 11.5px;
            font-weight: 800;
            color: #ddd6fe;
        }

        /* KITOBCHA MODAL */
        .rules-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(3, 1, 10, 0.78);
            backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        .rules-modal.open {
            display: flex;
        }

        .rules-box {
            width: 100%;
            max-width: 360px;
            background: linear-gradient(160deg, #24104d 0%, #0f0724 100%);
            border: 1.5px solid rgba(192, 132, 252, 0.6);
            border-radius: 22px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.75);
        }

        .rules-title {
            font-size: 18px;
            font-weight: 950;
            color: #fde047;
            text-align: center;
        }

        .rules-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
            line-height: 1.45;
            color: #f3e8ff;
        }

        .close-rules-btn {
            margin-top: 4px;
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(135deg, #9333ea, #c084fc);
            color: #ffffff;
            font-size: 13.5px;
            font-weight: 900;
            cursor: pointer;
        }

        /* HISOBIM BO'LIMI (STARS YECHISH) */
        .panel-card {
            width: 100%;
            background: linear-gradient(160deg, rgba(109, 40, 217, 0.28) 0%, rgba(25, 11, 56, 0.76) 60%, rgba(10, 5, 24, 0.94) 100%);
            border: 1.5px solid rgba(192, 132, 252, 0.45);
            border-radius: 24px;
            padding: 20px 18px;
            box-shadow: 0 16px 38px rgba(0, 0, 0, 0.55), inset 0 0 20px rgba(168, 85, 247, 0.14);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 13px;
            text-align: center;
        }

        .panel-title {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 0.8px;
            color: #ffffff;
        }

        .balance-big {
            font-size: 26px;
            font-weight: 950;
            color: #fde047;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 16px rgba(250, 204, 21, 0.35);
        }

        .withdraw-main-btn {
            width: 100%;
            padding: 13px 16px;
            border-radius: 15px;
            border: 1px solid rgba(250, 204, 21, 0.5);
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #ffffff;
            font-size: 14.5px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(124, 58, 237, 0.35);
        }

        .withdraw-box {
            display: none;
            width: 100%;
            flex-direction: column;
            gap: 10px;
            background: rgba(11, 5, 26, 0.85);
            border: 1px solid rgba(192, 132, 252, 0.4);
            border-radius: 18px;
            padding: 14px;
        }

        .withdraw-box.open {
            display: flex;
        }

        .target-switch-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .target-btn {
            padding: 9px 8px;
            border-radius: 12px;
            border: 1px solid rgba(192, 132, 252, 0.4);
            background: rgba(124, 58, 237, 0.2);
            color: #ddd6fe;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
        }

        .target-btn.active {
            background: linear-gradient(135deg, #9333ea, #c084fc);
            color: #ffffff;
            border-color: #fde047;
        }

        .limit-hint {
            font-size: 11.5px;
            color: #fde047;
            font-weight: 800;
        }

        .send-admin-btn {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #eab308, #facc15);
            color: #14092c;
            font-size: 13.5px;
            font-weight: 950;
            cursor: pointer;
        }

        /* HISOB BO'LIMI */
        .profile-photo-ring {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #38bdf8, #c084fc, #facc15);
            box-shadow: 0 0 24px rgba(168, 85, 247, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-photo-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #140a2e;
        }

        .user-nick-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 2px;
        }

        .user-nick-text {
            font-size: 19px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.4px;
        }

        .moving-badge-svg {
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            animation: badgeMove 1.8s infinite ease-in-out;
            flex-shrink: 0;
        }

        @keyframes badgeMove {
            0%, 100% { transform: scale(1) rotate(0deg); }
            30% { transform: scale(1.22) rotate(-10deg); }
            70% { transform: scale(1.14) rotate(10deg); }
        }

        /* PASTKI 4 TA BO'LIM PANELI */
        .bottom-nav {
            position: relative;
            z-index: 5;
            width: 100%;
            background: rgba(11, 6, 26, 0.92);
            backdrop-filter: blur(14px);
            border-top: 1px solid rgba(192, 132, 252, 0.28);
            padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .nav-item {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 16px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            color: #a78bfa;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            background: rgba(139, 92, 246, 0.22);
            border-color: rgba(192, 132, 252, 0.5);
            color: #ffffff;
            box-shadow: 0 0 16px rgba(139, 92, 246, 0.28);
        }

        .nav-icon {
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .anim-games { animation: iconWobble 2.1s infinite ease-in-out; }
        .anim-plane { animation: iconFly 1.9s infinite ease-in-out; }
        .anim-wallet { animation: iconBounce 2.2s infinite ease-in-out 0.25s; }
        .anim-user { animation: iconPulse 2.3s infinite ease-in-out 0.45s; }

        @keyframes iconWobble {
            0%, 100% { transform: rotate(0deg) scale(1); }
            30% { transform: rotate(-10deg) scale(1.1); }
            70% { transform: rotate(10deg) scale(1.1); }
        }

        @keyframes iconFly {
            0%, 100% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
            50% { transform: translate(2px, -3px) rotate(6deg) scale(1.12); }
        }

        @keyframes iconBounce {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-3px) scale(1.1); }
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.14); }
        }

        .nav-label {
            font-size: 11.5px;
            font-weight: 800;

                            <rect x="8.5" y="11.5" width="8.5" height="2" rx="1" fill="#c084fc"/>
                            <circle cx="17.5" cy="15.5" r="1.7" fill="#facc15" stroke="#6d28d9" stroke-width="0.9"/>
                            <rect x="23.2" y="6.5" width="1.4" height="8" rx="0.7" fill="#facc15"/>
                        </g>
                    </svg>
                </span>
                <span class="nav-label">crash</span>
            </button>

            <button class="nav-item" data-tab="myaccount" onclick="switchTab('myaccount', this)">
                <span class="nav-icon anim-wallet">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2.5L15 8.6L21.7 9.6L16.8 14.3L18 21L12 17.8L6 21L7.2 14.3L2.3 9.6L9 8.6L12 2.5Z" fill="#facc15"/>
                    </svg>
                </span>
                <span class="nav-label">hisobim</span>
            </button>

            <button class="nav-item" data-tab="account" onclick="switchTab('account', this)">
                <span class="nav-icon anim-user">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="8.2" r="3.8" fill="#c084fc" stroke="currentColor" stroke-width="1.6"/>
                        <path d="M5.2 19.2C5.8 16.1 8.6 14.2 12 14.2C15.4 14.2 18.2 16.1 18.8 19.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </span>
                <span class="nav-label">hisob</span>
            </button>
        </nav>
    </div>

    <!-- KITOBCHA: QANDAY O'YNALADI -->
    <div id="rulesModal" class="rules-modal" onclick="closeRulesModal(event)">
        <div class="rules-box" onclick="event.stopPropagation()">
            <div id="rulesTitle" class="rules-title">Qanday oʻynaladi</div>
            <ul id="rulesList" class="rules-list"></ul>
            <button class="close-rules-btn" onclick="closeRulesModal()">Yopish</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;

        // Har bir foydalanuvchi uchun alohida identifikator (bitta umumiy kishiga tegishli bo'lmasligi uchun)
        function getUserStorageSuffix() {
            if (tgUser && tgUser.id) {
                return 'tg_u_' + String(tgUser.id);
            }
            let localUid = localStorage.getItem('local_unique_player_id_v1');
            if (!localUid) {
                localUid = 'guest_' + Math.random().toString(36).slice(2, 11) + '_' + Date.now().toString(36);
                localStorage.setItem('local_unique_player_id_v1', localUid);
            }
            return localUid;
        }

        const userSuffix = getUserStorageSuffix();
        const STORAGE_STARS_KEY = 'tg_stars_balance_' + userSuffix;
        const STORAGE_HIST_KEY = 'tg_crash_history_' + userSuffix;

        // Foydalanuvchi ma'lumotlari
        function loadTelegramUser() {
            const nameEl = document.getElementById('userName');
            const photoEl = document.getElementById('userPhoto');

            let displayName = '@foydalanuvchi';
            if (tgUser) {
                if (tgUser.username) {
                    displayName = '@' + tgUser.username;
                } else {
                    displayName = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') || '@foydalanuvchi';
                }
            }
            nameEl.textContent = displayName;

            const defaultAvatar = "data:image/svg+xml;utf8," + encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                    <rect width="100" height="100" fill="#1e103f"/>
                    <circle cx="50" cy="38" r="18" fill="#c084fc"/>
                    <path d="M20 86C24 68 36 60 50 60C64 60 76 68 80 86" fill="#7c3aed"/>
                </svg>
            `);

            photoEl.src = (tgUser && tgUser.photo_url) ? tgUser.photo_url : defaultAvatar;
            photoEl.onerror = function () {
                this.src = defaultAvatar;
            };
        }
        loadTelegramUser();

        // Kirish chizig'i 100% -> Asosiy sahifa
        let loadVal = 0;
        const fillEl = document.getElementById('progressFill');
        const percentEl = document.getElementById('progressPercent');

        const loadTimer = setInterval(() => {
            if (loadVal < 100) {
                loadVal++;
                fillEl.style.width = loadVal + '%';
                percentEl.textContent = loadVal + '%';
            } else {
                clearInterval(loadTimer);
                setTimeout(() => {
                    document.getElementById('loaderPage').classList.remove('active');
                    document.getElementById('mainPage').classList.add('active');
                }, 350);
            }
        }, 25);

        // Bo'limlar o'rtasida o'tish
        function switchTab(tabName, btnEl) {
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            if (btnEl) {
                btnEl.classList.add('active');
            } else {
                const navTarget = (tabName === 'stopwatch') ? 'games' : tabName;
                const targetBtn = document.querySelector(`.nav-item[data-tab="${navTarget}"]`);
                if (targetBtn) targetBtn.classList.add('active');
            }

            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
            const targetPanel = document.getElementById('panel-' + tabName);
            if (targetPanel) targetPanel.classList.add('active');
        }

        function openGameTab(gameTab) {
            switchTab(gameTab, null);
        }

        // KITOBCHA QOIDALARI
        function openRulesModal(mode) {
            const titleEl = document.getElementById('rulesTitle');
            const listEl = document.getElementById('rulesList');
            if (mode === 'stopwatch') {
                titleEl.textContent = 'Sekundamer — Qanday oʻynaladi';
                listEl.innerHTML = `
                    <li>• Tikish miqdorini va maqsad sekundni (masalan, <b>5.00s</b>) tanlang.</li>
                    <li>• Oʻyin toʻliq <b>omadga bogʻliq</b>: sekundamer ishlayotganda omadsizlik nuqtasi istalgan vaqtda kelishi mumkin.</li>
                    <li>• Maqsad sekundga yetganingizda <b>Olish</b> tugmasini bossangiz, yutuq = <b>Tikish × Sekund</b> (masalan, 1 Stars × 5 = <b>5 Stars</b>) hisoblanadi.</li>
                    <li>• Vaqtida ololmasangiz yoki omadsizlikka uchrasangiz, tikilgan Stars kuyadi.</li>
                `;
            } else {
                titleEl.textContent = 'CRASH — Qanday oʻynaladi';
                listEl.innerHTML = `
                    <li>• Koeffitsient <b>1.30x</b> ga yetmaguncha <b>Stop</b> bilan yutuqni olish mumkin emas.</li>
                    <li>• Oʻyin davom etayotganida tiksangiz, <b>keyingi raundgacha</b> kutib turadi.</li>
                    <li>• Yutib olganingizdan keyin keyingi oʻyin boshlanmaguncha qayta tikib boʻlmaydi.</li>
                    <li>• Har oʻlganda <b>4 soniyadan keyin</b> yangi raund boshlanadi.</li>
                `;
            }
            document.getElementById('rulesModal').classList.add('open');
        }

        function closeRulesModal(e) {
            if (!e || e.target.id === 'rulesModal') {
                document.getElementById('rulesModal').classList.remove('open');
            }
        }

        // HAR BIR FOYDALANUVCHI UCHUN ALOHIDA STARS BALANSI (BOSHLANG'ICH: 2 STARS)
        const savedStars = localStorage.getItem(STORAGE_STARS_KEY);
        let starsBalance = savedStars !== null ? Number(savedStars) : 2;
        if (Number.isNaN(starsBalance) || starsBalance < 0) starsBalance = 2;

        const savedHist = localStorage.getItem(STORAGE_HIST_KEY);
        let historyList = [1.45, 2.30, 1.12, 3.65, 1.68, 2.05];
        if (savedHist) {
            try {
                const parsed = JSON.parse(savedHist);
                if (Array.isArray(parsed) && parsed.length > 0) historyList = parsed;
            } catch (_) {}
        }

        const crashTopStarsEl = document.getElementById('crashTopStars');
        const swTopStarsEl = document.getElementById('swTopStars');
        const myAccountStarsEl = document.getElementById('myAccountStars');

        function formatStars(val) {
            const num = Number(val);
            const clean = Number.isInteger(num) ? num : +num.toFixed(2);
            return clean.toLocaleString('en-US') + ' Stars';
        }

        function saveAll() {
            localStorage.setItem(STORAGE_STARS_KEY, String(starsBalance));
            localStorage.setItem(STORAGE_HIST_KEY, JSON.stringify(historyList.slice(0, 15)));
        }

        function syncStars() {
            crashTopStarsEl.textContent = formatStars(starsBalance);
            swTopStarsEl.textContent = formatStars(starsBalance);
            myAccountStarsEl.textContent = formatStars(starsBalance);
            saveAll();
            updateCrashButtons();
        }

        // ADMINKA ORQALI YECHISH (POSTGA / PROFILGA)
        let withdrawTarget = 'Postga';
        let withdrawAmount = 1;

        function toggleWithdrawBox() {
            document.getElementById('withdrawBox').classList.toggle('open');
        }

        function getWithdrawRange() {
            return withdrawTarget === 'Postga' ? { min: 1, max: 10 } : { min: 50, max: 150 };
        }

        function selectWithdrawTarget(target) {
            withdrawTarget = target;
            document.getElementById('btnTargetPost').classList.toggle('active', target === 'Postga');
            document.getElementById('btnTargetProfile').classList.toggle('active', target === 'Profilga');

            const rng = getWithdrawRange();
            withdrawAmount = rng.min;
            document.getElementById('withdrawLimitHint').textContent =
                `${target}: minimal ${rng.min} Stars, maksimal ${rng.max} Stars`;
            document.getElementById('withdrawAmountDisplay').textContent = formatStars(withdrawAmount);
        }

        function changeWithdrawStars(delta) {
            const rng = getWithdrawRange();
            let next = withdrawAmount + delta;
            if (next < rng.min) next = rng.min;
            if (next > rng.max) next = rng.max;
            withdrawAmount = next;
            document.getElementById('withdrawAmountDisplay').textContent = formatStars(withdrawAmount);
        }

        function sendToAdmin() {
            const text = encodeURIComponent(
                `Assalomu alaykum @axeopeng, ${withdrawTarget} uchun ${withdrawAmount} Stars yechib olmoqchiman.`
            );
            const url = `https://t.me/axeopeng?text=${text}`;
            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink(url);
            } else {
                window.location.href = url;
            }
        }

        // CRASH O'YINI
        let crashBetInput = 1;
        let multiplier = 1.00;
        let crashPoint = 1.85;
        let crashPhase = 'flying'; // 'flying' | 'crashed' | 'waiting'
        let queuedBet = 0;
        let activeCrashBet = 0;
        let cashedOutThisRound = false;

        const crashBetDisplayEl = document.getElementById('crashBetDisplay');
        const multTextEl = document.getElementById('multiplierText');
        const planeMoverEl = document.getElementById('livePlaneMover');
        const btnCrashTikishEl = document.getElementById('btnCrashTikish');
        const btnCrashStopEl = document.getElementById('btnCrashStop');
        const historyStripEl = document.getElementById('historyStrip');

        function renderHistory() {
            historyStripEl.innerHTML = '';
            historyList.slice(0, 10).forEach(val => {
                const chip = document.createElement('span');
                chip.className = 'hist-chip ' + (val >= 2 ? 'high' : (val < 1.3 ? 'low' : ''));
                chip.textContent = Number(val).toFixed(2) + 'x';
                historyStripEl.appendChild(chip);
            });
        }

        function generateHardcoreCrashPoint() {
            const r = Math.random();
            if (r < 0.24) return +(1.06 + Math.random() * 0.22).toFixed(2);
            if (r < 0.68) return +(1.30 + Math.random() * 1.15).toFixed(2);
            if (r < 0.91) return +(2.45 + Math.random() * 2.50).toFixed(2);
            return +(5.00 + Math.random() * 4.50).toFixed(2);
        }

        function canPlaceCrashBet() {
            return !cashedOutThisRound && queuedBet === 0 && activeCrashBet === 0 && starsBalance >= crashBetInput;
        }

        function updateCrashButtons() {
            btnCrashTikishEl.disabled = !canPlaceCrashBet();

            const canStop =
                activeCrashBet > 0 &&
                crashPhase === 'flying' &&
                multiplier >= 1.30;
            btnCrashStopEl.disabled = !canStop;
        }

        function changeCrashBet(delta) {
            let next = crashBetInput + delta;
            if (next < 1) next = 1;
            if (next > 150) next = 150;
            crashBetInput = next;
            crashBetDisplayEl.textContent = formatStars(crashBetInput);
            updateCrashButtons();
        }

        function setCrashBetExact(val) {
            crashBetInput = val;
            crashBetDisplayEl.textContent = formatStars(crashBetInput);
            updateCrashButtons();
        }

        function placeCrashBet() {
            if (!canPlaceCrashBet()) return;
            starsBalance = +(starsBalance - crashBetInput).toFixed(2);
            syncStars();

            if (crashPhase === 'flying') {
                queuedBet = crashBetInput;
            } else {
                activeCrashBet = crashBetInput;
            }
            updateCrashButtons();
        }

        function cashoutCrashBet() {
            if (activeCrashBet <= 0 || crashPhase !== 'flying' || multiplier < 1.30) return;

            const won = Math.floor(activeCrashBet * multiplier * 100) / 100;
            starsBalance = +(starsBalance + won).toFixed(2);
            activeCrashBet = 0;
            cashedOutThisRound = true;
            syncStars();
            updateCrashButtons();
        }

        function startCrashRound() {
            multiplier = 1.00;
            crashPoint = generateHardcoreCrashPoint();
            crashPhase = 'flying';
            cashedOutThisRound = false;

            if (queuedBet > 0) {
                activeCrashBet = queuedBet;
                queuedBet = 0;
            }

            multTextEl.classList.remove('crashed', 'waiting');
            multTextEl.textContent = '1.00x';
            planeMoverEl.classList.remove('crashed-plane');
            planeMoverEl.style.left = '14%';
            planeMoverEl.style.bottom = '16%';
            updateCrashButtons();
        }

        function handleCrashBoom() {
            crashPhase = 'crashed';
            multTextEl.classList.add('crashed');
            multTextEl.textContent = multiplier.toFixed(2) + 'x';
            planeMoverEl.classList.add('crashed-plane');

            historyList.unshift(Number(multiplier.toFixed(2)));
            if (historyList.length > 15) historyList.pop();
            renderHistory();
            saveAll();

            if (activeCrashBet > 0) {
                activeCrashBet = 0;
            }
            updateCrashButtons();

            setTimeout(() => {
                crashPhase = 'waiting';
                cashedOutThisRound = false;
                multTextEl.classList.remove('crashed');
                multTextEl.classList.add('waiting');
                multTextEl.textContent = 'Keyingi raund...';
                updateCrashButtons();
            }, 1200);

            setTimeout(() => {
                startCrashRound();
            }, 4000);
        }

        // SEKUNDAMER O'YINI
        let swBet = 1;
        let swTargetSec = 5;
        let swElapsed = 0.00;
        let swBustSec = 3.20;
        let swRunning = false;
        let swTimer = null;

        const swBetDisplayEl = document.getElementById('swBetDisplay');
        const swTargetDisplayEl = document.getElementById('swTargetDisplay');
        const swClockTextEl = document.getElementById('swClockText');
        const swSubStatusEl = document.getElementById('swSubStatus');
        const btnSwStartEl = document.getElementById('btnSwStart');
        const btnSwTakeEl = document.getElementById('btnSwTake');

        function changeSwBet(delta) {
            if (swRunning) return;
            let next = swBet + delta;
            if (next < 1) next = 1;
            if (next > 100) next = 100;
            swBet = next;
            swBetDisplayEl.textContent = formatStars(swBet);
            swSubStatusEl.textContent = `Maqsad: ${swTargetSec.toFixed(2)}s (Yutuq: ${swBet * swTargetSec} Stars)`;
        }

        function changeSwTarget(delta) {
            if (swRunning) return;
            let next = swTargetSec + delta;
            if (next < 1) next = 1;
            if (next > 20) next = 20;
            swTargetSec = next;
            swTargetDisplayEl.textContent = swTargetSec.toFixed(2) + 's';
            swSubStatusEl.textContent = `Maqsad: ${swTargetSec.toFixed(2)}s (Yutuq: ${swBet * swTargetSec} Stars)`;
        }

        function startStopwatchGame() {
            if (swRunning || starsBalance < swBet) return;
            starsBalance = +(starsBalance - swBet).toFixed(2);
            syncStars();

            swRunning = true;
            swElapsed = 0.00;
            const luckRoll = Math.random();
            if (luckRoll < 0.55) {
                swBustSec = +(0.40 + Math.random() * Math.max(0.5, swTargetSec - 0.5)).toFixed(2);
            } else {
                swBustSec = +(swTargetSec + Math.random() * 2.5).toFixed(2);
            }

            btnSwStartEl.disabled = true;
            btnSwTakeEl.disabled = true;
            swClockTextEl.classList.remove('crashed', 'waiting');
            swSubStatusEl.textContent = `Maqsad: ${swTargetSec.toFixed(2)}s`;

            swTimer = setInterval(() => {
                swElapsed = +(swElapsed + 0.05).toFixed(2);
                swClockTextEl.textContent = swElapsed.toFixed(2) + 's';

                if (swElapsed >= swTargetSec) {
                    btnSwTakeEl.disabled = false;
                }

                if (swElapsed >= swBustSec) {
                    clearInterval(swTimer);
                    swRunning = false;
                    swClockTextEl.classList.add('crashed');
                    swSubStatusEl.textContent = `${swBustSec.toFixed(2)}s da uzildi (Omadsiz)`;
                    btnSwStartEl.disabled = false;
                    btnSwTakeEl.disabled = true;
                }
            }, 50);
        }

        function takeStopwatchWin() {
            if (!swRunning || swElapsed < swTargetSec) return;
            clearInterval(swTimer);
            swRunning = false;

            const winStars = swBet * swTargetSec;
            starsBalance = +(starsBalance + winStars).toFixed(2);
            syncStars();

            swClockTextEl.classList.remove('crashed');
            swClockTextEl.classList.add('waiting');
            swSubStatusEl.textContent = `Yutdingiz: +${winStars} Stars!`;
            btnSwStartEl.disabled = false;
            btnSwTakeEl.disabled = true;
        }

        // ISHGA TUSHIRISH
        syncStars();
        renderHistory();
        selectWithdrawTarget('Postga');
        changeSwTarget(0);
        startCrashRound();

        setInterval(() => {
            if (crashPhase === 'flying') {
                const step = multiplier < 1.5 ? 0.014 : (multiplier < 2.8 ? 0.025 : 0.042);
                multiplier = +(multiplier + step).toFixed(2);
                multTextEl.textContent = multiplier.toFixed(2) + 'x';

                const ratio = Math.min((multiplier - 1) / 4, 1);
                planeMoverEl.style.left = (14 + ratio * 54) + '%';
                planeMoverEl.style.bottom = (16 + ratio * 54) + '%';

                updateCrashButtons();

                if (multiplier >= crashPoint) {
                    handleCrashBoom();
                }
            }
        }, 80);
    </script>
