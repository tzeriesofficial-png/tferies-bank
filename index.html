<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tferies Bank</title>

    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{background-color:#08140e;color:#fff;font-family:sans-serif;padding-bottom:80px;}
        
        /* reCAPTCHA Oyna */
        #captcha-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #08140e; z-index: 99999; display: flex;
            flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        .captcha-box {
            background: #ffffff; color: #000; padding: 20px; border-radius: 8px;
            width: 100%; max-width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: space-between;
        }
        .captcha-left { display: flex; align-items: center; gap: 12px; }
        .captcha-checkbox {
            width: 28px; height: 28px; border: 2px solid #c1c1c1; border-radius: 3px;
            background: #f9f9f9; cursor: pointer; display: flex; align-items: center;
            justify-content: center; font-size: 18px; color: #1a73e8; font-weight: bold;
        }
        .captcha-text { font-size: 14px; font-weight: 500; color: #222; }
        .captcha-right { display: flex; flex-direction: column; align-items: center; }
        .captcha-logo { font-size: 20px; font-weight: bold; color: #1a73e8; }
        .captcha-footer { font-size: 9px; color: #555; margin-top: 2px; }

        /* Bank Interfeysi */
        .header{padding:20px;display:flex;justify-content:space-between;align-items:center;}
        .brand{color:#d4af37;font-size:20px;font-weight:bold;letter-spacing:1px;}
        .prof{width:36px;height:36px;background:#133321;border:1px solid #d4af37;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#d4af37;font-weight:bold;}
        .card-con{padding:0 16px;margin-top:10px;}
        .card{background:linear-gradient(135deg,#133321,#0b1d13);border:1px solid #d4af37;border-radius:20px;padding:24px;}
        .c-title{font-size:13px;color:#8b9a90;text-transform:uppercase;}
        .sum{font-size:32px;font-weight:bold;color:#fff;margin:8px 0 20px 0;}
        .acts{display:flex;gap:10px;}
        .btn{flex:1;background:rgba(212,175,55,0.15);border:1px solid #d4af37;color:#d4af37;padding:12px;border-radius:10px;font-weight:bold;text-align:center;cursor:pointer;font-size:14px;}
        .btn.prim{background:#d4af37;color:#08140e;border:none;}
        .page{display:none;padding:20px 16px;}
        .page.active{display:block;}
        .sec-title{font-size:16px;font-weight:bold;color:#d4af37;margin-bottom:15px;}
        .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px;}
        .s-item{background:#133321;border:1px solid #1a442d;border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;}
        .s-ic{font-size:16px;margin-bottom:6px;color:#d4af37;font-weight:bold;}
        .s-tx{font-size:11px;color:#cbd5d0;}
        .fg{margin-bottom:14px;}
        .fg label{font-size:12px;color:#d4af37;display:block;margin-bottom:6px;font-weight:600;}
        .fc{width:100%;padding:12px;background:#08140e;border:1px solid #1a442d;border-radius:10px;color:#fff;font-size:14px;outline:none;}
        .fc:focus{border-color:#d4af37;}
        .nav{position:fixed;bottom:0;left:0;right:0;height:65px;background:#060e0a;border-top:1px solid #133321;display:flex;justify-content:space-around;align-items:center;z-index:1000;}
        .n-it{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#6c7c72;flex:1;height:100%;cursor:pointer;}
        .n-it.active{color:#d4af37;}
        .n-ic{font-size:14px;margin-bottom:3px;font-weight:bold;}
        .n-lb{font-size:10px;}
    </style>
</head>
