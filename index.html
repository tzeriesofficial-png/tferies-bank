<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>acazesbot — Kalkulyator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0d0208;
            color: #ff69b4;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 15px;
            position: relative;
        }

        /* Professional SVG Pushti fon */
        .svg-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle at center, rgba(255, 20, 147, 0.2) 0%, rgba(13, 2, 8, 0.98) 85%);
        }

        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.25;
        }

        /* 1. KIRISH QISMI (acazesbot) */
        .splash-screen {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 400px;
            transition: opacity 0.5s ease;
        }

        .title-acazesbot {
            font-family: 'Cinzel', serif;
            font-size: 32px;
            letter-spacing: 8px;
            color: #ff69b4;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.9), 0 0 35px rgba(255, 20, 147, 0.6);
            margin-bottom: 25px;
            text-transform: lowercase;
            font-weight: 900;
        }

        .loader-ring {
            width: 50px;
            height: 50px;
            animation: rotate 2s linear infinite;
        }

        .loader-ring circle {
            fill: none;
            stroke: #ff1493;
            stroke-width: 3;
            stroke-dasharray: 120;
            stroke-dashoffset: 40;
            filter: drop-shadow(0 0 8px #ff1493);
        }

        /* 2. KATTA KALKULYATOR EKRANI */
        .calculator-wrapper {
            position: relative;
            z-index: 2;
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 380px;
            background: rgba(26, 5, 17, 0.9);
            border: 1.5px solid #ff1493;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.35);
            animation: fadeIn 0.5s ease-out;
        }

        .calc-header {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 4px;
            color: #ff69b4;
            text-align: center;
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .display-screen {
            width: 100%;
            background-color: #0d0208;
            border: 1px solid #8b0046;
            border-radius: 12px;
            padding: 18px 15px;
            margin-bottom: 20px;
            text-align: right;
            box-shadow: inset 0 0 15px rgba(255, 20, 147, 0.2);
            min-height: 95px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .prev-operand {
            font-size: 15px;
            color: #b34781;
            min-height: 20px;
            word-wrap: break-word;
        }

        .curr-operand {
            font-size: 34px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.7);
            word-wrap: break-word;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .calc-btn {
            background-color: #1f0614;
            border: 1px solid #8b0046;
            border-radius: 14px;
            height: 62px;
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: #ffb6c1;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .calc-btn:active {
            transform: scale(0.94);
            background-color: #3d0c27;
        }

        /* Amallar (+, -, *, /) tugmalari */
        .calc-btn.operator {
            background-color: #360921;
            border-color: #ff1493;
            color: #ff1493;
            font-size: 26px;
        }

        /* Tozalash (C va DEL) tugmalari */
        .calc-btn.clear {
            background-color: #2b071a;
            color: #ff69b4;
            font-size: 18px;
        }

        /* Teng (=) tugmasi */
        .calc-btn.equals {
            grid-column: span 2;
            background: linear-gradient(135deg, #c70067 0%, #ff1493 100%);
            border: 1px solid #ff69b4;
            color: #ffffff;
            font-size: 28px;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.6);
        }

        .calc-btn.equals:active {
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="svg-bg"></div>

    <!-- SVG Pushti Setka Fon -->
    <svg class="bg-pattern" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <defs>
            <pattern id="pinkGrid" width="35" height="35" patternUnits="userSpaceOnUse">
                <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#ff1493" stroke-width="0.6" stroke-opacity="0.25"/>
                <circle cx="0" cy="0" r="1.2" fill="#ff69b4" fill-opacity="0.4"/>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#pinkGrid)" />
    </svg>

    <!-- 1. KIRISH QISMI -->
    <div class="splash-screen" id="splashScreen">
        <div class="title-acazesbot">acazesbot</div>
        <svg class="loader-ring" viewBox="0 0 50 50">
            <circle cx="25" cy="25" r="20"></circle>
        </svg>
    </div>

    <!-- 2. KATTA KALKULYATOR -->
    <div class="calculator-wrapper" id="calcApp">
        <div class="calc-header">acazesbot</div>
        
        <div class="display-screen">
            <div class="prev-operand" id="prevOperand"></div>
            <div class="curr-operand" id="currOperand">0</div>
        </div>

        <div class="buttons-grid">
            <button class="calc-btn clear" onclick="clearDisplay()">AC</button>
            <button class="calc-btn clear" onclick="deleteLast()">⌫</button>
            <button class="calc-btn operator" onclick="chooseOperation('÷')">÷</button>
            <button class="calc-btn operator" onclick="chooseOperation('×')">×</button>

            <button class="calc-btn" onclick="appendNumber('7')">7</button>
            <button class="calc-btn" onclick="appendNumber('8')">8</button>
            <button class="calc-btn" onclick="appendNumber('9')">9</button>
            <button class="calc-btn operator" onclick="chooseOperation('-')">−</button>

            <button class="calc-btn" onclick="appendNumber('4')">4</button>
            <button class="calc-btn" onclick="appendNumber('5')">5</button>
            <button class="calc-btn" onclick="appendNumber('6')">6</button>
            <button class="calc-btn operator" onclick="chooseOperation('+')">+</button>

            <button class="calc-btn" onclick="appendNumber('1')">1</button>
            <button class="calc-btn" onclick="appendNumber('2')">2</button>
            <button class="calc-btn" onclick="appendNumber('3')">3</button>
            <button class="calc-btn" onclick="appendNumber('.')">.</button>

            <button class="calc-btn" onclick="appendNumber('0')">0</button>
            <button class="calc-btn" onclick="appendNumber('00')">00</button>
            <button class="calc-btn equals" onclick="compute()">=</button>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // Kirish ekranidan keyin kalkulyatorni ochish (2 soniya)
        setTimeout(() => {
            document.getElementById('splashScreen').style.display = 'none';
            document.getElementById('calcApp').style.display = 'flex';
        }, 2000);

        // Kalkulyator logikasi
        let currentOperand = '0';
        let previousOperand = '';
        let operation = undefined;

        const currDisplay = document.getElementById('currOperand');
        const prevDisplay = document.getElementById('prevOperand');

        function updateDisplay() {
            currDisplay.innerText = currentOperand;
            if (operation != null) {
                prevDisplay.innerText = `${previousOperand} ${operation}`;
            } else {
                prevDisplay.innerText = '';
            }
        }

        function appendNumber(number) {
            if (number === '.' && currentOperand.includes('.')) return;
            if (currentOperand === '0' && number !== '.') {
                if (number === '00') return;
                currentOperand = number.toString();
            } else {
                currentOperand = currentOperand.toString() + number.toString();
            }
            updateDisplay();
        }

        function chooseOperation(op) {
            if (currentOperand === '') return;
            if (previousOperand !== '') {
                compute();
            }
            operation = op;
            previousOperand = currentOperand;
            currentOperand = '';
            updateDisplay();
        }

        function compute() {
            let computation;
            const prev = parseFloat(previousOperand);
            const current = parseFloat(currentOperand);
            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+':
                    computation = prev + current;
                    break;
                case '-':
                    computation = prev - current;
                    break;
                case '×':
                    computation = prev * current;
                    break;
                case '÷':
                    if (current === 0) {
                        currentOperand = 'Xato';
                        previousOperand = '';
                        operation = undefined;
                        updateDisplay();
                        return;
                    }
                    computation = prev / current;
                    break;
                default:
                    return;
            }

            // O'nlik kasrlarni chiroyli yaxlitlash
            currentOperand = Math.round(computation * 100000000) / 100000000;
            operation = undefined;
            previousOperand = '';
            updateDisplay();
        }

        function clearDisplay() {
            currentOperand = '0';
            previousOperand = '';
            operation = undefined;
            updateDisplay();
        }

        function deleteLast() {
            if (currentOperand === 'Xato') {
                clearDisplay();
                return;
            }
            currentOperand = currentOperand.toString().slice(0, -1);
            if (currentOperand === '' || currentOperand === '-') {
                currentOperand = '0';
            }
            updateDisplay();
        }
    </script>
</body>
</html>
