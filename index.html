
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BILLIARD PRO</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#07101e;color:white;
 font-family:Arial,sans-serif;overflow:hidden;
 touch-action:none
}
#app{height:100dvh;display:flex;flex-direction:column}
header{
 height:85px;min-height:85px;
 display:flex;align-items:center;justify-content:space-around;
 background:linear-gradient(90deg,#101b32,#253653,#101b32);
 border-bottom:2px solid #526b90;padding:5px
}
.player{text-align:center;min-width:100px}
.name{font-weight:bold;font-size:14px}
.level{color:#ffd34e;font-size:12px;margin-top:5px}
.avatar{
 width:37px;height:37px;border:3px solid #e8bd55;
 border-radius:12px;margin:auto auto 3px;
 background:linear-gradient(135deg,#14a6a1,#182b52);
 display:grid;place-items:center;font-size:20px
}
.score{font-size:19px;color:#ffdc51;font-weight:bold}
.logo{font-size:17px;font-weight:900;color:#ffdc51}
#gameArea{
 flex:1;min-height:0;display:flex;align-items:center;
 justify-content:center;padding:8px
}
#table{
 width:min(100%,1400px);
 aspect-ratio:1.65;
 position:relative;
 background:linear-gradient(135deg,#164b88,#092957);
 border:9px ridge #b4b9c1;
 border-radius:35px;padding:27px;
 box-shadow:0 0 25px #000, inset 0 0 20px #000;
}
#felt{
 width:100%;height:100%;position:relative;
 overflow:hidden;border:5px solid #d1d8df;
 border-radius:12px;
 background:
 radial-gradient(ellipse at center,#e2edf2 0%,#b9ccd8 70%,#8ca7b9 100%);
 box-shadow:inset 0 0 22px #344c5e;
}
.pocket{
 width:6.5%;aspect-ratio:1;position:absolute;
 background:radial-gradient(circle,#000 48%,#171018 65%,#49515d 72%);
 border-radius:50%;z-index:5;
 box-shadow:0 2px 5px #000
}
.pocket:nth-child(1){top:-3%;left:-2%}
.pocket:nth-child(2){top:-3%;left:46.75%}
.pocket:nth-child(3){top:-3%;right:-2%}
.pocket:nth-child(4){bottom:-3%;left:-2%}
.pocket:nth-child(5){bottom:-3%;left:46.75%}
.pocket:nth-child(6){bottom:-3%;right:-2%}
#balls{position:absolute;inset:0}
.ball{
 position:absolute;width:3.1%;aspect-ratio:1;
 border-radius:50%;z-index:3;
 box-shadow:inset -4px -5px 7px #0007,inset 3px 3px 5px #fff9,0 2px 3px #0008;
 display:grid;place-items:center;
 font-size:clamp(6px,1vw,12px);font-weight:bold;color:#111
}
.ball::after{
 content:"";position:absolute;width:37%;height:37%;
 background:#fff;border-radius:50%;
 opacity:.9
}
.ball span{z-index:2;font-size:8px}
#aim{
 position:absolute;height:2px;background:#222;
 transform-origin:left center;z-index:8;
 pointer-events:none;opacity:.9;
 box-shadow:0 0 2px white
}
#cue{
 position:absolute;height:5px;width:35%;border-radius:4px;
 background:linear-gradient(90deg,#222,#d9c6a0 12%,#a77a48 17%,#eee0bd 90%,#222);
 transform-origin:left center;z-index:7;
 box-shadow:0 2px 4px #0008;pointer-events:none
}
#controls{
 min-height:100px;background:#101b30;
 border-top:2px solid #344e72;
 display:flex;align-items:center;justify-content:center;
 gap:14px;padding:10px;flex-wrap:wrap
}
button{
 background:linear-gradient(135deg,#168cba,#07517e);
 border:1px solid #55b8e6;color:white;
 border-radius:12px;padding:12px 17px;font-weight:bold;
 cursor:pointer
}
button:active{transform:scale(.96)}
.power{display:flex;align-items:center;gap:8px;font-size:13px}
input{width:110px;accent-color:#ffc83d}
#message{font-size:13px;color:#ffdf83;text-align:center}
@media(max-width:600px){
 header{height:66px;min-height:66px}
 .avatar{width:29px;height:29px;font-size:15px}
 .name{font-size:11px}.level{font-size:10px}
 .logo{font-size:13px}
 #table{padding:17px;border-width:6px;border-radius:20px}
 #controls{gap:7px;min-height:95px}
 button{padding:10px;font-size:11px}
 .power{font-size:11px}
 input{width:85px}
}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="player">
  <div class="avatar">👤</div>
  <div class="name">SIZ</div>
  <div class="level">⭐ 43-daraja</div>
  <div class="score" id="myScore">0</div>
 </div>
 <div class="logo">🎱 BILLIARD<br>PRO</div>
 <div class="player">
  <div class="avatar">🤖</div>
  <div class="name">PRO BOT</div>
  <div class="level">⭐ 46-daraja</div>
  <div class="score" id="botScore">0</div>
 </div>
</header>

<main id="gameArea">
 <div id="table">
  <div id="felt">
   <div class="pocket"></div><div class="pocket"></div>
   <div class="pocket"></div><div class="pocket"></div>
   <div class="pocket"></div><div class="pocket"></div>
   <div id="balls"></div>
   <div id="aim"></div>
   <div id="cue"></div>
  </div>
 </div>
</main>

<div id="controls">
 <div class="power">ZARBA KUCHI
  <input id="power" type="range" min="5" max="100" value="55">
  <span id="powerVal">55%</span>
 </div>
 <button id="hit">🎯 ZARBA BERISH</button>
 <button id="reset">↻ QAYTA</button>
 <button id="bot">🤖 BOT BILAN</button>
 <div id="message">Oq sharni barmog‘ingiz bilan yo‘naltiring</div>
</div>
</div>

<script>
const felt=document.getElementById('felt');
const layer=document.getElementById('balls');
const cue=document.getElementById('cue');
const aim=document.getElementById('aim');
const power=document.getElementById('power');
const message=document.getElementById('message');
const W=1000,H=550,R=16;
let balls=[],turn='you',moving=false,angle=0;
let myScore=0,botScore=0,aiming=false;
let start={x:300,y:275};
let lastTime=0;

const colors={
 1:'#f6d23a',2:'#2468c8',3:'#d83232',4:'#713ba0',
 5:'#ed8b25',6:'#25954b',7:'#792d20',8:'#16191e',
 9:'#f6d23a',10:'#2468c8',11:'#d83232',
 12:'#713ba0',13:'#ed8b25',14:'#25954b',15:'#792d20'
};
function makeBall(n,x,y){
 return {n,x,y,vx:0,vy:0,alive:true};
}
function setup(){
 balls=[];
 balls.push(makeBall(0,250,275));
 let positions=[
 [700,275],[728,258],[728,292],
 [756,241],[756,275],[756,309],
 [784,224],[784,258],[784,292],[784,326],
 [812,207],[812,241],[812,275],[812,309],[812,343]
 ];
 positions.forEach((p,i)=>balls.push(makeBall(i+1,p[0],p[1])));
 render();
}
function render(){
 layer.innerHTML='';
 balls.forEach(b=>{
  if(!b.alive)return;
  let el=document.createElement('div');
  el.className='ball';
  el.style.left=(b.x/W*100)+'%';
  el.style.top=(b.y/H*100)+'%';
  el.style.background=b.n===0?
   'radial-gradient(circle at 30% 25%,white,#ddd 65%,#777)':
   `radial-gradient(circle at 30% 25%,white,${colors[b.n]} 30%,${colors[b.n]} 75%,#111)`;
  if(b.n!==0){
   el.innerHTML='<span>'+((b.n-1)%8+1)+'</span>';
   if(b.n>8)el.style.background=
    `linear-gradient(white 20%,${colors[b.n]} 20%,${colors[b.n]} 80%,white 80%)`;
  }
  layer.appendChild(el);
 });
}
function getWhite(){return balls.find(b=>b.n===0)}
function setLine(x1,y1,x2,y2){
 let dx=x2-x1,dy=y2-y1;
 let len=Math.hypot(dx,dy);
 let deg=Math.atan2(dy,dx)*180/Math.PI;
 aim.style.left=x1/W*100+'%';
 aim.style.top=y1/H*100+'%';
 aim.style.width=(len/W*100)+'%';
 aim.style.transform=`rotate(${deg}deg)`;
 cue.style.left=(x1-dx/len*115)/W*100+'%';
 cue.style.top=y1/H*100+'%';
 cue.style.transform=`rotate(${deg}deg)`;
}
function coords(e){
 let rect=felt.getBoundingClientRect();
 return {
  x:(e.clientX-rect.left)/rect.width*W,
  y:(e.clientY-rect.top)/rect.height*H
 };
}
felt.addEventListener('pointerdown',e=>{
 if(moving||turn!=='you')return;
 aiming=true;
 let p=coords(e),w=getWhite();
 angle=Math.atan2(p.y-w.y,p.x-w.x);
 setLine(w.x,w.y,p.x,p.y);
});
felt.addEventListener('pointermove',e=>{
 if(!aiming)return;
 let p=coords(e),w=getWhite();
 angle=Math.atan2(p.y-w.y,p.x-w.x);
 setLine(w.x,w.y,p.x,p.y);
});
felt.addEventListener('pointerup',()=>{
 if(!aiming)return;
 aiming=false;
 shoot(angle,Number(power.value));
});
document.getElementById('power').oninput=e=>{
 document.getElementById('powerVal').textContent=e.target.value+'%';
};
document.getElementById('hit').onclick=()=>{
 if(moving||turn!=='you')return;
 shoot(angle,Number(power.value));
};
function shoot(a,p){
 if(moving||turn!=='you')return;
 let w=getWhite();
 w.vx=Math.cos(a)*p*.20;
 w.vy=Math.sin(a)*p*.20;
 moving=true;
 cue.style.display='none';aim.style.display='none';
 message.textContent='Sharlar harakatlanmoqda...';
}
function pocketCheck(b){
 const holes=[[0,0],[W/2,0],[W,0],[0,H],[W/2,H],[W,H]];
 for(const h of holes){
  if(Math.hypot(b.x-h[0],b.y-h[1])<43){
   b.alive=false;
   if(b.n!==0){
    if(turn==='you')myScore++;else botScore++;
    document.getElementById('myScore').textContent=myScore;
    document.getElementById('botScore').textContent=botScore;
   }else{
    b.x=250;b.y=275;b.vx=0;b.vy=0;
   }
   return true;
  }
 }
 return false;
}
function update(dt){
 let active=false;
 let friction=Math.pow(.988,dt/16.67);
 for(let b of balls){
  if(!b.alive)continue;
  b.x+=b.vx*dt/16.67;
  b.y+=b.vy*dt/16.67;
  b.vx*=friction;b.vy*=friction;
  if(Math.hypot(b.vx,b.vy)<.035){b.vx=0;b.vy=0}
  if(b.vx||b.vy)active=true;
  if(b.x<R+2){b.x=R+2;b.vx=Math.abs(b.vx)*.85}
  if(b.x>W-R-2){b.x=W-R-2;b.vx=-Math.abs(b.vx)*.85}
  if(b.y<R+2){b.y=R+2;b.vy=Math.abs(b.vy)*.85}
  if(b.y>H-R-2){b.y=H-R-2;b.vy=-Math.abs(b.vy)*.85}
  pocketCheck(b);
 }
 for(let i=0;i<balls.length;i++){
  let a=balls[i];if(!a.alive)continue;
  for(let j=i+1;j<balls.length;j++){
   let b=balls[j];if(!b.alive)continue;
   let dx=b.x-a.x,dy=b.y-a.y;
   let d=Math.hypot(dx,dy);
   if(d>0&&d<2*R){
    let nx=dx/d,ny=dy/d;
    let overlap=2*R-d;
    a.x-=nx*overlap/2;a.y-=ny*overlap/2;
    b.x+=nx*overlap/2;b.y+=ny*overlap/2;
    let rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
    if(rel>0){
     a.vx-=rel*nx*.96;a.vy-=rel*ny*.96;
     b.vx+=rel*nx*.96;b.vy+=rel*ny*.96;
    }
   }
  }
 }
 render();
 return active;
}
function loop(t){
 let dt=Math.min(t-lastTime||16,30);lastTime=t;
 if(moving){
  if(!update(dt)){
   moving=false;
   if(turn==='you'){
    turn='bot';
    message.textContent='Bot o‘ylayapti...';
    setTimeout(botTurn,700);
   }else{
    turn='you';message.textContent='Sizning navbatingiz!';
    cue.style.display='block';aim.style.display='block';
    let w=getWhite();setLine(w.x,w.y,w.x-150,w.y);
   }
  }
 }
 requestAnimationFrame(loop);
}
function botTurn(){
 if(turn!=='bot'||moving)return;
 let w=getWhite();
 let targets=balls.filter(b=>b.alive&&b.n!==0);
 if(!targets.length){turn='you';return}
 let target=targets[Math.floor(Math.random()*targets.length)];
 let a=Math.atan2(target.y-w.y,target.x-w.x);
 shootBot(a);
}
function shootBot(a){
 let w=getWhite();
 w.vx=Math.cos(a)*8;
 w.vy=Math.sin(a)*8;
 moving=true;
}
document.getElementById('reset').onclick=()=>{
 if(moving)return;
 myScore=0;botScore=0;turn='you';
 document.getElementById('myScore').textContent='0';
 document.getElementById('botScore').textContent='0';
 setup();cue.style.display='block';aim.style.display='block';
 let w=getWhite();setLine(w.x,w.y,w.x-150,w.y);
 message.textContent='Yangi o‘yin boshlandi!';
};
document.getElementById('bot').onclick=()=>{
 if(moving)return;
 if(turn==='you')message.textContent='Siz PRO BOT bilan o‘ynayapsiz!';
};
setup();
setLine(250,275,100,275);
requestAnimationFrame(loop);
</script>
</body>
</html>
