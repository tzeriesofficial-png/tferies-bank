<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACAZES TERRORIZM</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000000;
            color: #8b0000;
            font-family: 'Cinzel', 'Montserrat', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }

        /* Fon uchun chuqur qorong'ulik effekti */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(20, 0, 0, 0.4) 0%, rgba(0, 0, 0, 1) 85%);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
        }

        /* Asosiy matnlar */
        .title-acazes {
            font-size: 28px;
            letter-spacing: 14px;
            color: #8b0000;
            text-shadow: 0 0 12px rgba(139, 0, 0, 0.7), 0 0 25px rgba(100, 0, 0, 0.4);
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 900;
        }

        .title-terrorizm {
            font-size: 32px;
            letter-spacing: 10px;
            color: #ab0000;
            text-shadow: 0 0 15px rgba(171, 0, 0, 0.8), 0 0 30px rgba(139, 0, 0, 0.5);
            text-transform: uppercase;
            font-weight: 900;
            margin-bottom: 60px;
        }

        /* SVG Loader container */
        .loader-container {
            width: 80px;
            height: 80px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Premium SVG Spinner */
        .loader-svg {
            width: 100%;
            height: 100%;
            animation: rotate 3s linear infinite;
        }

        .loader-svg circle {
            fill: none;
            stroke-width: 3;
            stroke-dasharray: 150;
            stroke-dashoffset: 75;
            transform-origin: center;
        }

        .loader-outer {
            stroke: #5a0000;
            animation: dash 2s ease-in-out infinite;
        }

        .loader-inner {
            stroke: #ff0000;
            stroke-width: 2;
            animation: rotate-reverse 1.5s linear infinite;
            filter: drop-shadow(0px 0px 6px #ff0000);
        }

        @keyframes rotate {
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes rotate-reverse {
            100% {
                transform: rotate(-360deg);
            }
        }

        @keyframes dash {
            0% {
                stroke-dashoffset: 150;
            }
            50% {
                stroke-dashoffset: 35;
            }
            100% {
                stroke-dashoffset: 150;
            }
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="container">
        <div class="title-acazes">A C A Z E S</div>
        <div class="title-terrorizm">T E R R O R I Z M</div>

        <!-- Premium SVG Loader -->
        <div class="loader-container">
            <svg class="loader-svg" viewBox="0 0 50 50">
                <!-- Tashqi to'q qizil aylana -->
                <circle class="loader-outer" cx="25" cy="25" r="20"></circle>
                <!-- Ichki yorqin qizil nur sochuvchi aylana -->
                <circle class="loader-inner" cx="25" cy="25" r="12" stroke-dasharray="40" stroke-dashoffset="10"></circle>
            </svg>
        </div>
    </div>

    <script>
        // Telegram Mini App’ni to'liq ekranga yoyish
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
