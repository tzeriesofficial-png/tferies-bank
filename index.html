<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAME TOPUP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080f20;color:white;font-family:Arial,sans-serif;padding-bottom:85px}
header{padding:22px 18px;font-size:23px;font-weight:bold}
header span{color:#3285ff}
.balance{margin:0 15px;background:linear-gradient(120deg,#1765e9,#368eff);padding:22px;border-radius:22px}
.balance small{opacity:.8}
.amount{font-size:30px;font-weight:bold;margin:10px 0 20px}
.actions{display:flex;justify-content:space-between;gap:8px}
.actions button{flex:1;border:0;border-radius:12px;padding:12px 5px;background:#ffffff25;color:white;font-size:12px}
.actions button span{display:block;font-size:21px;margin-bottom:5px}
.tabs{display:flex;gap:10px;padding:20px 15px}
.tabs button{border:0;border-radius:20px;padding:10px 17px;background:#17243c;color:#aaa}
.tabs button.active{background:#287cff;color:white}
h3{padding:5px 17px 15px}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 13px}
.game{background:#121e34;border-radius:15px;overflow:hidden;cursor:pointer}
.game img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.game p{text-align:center;font-size:12px;padding:10px 3px}
nav{position:fixed;bottom:0;left:0;right:0;background:#101b30;display:flex;justify-content:space-around;padding:14px 5px;border-top:1px solid #26334b}
nav button{border:0;background:none;color:#9baac4;font-size:12px}
nav button span{display:block;font-size:21px;margin-bottom:4px}
.page{display:none;padding:15px}
.page.active{display:block}
.back{background:#1a2942;color:white;border:0;padding:12px 17px;border-radius:12px;margin-bottom:20px}
.detail{text-align:center}
.detail img{width:115px;height:115px;object-fit:cover;border-radius:20px}
.detail h2{margin:12px}
input{width:100%;padding:15px;border-radius:12px;border:1px solid #34435d;background:#121e34;color:white;margin:15px 0}
.packages{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
.package{background:#17243b;padding:17px;border-radius:14px;border:1px solid #293c5c;text-align:center;cursor:pointer}
.package.selected{border:2px solid #368aff;background:#1c3153}
.package strong{display:block;margin:8px 0}
.buy{position:fixed;bottom:72px;left:15px;right:15px;padding:15px;background:#287cff;color:white;border:0;border-radius:13px;font-size:16px;font-weight:bold}
#detailPage{padding-bottom:90px}
.info{background:#121e34;padding:18px;border-radius:14px;margin-top:15px}
</style>
</head>
<body>

<header>GAME <span>TOPUP</span></header>

<section id="homePage" class="page active">
<div class="balance">
<small>💳 Mening balansim</small>
<div class="amount">0 so'm</div>
<div class="actions">
<button onclick="alert('To‘lov tizimi hali ulanmagan')"><span>＋</span>Hisob to‘ldirish</button>
<button onclick="alert('Bonus kodlar tez orada')"><span>🎁</span>Bonus kod</button>
<button onclick="alert('Yordam xizmati')"><span>🎧</span>Yordam</button>
</div>
</div>

<div class="tabs">
<button class="active" onclick="filterGames('all',this)">Hammasi</button>
<button onclick="filterGames('game',this)">O'yinlar</button>
<button onclick="filterGames('service',this)">Servislar</button>
</div>

<h3>🎮 O'yinlar va servislar</h3>
<div class="games" id="games"></div>
</section>

<section id="detailPage" class="page">
<button class="back" onclick="showPage('homePage')">← Orqaga</button>
<div class="detail">
<img id="detailImg" src="images/pubg.jpg">
<h2 id="detailName">PUBG Mobile</h2>
</div>
<div class="info">
<b>Player ID</b>
<input id="playerId" placeholder="O'yinchi ID raqamini kiriting">
</div>
<h3 style="padding:20px 0 10px">Paketni tanlang</h3>
<div class="packages" id="packages"></div>
<button class="buy" onclick="buy()">Sotib olish</button>
</section>

<section id="historyPage" class="page">
<h2>📜 Xaridlar tarixi</h2>
<div class="info">Hozircha xaridlar mavjud emas.</div>
</section>

<section id="settingsPage" class="page">
<h2>⚙️ Sozlamalar</h2>
<div class="info">GAME TOPUP<br><br>Versiya: 1.0<br><br>Yordam: Telegram</div>
</section>

<nav>
<button onclick="showPage('homePage')"><span>⌂</span>Bosh sahifa</button>
<button onclick="showPage('historyPage')"><span>◷</span>Tarix</button>
<button onclick="showPage('settingsPage')"><span>⚙</span>Sozlamalar</button>
</nav>

<script>
const games=[
{name:"PUBG Mobile",image:"images/pubg.jpg",type:"game",packages:["60 UC","325 UC","660 UC","1800 UC","3850 UC","8100 UC"]},
{name:"Free Fire",image:"images/freefire.jpg",type:"game",packages:["100 Diamond","310 Diamond","520 Diamond","1060 Diamond"]},
{name:"Standoff 2",image:"images/standoff2.jpg",type:"game",packages:["100 Gold","300 Gold","500 Gold","1000 Gold"]},
{name:"Blood Strike",image:"images/bloodstrike.jpg",type:"game",packages:["100 Gold","300 Gold","500 Gold","1000 Gold"]},
{name:"Mobile Legends",image:"images/ml.jpg",type:"game",packages:["86 Diamond","172 Diamond","257 Diamond","706 Diamond"]},
{name:"Roblox",image:"images/roblox.jpg",type:"game",packages:["Robux 80","Robux 400","Robux 800"]},
{name:"Telegram",image:"images/telegram.jpg",type:"service",packages:["50 Stars","100 Stars","250 Stars"]},
{name:"YouTube",image:"images/youtube.jpg",type:"service",packages:["Obuna","Premium"]}
];

let currentGame=null;
let selectedPackage=null;

function renderGames(list=games){
document.getElementById("games").innerHTML=list.map((g,i)=>`
<div class="game" onclick="openGame('${g.name}')">
<img src="${g.image}" alt="${g.name}" onerror="this.style.background='#263b60'">
<p>${g.name}</p>
</div>`).join("");
}

function filterGames(type,btn){
document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
renderGames(type==="all"?games:games.filter(g=>g.type===type));
}

function openGame(name){
currentGame=games.find(g=>g.name===name);
selectedPackage=null;
document.getElementById("detailName").textContent=currentGame.name;
document.getElementById("detailImg").src=currentGame.image;
document.getElementById("playerId").value="";
document.getElementById("packages").innerHTML=currentGame.packages.map((p,i)=>`
<div class="package" onclick="selectPackage(this,'${p}')">
🎁<strong>${p}</strong><small>Narx: tez orada</small>
</div>`).join("");
showPage("detailPage");
}

function selectPackage(el,name){
document.querySelectorAll(".package").forEach(p=>p.classList.remove("selected"));
el.classList.add("selected");
selectedPackage=name;
}

function buy(){
if(!document.getElementById("playerId").value.trim()){
alert("Player ID kiriting!");
return;
}
if(!selectedPackage){
alert("Paketni tanlang!");
return;
}
alert("Bu demo versiya. Haqiqiy to‘lov va top-up tizimi hali ulanmagan.");
}

function showPage(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

renderGames();
</script>
</body>
  </html>
