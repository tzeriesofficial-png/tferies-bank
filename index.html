<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            color: #000000;
            overflow: hidden;
            position: relative;
        }

        /* KIRISH QISMI: OQ FON, YOZUVSIZ, BLOKSIZ KATTA QORA PREMIUM SVG SAMOLYOT */
        .tg-splash-screen {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.45s ease;
            z-index: 50;
        }

        .tg-splash-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .plane-svg-wrap {
            width: 146px;
            height: 146px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: tgPlaneMotion 2.4s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes tgPlaneMotion {
            0% {
                transform: translate(0px, 0px) rotate(0deg) scale(1);
            }
            35% {
                transform: translate(5px, -8px) rotate(-4deg) scale(1.04);
            }
            70% {
                transform: translate(-3px, -4px) rotate(3deg) scale(1.02);
            }
            100% {
                transform: translate(0px, 0px) rotate(0deg) scale(1);
            }
        }

        .plane-svg-wrap svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        /* ASOSIY OYNA VA 3 BO'LIMLI MENYU */
        .tg-main-shell {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .tg-content-area {
            flex: 1;
            width: 100%;
            overflow-y: auto;
            padding: 18px 16px;
        }

        .tg-section {
            display: none;
            width: 100%;
            height: 100%;
        }

        .tg-section.active {
            display: block;
        }

        /* PASTKI 3 TA IKONKALI MENYU */
        .tg-bottom-nav {
            width: 100%;
            background-color: #ffffff;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            flex-shrink: 0;
        }

        .tg-nav-btn {
            background: transparent;
            border: 1.5px solid transparent;
            border-radius: 16px;
            padding: 7px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: #111111;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .tg-nav-btn.active {
            background-color: rgba(0, 0, 0, 0.05);
            border-color: rgba(0, 0, 0, 0.16);
            color: #000000;
        }

        /* QIMIRLAB TURUVCHI PREMIUM SVG IKONKALAR */
        .premium-nav-svg {
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            animation: iconWigglePremium 2.1s ease-in-out infinite;
            transform-origin: center;
        }

        .tg-nav-btn:nth-child(2) .premium-nav-svg {
            animation-delay: 0.35s;
        }

        .tg-nav-btn:nth-child(3) .premium-nav-svg {
            animation-delay: 0.7s;
        }

        @keyframes iconWigglePremium {
            0%, 100% {
                transform: translateY(0px) rotate(0deg) scale(1);
            }
            35% {
                transform: translateY(-2.5px) rotate(-6deg) scale(1.07);
            }
            70% {
                transform: translateY(1px) rotate(6deg) scale(1.04);
            }
        }

        .premium-nav-svg svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }
    </style>
</head>
<body>

    <!-- KIRISH QISMI: OQ FON, YOZUVSIZ, BLOKSIZ KATTA QORA PREMIUM SVG SAMOLYOT -->
    <div id="tgSplash" class="tg-splash-screen">
        <div class="plane-svg-wrap">
            <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="planeBlackMain" x1="16" y1="22" x2="104" y2="96" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#1a1a1a"/>
                        <stop offset="55%" stop-color="#0a0a0a"/>
                        <stop offset="100%" stop-color="#000000"/>
                    </linearGradient>
                    <linearGradient id="planeBlackLeft" x1="20" y1="54" x2="54" y2="74" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#2c2c2c"/>
                        <stop offset="100%" stop-color="#111111"/>
                    </linearGradient>
                    <linearGradient id="planeBlackRight" x1="48" y1="66" x2="88" y2="96" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#0f0f0f"/>
                        <stop offset="100%" stop-color="#000000"/>
                    </linearGradient>
                    <linearGradient id="planeBlackFold" x1="44" y1="62" x2="66" y2="86" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#050505"/>
                        <stop offset="100%" stop-color="#1f1f1f"/>
                    </linearGradient>
                </defs>

                <path d="M18 86C26 84 32 87 37 92" stroke="#111111" stroke-width="2.4" stroke-linecap="round" opacity="0.5"/>
                <path d="M12 73C19 72 24 75 28 79" stroke="#262626" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

                <path d="M102 24L18 57.5C15.5 58.5 15.6 61.9 18.2 62.7L39.5 69.3L95.5 32.2C97.8 30.7 100.3 33.7 98.3 35.6L51.5 76.2L84.4 98.8C86.6 100.3 89.6 99 90.2 96.4L106.4 28.1C107.1 25.1 104.7 22.8 102 24Z" fill="url(#planeBlackMain)"/>
                <path d="M18 57.5L102 24L39.5 69.3L18.2 62.7C15.6 61.9 15.5 58.5 18 57.5Z" fill="url(#planeBlackLeft)"/>
                <path d="M51.5 76.2L98.3 35.6L90.2 96.4C89.6 99 86.6 100.3 84.4 98.8L51.5 76.2Z" fill="url(#planeBlackRight)"/>
                <path d="M39.5 69.3L98.3 35.6L51.5 76.2L47.8 91.8C47.2 94.3 43.9 94.8 42.6 92.6L39.5 69.3Z" fill="url(#planeBlackFold)"/>
                <path d="M22 59.4L98.5 27.6" stroke="#525252" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
            </svg>
        </div>
    </div>

    <!-- ASOSIY SAHIFA -->
    <div id="tgMainShell" class="tg-main-shell">
        <div class="tg-content-area">
            <section id="sec-chatlar" class="tg-section active"></section>
            <section id="sec-kontaktlar" class="tg-section"></section>
            <section id="sec-profil" class="tg-section"></section>
        </div>

        <!-- 3 TA QIMIRLAB TURUVCHI PREMIUM SVG IKONKA -->
        <nav class="tg-bottom-nav">
            <!-- 1. CHATLAR -->
            <button type="button" class="tg-nav-btn active" onclick="openSection('chatlar', this)">
                <span class="premium-nav-svg">
                    <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="chatBubbleGrad" x1="5" y1="6" x2="31" y2="28" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#2b2b2b"/>
                                <stop offset="100%" stop-color="#050505"/>
                            </linearGradient>
                        </defs>
                        <path d="M6 10.5C6 7.74 8.24 5.5 11 5.5H25C27.76 5.5 30 7.74 30 10.5V21.5C30 24.26 27.76 26.5 25 26.5H15.5L9.5 31.5V26.5H11C8.24 26.5 6 24.26 6 21.5V10.5Z" fill="url(#chatBubbleGrad)"/>
                        <circle cx="13" cy="16" r="1.8" fill="#ffffff"/>
                        <circle cx="18" cy="16" r="1.8" fill="#ffffff"/>
                        <circle cx="23" cy="16" r="1.8" fill="#ffffff"/>
                        <path d="M10.5 8.2H25.5" stroke="#7a7a7a" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>
                    </svg>
                </span>
                <span>chatlar</span>
            </button>

            <!-- 2. KONTAKTLAR -->
            <button type="button" class="tg-nav-btn" onclick="openSection('kontaktlar', this)">
                <span class="premium-nav-svg">
                    <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="contactBodyGrad" x1="6" y1="6" x2="30" y2="30" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#2d2d2d"/>
                                <stop offset="100%" stop-color="#070707"/>
                            </linearGradient>
                        </defs>
                        <circle cx="14.5" cy="12" r="5" fill="url(#contactBodyGrad)"/>
                        <path d="M5.5 28.5C6.4 23.1 10.1 19.8 14.5 19.8C18.9 19.8 22.6 23.1 23.5 28.5" fill="url(#contactBodyGrad)"/>
                        <circle cx="24.5" cy="13.5" r="3.6" fill="#1c1c1c"/>
                        <path d="M22.5 28.5C23.1 24.7 25.4 22.2 28.2 22.2C29.6 22.2 30.8 22.8 31.5 24" stroke="#111111" stroke-width="2.4" stroke-linecap="round"/>
                        <path d="M12.5 9.2L15.8 7.8" stroke="#8a8a8a" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>
                    </svg>
                </span>
                <span>kontaktlar</span>
            </button>

            <!-- 3. PROFIL -->
            <button type="button" class="tg-nav-btn" onclick="openSection('profil', this)">
                <span class="premium-nav-svg">
                    <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="profileRingGrad" x1="5" y1="5" x2="31" y2="31" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#2a2a2a"/>
                                <stop offset="100%" stop-color="#040404"/>
                            </linearGradient>
                        </defs>
                        <circle cx="18" cy="18" r="13" stroke="url(#profileRingGrad)" stroke-width="2.4" fill="rgba(0,0,0,0.03)"/>
                        <circle cx="18" cy="14" r="4.5" fill="url(#profileRingGrad)"/>
                        <path d="M10.5 27.2C11.7 23.4 14.5 21.3 18 21.3C21.5 21.3 24.3 23.4 25.5 27.2" stroke="url(#profileRingGrad)" stroke-width="2.5" stroke-linecap="round"/>
                    </svg>
                </span>
                <span>profil</span>
            </button>
        </nav>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        function openSection(secId, btnEl) {
            document.querySelectorAll(".tg-nav-btn").forEach(b => b.classList.remove("active"));
            if (btnEl) btnEl.classList.add("active");
            document.querySelectorAll(".tg-section").forEach(s => s.classList.remove("active"));
            const target = document.getElementById("sec-" + secId);
            if (target) target.classList.add("active");
        }

        setTimeout(() => {
            const splash = document.getElementById("tgSplash");
            if (splash) splash.classList.add("fade-out");
        }, 1500);
    </script>
</body>
</html>
