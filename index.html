<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRASH</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            height: 100vh;
            background:
                radial-gradient(circle at 22% 20%, rgba(168, 85, 247, 0.35), transparent 45%),
                radial-gradient(circle at 80% 30%, rgba(59, 130, 246, 0.28), transparent 50%),
                radial-gradient(circle at 50% 85%, rgba(124, 58, 237, 0.32), transparent 55%),
                linear-gradient(180deg, #130829 0%, #090517 55%, #04020b 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 7 ta alohida yulduzcha */
        .star-7 {
            position: absolute;
            pointer-events: none;
            z-index: 1;
        }

        .star-7:nth-of-type(1) {
            top: 11%;
            left: 14%;
            animation: twinkle1 2.2s infinite ease-in-out;
        }

        .star-7:nth-of-type(2) {
            top: 16%;
            right: 16%;
            animation: twinkle2 2.6s infinite ease-in-out 0.3s;
        }

        .star-7:nth-of-type(3) {
            top: 31%;
            left: 9%;
            animation: twinkle1 2.1s infinite ease-in-out 0.6s;
        }

        .star-7:nth-of-type(4) {
            top: 38%;
            right: 10%;
            animation: twinkle2 2.5s infinite ease-in-out 0.9s;
        }

        .star-7:nth-of-type(5) {
            bottom: 24%;
            left: 17%;
            animation: twinkle1 2.4s infinite ease-in-out 1.1s;
        }

        .star-7:nth-of-type(6) {
            bottom: 18%;
            right: 18%;
            animation: twinkle2 2.3s infinite ease-in-out 0.4s;
        }

        .star-7:nth-of-type(7) {
            top: 56%;
            left: 82%;
            animation: twinkle1 2.7s infinite ease-in-out 0.8s;
        }

        @keyframes twinkle1 {
            0%, 100% { transform: scale(0.85) rotate(0deg); opacity: 0.65; }
            50% { transform: scale(1.22) rotate(12deg); opacity: 1; }
        }

        @keyframes twinkle2 {
            0%, 100% { transform: scale(1.1) rotate(0deg); opacity: 0.75; }
            50% { transform: scale(0.82) rotate(-14deg); opacity: 1; }
        }

        .loader-wrap {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 345px;
            padding: 0 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .crash-card {
            width: 100%;
            background: linear-gradient(160deg, rgba(109, 40, 217, 0.34) 0%, rgba(30, 12, 66, 0.68) 55%, rgba(10, 5, 25, 0.9) 100%);
            border: 1.5px solid rgba(192, 132, 252, 0.55);
            border-radius: 26px;
            padding: 24px 18px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-shadow: 0 20px 45px rgba(109, 40, 217, 0.38), inset 0 0 26px rgba(168, 85, 247, 0.18);
        }

        .rocket-3d-box {
            width: 175px;
            height: 145px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 16px 26px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 18px rgba(168, 85, 247, 0.45));
        }

        .rocket-3d-flight {
            animation: flight3D 2.4s infinite ease-in-out;
            transform-origin: 88px 72px;
        }

        @keyframes flight3D {
            0%, 100% {
                transform: translate(0px, 3px) rotate(-2deg) scale(1);
            }
            50% {
                transform: translate(5px, -7px) rotate(4deg) scale(1.06);
            }
        }

        .flame-3d {
            animation: flamePulse 0.45s infinite alternate ease-in-out;
            transform-origin: 54px 92px;
        }

        @keyframes flamePulse {
            0% { transform: scale(0.92); opacity: 0.85; }
            100% { transform: scale(1.12); opacity: 1; }
        }

        .crash-label {
            font-size: 34px;
            font-weight: 950;
            font-style: italic;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow:
                0 3px 0 #4c1d95,
                0 0 22px rgba(192, 132, 252, 0.85);
        }

        .deco-lines {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .line-bar {
            height: 2.5px;
            border-radius: 99px;
            background: linear-gradient(90deg, transparent, #c084fc, #facc15, transparent);
            animation: linePulse 1.8s infinite ease-in-out;
        }

        .line-bar.a { width: 24px; }
        .line-bar.b { width: 64px; animation-delay: 0.2s; }
        .line-bar.c { width: 24px; animation-delay: 0.4s; }

        @keyframes linePulse {
            0%, 100% { opacity: 0.4; transform: scaleX(0.88); }
            50% { opacity: 1; transform: scaleX(1.1); }
        }

        .progress-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 99px;
            overflow: hidden;
            border: 1px solid rgba(192, 132, 252, 0.28);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #9333ea, #c084fc, #facc15);
            border-radius: 99px;
            box-shadow: 0 0 14px rgba(192, 132, 252, 0.8);
            transition: width 0.05s linear;
        }

        .progress-percent {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #f3e8ff;
        }
    </style>
</head>
<body>

    <!-- 7 TA YULDUZCHA (HAR XIL JOYDA) -->
    <svg class="star-7" viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
        <polygon points="12,2 14.9,8.6 22,9.3 16.6,14 18.2,21 12,17.3 5.8,21 7.4,14 2,9.3 9.1,8.6" fill="#facc15"/>
    </svg>
    <svg class="star-7" viewBox="0 0 24 24" width="16" height="16" xmlns="http://www.w3.org/2000/svg">
        <polygon points="12,2 14.9,8.6 22,9.3 16.6,14 18.2,21 12,17.3 5.8,21 7.4,14 2,9.3 9.1,8.6" fill="#fde047"/>
    </svg>
    <svg class="star-7" viewBox="0 0 24 24" width="15" height="15" xmlns="http://www.w3.org/2000/svg">
        <polygon points="12,2 14.9,8.6 22,9.3 16.6,14 18.2,21 12,17.3 5.8,21 7.4,14 2,9.3 9.1,8.6" fill="#f59e0b"/>
    </svg>
    <svg class="star-7" viewBox="0 0 24 24" width="22" height="22" xmlns="http://www.w3.org/2000/svg">
        <polygon points="12,2 14.9,8.6 22,9.3 16.6,14 18.2,21 12,17.3 5.8,21 7.4,14 2,9.3 9.1,8.6" fill="#facc15"/>
    </svg>
    <svg class="star-7" viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
        <polygon points="12,2 14.9,8.6 22,9.3 16.6,14 18.2,21 12,17.3 5.8,21 7.4,14 2,9.3 9.1,8.6" fill="#fde047"/>
    </svg>
    <svg class="star-7" viewBox="0 0 24 24" width="19" height="19" xmlns="http://www.w3.org/2000/svg">
        <polygon points="12,2 14.9,8.6 22,9.3 16.6,14 18.2,21 12,17.3 5.8,21 7.4,14 2,9.3 9.1,8.6" fill="#facc15"/>
    </svg>
    <svg class="star-7" viewBox="0 0 24 24" width="14" height="14" xmlns="http://www.w3.org/2000/svg">
        <polygon points="12,2 14.9,8.6 22,9.3 16.6,14 18.2,21 12,17.3 5.8,21 7.4,14 2,9.3 9.1,8.6" fill="#fbbf24"/>
    </svg>

    <div class="loader-wrap">
        <div class="crash-card">
            <div class="rocket-3d-box">
                <svg viewBox="0 0 170 140" width="170" height="140" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- 3D Korpus gradienti -->
                        <linearGradient id="body3D" x1="78" y1="24" x2="128" y2="78" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="55%" stop-color="#e9d5ff"/>
                            <stop offset="100%" stop-color="#9333ea"/>
                        </linearGradient>
                        <!-- 3D Burun/Uch qismi -->
                        <linearGradient id="nose3D" x1="106" y1="22" x2="132" y2="48" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#c084fc"/>
                            <stop offset="100%" stop-color="#6b21a8"/>
                        </linearGradient>
                        <!-- 3D Oyna gradienti -->
                        <radialGradient id="window3D" cx="35%" cy="35%" r="65%">
                            <stop offset="0%" stop-color="#7dd3fc"/>
                            <stop offset="55%" stop-color="#2563eb"/>
                            <stop offset="100%" stop-color="#1e1b4b"/>
                        </radialGradient>
                        <!-- 3D Qanot gradienti -->
                        <linearGradient id="fin3D" x1="55" y1="50" x2="95" y2="95" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#a855f7"/>
                            <stop offset="100%" stop-color="#4c1d95"/>
                        </linearGradient>
                        <!-- 3D Alanga gradienti -->
                        <linearGradient id="fire3D" x1="62" y1="84" x2="26" y2="124" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#fef08a"/>
                            <stop offset="45%" stop-color="#fb923c"/>
                            <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
                        </linearGradient>
                    </defs>

                    <g class="rocket-3d-flight">
                        <!-- 3D Alanga -->
                        <g class="flame-3d">
                            <path d="M62 84 C44 92, 32 106, 26 122 C41 117, 49 113, 53 119 C56 110, 65 101, 74 92 Z" fill="url(#fire3D)"/>
                            <path d="M63 87 C51 94, 44 102, 41 110 C49 107, 54 106, 57 109 C61 103, 66 96, 71 91 Z" fill="#fef08a"/>
                        </g>

                        <!-- Orqa 3D qanot -->
                        <path d="M98 72 L103 98 L90 105 L82 81 Z" fill="url(#fin3D)"/>

                        <!-- Asosiy 3D raketa korpusi -->
                        <path d="M124 22 C124 22 138 26 138 44 C138 59 121 75 104 84 L74 54 C83 37 99 20 124 22Z" fill="url(#body3D)" stroke="#ffffff" stroke-width="1.5"/>

                        <!-- 3D burun qismi -->
                        <path d="M124 22 C131 24 137 31 138 40 C131 38 125 32 124 22Z" fill="url(#nose3D)"/>

                        <!-- 3D yon qanot -->
                        <path d="M82 56 L55 52 L48 64 L74 72 Z" fill="url(#fin3D)" stroke="#c084fc" stroke-width="1"/>

                        <!-- 3D illyuminator (oyna) -->
                        <circle cx="113" cy="45" r="10.5" fill="#4c1d95"/>
                        <circle cx="112.5" cy="44.5" r="8.5" fill="url(#window3D)" stroke="#ffffff" stroke-width="1.6"/>
                        <ellipse cx="109.5" cy="41.5" rx="2.8" ry="1.6" transform="rotate(-35 109.5 41.5)" fill="#ffffff" opacity="0.85"/>
                    </g>
                </svg>
            </div>

            <div class="crash-label">CRASH</div>

            <div class="deco-lines">
                <span class="line-bar a"></span>
                <span class="line-bar b"></span>
                <span class="line-bar c"></span>
            </div>
        </div>

        <div class="progress-area">
            <div class="progress-track">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <div id="progressPercent" class="progress-percent">0%</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // 0% dan 100% gacha to'ladi va shu sahifada qoladi (keyingi oynaga o'tmaydi)
        let current = 0;
        const fillEl = document.getElementById('progressFill');
        const percentEl = document.getElementById('progressPercent');

        const interval = setInterval(() => {
            if (current < 100) {
                current++;
                fillEl.style.width = current + '%';
                percentEl.textContent = current + '%';
            } else {
                clearInterval(interval);
            }
        }, 25);
    </script>
</body>
</html>
