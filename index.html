<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A C A Z E S</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #14171d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    /* 1. KIRISH EKRANI */
    .splash-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #d60d06;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    .splash-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .moving-brand {
      color: #ffffff;
      font-size: clamp(28px, 8vw, 44px);
      font-weight: 900;
      letter-spacing: 0.28em;
      padding-left: 0.28em;
      text-transform: uppercase;
      animation: pulseFloat 2.2s ease-in-out infinite;
    }

    @keyframes pulseFloat {
      0% {
        transform: translateY(0px) scale(1);
        letter-spacing: 0.28em;
      }
      50% {
        transform: translateY(-7px) scale(1.04);
        letter-spacing: 0.33em;
      }
      100% {
        transform: translateY(0px) scale(1);
        letter-spacing: 0.28em;
      }
    }

    /* 2. ASOSIY KONTENT MAYDONI */
    .main-layout {
      width: 100%;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 50% 0%, rgba(214, 13, 6, 0.16) 0%, rgba(20, 23, 29, 0) 55%),
        #14171d;
    }

    .page-content {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px 96px;
      display: none;
    }

    .page-content.active {
      display: block;
      animation: fadeTab 0.25s ease;
    }

    @keyframes fadeTab {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-card {
      background: rgba(29, 34, 43, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }

    .section-sub {
      font-size: 13px;
      color: #9aa4b2;
      line-height: 1.45;
    }

    /* 3. PASTKI 4 TA MENYU PANELI */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      padding: 10px 12px 14px;
      background: rgba(20, 23, 29, 0.92);
      backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 50;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: #1b2029;
      padding: 6px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .nav-item {
      position: relative;
      border: none;
      background: transparent;
      color: #8f99a8;
      border-radius: 15px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: background 0.25s ease, color 0.25s ease, transform 0.2s ease;
    }

    .nav-item.active {
      background: rgba(214, 13, 6, 0.2);
      color: #ffffff;
      box-shadow: inset 0 0 0 1px rgba(214, 13, 6, 0.45);
    }

    /* Premium SVG stiker konteyneri va qimirlab turish animatsiyasi */
    .sticker-wrap {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
    }

    .nav-item.active .sticker-wrap {
      background: linear-gradient(145deg, #d60d06 0%, #8f0804 100%);
      border-color: rgba(255, 255, 255, 0.28);
      box-shadow: 0 6px 16px rgba(214, 13, 6, 0.42);
      animation: stickerWiggle 2.1s ease-in-out infinite;
    }

    .nav-item:hover .sticker-wrap {
      transform: translateY(-2px) scale(1.05);
    }

    .nav-svg {
      width: 21px;
      height: 21px;
      overflow: visible;
    }

    /* Har bir SVG detalining ichki harakati */
    .nav-item.active .svg-bob {
      animation: svgBob 1.7s ease-in-out infinite;
    }

    .nav-item.active .svg-tilt {
      transform-origin: center;
      animation: svgTilt 2s ease-in-out infinite;
    }

    .nav-item.active .svg-pulse {
      transform-origin: center;
      animation: svgPulse 1.8s ease-in-out infinite;
    }

    .nav-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1.1;
    }

    @keyframes stickerWiggle {
      0%, 100% {
        transform: translateY(0px) rotate(0deg) scale(1);
      }
      50% {
        transform: translateY(-3px) rotate(-2.5deg) scale(1.06);
      }
    }

    @keyframes svgBob {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-1.5px);
      }
    }

    @keyframes svgTilt {
      0%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(7deg);
      }
    }

    @keyframes svgPulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.12);
      }
    }
  </style>
</head>
<body>
  <!-- KIRISH QISMI -->
  <div class="splash-screen" id="splash">
    <div class="moving-brand">A C A Z E S</div>
  </div>

  <!-- ASOSIY OYNA -->
  <div class="main-layout">
    <!-- 1. TAXI BO'LIMI -->
    <section class="page-content active" id="page-taxi">
      <div class="section-card">
        <div class="section-title">Taxi</div>
        <div class="section-sub">A C A Z E S Taxi asosiy boʻlimi tayyor. Keyingi bosqichda buyurtma formalari va tariflarni shu yerga qoʻshamiz.</div>
      </div>
    </section>

    <!-- 2. CHATLAR BO'LIMI -->
    <section class="page-content" id="page-chats">
      <div class="section-card">
        <div class="section-title">Chatlar</div>
        <div class="section-sub">Haydovchi va mijozlar bilan yozishmalar boʻlimi.</div>
      </div>
    </section>

    <!-- 3. PROFILM BO'LIMI -->
    <section class="page-content" id="page-profile">
      <div class="section-card">
        <div class="section-title">Profilm</div>
        <div class="section-sub">Foydalanuvchi hisobi va sozlamalar boʻlimi.</div>
      </div>
    </section>

    <!-- 4. GURPA BO'LIMI -->
    <section class="page-content" id="page-group">
      <div class="section-card">
        <div class="section-title">Gurpa</div>
        <div class="section-sub">Jamoa / haydovchilar va hamkorlar guruhi boʻlimi.</div>
      </div>
    </section>

    <!-- PASTKI 4 TA MENYU -->
    <nav class="bottom-nav" aria-label="Asosiy menyu">
      <div class="nav-grid">
        <!-- TAXI -->
        <button type="button" class="nav-item active" data-target="page-taxi">
          <span class="sticker-wrap">
            <svg class="nav-svg svg-bob" viewBox="0 0 24 24" fill="none">
              <defs>
                <linearGradient id="taxiGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#ffffff" />
                  <stop offset="100%" stop-color="#ffd2cf" />
                </linearGradient>
              </defs>
              <path d="M5.5 11.5L7.2 6.8C7.5 6 8.2 5.5 9.1 5.5H14.9C15.8 5.5 16.5 6 16.8 6.8L18.5 11.5" stroke="url(#taxiGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="3.5" y="11.5" width="17" height="5.5" rx="2.2" stroke="url(#taxiGrad)" stroke-width="1.8"/>
              <circle cx="7.2" cy="17.5" r="1.7" fill="#ffffff"/>
              <circle cx="16.8" cy="17.5" r="1.7" fill="#ffffff"/>
              <path d="M9.8 3.5H14.2" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="nav-label">Taxi</span>
        </button>

        <!-- CHATLAR -->
        <button type="button" class="nav-item" data-target="page-chats">
          <span class="sticker-wrap">
            <svg class="nav-svg svg-tilt" viewBox="0 0 24 24" fill="none">
              <path d="M5 6.5C5 5.1 6.1 4 7.5 4H16.5C17.9 4 19 5.1 19 6.5V13.5C19 14.9 17.9 16 16.5 16H10.5L6.5 19.5V16C5.6 15.6 5 14.6 5 13.5V6.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <circle cx="9.2" cy="10" r="1.1" fill="currentColor" class="svg-pulse"/>
              <circle cx="12" cy="10" r="1.1" fill="currentColor" class="svg-pulse"/>
              <circle cx="14.8" cy="10" r="1.1" fill="currentColor" class="svg-pulse"/>
            </svg>
          </span>
          <span class="nav-label">Chatlar</span>
        </button>

        <!-- PROFILM -->
        <button type="button" class="nav-item" data-target="page-profile">
          <span class="sticker-wrap">
            <svg class="nav-svg svg-bob" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="8.2" r="3.4" stroke="currentColor" stroke-width="1.8"/>
              <path d="M5.5 19.2C5.5 16.1 8.4 14 12 14C15.6 14 18.5 16.1 18.5 19.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M17.5 5.5L18.1 6.8L19.4 7.4L18.1 8L17.5 9.3L16.9 8L15.6 7.4L16.9 6.8L17.5 5.5Z" fill="currentColor" class="svg-pulse"/>
            </svg>
          </span>
          <span class="nav-label">Profilm</span>
        </button>

        <!-- GURPA -->
        <button type="button" class="nav-item" data-target="page-group">
          <span class="sticker-wrap">
            <svg class="nav-svg svg-bob" viewBox="0 0 24 24" fill="none">
              <circle cx="9" cy="9" r="2.7" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="15.5" cy="9.8" r="2.2" stroke="currentColor" stroke-width="1.7"/>
              <path d="M4.2 18.5C4.2 16 6.5 14.3 9 14.3C11.5 14.3 13.8 16 13.8 18.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M14.5 14.6C16.6 14.8 19.8 16 19.8 18.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="nav-label">Gurpa</span>
        </button>
      </div>
    </nav>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#d60d06");
      tg.setBackgroundColor("#14171d");
    }

    setTimeout(() => {
      document.getElementById("splash").classList.add("hide");
      if (tg) {
        tg.setHeaderColor("#14171d");
      }
    }, 1600);

    const navItems = document.querySelectorAll(".nav-item");
    const pages = document.querySelectorAll(".page-content");

    navItems.forEach((btn) => {
      btn.addEventListener("click", () => {
        const targetId = btn.dataset.target;

        navItems.forEach((item) => item.classList.remove("active"));
        btn.classList.add("active");

        pages.forEach((page) => {
          page.classList.toggle("active", page.id === targetId);
        });

        if (tg && tg.HapticFeedback) {
          tg.HapticFeedback.selectionChanged();
        }
      });
    });
  </script>
</body>
</html>
