<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A C A Z E S</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #d60d06;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    /* 1. KIRISH EKRANI */
    .splash-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #d60d06;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    .splash-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .moving-brand {
      color: #ffffff;
      font-size: clamp(28px, 8vw, 44px);
      font-weight: 900;
      letter-spacing: 0.28em;
      padding-left: 0.28em;
      text-transform: uppercase;
      animation: pulseFloat 2.2s ease-in-out infinite;
    }

    @keyframes pulseFloat {
      0% { transform: translateY(0px) scale(1); letter-spacing: 0.28em; }
      50% { transform: translateY(-7px) scale(1.04); letter-spacing: 0.33em; }
      100% { transform: translateY(0px) scale(1); letter-spacing: 0.28em; }
    }

    /* 2. ASOSIY KONTENT MAYDONI */
    .main-layout {
      width: 100%;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background-color: #d60d06;
      position: relative;
    }

    .page-content {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px 124px;
      display: none;
    }

    .page-content.active {
      display: block;
      animation: fadeTab 0.22s ease;
    }

    @keyframes fadeTab {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* HONA BO'LIMI TEPADAGI UYCHA TUGMASI */
    .hona-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .create-house-btn {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(125, 4, 2, 0.72);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
      animation: houseTopFloat 2s ease-in-out infinite;
      transition: transform 0.16s ease;
    }

    .create-house-btn:active {
      transform: scale(0.93);
    }

    .create-house-svg {
      width: 28px;
      height: 28px;
      overflow: visible;
    }

    .roof-anim {
      transform-origin: center;
      animation: roofLift 1.8s ease-in-out infinite;
    }

    @keyframes houseTopFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-3px) rotate(-3deg); }
    }

    @keyframes roofLift {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-1.8px); }
    }

    /* OCHILGAN HONALAR RO'YXATI */
    .rooms-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .room-card {
      background: rgba(125, 4, 2, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
      cursor: pointer;
      transition: transform 0.16s ease;
    }

    .room-card:active {
      transform: scale(0.97);
    }

    .room-img-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: rgba(90, 2, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .room-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .room-alias {
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      text-align: center;
      min-height: 38px;
      word-break: break-word;
    }

    /* XONA ICHKI SAHNASI */
    .room-stage {
      display: none;
      flex-direction: column;
      gap: 18px;
      animation: fadeTab 0.24s ease;
    }

    .room-stage.active {
      display: flex;
    }

    .stage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(125, 4, 2, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 22px;
      padding: 12px 14px;
    }

    .stage-room-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .stage-room-thumb {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      object-fit: cover;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      background: rgba(85, 2, 0, 0.8);
      flex-shrink: 0;
    }

    .stage-room-title {
      font-size: 17px;
      font-weight: 900;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .leave-room-btn {
      padding: 9px 13px;
      border-radius: 13px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(85, 2, 0, 0.75);
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 5 TA PROFESSIONAL QIMIRLOVCHI SVG O'RINDIQ */
    .seats-panel {
      background: rgba(120, 4, 2, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 26px;
      padding: 20px 14px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.2);
    }

    .seats-row-top {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
    }

    .seats-row-bottom {
      display: grid;
      grid-template-columns: repeat(2, minmax(96px, 124px));
      justify-content: center;
      gap: 18px;
      width: 100%;
    }

    .seat-slot {
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      padding: 4px;
    }

    .seat-visual {
      width: 68px;
      height: 68px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.11);
      border: 1.5px solid rgba(255, 255, 255, 0.32);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.24);
      animation: seatIdleMove 2.2s ease-in-out infinite;
      transition: transform 0.18s ease, background 0.22s ease, border-color 0.22s ease;
    }

    .seat-slot:nth-child(2) .seat-visual { animation-delay: 0.25s; }
    .seat-slot:nth-child(3) .seat-visual { animation-delay: 0.5s; }
    .seats-row-bottom .seat-slot:nth-child(1) .seat-visual { animation-delay: 0.75s; }
    .seats-row-bottom .seat-slot:nth-child(2) .seat-visual { animation-delay: 1s; }

    .seat-slot.occupied .seat-visual {
      background: #ffffff;
      border-color: #ffffff;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.32), 0 0 0 3px rgba(255, 255, 255, 0.28);
      animation: seatActiveBounce 1.7s ease-in-out infinite;
    }

    .seat-svg {
      width: 40px;
      height: 40px;
      overflow: visible;
    }

    .seat-cushion {
      transform-origin: center;
      animation: cushionPulse 2.2s ease-in-out infinite;
    }

    .seat-backrest {
      transform-origin: center;
      animation: backrestTilt 2.2s ease-in-out infinite;
    }

    .seat-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .seat-tag {
      font-size: 11px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.92);
      max-width: 92px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @keyframes seatIdleMove {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-3.5px) rotate(-2deg); }
    }

    @keyframes seatActiveBounce {
      0%, 100% { transform: translateY(0px) scale(1.04); }
      50% { transform: translateY(-4.5px) scale(1.08); }
    }

    @keyframes cushionPulse {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.07); }
    }

    @keyframes backrestTilt {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(3.5deg); }
    }

    /* PASTKI MIKROFON STIKERI (FAQAT O'RINDIQQA O'TIRGANDA CHIQADI) */
    .mic-dock {
      display: none;
      position: fixed;
      bottom: 106px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      animation: fadeTab 0.22s ease;
    }

    .mic-dock.visible {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mic-sticker-btn {
      width: 68px;
      height: 68px;
      border-radius: 24px;
      border: 2px solid rgba(255, 255, 255, 0.55);
      background: rgba(110, 3, 1, 0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.36);
      animation: micStickerMove 1.8s ease-in-out infinite;
      transition: transform 0.16s ease, background 0.22s ease, box-shadow 0.22s ease;
    }

    .mic-sticker-btn:active {
      transform: scale(0.93);
    }

    .mic-sticker-btn.mic-on {
      background: #ffffff;
      border-color: #ffffff;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35), 0 0 22px rgba(255, 255, 255, 0.55);
    }

    .mic-svg {
      width: 34px;
      height: 34px;
      overflow: visible;
    }

    .mic-capsule {
      transform-origin: center;
      animation: micCapsulePulse 1.6s ease-in-out infinite;
    }

    .mic-slash {
      opacity: 1;
      transition: opacity 0.2s ease;
    }

    .mic-sticker-btn.mic-on .mic-slash {
      opacity: 0;
    }

    @keyframes micStickerMove {
      0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
      50% { transform: translateY(-3px) rotate(-3deg) scale(1.05); }
    }

    @keyframes micCapsulePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    /* XONA YARATISH MODALI */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 390px;
      background: #b80a04;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 24px;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
    }

    .modal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 900;
      color: #ffffff;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(90, 2, 0, 0.65);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .pick-photo-label {
      width: 100%;
      height: 140px;
      border-radius: 18px;
      border: 1.5px dashed rgba(255, 255, 255, 0.45);
      background: rgba(95, 2, 0, 0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      overflow: hidden;
    }

    .pick-photo-label img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .pick-photo-label.has-img img {
      display: block;
    }

    .pick-photo-label.has-img .pick-hint {
      display: none;
    }

    .pick-hint {
      font-size: 12px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
    }

    .alias-input-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .alias-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(90, 2, 0, 0.72);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      outline: none;
    }

    .alias-input::placeholder {
      color: rgba(255, 255, 255, 0.55);
      font-weight: 500;
    }

    .char-counter {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
      text-align: right;
    }

    .save-room-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 15px;
      background: #ffffff;
      color: #d60d06;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .save-room-btn:active {
      transform: scale(0.98);
    }

    /* PROFILM BO'LIMI */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 28px 16px;
      background: rgba(135, 6, 2, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 24px;
    }

    .avatar-ring {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #ffffff 0%, rgba(255, 255, 255, 0.35) 100%);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      margin-bottom: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #9e0803;
      display: block;
    }

    .profile-name-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .profile-name {
      font-size: 21px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.01em;
    }

    .verified-badge-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      animation: badgeFloatPulse 2s ease-in-out infinite;
    }

    .verified-svg {
      width: 24px;
      height: 24px;
      overflow: visible;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.32));
    }

    .verified-check {
      animation: checkDrawPulse 2s ease-in-out infinite;
    }

    @keyframes badgeFloatPulse {
      0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
      50% { transform: translateY(-3px) rotate(6deg) scale(1.1); }
    }

    @keyframes checkDrawPulse {
      0%, 100% { transform: scale(1); transform-origin: center; }
      50% { transform: scale(1.08); transform-origin: center; }
    }

    /* 3. PASTKI 4 TA MENYU PANELI */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      padding: 12px 14px 18px;
      background: #d60d06;
      border-top: 1px solid rgba(255, 255, 255, 0.24);
      z-index: 50;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      background: rgba(125, 4, 2, 0.78);
      padding: 8px;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .nav-item {
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.85);
      border-radius: 16px;
      padding: 9px 4px;
      min-height: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: background 0.22s ease, color 0.22s ease, transform 0.15s ease;
    }

    .nav-item:active {
      transform: scale(0.96);
    }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.38);
    }

    .premium-sticker {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.32);
      animation: stickerMove 2s ease-in-out infinite;
    }

    .nav-item.active .premium-sticker {
      background: #ffffff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.24);
    }

    .premium-svg {
      width: 19px;
      height: 19px;
      overflow: visible;
    }

    .svg-stroke-white { stroke: #ffffff; }
    .nav-item.active .svg-stroke-white { stroke: #d60d06; }
    .svg-fill-white { fill: #ffffff; }
    .nav-item.active .svg-fill-white { fill: #d60d06; }

    .anim-float {
      transform-origin: center;
      animation: innerFloat 1.8s ease-in-out infinite;
    }

    .anim-tilt {
      transform-origin: center;
      animation: innerTilt 2.1s ease-in-out infinite;
    }

    @keyframes stickerMove {
      0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
      50% { transform: translateY(-3px) rotate(-3.5deg) scale(1.07); }
    }

    @keyframes innerFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-1.5px) scale(1.06); }
    }

    @keyframes innerTilt {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(7deg); }
    }

    .nav-label {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.15;
    }
  </style>
</head>
<body>
  <!-- KIRISH QISMI -->
  <div class="splash-screen" id="splash">
    <div class="moving-brand">A C A Z E S</div>
  </div>

  <!-- ASOSIY OYNA -->
  <div class="main-layout">
    <!-- 1. HONA BO'LIMI -->
    <section class="page-content active" id="page-hona">
      <!-- HONALAR RO'YXATI VA YARATISH TUGMASI -->
      <div id="honaLobbyView">
        <div class="hona-top-bar">
          <button type="button" class="create-house-btn" id="openRoomModalBtn" aria-label="Hona ochish">
            <svg class="create-house-svg" viewBox="0 0 24 24" fill="none">
              <path
                class="roof-anim"
                d="M3.2 11.2L12 3.8L20.8 11.2"
                stroke="#ffffff"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M6.2 9.4V18.8C6.2 19.4 6.6 19.8 7.2 19.8H16.8C17.4 19.8 17.8 19.4 17.8 18.8V9.4"
                stroke="#ffffff"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <rect x="10.2" y="13.5" width="3.6" height="6.3" rx="1" fill="#ffffff" />
            </svg>
          </button>
        </div>

        <div class="rooms-grid" id="roomsGrid"></div>
      </div>

      <!-- XONA ICHKI SAHNASI (5 TA O'RINDIQ) -->
      <div class="room-stage" id="roomStageView">
        <div class="stage-header">
          <div class="stage-room-info">
            <img class="stage-room-thumb" id="stageRoomPhoto" src="" alt="" />
            <div class="stage-room-title" id="stageRoomTitle"></div>
          </div>
          <button type="button" class="leave-room-btn" id="leaveRoomBtn">Chiqish</button>
        </div>

        <div class="seats-panel">
          <div class="seats-row-top" id="seatsTopRow"></div>
          <div class="seats-row-bottom" id="seatsBottomRow"></div>
        </div>
      </div>
    </section>

    <!-- 2. CHATLAR BO'LIMI -->
    <section class="page-content" id="page-chats"></section>

    <!-- 3. FAMILY BO'LIMI -->
    <section class="page-content" id="page-family"></section>

    <!-- 4. PROFILM BO'LIMI -->
    <section class="page-content" id="page-profile">
      <div class="profile-header">
        <div class="avatar-ring">
          <img
            id="tgPhoto"
            class="avatar-img"
            src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><rect width='120' height='120' fill='%23990703'/><circle cx='60' cy='46' r='20' fill='%23ffffff' fill-opacity='0.9'/><path d='M24 102C24 81 40 68 60 68C80 68 96 81 96 102' fill='%23ffffff' fill-opacity='0.9'/></svg>"
            alt=""
          />
        </div>

        <div class="profile-name-row">
          <span class="profile-name" id="tgName"></span>
          <span class="verified-badge-wrap">
            <svg class="verified-svg" viewBox="0 0 24 24" fill="none">
              <path
                d="M12 2.2L14.4 4.1L17.4 3.8L18.4 6.7L21.1 8.2L20.3 11.1L21.8 13.8L19.6 15.9L19.5 19L16.5 19.6L14.8 22.1L12 21L9.2 22.1L7.5 19.6L4.5 19L4.4 15.9L2.2 13.8L3.7 11.1L2.9 8.2L5.6 6.7L6.6 3.8L9.6 4.1L12 2.2Z"
                fill="#ffffff"
              />
              <path
                class="verified-check"
                d="M8.3 12.2L10.8 14.7L15.9 9.5"
                stroke="#d60d06"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </div>
      </div>
    </section>

    <!-- O'RINDIQQA O'TIRGANDA CHIQADIGAN MIKROFON STIKERI -->
    <div class="mic-dock" id="micDock">
      <button type="button" class="mic-sticker-btn" id="micStickerBtn" aria-label="Mic">
        <svg class="mic-svg" viewBox="0 0 28 28" fill="none">
          <g class="mic-capsule">
            <rect
              x="10.2"
              y="4.2"
              width="7.6"
              height="12.2"
              rx="3.8"
              fill="#ffffff"
            />
            <path
              d="M7.2 13.2C7.2 16.95 10.25 20 14 20C17.75 20 20.8 16.95 20.8 13.2"
              stroke="#ffffff"
              stroke-width="2.1"
              stroke-linecap="round"
            />
            <path
              d="M14 20V23.8M10.5 23.8H17.5"
              stroke="#ffffff"
              stroke-width="2.1"
              stroke-linecap="round"
            />
          </g>
          <!-- O'CHIQ HOLATDAGI QIZIL CHIZIQ -->
          <line
            class="mic-slash"
            x1="5"
            y1="5"
            x2="23"
            y2="23"
            stroke="#ff1e16"
            stroke-width="2.8"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>

    <!-- PASTKI 4 TA MENYU -->
    <nav class="bottom-nav">
      <div class="nav-grid">
        <button type="button" class="nav-item active" data-target="page-hona">
          <span class="premium-sticker">
            <svg class="premium-svg anim-float" viewBox="0 0 24 24" fill="none">
              <path class="svg-stroke-white" d="M3.5 11.2L12 4L20.5 11.2" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
              <path class="svg-stroke-white" d="M6.2 9.5V18.8C6.2 19.4 6.6 19.8 7.2 19.8H16.8C17.4 19.8 17.8 19.4 17.8 18.8V9.5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
              <rect class="svg-fill-white" x="10.3" y="13.5" width="3.4" height="6.3" rx="0.9"/>
            </svg>
          </span>
          <span class="nav-label">HONA</span>
        </button>

        <button type="button" class="nav-item" data-target="page-chats">
          <span class="premium-sticker">
            <svg class="premium-svg anim-tilt" viewBox="0 0 24 24" fill="none">
              <path class="svg-stroke-white" d="M4.5 6.8C4.5 5.4 5.6 4.3 7 4.3H17C18.4 4.3 19.5 5.4 19.5 6.8V13.6C19.5 15 18.4 16.1 17 16.1H10.8L6.8 19.7V16.1C5.5 15.8 4.5 14.8 4.5 13.6V6.8Z" stroke-width="1.9" stroke-linejoin="round"/>
              <circle class="svg-fill-white" cx="9" cy="10.2" r="1.15"/>
              <circle class="svg-fill-white" cx="12" cy="10.2" r="1.15"/>
              <circle class="svg-fill-white" cx="15" cy="10.2" r="1.15"/>
            </svg>
          </span>
          <span class="nav-label">CHATLAR</span>
        </button>

        <button type="button" class="nav-item" data-target="page-family">
          <span class="premium-sticker">
            <svg class="premium-svg anim-float" viewBox="0 0 24 24" fill="none">
              <path class="svg-stroke-white" d="M12 19.5C12 19.5 4.5 14.7 4.5 9.1C4.5 6.7 6.4 4.8 8.8 4.8C10.3 4.8 11.5 5.6 12 6.7C12.5 5.6 13.7 4.8 15.2 4.8C17.6 4.8 19.5 6.7 19.5 9.1C19.5 14.7 12 19.5 12 19.5Z" stroke-width="1.9" stroke-linejoin="round"/>
              <circle class="svg-fill-white" cx="9.2" cy="9.4" r="1.1"/>
              <circle class="svg-fill-white" cx="14.8" cy="9.4" r="1.1"/>
            </svg>
          </span>
          <span class="nav-label">FAMILY</span>
        </button>

        <button type="button" class="nav-item" data-target="page-profile">
          <span class="premium-sticker">
            <svg class="premium-svg anim-float" viewBox="0 0 24 24" fill="none">
              <circle class="svg-stroke-white" cx="12" cy="8.3" r="3.4" stroke-width="1.9"/>
              <path class="svg-stroke-white" d="M5.5 19.2C5.5 16.1 8.4 14 12 14C15.6 14 18.5 16.1 18.5 19.2" stroke-width="1.9" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="nav-label">PROFILM</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- XONA YARATISH OYNASI -->
  <div class="modal-backdrop" id="roomModal">
    <div class="modal-card">
      <div class="modal-top">
        <span class="modal-title">Hona ochish</span>
        <button type="button" class="close-btn" id="closeRoomModalBtn">✕</button>
      </div>

      <label class="pick-photo-label" id="pickPhotoLabel" for="roomPhotoInput">
        <img id="roomPreviewImg" src="" alt="" />
        <span class="pick-hint" id="pickPhotoHint">Rasm tanlash</span>
      </label>
      <input type="file" id="roomPhotoInput" accept="image/*" hidden />

      <div class="alias-input-wrap">
        <input
          type="text"
          id="roomAliasInput"
          class="alias-input"
          maxlength="10"
          placeholder="Taxallus (0–10 belgi)"
        />
        <div class="char-counter" id="charCounter">0 / 10</div>
      </div>

      <button type="button" class="save-room-btn" id="saveRoomBtn">Ochish</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#d60d06");
      tg.setBackgroundColor("#d60d06");
    }

    setTimeout(() => {
      document.getElementById("splash").classList.add("hide");
    }, 1500);

    // Profil ma'lumotlari
    const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
    const urlParams = new URLSearchParams(window.location.search);

    const fullName =
      urlParams.get("name") ||
      (tgUser ? [tgUser.first_name, tgUser.last_name].filter(Boolean).join(" ") : "") ||
      "";

    const photoUrl = urlParams.get("photo") || "";
    document.getElementById("tgName").textContent = fullName;
    if (photoUrl) {
      document.getElementById("tgPhoto").src = photoUrl;
    }

    // Mikrofon holati (boshida o'chiq, qizil chiziqli)
    const micDock = document.getElementById("micDock");
    const micStickerBtn = document.getElementById("micStickerBtn");
    let micEnabled = false;
    let seatedIndex = null;
    let activeRoomId = null;

    function syncMicVisibility() {
      const onHonaPage = document.getElementById("page-hona").classList.contains("active");
      const insideRoom = document.getElementById("roomStageView").classList.contains("active");
      const shouldShow = onHonaPage && insideRoom && seatedIndex !== null;
      micDock.classList.toggle("visible", shouldShow);
      if (!shouldShow) {
        micEnabled = false;
        micStickerBtn.classList.remove("mic-on");
      }
    }

    micStickerBtn.addEventListener("click", () => {
      micEnabled = !micEnabled;
      micStickerBtn.classList.toggle("mic-on", micEnabled);
      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred(micEnabled ? "medium" : "light");
      }
    });

    // Menyu almashinuvi
    const navItems = document.querySelectorAll(".nav-item");
    const pages = document.querySelectorAll(".page-content");

    navItems.forEach((btn) => {
      btn.addEventListener("click", () => {
        const targetId = btn.dataset.target;
        navItems.forEach((item) => item.classList.remove("active"));
        btn.classList.add("active");
        pages.forEach((page) => {
          page.classList.toggle("active", page.id === targetId);
        });
        syncMicVisibility();
        if (tg && tg.HapticFeedback) {
          tg.HapticFeedback.selectionChanged();
        }
      });
    });

    // HONA YARATISH VA ICHIGA KIRISH
    const STORAGE_KEY = "acazes_hona_rooms_v2";
    const roomModal = document.getElementById("roomModal");
    const openRoomModalBtn = document.getElementById("openRoomModalBtn");
    const closeRoomModalBtn = document.getElementById("closeRoomModalBtn");
    const roomPhotoInput = document.getElementById("roomPhotoInput");
    const pickPhotoLabel = document.getElementById("pickPhotoLabel");
    const roomPreviewImg = document.getElementById("roomPreviewImg");
    const roomAliasInput = document.getElementById("roomAliasInput");
    const charCounter = document.getElementById("charCounter");
    const saveRoomBtn = document.getElementById("saveRoomBtn");
    const roomsGrid = document.getElementById("roomsGrid");

    const honaLobbyView = document.getElementById("honaLobbyView");
    const roomStageView = document.getElementById("roomStageView");
    const stageRoomPhoto = document.getElementById("stageRoomPhoto");
    const stageRoomTitle = document.getElementById("stageRoomTitle");
    const leaveRoomBtn = document.getElementById("leaveRoomBtn");
    const seatsTopRow = document.getElementById("seatsTopRow");
    const seatsBottomRow = document.getElementById("seatsBottomRow");

    let selectedRoomPhoto = "";

    function loadRooms() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (_) {
        return [];
      }
    }

    function saveRooms(rooms) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(rooms));
      } catch (_) {}
    }

    function createSeatSvg() {
      return `
        <svg class="seat-svg" viewBox="0 0 40 40" fill="none">
          <path
            class="seat-backrest"
            d="M11 8.5C11 6.8 12.4 5.5 14.1 5.5H25.9C27.6 5.5 29 6.8 29 8.5V19.5H11V8.5Z"
            stroke="#ffffff"
            stroke-width="2.2"
            stroke-linejoin="round"
          />
          <rect
            class="seat-cushion"
            x="7.5"
            y="19.5"
            width="25"
            height="8"
            rx="3.5"
            fill="#ffffff"
          />
          <path
            d="M10.5 27.5V33.5M29.5 27.5V33.5"
            stroke="#ffffff"
            stroke-width="2.3"
            stroke-linecap="round"
          />
        </svg>
      `;
    }

    function renderFiveSeats() {
      seatsTopRow.innerHTML = "";
      seatsBottomRow.innerHTML = "";

      for (let i = 0; i < 5; i++) {
        const isSeated = seatedIndex === i;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `seat-slot ${isSeated ? "occupied" : ""}`;

        const visual = document.createElement("div");
        visual.className = "seat-visual";

        if (isSeated) {
          if (photoUrl) {
            const img = document.createElement("img");
            img.className = "seat-avatar-img";
            img.src = photoUrl;
            img.alt = "";
            visual.appendChild(img);
          } else {
            visual.innerHTML = `
              <svg class="seat-svg" viewBox="0 0 40 40" fill="none">
                <circle cx="20" cy="14" r="6.5" fill="#d60d06"/>
                <path d="M9 32C9 25.5 13.8 22 20 22C26.2 22 31 25.5 31 32" fill="#d60d06"/>
              </svg>
            `;
          }
        } else {
          visual.innerHTML = createSeatSvg();
        }

        const tag = document.createElement("span");
        tag.className = "seat-tag";
        tag.textContent = isSeated ? fullName : `#${i + 1}`;

        btn.appendChild(visual);
        btn.appendChild(tag);

        btn.addEventListener("click", () => {
          if (seatedIndex === i) {
            seatedIndex = null;
          } else {
            seatedIndex = i;
          }
          renderFiveSeats();
          syncMicVisibility();
          if (tg && tg.HapticFeedback) {
            tg.HapticFeedback.selectionChanged();
          }
        });

        if (i < 3) {
          seatsTopRow.appendChild(btn);
        } else {
          seatsBottomRow.appendChild(btn);
        }
      }
    }

    function enterRoom(room) {
      activeRoomId = room.id;
      seatedIndex = null;
      micEnabled = false;
      micStickerBtn.classList.remove("mic-on");

      stageRoomTitle.textContent = (room.alias || "").slice(0, 10);
      if (room.photo) {
        stageRoomPhoto.src = room.photo;
        stageRoomPhoto.style.display = "block";
      } else {
        stageRoomPhoto.removeAttribute("src");
        stageRoomPhoto.style.display = "none";
      }

      honaLobbyView.style.display = "none";
      roomStageView.classList.add("active");
      renderFiveSeats();
      syncMicVisibility();
    }

    leaveRoomBtn.addEventListener("click", () => {
      activeRoomId = null;
      seatedIndex = null;
      micEnabled = false;
      micStickerBtn.classList.remove("mic-on");
      roomStageView.classList.remove("active");
      honaLobbyView.style.display = "block";
      syncMicVisibility();
    });

    function renderRooms() {
      const rooms = loadRooms();
      roomsGrid.innerHTML = "";
      rooms.forEach((room) => {
        const card = document.createElement("div");
        card.className = "room-card";

        const imgBox = document.createElement("div");
        imgBox.className = "room-img-box";
        if (room.photo) {
          const img = document.createElement("img");
          img.src = room.photo;
          img.alt = room.alias || "";
          imgBox.appendChild(img);
        }

        const aliasDiv = document.createElement("div");
        aliasDiv.className = "room-alias";
        aliasDiv.textContent = (room.alias || "").slice(0, 10);

        card.appendChild(imgBox);
        card.appendChild(aliasDiv);
        card.addEventListener("click", () => enterRoom(room));
        roomsGrid.appendChild(card);
      });
    }

    function resetModalForm() {
      selectedRoomPhoto = "";
      roomPreviewImg.src = "";
      pickPhotoLabel.classList.remove("has-img");
      roomPhotoInput.value = "";
      roomAliasInput.value = "";
      charCounter.textContent = "0 / 10";
    }

    openRoomModalBtn.addEventListener("click", () => {
      resetModalForm();
      roomModal.classList.add("open");
    });

    closeRoomModalBtn.addEventListener("click", () => {
      roomModal.classList.remove("open");
    });

    roomModal.addEventListener("click", (e) => {
      if (e.target === roomModal) {
        roomModal.classList.remove("open");
      }
    });

    roomPhotoInput.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        selectedRoomPhoto = String(reader.result || "");
        roomPreviewImg.src = selectedRoomPhoto;
        pickPhotoLabel.classList.add("has-img");
      };
      reader.readAsDataURL(file);
    });

    roomAliasInput.addEventListener("input", () => {
      if (roomAliasInput.value.length > 10) {
        roomAliasInput.value = roomAliasInput.value.slice(0, 10);
      }
      charCounter.textContent = `${roomAliasInput.value.length} / 10`;
    });

    saveRoomBtn.addEventListener("click", () => {
      const alias = roomAliasInput.value.trim().slice(0, 10);
      const newRoom = {
        id: Date.now(),
        photo: selectedRoomPhoto,
        alias: alias
      };
      const rooms = loadRooms();
      rooms.unshift(newRoom);
      saveRooms(rooms);
      renderRooms();
      roomModal.classList.remove("open");
      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred("success");
      }
      // Ochilishi bilan darhol xona ichiga kiradi
      enterRoom(newRoom);
    });

    renderRooms();
    syncMicVisibility();
  </script>
</body>
</html>
