<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACAZES — PUBG Marketplace</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: radial-gradient(circle at center, #0a2458 0%, #030a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Orqa fondagi mayin SVG to'r */
        .bg-grid {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0.18;
            pointer-events: none;
        }

        /* Yonib turuvchi A C A Z E S bloki */
        .acazes-box {
            position: relative;
            z-index: 2;
            padding: 22px 34px;
            border-radius: 20px;
            border: 2px solid #00bfff;
            background: rgba(5, 18, 45, 0.65);
            backdrop-filter: blur(8px);
            animation: blueNeonGlow 2s infinite alternate ease-in-out;
        }

        .acazes-text {
            font-family: 'Cinzel', serif;
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 12px;
            padding-left: 12px; /* Harflar o'rtada tekis turishi uchun */
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 
                0 0 10px #00bfff,
                0 0 25px #0080ff,
                0 0 45px #0055ff;
        }

        @keyframes blueNeonGlow {
            0% {
                border-color: #0077ff;
                box-shadow: 
                    0 0 15px rgba(0, 119, 255, 0.5),
                    inset 0 0 12px rgba(0, 119, 255, 0.3);
                transform: scale(0.98);
            }
            100% {
                border-color: #38e8ff;
                box-shadow: 
                    0 0 30px rgba(56, 232, 255, 0.9),
                    0 0 60px rgba(0, 136, 255, 0.6),
                    inset 0 0 20px rgba(56, 232, 255, 0.4);
                transform: scale(1.03);
            }
        }
    </style>
</head>
<body>

    <svg class="bg-grid" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <pattern id="blueGrid" width="32" height="32" patternUnits="userSpaceOnUse">
                <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38e8ff" stroke-width="0.6"/>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#blueGrid)"/>
    </svg>

    <div class="acazes-box">
        <div class="acazes-text">A C A Z E S</div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
