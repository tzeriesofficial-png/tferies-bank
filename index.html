<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-BOX</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Arial Black', Impact, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg-white: #ffffff;
            --bg-soft: #fdf4ff;
            --accent-pink: #ec4899;
            --accent-purple: #a855f7;
            --accent-magenta: #c026d3;
            --text-plum: #86198f;
            --text-muted: #a21caf;
            --border-plum: rgba(192, 38, 211, 0.24);
        }

        body {
            min-height: 100vh;
            background-color: var(--bg-white);
            color: var(--text-plum);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .screen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 1-EKRAN: X-BOX (O'RTADA, SOYASIZ, PUSHTI-BINAFSHA) */
        .xbox-title {
            font-size: clamp(38px, 10.5vw, 60px);
            font-weight: 900;
            color: var(--accent-magenta);
            letter-spacing: 6px;
            line-height: 1;
            text-align: center;
            text-transform: uppercase;
            text-shadow: none;
            filter: none;
            box-shadow: none;
        }

        /* 2-EKRAN: ASOSIY OYNA */
        #mainScreen {
            justify-content: space-between;
            background-color: var(--bg-white);
        }

        .content-area {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 14px;
            overflow-y: auto;
            background-color: var(--bg-white);
        }

        .tab-panel {
            display: none;
            width: 100%;
            max-width: 430px;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
        }

        .tab-panel.active {
            display: flex;
        }

        #panel-tanishuv,
        #panel-lichka,
        #panel-hisobim {
            justify-content: flex-start;
            padding-top: 4px;
        }

        .panel-title {
            font-size: 22px;
            font-weight: 900;
            color: var(--text-plum);
            letter-spacing: 0.8px;
            text-transform: lowercase;
        }

        .panel-subtitle {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .section-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 4px 10px;
            border-bottom: 1.5px solid var(--border-plum);
            flex-shrink: 0;
        }

        .count-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-soft);
            border: 1.5px solid var(--accent-magenta);
            border-radius: 999px;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 900;
            color: var(--accent-magenta);
        }

        /* JINSGA QARAB QIMIRLAB TURUVCHI PREMIUM SVG BELGI */
        .gender-badge-svg {
            width: 19px;
            height: 19px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            animation: badgePulseSwing 1.8s infinite ease-in-out;
        }

        @keyframes badgePulseSwing {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.18) rotate(-10deg); }
            50% { transform: scale(1.05) rotate(4deg); }
            75% { transform: scale(1.16) rotate(10deg); }
        }

        .nick-with-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .nick-text-truncate {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* X-TANISHUV RO'YXATI */
        .users-feed-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            padding-top: 10px;
            padding-bottom: 16px;
        }

        .user-profile-card {
            width: 100%;
            background: var(--bg-soft);
            border: 1.5px solid var(--border-plum);
            border-radius: 18px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            text-align: left;
        }

        .user-profile-card.is-me {
            border-color: var(--accent-magenta);
            background: #fae8ff;
        }

        .user-card-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }

        .user-tg-photo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-magenta);
            background: var(--bg-white);
            flex-shrink: 0;
        }

        .user-tg-meta {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
            flex: 1;
        }

        .user-tg-username {
            font-size: 15px;
            font-weight: 900;
            color: var(--text-plum);
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .view-profile-btn {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            color: var(--bg-white);
            border: none;
            border-radius: 12px;
            padding: 9px 14px;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            flex-shrink: 0;
        }

        .view-profile-btn:active {
            transform: scale(0.95);
        }

        /* X-LICHKA (INSTAGRAM DM USLUBIDA) */
        .lichka-container {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: 8px;
        }

        .dm-threads-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 9px;
            overflow-y: auto;
            padding-bottom: 14px;
        }

        .dm-thread-card {
            width: 100%;
            background: var(--bg-soft);
            border: 1.5px solid var(--border-plum);
            border-radius: 18px;
            padding: 11px 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            text-align: left;
            cursor: pointer;
        }

        .dm-thread-card.has-unread {
            border-color: var(--accent-magenta);
            background: #fae8ff;
        }

        .dm-thread-left {
            display: flex;
            align-items: center;
            gap: 11px;
            min-width: 0;
            flex: 1;
        }

        .dm-thread-info {
            min-width: 0;
            flex: 1;
        }

        .dm-thread-peer {
            font-size: 14.5px;
            font-weight: 900;
            color: var(--text-plum);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dm-thread-last {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 3px;
        }

        .ig-chat-view {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background: var(--bg-white);
        }

        .ig-chat-view.active {
            display: flex;
        }

        .ig-chat-topbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 6px 10px;
            border-bottom: 1.5px solid var(--border-plum);
            flex-shrink: 0;
        }

        .ig-back-btn {
            background: var(--bg-soft);
            color: var(--text-plum);
            border: 1.5px solid var(--border-plum);
            border-radius: 12px;
            padding: 7px 11px;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
        }

        .ig-peer-header {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
            flex: 1;
        }

        .ig-peer-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-magenta);
            background: var(--bg-soft);
            flex-shrink: 0;
        }

        .ig-peer-name {
            font-size: 14px;
            font-weight: 900;
            color: var(--text-plum);
            display: flex;
            align-items: center;
            gap: 5px;
            min-width: 0;
        }

        .ig-messages-stream {
            flex: 1;
            width: 100%;
            overflow-y: auto;
            padding: 12px 4px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ig-bubble {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 13.5px;
            font-weight: 600;
            line-height: 1.38;
            word-break: break-word;
            text-align: left;
        }

        .ig-bubble.mine {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            color: var(--bg-white);
            border-bottom-right-radius: 6px;
        }

        .ig-bubble.theirs {
            align-self: flex-start;
            background: var(--bg-soft);
            border: 1.5px solid var(--border-plum);
            color: var(--text-plum);
            border-bottom-left-radius: 6px;
        }

        .ig-input-bar {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-top: 8px;
            border-top: 1.5px solid var(--border-plum);
            flex-shrink: 0;
        }

        .ig-msg-input {
            flex: 1;
            background: var(--bg-soft);
            color: var(--text-plum);
            border: 1.8px solid var(--accent-purple);
            border-radius: 999px;
            padding: 10px 14px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 13.5px;
            font-weight: 700;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }

        .ig-send-btn {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            color: var(--bg-white);
            border: none;
            border-radius: 999px;
            padding: 10px 16px;
            font-size: 12.5px;
            font-weight: 900;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* X-HISOBIM PROFIL KARTASI (TOZA PROFIL) */
        .hisobim-scroll {
            width: 100%;
            overflow-y: auto;
            padding-top: 12px;
            padding-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .hisobim-card {
            width: 100%;
            background: var(--bg-soft);
            border: 2px solid var(--border-plum);
            border-radius: 24px;
            padding: 22px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .hisobim-avatar-wrap {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
        }

        .hisobim-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--bg-white);
            background: var(--bg-white);
            display: block;
        }

        .hisobim-nick-row {
            font-size: 20px;
            font-weight: 900;
            color: var(--text-plum);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            word-break: break-word;
        }

        .profile-meta-pills {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 7px;
        }

        .meta-pill {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 12px;
            font-weight: 800;
            color: var(--text-plum);
            background: var(--bg-white);
            border: 1px solid var(--border-plum);
            border-radius: 999px;
            padding: 4px 11px;
        }

        .profile-bio-box {
            width: 100%;
            background: var(--bg-white);
            border: 1.5px solid var(--border-plum);
            border-radius: 16px;
            padding: 11px 13px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-plum);
            text-align: left;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .edit-profile-btn {
            margin-top: 4px;
            width: 100%;
            max-width: 280px;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            color: var(--bg-white);
            border: none;
            border-radius: 16px;
            padding: 13px 18px;
            font-size: 13.5px;
            font-weight: 900;
            letter-spacing: 0.4px;
            cursor: pointer;
        }

        .edit-profile-btn:active {
            transform: scale(0.97);
        }

        /* MODALLAR */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(88, 28, 135, 0.36);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 60;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 390px;
            max-height: 88vh;
            overflow-y: auto;
            background: var(--bg-white);
            border: 2px solid var(--accent-magenta);
            border-radius: 24px;
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 900;
            color: var(--text-plum);
        }

        .modal-photo-picker {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .modal-preview-img {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            object-fit: cover;
            border: 2.5px solid var(--accent-magenta);
            background: var(--bg-soft);
        }

        .choose-photo-btn {
            background: var(--bg-soft);
            color: var(--accent-magenta);
            border: 1.5px solid var(--accent-magenta);
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }

        .input-label {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 12px;
            font-weight: 800;
            color: var(--text-plum);
        }

        .nick-input,
        .bio-textarea,
        .date-input {
            width: 100%;
            background: var(--bg-soft);
            color: var(--text-plum);
            border: 1.8px solid var(--accent-purple);
            border-radius: 14px;
            padding: 10px 12px;
            font-size: 13.5px;
            font-weight: 700;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }

        .bio-textarea {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 70px;
            resize: vertical;
        }

        .gender-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .gender-choice-btn {
            background: var(--bg-soft);
            color: var(--text-plum);
            border: 1.8px solid var(--border-plum);
            border-radius: 14px;
            padding: 10px 8px;
            font-size: 12.5px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .gender-choice-btn.selected {
            border-color: var(--accent-magenta);
            background: #fae8ff;
        }

        .modal-error {
            min-height: 18px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 12.5px;
            font-weight: 800;
            color: #be185d;
            text-align: center;
        }

        .modal-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .modal-cancel-btn {
            background: var(--bg-soft);
            color: var(--text-plum);
            border: 1.5px solid var(--border-plum);
            border-radius: 14px;
            padding: 11px;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
        }

        .modal-save-btn {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            color: var(--bg-white);
            border: none;
            border-radius: 14px;
            padding: 11px;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
        }

        .peer-top-card {
            background: var(--bg-soft);
            border: 1.5px solid var(--border-plum);
            border-radius: 20px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .peer-action-row {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        /* PASTKI 4 TA PUSHTI-BINAFSHA PREMIUM SVG IKONKA PANELI */
        .bottom-nav {
            width: 100%;
            background-color: var(--bg-white);
            border-top: 1.5px solid var(--border-plum);
            padding: 9px 6px calc(11px + env(safe-area-inset-bottom));
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            flex-shrink: 0;
        }

        .nav-item-btn {
            position: relative;
            background: transparent;
            border: 1.5px solid transparent;
            border-radius: 15px;
            padding: 8px 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            color: var(--accent-purple);
            font-size: 10.5px;
            font-weight: 900;
            letter-spacing: 0.2px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-item-btn.active {
            color: var(--accent-magenta);
            background: var(--bg-soft);
            border-color: var(--accent-magenta);
        }

        .nav-unread-dot {
            position: absolute;
            top: 5px;
            right: 10px;
            background: var(--accent-pink);
            color: var(--bg-white);
            border-radius: 999px;
            padding: 1px 5px;
            font-size: 9.5px;
            font-weight: 900;
            display: none;
        }

        .nav-unread-dot.visible {
            display: inline-block;
        }

        .svg-icon-box {
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* QIMIRLAB TURUVCHI PREMIUM ANIMATSIYALAR */
        .anim-xbox-svg {
            animation: xboxSpinFloat 2.2s infinite ease-in-out;
        }

        .anim-tanishuv-svg {
            animation: tanishuvBeat 1.7s infinite ease-in-out;
        }

        .anim-lichka-svg {
            animation: lichkaWiggle 1.6s infinite ease-in-out;
        }

        .anim-hisobim-svg {
            animation: hisobimDance 1.9s infinite ease-in-out;
        }

        @keyframes xboxSpinFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            35% { transform: translateY(-3px) rotate(12deg) scale(1.12); }
            70% { transform: translateY(1px) rotate(-10deg) scale(1.06); }
        }

        @keyframes tanishuvBeat {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.18) rotate(-6deg); }
            50% { transform: scale(1.04) rotate(0deg); }
            75% { transform: scale(1.15) rotate(6deg); }
        }

        @keyframes lichkaWiggle {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            20% { transform: translateY(-2px) rotate(-11deg) scale(1.14); }
            45% { transform: translateY(-3px) rotate(11deg) scale(1.16); }
            70% { transform: translateY(0px) rotate(-5deg) scale(1.05); }
        }

        @keyframes hisobimDance {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            30% { transform: translateY(-3px) rotate(-9deg) scale(1.14); }
            65% { transform: translateY(-1px) rotate(9deg) scale(1.1); }
        }
    </style>
</head>
<body>

    <!-- 1-EKRAN: X-BOX -->
    <div id="splashScreen" class="screen active">
        <div class="xbox-title">X-BOX</div>
    </div>

    <!-- 2-EKRAN: ASOSIY OYNA -->
    <div id="mainScreen" class="screen">
        <div class="content-area">
            <!-- 1. X-BOX BO'LIMI -->
            <div id="panel-xbox" class="tab-panel active">
                <div class="panel-title">x-box</div>
                <div class="panel-subtitle">Asosiy boʻlim</div>
            </div>

            <!-- 2. X-TANISHUV BO'LIMI -->
            <div id="panel-tanishuv" class="tab-panel">
                <div class="section-header">
                    <div class="panel-title">x-tanishuv</div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const FIREBASE_DB_URL = "https://xbox-tanishuv-default-rtdb.firebaseio.com";
        const LOCAL_USERS_KEY = "xbox_tanishuv_directory_v2";
        const LOCAL_CHATS_KEY = "xbox_bot_dm_chats_v1";
        const LOCAL_READ_KEY = "xbox_lichka_last_read_v1";

        const fallbackAvatar = "data:image/svg+xml;utf8," + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                <rect width="100" height="100" fill="#fdf4ff"/>
                <circle cx="50" cy="38" r="18" fill="#c026d3"/>
                <path d="M20 86C24 68 36 60 50 60C64 60 76 68 80 86" fill="#e879f9"/>
            </svg>
        `);

        function getGenderPremiumSvg(gender) {
            if (gender === 'female') {
                return `
                    <span class="gender-badge-svg" title="Qiz bola">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="pinkStarGrad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                                    <stop offset="0%" stop-color="#f472b6"/>
                                    <stop offset="100%" stop-color="#db2777"/>
                                </linearGradient>
                            </defs>
                            <circle cx="12" cy="12" r="10" fill="url(#pinkStarGrad)" stroke="#be185d" stroke-width="1.4"/>
                            <path d="M8.2 12.4L10.8 15L16.2 9.4" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                `;
            }

            return `
                <span class="gender-badge-svg" title="O'g'il bola">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" fill="#09090b" stroke="#27272a" stroke-width="1.4"/>
                        <path d="M8.2 12.4L10.8 15L16.2 9.4" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
            `;
        }

        document.getElementById('maleChoiceSvg').innerHTML = getGenderPremiumSvg('male');
        document.getElementById('femaleChoiceSvg').innerHTML = getGenderPremiumSvg('female');

        function normalizeNick(rawNick, fallbackName) {
            let clean = String(rawNick || '').trim().replace(/\s+/g, '_');
            if (!clean) {
                clean = String(fallbackName || 'foydalanuvchi').trim().replace(/\s+/g, '_');
            }
            if (!clean.startsWith('@')) {
                clean = '@' + clean;
            }
            return clean;
        }

        function calcAgeFromBirthDate(birthDateStr) {
            if (!birthDateStr) return null;
            const parts = birthDateStr.split('-');
            if (parts.length !== 3) return null;
            const year = Number(parts[0]);
            const month = Number(parts[1]) - 1;
            const day = Number(parts[2]);
            const dob = new Date(year, month, day);
            if (Number.isNaN(dob.getTime())) return null;

            const today = new Date();
            let age = today.getFullYear() - dob.getFullYear();
            const mDiff = today.getMonth() - dob.getMonth();
            if (mDiff < 0 || (mDiff === 0 && today.getDate() < dob.getDate())) {
                age--;
            }
            return (age >= 0 && age <= 120) ? age : null;
        }

        function getInitialTgUser() {
            const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;
            if (u && u.id) {
                const fullName = [u.first_name, u.last_name].filter(Boolean).join(' ') || 'Foydalanuvchi';
                const tgHandle = u.username ? u.username : '';
                const atName = normalizeNick(tgHandle ? ('@' + tgHandle) : fullName, fullName);
                return {
                    id: String(u.id),
                    tgUserId: String(u.id),
                    tgUsername: tgHandle,
                    atName: atName,
                    fullName: fullName,
                    photo: u.photo_url || '',
                    gender: 'male',
                    birthDate: '',
                    bio: '',
                    lastSeen: Date.now()
                };
            }

            let guestId = localStorage.getItem('xbox_guest_uid_v1');
            if (!guestId) {
                guestId = 'guest_' + Math.random().toString(36).slice(2, 9);
                localStorage.setItem('xbox_guest_uid_v1', guestId);
            }
            return {
                id: guestId,
                tgUserId: '',
                tgUsername: '',
                atName: '@mehmon_' + guestId.slice(-4),
                fullName: 'Mehmon foydalanuvchi',
                photo: '',
                gender: 'male',
                birthDate: '',
                bio: '',
                lastSeen: Date.now()
            };
        }

        function loadLocalDirectory() {
            try {
                const raw = localStorage.getItem(LOCAL_USERS_KEY);
                const parsed = raw ? JSON.parse(raw) : {};
                return (parsed && typeof parsed === 'object') ? parsed : {};
            } catch (e) {
                return {};
            }
        }

        function saveLocalDirectory(mapObj) {
            try {
                localStorage.setItem(LOCAL_USERS_KEY, JSON.stringify(mapObj));
            } catch (e) {}
        }

        function loadLocalChats() {
            try {
                const raw = localStorage.getItem(LOCAL_CHATS_KEY);
                const parsed = raw ? JSON.parse(raw) : {};
                return (parsed && typeof parsed === 'object') ? parsed : {};
            } catch (e) {
                return {};
            }
        }

        function saveLocalChats(chatsObj) {
            try {
                localStorage.setItem(LOCAL_CHATS_KEY, JSON.stringify(chatsObj));
            } catch (e) {}
        }

        function loadReadMap() {
            try {
                const raw = localStorage.getItem(LOCAL_READ_KEY);
                const parsed = raw ? JSON.parse(raw) : {};
                return (parsed && typeof parsed === 'object') ? parsed : {};
            } catch (e) {
                return {};
            }
        }

        function saveReadMap(readObj) {
            try {
                localStorage.setItem(LOCAL_READ_KEY, JSON.stringify(readObj));
            } catch (e) {}
        }

        const tgInitialUser = getInitialTgUser();
        const initialLocalMap = loadLocalDirectory();
        let currentUser = initialLocalMap[tgInitialUser.id]
            ? {
                ...tgInitialUser,
                ...initialLocalMap[tgInitialUser.id],
                id: tgInitialUser.id,
                tgUserId: tgInitialUser.tgUserId || initialLocalMap[tgInitialUser.id].tgUserId || '',
                tgUsername: tgInitialUser.tgUsername || initialLocalMap[tgInitialUser.id].tgUsername || '',
                lastSeen: Date.now()
            }
            : tgInitialUser;

        let allUsersMap = { ...initialLocalMap, [currentUser.id]: currentUser };
        let allChatsMap = loadLocalChats();
        let readMap = loadReadMap();
        let tempEditedPhoto = currentUser.photo || '';
        let tempSelectedGender = currentUser.gender || 'male';
        let activePeerUser = null;
        let activeChatPeerId = null;

        function buildMetaPills(user) {
            const pills = [];
            pills.push(user.gender === 'female' ? 'Qiz bola' : 'Oʻgʻil bola');
            if (user.birthDate) {
                const age = calcAgeFromBirthDate(user.birthDate);
                pills.push(age !== null ? `${user.birthDate} (${age} yosh)` : user.birthDate);
            }
            return pills.map(text => `<span class="meta-pill">${escapeHtml(text)}</span>`).join('');
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function renderHisobimProfile() {
            document.getElementById('hisobimPhoto').src = currentUser.photo || fallbackAvatar;
            document.getElementById('hisobimPhoto').onerror = function() { this.src = fallbackAvatar; };
            document.getElementById('hisobimNick').textContent = currentUser.atName || '@nik';
            document.getElementById('hisobimGenderBadge').innerHTML = getGenderPremiumSvg(currentUser.gender || 'male');
            document.getElementById('hisobimMetaPills').innerHTML = buildMetaPills(currentUser);
            document.getElementById('hisobimBio').textContent = currentUser.bio ? currentUser.bio : 'Tavsif hali kiritilmagan.';
        }

        function renderTanishuvUsers(usersMap) {
            const listEl = document.getElementById('usersFeedList');
            const countEl = document.getElementById('tanishuvUserCount');

            const usersArr = Object.values(usersMap || {})
                .filter(u => u && u.id)
                .sort((a, b) => (b.lastSeen || 0) - (a.lastSeen || 0));

            countEl.textContent = String(usersArr.length);
            listEl.innerHTML = '';

            usersArr.forEach(user => {
                const isMe = String(user.id) === String(currentUser.id);
                const card = document.createElement('div');
                card.className = 'user-profile-card' + (isMe ? ' is-me' : '');

                const left = document.createElement('div');
                left.className = 'user-card-left';

                const img = document.createElement('img');
                img.className = 'user-tg-photo';
                img.src = user.photo || fallbackAvatar;
                img.alt = user.atName || 'User';
                img.onerror = () => { img.src = fallbackAvatar; };

                const meta = document.createElement('div');
                meta.className = 'user-tg-meta';

                const nameLine = document.createElement('div');
                nameLine.className = 'user-tg-username';

                const nickSpan = document.createElement('span');
                nickSpan.className = 'nick-text-truncate';
                nickSpan.textContent = (user.atName || '@foydalanuvchi') + (isMe ? ' (Siz)' : '');

                const badgeWrap = document.createElement('span');
                badgeWrap.innerHTML = getGenderPremiumSvg(user.gender || 'male');

                nameLine.appendChild(nickSpan);
                nameLine.appendChild(badgeWrap.firstElementChild);

                meta.appendChild(nameLine);
                left.appendChild(img);
                left.appendChild(meta);
                card.appendChild(left);

                const viewBtn = document.createElement('button');
                viewBtn.type = 'button';
                viewBtn.className = 'view-profile-btn';
                viewBtn.textContent = 'Koʻrish';
                viewBtn.onclick = () => openViewUserModal(user.id);
                card.appendChild(viewBtn);

                listEl.appendChild(card);
            });
        }

        function getThreadKey(uidA, uidB) {
            return [String(uidA), String(uidB)].sort().join('__');
        }

        function getThreadsForCurrentUser() {
            return Object.entries(allChatsMap || {})
                .filter(([key]) => key.split('__').includes(String(currentUser.id)))
                .map(([key, msgsObj]) => {
                    const parts = key.split('__');
                    const peerId = parts[0] === String(currentUser.id) ? parts[1] : parts[0];
                    const msgs = Object.values(msgsObj || {}).sort((a, b) => (a.ts || 0) - (b.ts || 0));
                    const lastMsg = msgs[msgs.length - 1];
                    const lastReadTs = Number(readMap[key] || 0);
                    const unreadCount = msgs.filter(m => String(m.senderId) !== String(currentUser.id) && (m.ts || 0) > lastReadTs).length;
                    return { key, peerId, msgs, lastMsg, unreadCount };
                })
                .filter(t => t.lastMsg)
                .sort((a, b) => (b.lastMsg.ts || 0) - (a.lastMsg.ts || 0));
        }

        function updateLichkaBadges() {
            const threads = getThreadsForCurrentUser();
            const totalUnread = threads.reduce((sum, t) => sum + t.unreadCount, 0);
            const navBadge = document.getElementById('lichkaUnreadBadge');
            const countEl = document.getElementById('lichkaThreadsCount');

            if (countEl) {
                countEl.textContent = `${threads.length} ta xabar`;
            }

            if (navBadge) {
                if (totalUnread > 0) {
                    navBadge.textContent = String(totalUnread);
                    navBadge.classList.add('visible');
                } else {
                    navBadge.textContent = '0';
                    navBadge.classList.remove('visible');
                }
            }
        }

        function renderLichkaThreadsList() {
            updateLichkaBadges();
            const listEl = document.getElementById('lichkaThreadsList');
            const threads = getThreadsForCurrentUser();

            listEl.innerHTML = '';
            if (threads.length === 0) {
                listEl.innerHTML = `
                    <div class="panel-subtitle" style="padding:24px 10px;">
                        x-lichka boʻsh. x-tanishuv boʻlimidan biror foydalanuvchini tanlab xabar yozing.
                    </div>
                `;
                return;
            }

            threads.forEach(thread => {
                const peer = allUsersMap[thread.peerId] || {
                    id: thread.peerId,
                    atName: '@foydalanuvchi',
                    photo: '',
                    gender: 'male'
                };

                const card = document.createElement('div');
                card.className = 'dm-thread-card' + (thread.unreadCount > 0 ? ' has-unread' : '');
                card.onclick = () => openIgChat(thread.peerId);

                const prefix = String(thread.lastMsg.senderId) === String(currentUser.id) ? 'Siz: ' : '';
                card.innerHTML = `
                    <div class="dm-thread-left">
                        <img class="user-tg-photo" src="${escapeHtml(peer.photo || fallbackAvatar)}" alt="Rasm">
                        <div class="dm-thread-info">
                            <div class="dm-thread-peer">
                                <span class="nick-text-truncate">${escapeHtml(peer.atName || '@foydalanuvchi')}</span>
                                ${getGenderPremiumSvg(peer.gender || 'male')}
                            </div>
                            <div class="dm-thread-last">${escapeHtml(prefix + (thread.lastMsg.text || ''))}</div>
                        </div>
                    </div>
                    <span class="view-profile-btn" style="padding:7px 11px;">
                        ${thread.unreadCount > 0 ? thread.unreadCount + ' yangi' : 'Yozish'}
                    </span>
                `;

                const imgEl = card.querySelector('img');
                if (imgEl) {
                    imgEl.onerror = function() { this.src = fallbackAvatar; };
                }

                listEl.appendChild(card);
            });
        }

        function openIgChat(peerId) {
            activeChatPeerId = String(peerId);
            const peer = allUsersMap[activeChatPeerId] || {
                id: activeChatPeerId,
                atName: '@foydalanuvchi',
                photo: '',
                gender: 'male'
            };

            const key = getThreadKey(currentUser.id, activeChatPeerId);
            readMap[key] = Date.now();
            saveReadMap(readMap);
            updateLichkaBadges();

            document.getElementById('lichkaThreadsView').style.display = 'none';
            document.getElementById('igChatView').classList.add('active');

            const avatarEl = document.getElementById('igPeerAvatar');
            avatarEl.src = peer.photo || fallbackAvatar;
            avatarEl.onerror = function() { this.src = fallbackAvatar; };

            document.getElementById('igPeerNick').textContent = peer.atName || '@foydalanuvchi';
            document.getElementById('igPeerBadge').innerHTML = getGenderPremiumSvg(peer.gender || 'male');
            document.getElementById('igMessageInput').value = '';

            renderIgMessages(activeChatPeerId);
        }

        function backToThreadsList() {
            activeChatPeerId = null;
            document.getElementById('igChatView').classList.remove('active');
            document.getElementById('lichkaThreadsView').style.display = 'flex';
            renderLichkaThreadsList();
        }

        function renderIgMessages(peerId) {
            const stream = document.getElementById('igMessagesStream');
            const key = getThreadKey(currentUser.id, peerId);
            const threadObj = allChatsMap[key] || {};
            const msgs = Object.values(threadObj).sort((a, b) => (a.ts || 0) - (b.ts || 0));

            stream.innerHTML = '';
            if (msgs.length === 0) {
                stream.innerHTML = `<div class="panel-subtitle" style="margin:auto; padding:16px;">Suhbatni boshlang — xabarlar shu yerda koʻrinadi.</div>`;
                return;
            }

            msgs.forEach(m => {
                const isMine = String(m.senderId) === String(currentUser.id);
                const bubble = document.createElement('div');
                bubble.className = 'ig-bubble ' + (isMine ? 'mine' : 'theirs');
                bubble.textContent = m.text || '';
                stream.appendChild(bubble);
            });
            stream.scrollTop = stream.scrollHeight;
        }

        async function sendIgMessage() {
            if (!activeChatPeerId) return;
            const inputEl = document.getElementById('igMessageInput');
            const text = inputEl.value.trim();
            if (!text) return;

            const nowTs = Date.now();
            const key = getThreadKey(currentUser.id, activeChatPeerId);
            const msgId = 'msg_' + nowTs + '_' + Math.random().toString(36).slice(2, 6);
            const msgObj = {
                id: msgId,
                senderId: String(currentUser.id),
                receiverId: String(activeChatPeerId),
                text: text,
                ts: nowTs
            };

            if (!allChatsMap[key] || typeof allChatsMap[key] !== 'object') {
                allChatsMap[key] = {};
            }
            allChatsMap[key][msgId] = msgObj;
            readMap[key] = nowTs;
            saveLocalChats(allChatsMap);
            saveReadMap(readMap);

            inputEl.value = '';
            renderIgMessages(activeChatPeerId);
            updateLichkaBadges();

            if (FIREBASE_DB_URL) {
                const base = FIREBASE_DB_URL.replace(/\/+$/, '');
                try {
                    await fetch(`${base}/tanishuv_chats/${encodeURIComponent(key)}/${encodeURIComponent(msgId)}.json`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(msgObj)
                    });
                } catch (err) {}
            }
        }

        async function syncAndLoadUsers() {
            currentUser.lastSeen = Date.now();
            const localMap = loadLocalDirectory();
            localMap[currentUser.id] = currentUser;
            saveLocalDirectory(localMap);

            allUsersMap = { ...localMap };

            if (FIREBASE_DB_URL) {
                const base = FIREBASE_DB_URL.replace(/\/+$/, '');
                try {
                    await fetch(`${base}/tanishuv_users/${encodeURIComponent(currentUser.id)}.json`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(currentUser)
                    });

                    const [usersRes, chatsRes] = await Promise.all([
                        fetch(`${base}/tanishuv_users.json`),
                        fetch(`${base}/tanishuv_chats.json`)
                    ]);

                    if (usersRes.ok) {
                        const remoteUsers = await usersRes.json();
                        if (remoteUsers && typeof remoteUsers === 'object') {
                            allUsersMap = { ...allUsersMap, ...remoteUsers };
                            if (allUsersMap[currentUser.id]) {
                                currentUser = { ...currentUser, ...allUsersMap[currentUser.id], id: currentUser.id };
                            }
                            saveLocalDirectory(allUsersMap);
                        }
                    }

                    if (chatsRes.ok) {
                        const remoteChats = await chatsRes.json();
                        if (remoteChats && typeof remoteChats === 'object') {
                            allChatsMap = { ...allChatsMap, ...remoteChats };
                            saveLocalChats(allChatsMap);
                        }
                    }
                } catch (err) {}
            }

            renderHisobimProfile();
            renderTanishuvUsers(allUsersMap);
            renderLichkaThreadsList();
            if (activeChatPeerId) {
                const key = getThreadKey(currentUser.id, activeChatPeerId);
                readMap[key] = Date.now();
                saveReadMap(readMap);
                renderIgMessages(activeChatPeerId);
                updateLichkaBadges();
            }
        }

        function selectGender(gender) {
            tempSelectedGender = gender === 'female' ? 'female' : 'male';
            document.getElementById('genderMaleBtn').classList.toggle('selected', tempSelectedGender === 'male');
            document.getElementById('genderFemaleBtn').classList.toggle('selected', tempSelectedGender === 'female');
        }

        function openEditModal() {
            tempEditedPhoto = currentUser.photo || '';
            tempSelectedGender = currentUser.gender || 'male';
            selectGender(tempSelectedGender);

            document.getElementById('modalPreviewPhoto').src = tempEditedPhoto || fallbackAvatar;
            document.getElementById('modalPreviewPhoto').onerror = function() { this.src = fallbackAvatar; };
            document.getElementById('nickInput').value = currentUser.atName || '@nik';
            document.getElementById('birthDateInput').value = currentUser.birthDate || '';
            document.getElementById('bioInput').value = currentUser.bio || '';
            document.getElementById('modalErrorMsg').textContent = '';
            document.getElementById('photoFileInput').value = '';
            document.getElementById('editProfileModal').classList.add('open');
        }

        function closeEditModal() {
            document.getElementById('editProfileModal').classList.remove('open');
            document.getElementById('modalErrorMsg').textContent = '';
        }

        function handlePhotoChosen(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxSize = 240;
                    let w = img.width;
                    let h = img.height;

                    if (w > h) {
                        if (w > maxSize) {
                            h = Math.round((h * maxSize) / w);
                            w = maxSize;
                        }
                    } else {
                        if (h > maxSize) {
                            w = Math.round((w * maxSize) / h);
                            h = maxSize;
                        }
                    }

                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);

                    tempEditedPhoto = canvas.toDataURL('image/jpeg', 0.8);
                    document.getElementById('modalPreviewPhoto').src = tempEditedPhoto;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function saveProfileChanges() {
            const errorEl = document.getElementById('modalErrorMsg');
            const rawInput = document.getElementById('nickInput').value.trim();
            const birthDateVal = document.getElementById('birthDateInput').value.trim();
            const bioVal = document.getElementById('bioInput').value.trim();

            if (!rawInput || rawInput === '@') {
                errorEl.textContent = 'Iltimos, nik kiriting!';
                return;
            }

            const candidateNick = normalizeNick(rawInput, currentUser.fullName).toLowerCase();
            const displayNick = normalizeNick(rawInput, currentUser.fullName);

            if (FIREBASE_DB_URL) {
                const base = FIREBASE_DB_URL.replace(/\/+$/, '');
                try {
                    const res = await fetch(`${base}/tanishuv_users.json`);
                    if (res.ok) {
                        const remoteData = await res.json();
                        if (remoteData && typeof remoteData === 'object') {
                            allUsersMap = { ...allUsersMap, ...remoteData };
                        }
                    }
                } catch (err) {}
            }

            const isNickTakenByOther = Object.values(allUsersMap).some(u => {
                if (!u || String(u.id) === String(currentUser.id)) return false;
                const existingNick = normalizeNick(u.atName || '', u.fullName || '').toLowerCase();
                return existingNick === candidateNick;
            });

            if (isNickTakenByOther) {
                errorEl.textContent = 'Bu nik allaqachon band! Boshqa nik kiriting.';
                return;
            }

            currentUser = {
                ...currentUser,
                atName: displayNick,
                photo: tempEditedPhoto || currentUser.photo || '',
                gender: tempSelectedGender,
                birthDate: birthDateVal,
                bio: bioVal,
                lastSeen: Date.now()
            };

            closeEditModal();
            await syncAndLoadUsers();

            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
        }

        function openViewUserModal(userId) {
            const user = allUsersMap[String(userId)];
            if (!user) return;
            activePeerUser = user;

            document.getElementById('peerProfilePhoto').src = user.photo || fallbackAvatar;
            document.getElementById('peerProfilePhoto').onerror = function() { this.src = fallbackAvatar; };
            document.getElementById('peerProfileNick').textContent = user.atName || '@foydalanuvchi';
            document.getElementById('peerProfileGenderBadge').innerHTML = getGenderPremiumSvg(user.gender || 'male');
            document.getElementById('peerProfileMeta').innerHTML = buildMetaPills(user);
            document.getElementById('peerProfileBio').textContent = user.bio ? user.bio : 'Tavsif kiritilmagan.';
            document.getElementById('viewUserModal').classList.add('open');
        }

        function closeViewUserModal() {
            document.getElementById('viewUserModal').classList.remove('open');
        }

        function openExternalTgFromPeer() {
            if (!activePeerUser) return;
            if (activePeerUser.tgUsername) {
                const link = 'https://t.me/' + activePeerUser.tgUsername;
                if (tg && tg.openTelegramLink) {
                    tg.openTelegramLink(link);
                } else {
                    window.open(link, '_blank', 'noopener,noreferrer');
                }
            } else if (activePeerUser.tgUserId) {
                const link = 'tg://user?id=' + activePeerUser.tgUserId;
                window.location.href = link;
            } else {
                alert('Bu foydalanuvchining Telegram profili topilmadi.');
            }
        }

        function openLichkaFromPeer() {
            if (!activePeerUser) return;
            const peerId = String(activePeerUser.id);
            closeViewUserModal();

            const lichkaBtn = document.querySelector('.nav-item-btn:nth-child(3)');
            openPanel('lichka', lichkaBtn);
            openIgChat(peerId);
        }

        renderHisobimProfile();
        renderLichkaThreadsList();
        syncAndLoadUsers();

        setInterval(() => {
            syncAndLoadUsers();
        }, 5000);

        setTimeout(() => {
            document.getElementById('splashScreen').classList.remove('active');
            document.getElementById('mainScreen').classList.add('active');
        }, 1600);

        function openPanel(panelName, btnEl) {
            document.querySelectorAll('.nav-item-btn').forEach(btn => btn.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');

            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
            const activePanel = document.getElementById('panel-' + panelName);
            if (activePanel) activePanel.classList.add('active');

            if (panelName === 'lichka' && !activeChatPeerId) {
                backToThreadsList();
            }

            syncAndLoadUsers();

            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.selectionChanged();
            }
        }
    </script>
</body>
</html>
