<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACAZES market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #070709;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Orqa fon SVG setka va nur */
        .bg-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 42px;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        /* Premium SVG Logo Animatsiyasi */
        .logo-svg {
            width: 100%;
            max-width: 340px;
            height: auto;
            overflow: visible;
            animation: svgPulse 2.2s infinite alternate ease-in-out;
        }

        @keyframes svgPulse {
            0% {
                transform: scale(0.98);
                filter: drop-shadow(0 0 14px rgba(255, 38, 38, 0.75)) drop-shadow(0 0 32px rgba(255, 38, 38, 0.35));
            }
            100% {
                transform: scale(1.03);
                filter: drop-shadow(0 0 18px rgba(255, 208, 0, 0.85)) drop-shadow(0 0 40px rgba(255, 136, 0, 0.45));
            }
        }

        /* Premium SVG KIRISH tugmasi */
        .enter-svg-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            outline: none;
            transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
            filter: drop-shadow(0 10px 25px rgba(255, 72, 0, 0.35));
        }

        .enter-svg-btn:active {
            transform: scale(0.93);
            filter: drop-shadow(0 4px 12px rgba(255, 72, 0, 0.25));
        }

        .btn-shine {
            animation: shineMove 3s infinite linear;
        }

        @keyframes shineMove {
            0% { transform: translateX(-220px); }
            50%, 100% { transform: translateX(260px); }
        }
    </style>
</head>
<body>

    <!-- Orqa fondagi Premium SVG geometrik panjara va markaziy nur -->
    <svg class="bg-svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <pattern id="premiumGrid" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
                <circle cx="0" cy="0" r="1" fill="rgba(255, 180, 0, 0.12)"/>
            </pattern>
            <radialGradient id="ambientGlow" cx="50%" cy="42%" r="55%">
                <stop offset="0%" stop-color="#ff2a2a" stop-opacity="0.18"/>
                <stop offset="45%" stop-color="#ffaa00" stop-opacity="0.06"/>
                <stop offset="100%" stop-color="#070709" stop-opacity="0"/>
            </radialGradient>
        </defs>
        <rect width="100%" height="100%" fill="url(#premiumGrid)"/>
        <rect width="100%" height="100%" fill="url(#ambientGlow)"/>
    </svg>

    <div class="container">
        <!-- 100% Premium SVG: A C A Z E S market -->
        <svg class="logo-svg" viewBox="0 0 360 135" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Qizil-Sariq jonli o'tuvchi gradient -->
                <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ff1e1e">
                        <animate attributeName="stop-color" values="#ff1e1e; #ffd000; #ff1e1e" dur="2.4s" repeatCount="indefinite"/>
                    </stop>
                    <stop offset="50%" stop-color="#ff8800">
                        <animate attributeName="stop-color" values="#ff8800; #ff2a2a; #ff8800" dur="2.4s" repeatCount="indefinite"/>
                    </stop>
                    <stop offset="100%" stop-color="#ffd000">
                        <animate attributeName="stop-color" values="#ffd000; #ff1e1e; #ffd000" dur="2.4s" repeatCount="indefinite"/>
                    </stop>
                </linearGradient>

                <!-- Teskari oqimdagi sub-gradient -->
                <linearGradient id="subFireGrad" x1="100%" y1="0%" x2="0%" y2="0%">
                    <stop offset="0%" stop-color="#ffd000">
                        <animate attributeName="stop-color" values="#ffd000; #ff2a2a; #ffd000" dur="2.4s" repeatCount="indefinite"/>
                    </stop>
                    <stop offset="100%" stop-color="#ff2a2a">
                        <animate attributeName="stop-color" values="#ff2a2a; #ffd000; #ff2a2a" dur="2.4s" repeatCount="indefinite"/>
                    </stop>
                </linearGradient>

                <!-- Premium tashqi ramka chizig'i -->
                <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="rgba(255, 42, 42, 0.55)"/>
                    <stop offset="50%" stop-color="rgba(255, 208, 0, 0.2)"/>
                    <stop offset="100%" stop-color="rgba(255, 208, 0, 0.65)"/>
                </linearGradient>
            </defs>

            <!-- Dekorativ burchak SVG chiziqlar -->
            <path d="M 24 18 L 10 18 L 10 32" fill="none" stroke="url(#frameGrad)" stroke-width="2" stroke-linecap="round"/>
            <path d="M 336 18 L 350 18 L 350 32" fill="none" stroke="url(#frameGrad)" stroke-width="2" stroke-linecap="round"/>
            <path d="M 24 118 L 10 118 L 10 104" fill="none" stroke="url(#frameGrad)" stroke-width="2" stroke-linecap="round"/>
            <path d="M 336 118 L 350 118 L 350 104" fill="none" stroke="url(#frameGrad)" stroke-width="2" stroke-linecap="round"/>

            <!-- Asosiy A C A Z E S vektor yozuvi -->
            <text x="186" y="62" text-anchor="middle" dominant-baseline="middle"
                  fill="url(#fireGrad)"
                  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
                  font-size="44" font-weight="900" letter-spacing="13">
                ACAZES
            </text>

            <!-- Ajratuvchi nozik SVG nur chizig'i -->
            <line x1="95" y1="86" x2="265" y2="86" stroke="url(#frameGrad)" stroke-width="1.2" stroke-linecap="round"/>

            <!-- Pastki market vektor yozuvi -->
            <text x="184" y="106" text-anchor="middle" dominant-baseline="middle"
                  fill="url(#subFireGrad)"
                  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
                  font-size="16" font-weight="800" letter-spacing="9">
                market
            </text>
        </svg>

        <!-- 100% Premium SVG: KIRISH Tugmasi -->
        <button class="enter-svg-btn" onclick="enterMarket()" aria-label="Kirish">
            <svg width="240" height="62" viewBox="0 0 240 62" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="btnBg" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ff2222"/>
                        <stop offset="50%" stop-color="#ff6a00"/>
                        <stop offset="100%" stop-color="#ffbb00"/>
                    </linearGradient>

                    <linearGradient id="btnBorder" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="rgba(255, 255, 255, 0.75)"/>
                        <stop offset="100%" stop-color="rgba(255, 255, 255, 0.1)"/>
                    </linearGradient>

                    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
                        <stop offset="50%" stop-color="rgba(255,255,255,0.45)"/>
                        <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
                    </linearGradient>

                    <clipPath id="btnClip">
                        <rect x="2" y="2" width="236" height="58" rx="18"/>
                    </clipPath>
                </defs>

                <!-- Tugma asosi -->
                <rect x="2" y="2" width="236" height="58" rx="18" fill="url(#btnBg)"/>
                
                <!-- Yuqori shishasimon yaltiroq chiziq -->
                <rect x="2" y="2" width="236" height="58" rx="18" fill="none" stroke="url(#btnBorder)" stroke-width="1.5"/>

                <!-- Harakatlanuvchi yaltiroq nur (Shine) -->
                <g clip-path="url(#btnClip)">
                    <polygon class="btn-shine" points="0,0 45,0 20,62 -25,62" fill="url(#shineGrad)"/>
                </g>

                <!-- KIRISH vektor matni -->
                <text x="106" y="32" text-anchor="middle" dominant-baseline="middle"
                      fill="#ffffff"
                      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
                      font-size="16" font-weight="900" letter-spacing="3.5">
                    KIRISH
                </text>

                <!-- Premium SVG Strelka ikonkasi -->
                <g transform="translate(166, 21)" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
                    <line x1="0" y1="10" x2="16" y2="10"/>
                    <polyline points="10 4 16 10 10 16"/>
                </g>
            </svg>
        </button>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        function enterMarket() {
            // Hozircha keyingi oynaga o'tmay turadi
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }
        }
    </script>
</body>
</html>
