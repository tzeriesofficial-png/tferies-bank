<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcazesAcademy</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Juda to'q va yorqin Sabzi rang fon */
        body {
            background: linear-gradient(145deg, #ff5500 0%, #e64500 50%, #cc3700 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            color: #ffffff;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: opacity 0.3s ease;
        }

        .page.hidden {
            opacity: 0;
            pointer-events: none;
            z-index: 1;
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 10;
        }

        /* 1-OYNA: Kirish */
        .landing-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .academy-title {
            font-size: 38px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
        }

        .register-btn {
            background: #ffffff;
            color: #e64500;
            border: none;
            border-radius: 20px;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            transition: transform 0.15s ease;
        }

        .register-btn:active {
            transform: scale(0.95);
        }

        /* 2-OYNA: Sana va Poisk */
        .date-card {
            background: rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            border-radius: 28px;
            padding: 24px 20px;
            width: 100%;
            max-width: 370px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
        }

        .premium-search-wrap {
            position: relative;
            width: 100%;
        }

        .premium-search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #ffffff;
            border-radius: 16px;
            padding: 12px 16px 12px 42px;
            font-size: 14px;
            font-weight: 800;
            color: #cc3700;
            outline: none;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.12);
        }

        .premium-search-input::placeholder {
            color: #ff7733;
            font-weight: 700;
        }

        .search-svg-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .selectors-grid {
            display: grid;
            grid-template-columns: 1.2fr 1.3fr 0.9fr;
            gap: 8px;
            width: 100%;
        }

        .select-box {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .select-label {
            font-size: 11px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            text-transform: uppercase;
        }

        .premium-select {
            background: #ffffff;
            color: #cc3700;
            border: none;
            border-radius: 14px;
            padding: 12px 6px;
            font-size: 14px;
            font-weight: 900;
            text-align: center;
            outline: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            appearance: none;
            -webkit-appearance: none;
        }

        .selected-preview {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 14px;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            color: #ffffff;
            border: 1px dashed rgba(255, 255, 255, 0.4);
        }

        .confirm-btn {
            background: #ffffff;
            color: #e64500;
            border: none;
            border-radius: 16px;
            padding: 14px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transition: transform 0.15s ease;
        }

        .confirm-btn:active {
            transform: scale(0.96);
        }

        /* 3-OYNA: Profil */
        .profile-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            padding: 24px 20px;
            width: 100%;
            max-width: 370px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
        }

        .avatar-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            padding: 4px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .user-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            background: #ff5500;
        }

        .user-name-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .user-fullname {
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .black-wiggle-badge {
            width: 24px;
            height: 24px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            animation: blackBadgeMotion 2s infinite ease-in-out;
        }

        @keyframes blackBadgeMotion {
            0%, 100% { transform: scale(1) rotate(0deg); }
            20% { transform: scale(1.22) rotate(-12deg); }
            45% { transform: scale(0.95) rotate(10deg); }
            70% { transform: scale(1.15) rotate(-8deg); }
        }

        .user-birth-info {
            background: rgba(0, 0, 0, 0.22);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .wiggle-cake-icon {
            width: 20px;
            height: 20px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            animation: cakeWiggle 2.2s infinite ease-in-out;
        }

        @keyframes cakeWiggle {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.18) rotate(-10deg); }
            50% { transform: scale(0.92) rotate(8deg); }
            75% { transform: scale(1.1) rotate(-5deg); }
        }

        /* "Tushundim" Premium SVG tugma */
        .understand-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 16px;
            padding: 14px;
            font-size: 15px;
            font-weight: 900;
            width: 100%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            transition: transform 0.15s ease;
        }

        .understand-btn:active {
            transform: scale(0.96);
        }

        .btn-star-icon {
            animation: starSpinWiggle 2.5s infinite ease-in-out;
            display: inline-flex;
        }

        @keyframes starSpinWiggle {
            0%, 100% { transform: scale(1) rotate(0deg); }
            30% { transform: scale(1.25) rotate(20deg); }
            60% { transform: scale(0.9) rotate(-10deg); }
        }

        /* 4-OYNA: 6 ta Til (Davlat) tanlash ekrani */
        .languages-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 390px;
            gap: 18px;
            padding: 10px;
        }

        /* Qimirlab turuvchi Premium SVG Sarlavha */
        .animated-header-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.25);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            padding: 12px 18px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            width: 100%;
            text-align: center;
            animation: headerPulseWiggle 3s infinite ease-in-out;
        }

        @keyframes headerPulseWiggle {
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 255, 255, 0.1); }
            50% { transform: scale(1.02); box-shadow: 0 0 25px rgba(255, 255, 255, 0.25); }
        }

        .header-text {
            font-size: 14.5px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .header-svg-anim {
            animation: headIconWiggle 2s infinite ease-in-out;
        }

        @keyframes headIconWiggle {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-15deg) scale(1.2); }
            75% { transform: rotate(15deg) scale(1.2); }
        }

        /* 6 ta Til kartochkalari gridi */
        .lang-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }

        .lang-card {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(14px);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            border-radius: 22px;
            padding: 18px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.15s ease, background 0.2s ease;
            animation: cardFloatAnim 4s infinite ease-in-out;
        }

        .lang-card:nth-child(even) { animation-delay: 2s; }

        @keyframes cardFloatAnim {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .lang-card:active {
            transform: scale(0.94);
            background: rgba(0, 0, 0, 0.6);
        }

        /* Qimirlab turuvchi Premium SVG Bayroq ikonkasi */
        .flag-svg-wrap {
            width: 48px;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: flagWiggleMotion 2.5s infinite ease-in-out;
        }

        @keyframes flagWiggleMotion {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.15) rotate(-8deg); }
            50% { transform: scale(0.95) rotate(6deg); }
            75% { transform: scale(1.1) rotate(-4deg); }
        }

        .lang-name {
            font-size: 15px;
            font-weight: 900;
            color: #ffffff;
            text-align: center;
        }

        .lang-sub {
            font-size: 11px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>

    <!-- 1-OYNA: Kirish -->
    <div id="step1Page" class="page active">
        <div class="landing-box">
            <div class="academy-title">AcazesAcademy</div>

            <button class="register-btn" onclick="goToStep2()">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L14.8 4.2L18.4 3.8L19.6 7.2L22.6 9.2L21.6 12.7L22.6 16.2L19.6 18.2L18.4 21.6L14.8 21.2L12 23.4L9.2 21.2L5.6 21.6L4.4 18.2L1.4 16.2L2.4 12.7L1.4 9.2L4.4 7.2L5.6 3.8L9.2 4.2L12 2Z" fill="#ff5500"/>
                    <path d="M12 8V16M8 12H16" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
                <span>Roʻyxatdan oʻtish</span>
            </button>
        </div>
    </div>

    <!-- 2-OYNA: Sana va Poisk -->
    <div id="step2Page" class="page hidden">
        <div class="date-card">
            <div class="card-header">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="4" ry="4"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span>Tugʻilgan sanangizni kiriting</span>
            </div>

            <div class="premium-search-wrap">
                <svg class="search-svg-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#ff5500" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="dateSearchInput" class="premium-search-input" placeholder="Poisk: masalan 2008 yoki Mart..." oninput="smartDateSearch(this.value)">
            </div>

            <div class="selectors-grid">
                <div class="select-box">
                    <span class="select-label">Yil</span>
                    <select id="yearSelect" class="premium-select" onchange="updateDatePreview()"></select>
                </div>
                <div class="select-box">
                    <span class="select-label">Oy</span>
                    <select id="monthSelect" class="premium-select" onchange="updateDatePreview()"></select>
                </div>
                <div class="select-box">
                    <span class="select-label">Sana</span>
                    <select id="daySelect" class="premium-select" onchange="updateDatePreview()"></select>
                </div>
            </div>

            <div id="datePreview" class="selected-preview">
                Tanlangan: 2005-yil, 1-Yanvar
            </div>

            <button class="confirm-btn" onclick="completeRegistration()">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#e64500" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <span>Tasdiqlash</span>
            </button>
        </div>
    </div>

    <!-- 3-OYNA: Profil -->
    <div id="step3Page" class="page hidden">
        <div class="profile-card">
            <div class="avatar-wrapper">
                <img id="tgUserPhoto" src="https://via.placeholder.com/100/ff5500/ffffff?text=User" alt="Profil" class="user-avatar">
            </div>

            <div class="user-name-row">
                <span id="tgUserName" class="user-fullname">Foydalanuvchi</span>

                <div class="black-wiggle-badge" title="Tasdiqlangan">
                    <svg viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L14.8 4.2L18.4 3.8L19.6 7.2L22.6 9.2L21.6 12.7L22.6 16.2L19.6 18.2L18.4 21.6L14.8 21.2L12 23.4L9.2 21.2L5.6 21.6L4.4 18.2L1.4 16.2L2.4 12.7L1.4 9.2L4.4 7.2L5.6 3.8L9.2 4.2L12 2Z" fill="#000000"/>
                        <polyline points="8.5 12.5 11 15 16 9.5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>

            <div id="userSavedBirth" class="user-birth-info">
                <div class="wiggle-cake-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2V5M9 3.5H15M7 11H17V20C17 21.1046 16.1046 22 15 22H9C7.89543 22 7 21.1046 7 20V11Z" fill="#ffaa55" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M4 11H20V13H4V11Z" fill="#ffffff" rx="1"/>
                        <path d="M7 16H17V17H7V16Z" fill="#ff5500"/>
                    </svg>
                </div>
                <span id="birthTextVal">2005-yil, 1-Yanvar</span>
            </div>

            <!-- "Tushundim" Premium SVG tugma -->
            <button class="understand-btn" onclick="goToStep4()">
                <div class="btn-star-icon">
                    <svg viewBox="0 0 24 24" width="22" height="22" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L14.8 4.2L18.4 3.8L19.6 7.2L22.6 9.2L21.6 12.7L22.6 16.2L19.6 18.2L18.4 21.6L14.8 21.2L12 23.4L9.2 21.2L5.6 21.6L4.4 18.2L1.4 16.2L2.4 12.7L1.4 9.2L4.4 7.2L5.6 3.8L9.2 4.2L12 2Z" fill="#000000"/>
                        <path d="M12 6L13.5 10.5H18L14.2 13.2L15.8 17.5L12 14.8L8.2 17.5L9.8 13.2L6 10.5H10.5L12 6Z" fill="#ffffff"/>
                    </svg>
                </div>
                <span>Tushundim</span>
            </button>
        </div>
    </div>

    <!-- 4-OYNA: 6 ta Til (Davlat) tanlash va Qimirlaydigan Premium SVG Sarlavha -->
    <div id="step4Page" class="page hidden">
        <div class="languages-container">
            <!-- Qimirlab turuvchi Premium SVG Sarlavha -->
            <div class="animated-header-box">
                <div class="header-svg-anim">
                    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" fill="#ffffff"/>
                        <path d="M2 12H22M12 2C14.5 4.5 15.5 8 15.5 12C15.5 16 14.5 19.5 12 22C9.5 19.5 8.5 16 8.5 12C8.5 8 9.5 4.5 12 2Z" stroke="#ff5500" stroke-width="2"/>
                    </svg>
                </div>
                <span class="header-text">AcazesAcademy’ga nima maqsadda kirdingiz?</span>
            </div>

            <!-- 6 ta Til kartochkalari -->
            <div class="lang-grid">
                <!-- 1. Ingliz tili -->
                <div class="lang-card" onclick="selectLanguage('Ingliz tili')">
                    <div class="flag-svg-wrap">
                        <svg viewBox="0 0 36 36" width="44" height="44">
                            <circle cx="18" cy="18" r="18" fill="#012169"/>
                            <path d="M0 0L36 36M36 0L0 36" stroke="#fff" stroke-width="5"/>
                            <path d="M0 0L36 36M36 0L0 36" stroke="#C8102E" stroke-width="2"/>
                            <path d="M18 0V36M0 18H36" stroke="#fff" stroke-width="8"/>
                            <path d="M18 0V36M0 18H36" stroke="#C8102E" stroke-width="4"/>
                        </svg>
                    </div>
                    <div>
                        <div class="lang-name">Ingliz tili</div>
                        <div class="lang-sub">Global til</div>
                    </div>
                </div>

                <!-- 2. Rus tili -->
                <div class="lang-card" onclick="selectLanguage('Rus tili')">
                    <div class="flag-svg-wrap">
                        <svg viewBox="0 0 36 36" width="44" height="44">
                            <circle cx="18" cy="18" r="18" fill="#fff"/>
                            <rect x="0" y="12" width="36" height="12" fill="#0039A6"/>
                            <rect x="0" y="24" width="36" height="12" fill="#D52B1E"/>
                        </svg>
                    </div>
                    <div>
                        <div class="lang-name">Rus tili</div>
                        <div class="lang-sub">Muloqot</div>
                    </div>
                </div>

                <!-- 3. Koreys tili -->
                <div class="lang-card" onclick="selectLanguage('Koreys tili')">
                    <div class="flag-svg-wrap">
                        <svg viewBox="0 0 36 36" width="44" height="44">
                            <circle cx="18" cy="18" r="18" fill="#fff"/>
                            <circle cx="18" cy="18" r="7" fill="#CD2E3A"/>
                            <path d="M11 18A7 7 0 0 0 25 18" fill="#0047A0"/>
                        </svg>
                    </div>
                    <div>
                        <div class="lang-name">Koreys tili</div>
                        <div class="lang-sub">TOPIK</div>
                    </div>
                </div>

                <!-- 4. Yapon tili -->
                <div class="lang-card" onclick="selectLanguage('Yapon tili')">
                    <div class="flag-svg-wrap">
                        <svg viewBox="0 0 36 36" width="44" height="44">
                            <circle cx="18" cy="18" r="18" fill="#fff"/>
                            <circle cx="18" cy="18" r="7.5" fill="#BC002D"/>
                        </svg>
                    </div>
                    <div>
                        <div class="lang-name">Yapon tili</div>
                        <div class="lang-sub">Anime & Ish</div>
                    </div>
                </div>

                <!-- 5. Turk tili -->
                <div class="lang-card" onclick="selectLanguage('Turk tili')">
                    <div class="flag-svg-wrap">
                        <svg viewBox="0 0 36 36" width="44" height="44">
                            <circle cx="18" cy="18" r="18" fill="#E30A17"/>
                            <circle cx="15" cy="18" r="7" fill="#E30A17"/>
                            <circle cx="16.5" cy="18" r="5.5" fill="#fff"/>
                            <polygon points="21,18 24.5,16.5 23,20" fill="#fff"/>
                        </svg>
                    </div>
                    <div>
                        <div class="lang-name">Turk tili</div>
                        <div class="lang-sub">Serial & Muloqot</div>
                    </div>
                </div>

                <!-- 6. Nemis tili -->
                <div class="lang-card" onclick="selectLanguage('Nemis tili')">
                    <div class="flag-svg-wrap">
                        <svg viewBox="0 0 36 36" width="44" height="44">
                            <circle cx="18" cy="18" r="18" fill="#000"/>
                            <rect x="0" y="12" width="36" height="12" fill="#DD0000"/>
                            <rect x="0" y="24" width="36" height="12" fill="#FFCC00"/>
                        </svg>
                    </div>
                    <div>
                        <div class="lang-name">Nemis tili</div>
                        <div class="lang-sub">Yevropa</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const months = [
            "Yanvar", "Fevral", "Mart", "Aprel", "May", "Iyun",
            "Iyul", "Avgust", "Sentabr", "Oktabr", "Noyabr", "Dekabr"
        ];

        function initDateSelectors() {
            const yearSel = document.getElementById('yearSelect');
            const monthSel = document.getElementById('monthSelect');
            const daySel = document.getElementById('daySelect');

            for (let y = 2020; y >= 1960; y--) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                if (y === 2005) opt.selected = true;
                yearSel.appendChild(opt);
            }

            months.forEach((m, idx) => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                if (idx === 0) opt.selected = true;
                monthSel.appendChild(opt);
            });

            for (let d = 1; d <= 31; d++) {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d;
                daySel.appendChild(opt);
            }
            updateDatePreview();
        }

        function smartDateSearch(query) {
            const q = query.trim().toLowerCase();
            if (!q) return;

            const yearSel = document.getElementById('yearSelect');
            const monthSel = document.getElementById('monthSelect');
            const daySel = document.getElementById('daySelect');

            const yearMatch = q.match(/\b(19\d{2}|20\d{2})\b/);
            if (yearMatch) {
                yearSel.value = yearMatch[1];
            }

            months.forEach(m => {
                if (q.includes(m.toLowerCase())) {
                    monthSel.value = m;
                }
            });

            const dayMatch = q.match(/\b([1-9]|[12][0-9]|3[01])\b/);
            if (dayMatch && !yearMatch) {
                daySel.value = dayMatch[1];
            }

            updateDatePreview();
        }

        function updateDatePreview() {
            const y = document.getElementById('yearSelect').value;
            const m = document.getElementById('monthSelect').value;
            const d = document.getElementById('daySelect').value;
            document.getElementById('datePreview').innerText = `Tanlangan: ${y}-yil, ${d}-${m}`;
        }

        function goToStep2() {
            hapticClick();
            document.getElementById('step1Page').classList.remove('active');
            document.getElementById('step1Page').classList.add('hidden');
            document.getElementById('step2Page').classList.remove('hidden');
            document.getElementById('step2Page').classList.add('active');
        }

        function syncTelegramUser() {
            let fullName = "Acazes Oʻquvchi";
            let photoUrl = "";

            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                fullName = [user.first_name, user.last_name].filter(Boolean).join(" ");
                if (user.photo_url) {
                    photoUrl = user.photo_url;
                } else if (user.username) {
                    photoUrl = `https://t.me/i/userpic/320/${user.username}.jpg`;
                }
            }

            document.getElementById('tgUserName').innerText = fullName;
            const imgEl = document.getElementById('tgUserPhoto');
            if (photoUrl) {
                imgEl.src = photoUrl + (photoUrl.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
            }
            imgEl.onerror = function() {
                this.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(fullName)}&background=ffffff&color=ff5500&bold=true&size=128`;
            };
        }

        function completeRegistration() {
            hapticClick();
            const y = document.getElementById('yearSelect').value;
            const m = document.getElementById('monthSelect').value;
            const d = document.getElementById('daySelect').value;

            syncTelegramUser();
            document.getElementById('birthTextVal').innerText = `${y}-yil, ${d}-${m}`;

            document.getElementById('step2Page').classList.remove('active');
            document.getElementById('step2Page').classList.add('hidden');
            document.getElementById('step3Page').classList.remove('hidden');
            document.getElementById('step3Page').classList.add('active');
        }

        function goToStep4() {
            hapticClick();
            document.getElementById('step3Page').classList.remove('active');
            document.getElementById('step3Page').classList.add('hidden');
            document.getElementById('step4Page').classList.remove('hidden');
            document.getElementById('step4Page').classList.add('active');
        }

        function selectLanguage(langName) {
            hapticClick();
            alert(`${langName} yo'nalishi tanlandi! Darsliklar tez orada yuklanadi.`);
        }

        function hapticClick() {
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initDateSelectors();
            syncTelegramUser();
        });
    </script>
</body>
</html>
