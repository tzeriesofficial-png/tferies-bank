<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Mini App</title>
    <!-- Telegram Web App skripti -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f4f4;
            color: #333;
            padding: 10px;
        }
        /* Qidiruv qismi */
        .search-container {
            position: sticky;
            top: 0;
            background: #f4f4f4;
            padding: 10px 0;
            z-index: 100;
        }
        .search-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            background-color: #e2e2e2;
            outline: none;
            transition: background 0.3s;
        }
        .search-input:focus {
            background-color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        /* Pinterest Grid (Kalonka) uslubi */
        .gallery {
            column-count: 2;
            column-gap: 10px;
            margin-top: 10px;
        }
        .card {
            break-inside: avoid;
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .card:active {
            transform: scale(0.98);
        }
        .card img {
            width: 100%;
            height: auto;
            display: block;
        }
        .card-title {
            padding: 8px 10px;
            font-size: 13px;
            font-weight: 500;
            color: #333;
        }
    </style>
</head>
<body>

    <!-- Qidirish paneli -->
    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Rasmlarni qidirish..." onkeyup="filterImages()">
    </div>

    <!-- Rasmlar galeriyasi (10 ta rasm) -->
    <div class="gallery" id="gallery">
        
        <!-- 1-rasm (Kelpka kiygan qoploncha) -->
        <div class="card" data-title="qoploncha leopard kelpka hayvon">
            <img src="https://images.unsplash.com/photo-1534361960057-19889db9621e?q=80&w=600&auto=format&fit=crop" alt="Stilniy qoploncha">
            <div class="card-title">Stilniy qoploncha</div>
        </div>

        <!-- 2-rasm -->
        <div class="card" data-title="tabiat manzara toglar">
            <img src="https://picsum.photos/seed/img2/300/500" alt="Rasm 2">
            <div class="card-title">Tog' manzarasi</div>
        </div>

        <!-- 3-rasm -->
        <div class="card" data-title="mashina sport avtomobil">
            <img src="https://picsum.photos/seed/img3/300/400" alt="Rasm 3">
            <div class="card-title">Sport mashina</div>
        </div>

        <!-- 4-rasm -->
        <div class="card" data-title="texnologiya kod kompyuter">
            <img src="https://picsum.photos/seed/img4/300/350" alt="Rasm 4">
            <div class="card-title">Dasturlash</div>
        </div>

        <!-- 5-rasm -->
        <div class="card" data-title="hayvon mushukcha">
            <img src="https://picsum.photos/seed/img5/300/450" alt="Rasm 5">
            <div class="card-title">Yoqimtoy mushuk</div>
        </div>

        <!-- 6-rasm -->
        <div class="card" data-title="kosmos yulduzlar galaktika">
            <img src="https://picsum.photos/seed/img6/300/300" alt="Rasm 6">
            <div class="card-title">Kosmos</div>
        </div>

        <!-- 7-rasm -->
        <div class="card" data-title="shahar kechasi chiroqlar">
            <img src="https://picsum.photos/seed/img7/300/480" alt="Rasm 7">
            <div class="card-title">Tungi shahar</div>
        </div>

        <!-- 8-rasm -->
        <div class="card" data-title="okean suv plyaj">
            <img src="https://picsum.photos/seed/img8/300/380" alt="Rasm 8">
            <div class="card-title">Okean sohili</div>
        </div>

        <!-- 9-rasm -->
        <div class="card" data-title="gullar atirgul bahor">
            <img src="https://picsum.photos/seed/img9/300/360" alt="Rasm 9">
            <div class="card-title">Chiroyli gullar</div>
        </div>

        <!-- 10-rasm -->
        <div class="card" data-title="arxitektura bino qurilish">
            <img src="https://picsum.photos/seed/img10/300/440" alt="Rasm 10">
            <div class="card-title">Arxitektura</div>
        </div>

    </div>

    <script>
        // Telegram WebApp sozlamasi
        let tg = window.Telegram.WebApp;
        tg.expand(); // Oynani to'liq ochish

        // Qidirish funksiyasi
        function filterImages() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getAttribute('data-title');
                if (title.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
