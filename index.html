<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USERGG Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: all 0.2s ease;
        }

        body {
            height: 100vh;
            background: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 1-OYNA: GELIK USLUBIDAGI KÖK-QORA KIRISH QISMI */
        #loaderPage {
            background: linear-gradient(180deg, #0b1d3a 0%, #050d1a 55%, #000000 100%);
            z-index: 300;
        }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 320px;
        }

        .loader-logo {
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(0, 136, 255, 0.6);
            animation: logoGlow 2s infinite ease-in-out;
        }

        @keyframes logoGlow {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .long-progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 136, 255, 0.3);
        }

        .long-progress-fill {
            height: 100%;
            width: 0%;
            background: #0088ff;
            border-radius: 10px;
            box-shadow: 0 0 10px #0088ff;
            transition: width 0.05s linear;
        }

        .loader-percent {
            font-size: 16px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 2px;
        }

        /* 2-OYNA: ASOSIY EKRAN (NIKLAR RO'YXATI) */
        #mainPage {
            justify-content: flex-start;
            padding: 30px 20px 20px 20px;
            background: #ffffff;
        }

        .main-header {
            font-size: 24px;
            font-weight: 900;
            color: #000000;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .nick-list {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .nick-card {
            width: 100%;
            background: #000000;
            border-radius: 18px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nick-main-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nick-text {
            font-size: 16px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        /* Ko'k rangli qimirlaydigan premium SVG galochka */
        .moving-blue-check {
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            animation: checkMotion 1.8s infinite ease-in-out;
        }

        @keyframes checkMotion {
            0%, 100% { transform: scale(1) rotate(0deg); }
            30% { transform: scale(1.25) rotate(-10deg); }
            70% { transform: scale(1.15) rotate(10deg); }
        }

        /* Narx qismi (bosganda ochiladi) */
        .nick-price-row {
            display: none;
            align-items: center;
            gap: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            font-size: 14px;
            font-weight: 800;
            color: #0088ff;
        }

        .nick-card.open .nick-price-row {
            display: flex;
        }

        /* Ko'k rangli qimirlaydigan premium SVG stiker (narx oldida) */
        .moving-blue-tag {
            width: 18px;
            height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            animation: tagMotion 2s infinite ease-in-out;
        }

        @keyframes tagMotion {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.2) translateY(-2px); }
        }
    </style>
</head>
<body>

    <!-- 1-OYNA: KIRISH QISMI (USERGG + Gelik ko'k-qora fon) -->
    <div id="loaderPage" class="page active">
        <div class="loader-container">
            <div class="loader-logo">USERGG</div>
            <div class="long-progress-container">
                <div id="longProgressFill" class="long-progress-fill"></div>
            </div>
            <div id="loaderPercent" class="loader-percent">0%</div>
        </div>
    </div>

    <!-- 2-OYNA: NIKLAR RO'YXATI -->
    <div id="mainPage" class="page">
        <div class="main-header">Available Usernames</div>
        
        <div class="nick-list">
            <!-- 1-Nik -->
            <div class="nick-card" onclick="togglePrice(this)">
                <div class="nick-main-row">
                    <span class="nick-text">@okenft</span>
                    <span class="moving-blue-check">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="10" fill="#0088ff"/>
                            <path d="M8 12L11 15L16 9" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                </div>
                <div class="nick-price-row">
                    <span class="moving-blue-tag">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z" fill="#0088ff"/>
                            <circle cx="7" cy="7" r="1.5" fill="#ffffff"/>
                        </svg>
                    </span>
                    <span>10,000 soʻm</span>
                </div>
            </div>

            <!-- 2-Nik -->
            <div class="nick-card" onclick="togglePrice(this)">
                <div class="nick-main-row">
                    <span class="nick-text">@axeoka</span>
                    <span class="moving-blue-check">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="10" fill="#0088ff"/>
                            <path d="M8 12L11 15L16 9" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                </div>
                <div class="nick-price-row">
                    <span class="moving-blue-tag">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z" fill="#0088ff"/>
                            <circle cx="7" cy="7" r="1.5" fill="#ffffff"/>
                        </svg>
                    </span>
                    <span>10,000 soʻm</span>
                </div>
            </div>

            <!-- 3-Nik -->
            <div class="nick-card" onclick="togglePrice(this)">
                <div class="nick-main-row">
                    <span class="nick-text">@axeake</span>
                    <span class="moving-blue-check">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="10" fill="#0088ff"/>
                            <path d="M8 12L11 15L16 9" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                </div>
                <div class="nick-price-row">
                    <span class="moving-blue-tag">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z" fill="#0088ff"/>
                            <circle cx="7" cy="7" r="1.5" fill="#ffffff"/>
                        </svg>
                    </span>
                    <span>10,000 soʻm</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { tg.ready(); tg.expand(); }

        // Uzun chiziq 100% gacha to'lishi logikasi
        let currentProgress = 0;
        const fillElement = document.getElementById('longProgressFill');
        const percentElement = document.getElementById('loaderPercent');

        const loadingInterval = setInterval(() => {
            if (currentProgress < 100) {
                currentProgress++;
                fillElement.style.width = currentProgress + '%';
                percentElement.textContent = currentProgress + '%';
            } else {
                clearInterval(loadingInterval);
                setTimeout(() => {
                    document.getElementById('loaderPage').classList.remove('active');
                    document.getElementById('mainPage').classList.add('active');
                }, 400);
            }
        }, 25);

        // Nik ustiga bosganda narxini ko'rsatish
        function togglePrice(cardElement) {
            // Boshqa ochiq kartalarni yopish (ixtiyoriy, xohlasangiz barchasi alohida ochiladi)
            document.querySelectorAll('.nick-card').forEach(card => {
                if (card !== cardElement) card.classList.remove('open');
            });
            cardElement.classList.toggle('open');
        }
    </script>
</body>
</html>
